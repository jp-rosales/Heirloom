<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Libro de Linaje</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --page-bg:#eef1f6; --page-ink:#1c2233; --page-muted:#6b7280;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page-bg:#0b0f1a; --page-ink:#e8ecf5; --page-muted:#8891a5; }
}
:root[data-theme="dark"]{ --page-bg:#0b0f1a; --page-ink:#e8ecf5; --page-muted:#8891a5; }

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--page-bg); color:var(--page-ink);
  font-family:'Pixelify Sans', monospace;
  min-height:100vh; min-height:100dvh;
  display:flex; justify-content:center;
  overflow-x:hidden;
}
button{font:inherit;}
img.pixel{image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
* { border-radius:0 !important; }

/* ---------- marco de la app: mismo lenguaje visual pixel-art del mockup "Thy Life So Far" ---------- */
.app{ width:100%; max-width:460px; min-height:100vh; min-height:100dvh; background:#0a2144; display:flex; }
.screen{ width:100%; display:flex; flex-direction:column; background:#2c6bb0; min-height:100vh; min-height:100dvh; color:#16294a; }

/* placeholder: bloque plano sin arte, mismo recurso que usa la propia referencia para su nav */
.slot{ display:flex; align-items:center; justify-content:center; flex:none; background:rgba(255,255,255,.16); }
.slot.on-tan{ background:rgba(20,30,50,.14); }

/* ---------- header ---------- */
.header{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:calc(12px + env(safe-area-inset-top)) 12px 10px; background:#2c6bb0; }
.identity{ display:flex; align-items:center; gap:10px; min-width:0; }
.portrait{ width:52px; height:52px; flex:none; background:#f3e8ca; border:3px solid #7a5a2c;
  box-shadow:inset 2px 2px 0 #fff6df, inset -3px -3px 0 #cba766, 3px 3px 0 rgba(8,18,38,.4);
  display:flex; align-items:center; justify-content:center; cursor:pointer; }
.portrait img{ width:36px; height:36px; }
.portrait.sm{ width:34px; height:34px; border-width:2px; }
.portrait.sm img{ width:22px; height:22px; }
/* §4 (sesión "cambios varios"): retrato grande para la sección "Yo", cursor normal porque no navega a
   ningún lado (ya estás en tu propio panel). */
.portrait.lg{ width:96px; height:96px; border-width:4px; cursor:default; margin:0 auto 8px; }
.portrait.lg img{ width:68px; height:68px; }
.identity-text{ min-width:0; }
.char-name{ font-size:16px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.char-sub{ margin-top:2px; font-size:12px; color:#a9c6e8; }
.header-actions{ display:flex; align-items:center; gap:6px; flex:none; margin-top:2px; }
.coin-badge{ display:flex; align-items:center; gap:4px; cursor:pointer; }
.coins{ display:inline-flex; align-items:center; gap:7px; flex-wrap:wrap; }
.coin-amt{ display:inline-flex; align-items:center; gap:2px; font-weight:600; }
.coin-ic{ width:14px; height:14px; image-rendering:pixelated; flex:none; }
.coin-fallback.coin-gold{ filter:saturate(1.5) brightness(1.05); }
.coin-fallback.coin-silver{ filter:grayscale(1) brightness(1.35) contrast(0.9); }
.coin-fallback.coin-copper{ filter:sepia(1) saturate(3.5) hue-rotate(-35deg) brightness(0.85); }
.coin-badge img{ width:16px; height:16px; }
.coin-badge span{ font-size:14px; font-weight:600; color:#fff; }
.icon-btn{ position:relative; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  background:none; border:none; padding:0; transition:transform .06s steps(1); }
.icon-btn.chest{ background:#e8a93c; border:2px solid #5c3413; box-shadow:inset 2px 2px 0 #ffd77a, inset -2px -2px 0 #a86a1f, 3px 3px 0 #5c3413; }
.icon-btn.gear{ background:#8fd0ea; border:2px solid #245571; box-shadow:inset 2px 2px 0 #d6f3ff, inset -2px -2px 0 #4a8ab0, 3px 3px 0 #245571; }
.icon-btn:active{ transform:translate(3px,3px); }
.icon-btn .slot{ width:16px; height:16px; }

/* ---------- stats bar (salud / encanto / ingenio / fe) ---------- */
.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:9px 12px 10px; background:#1e5290; border-top:2px solid #163f70; border-bottom:2px solid #163f70; }
.stat{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.stat-top{ display:flex; align-items:center; gap:5px; }
.stat img.pixel{ width:17px; height:17px; flex:none; }
.stat .slot{ width:17px; height:17px; }
.stat-num{ font-size:13px; font-weight:600; color:#fff; }
.stat-bar{ position:relative; height:7px; background:#123863; box-shadow:inset 1px 1px 0 rgba(0,0,0,.4); overflow:hidden; }
.stat-bar>i{ position:absolute; inset:0 auto 0 0; height:100%; box-shadow:inset 0 2px 0 rgba(255,255,255,.45), inset 0 -2px 0 rgba(0,0,0,.2); }
.stat-heart>i{ background:#ef4f5c; } .stat-charm>i{ background:#f7c948; } .stat-wits>i{ background:#63b3ec; } .stat-faith>i{ background:#5cbf72; }

/* ---------- caption / cabecera de pantalla ---------- */
.caption{ text-align:center; padding:9px 0 8px; font-size:12.5px; letter-spacing:.05em; color:#1c3a63; background:#9ecef6; }
.screen-head{ padding:12px 14px 6px; background:#9ecef6; }
.screen-head h2{ margin:0; font-size:16px; color:#12294e; }
.screen-head .sub{ margin:3px 0 0; font-size:11.5px; color:#3d6491; }

/* ---------- barra de sub-pestañas (usada en VIDA / HACER / GENTE) ---------- */
.subtabs{ display:flex; gap:6px; padding:8px 12px 10px; background:#9ecef6; overflow-x:auto; }
.subtab{ flex:none; text-align:center; padding:7px 10px; font-size:10.5px; letter-spacing:.02em; color:#3d6491; background:#9ecef6; border:2px solid transparent; cursor:pointer; white-space:nowrap; }
.subtab.active{ color:#122c4e; font-weight:600; background:#eef7ff; border-color:#1c3a63; box-shadow:inset 2px 2px 0 #fff, inset -2px -2px 0 #bcd8f2, 2px 2px 0 #1c3a63; }

/* ---------- contenido desplazable ---------- */
.content{ flex:1; min-height:0; overflow-y:auto; background:#cfe4ff; padding:10px 12px 14px; display:flex; flex-direction:column; gap:9px; }
.content h2{ font-size:15px; margin:2px 0 0; color:#12294e; }
.content .lead{ font-size:11.5px; color:#3d6491; margin:2px 0 4px; }

/* ---------- tarjetas ---------- */
.card{ padding:10px 12px; background:#f3f7ee; border-left:5px solid #7c93a8; }
.card h3{ margin:0 0 8px; font-size:11px; letter-spacing:.06em; color:#3d6491; text-transform:uppercase; }
.card.tan{ background:#f4e7c4; border-left-color:#c9a13c; }
.card.pink{ background:#fbe3e3; border-left-color:#d6483c; }
.card.green{ background:#e3f0d8; border-left-color:#4f8f4a; }
.card.navy{ background:#132b52; border-left-color:#f7c948; color:#eaf1fb; }
.card.navy h3{ color:#a9c6e8; }
.card .label{ display:block; font-size:9.5px; letter-spacing:.06em; margin-bottom:4px; }
.card .body{ font-size:12.5px; font-weight:500; line-height:1.35; color:#1c2b45; }
.card.navy .body{ color:#dfe9fb; }
.empty{ font-size:12px; color:#5c7597; font-style:italic; }

/* ---------- filas estilo "ledger" (etiqueta ... valor) ---------- */
.row{ display:flex; align-items:baseline; gap:6px; padding:3px 0; font-size:12.5px; }
.row .k{ color:#3d6491; white-space:nowrap; }
.row .leader{ flex:1; border-bottom:1px dotted #9ab6d8; transform:translateY(-3px); min-width:10px; }
.row .v{ font-weight:600; color:#16294a; text-align:right; max-width:56%; }

/* ---------- barra genérica (atributos, nobleza, hacienda) ---------- */
.bar{ position:relative; height:8px; background:#d8e6f7; box-shadow:inset 1px 1px 0 rgba(0,0,0,.15); overflow:hidden; margin-top:3px; }
.bar>i{ position:absolute; inset:0 auto 0 0; height:100%; background:#4f8f4a; box-shadow:inset 0 2px 0 rgba(255,255,255,.4); }
.bar.low>i{ background:#d6483c; } .bar.mid>i{ background:#c9a13c; }

/* ---------- botones pixel-art ---------- */
.btn{ position:relative; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:8px 12px; font-family:'Pixelify Sans',monospace; font-size:11.5px; font-weight:600; letter-spacing:.02em;
  background:#eef7ff; color:#16294a; border:2px solid #1c3a63; cursor:pointer;
  box-shadow:inset 2px 2px 0 #fff, inset -2px -2px 0 #bcd8f2, 2px 2px 0 #1c3a63;
  transition:transform .06s steps(1); }
.btn:active{ transform:translate(2px,2px); box-shadow:inset 2px 2px 0 #bcd8f2, inset -2px -2px 0 #fff; }
.btn.primary{ background:#f7c948; border-color:#6b490f; box-shadow:inset 2px 2px 0 #fff3c4, inset -2px -2px 0 #c9922a, 2px 2px 0 #6b490f; }
.btn.primary:active{ box-shadow:inset 2px 2px 0 #c9922a, inset -2px -2px 0 #fff3c4; }
.btn.ghost{ background:#cfe4ff; box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 #9ab6d8, 2px 2px 0 #6f8bab; border-color:#3d6491; }
.btn.danger{ background:#f7c9c9; border-color:#8a231e; box-shadow:inset 2px 2px 0 #ffe4e4, inset -2px -2px 0 #d6483c, 2px 2px 0 #8a231e; }
.btn:disabled{ opacity:.4; cursor:not-allowed; transform:none !important; }
.btn.small{ padding:5px 9px; font-size:10px; }
.btn.block{ width:100%; }
.actions-row{ display:flex; flex-wrap:wrap; gap:7px; margin-top:9px; }

/* ---------- insignias / tags ---------- */
.taglist{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.tag{ font-size:10px; padding:3px 8px; background:#eef7ff; border:2px solid #1c3a63; color:#16294a; letter-spacing:.02em; }
.tag.on-tan{ background:#fff8e6; }

/* ---------- filas de persona (familia / pueblo / listas) ---------- */
.list-row{ display:flex; align-items:center; gap:9px; padding:9px 10px; background:#f3f7ee; border-left:5px solid #7c93a8; }
.list-row + .list-row{ margin-top:7px; }
.list-row .info{ flex:1; min-width:0; }
.list-row .name{ font-size:13px; font-weight:600; color:#16294a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.list-row .role{ font-size:10.5px; color:#5c7597; margin-top:1px; }
.list-row .side{ text-align:right; flex:none; }
.list-row .pct{ font-size:13px; font-weight:700; }
.list-row .pct.warm{ color:#3f8a3f; } .list-row .pct.cool{ color:#8a6414; } .list-row .pct.hostile{ color:#b5352a; }
.list-row .tiny{ font-size:9.5px; color:#5c7597; text-transform:uppercase; letter-spacing:.03em; }
.list-row.dead{ opacity:.55; }
.list-row.clickable{ cursor:pointer; }

/* ---------- rejilla de actividades HACER ---------- */
.do-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.do-card{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; padding:10px; background:#f4e7c4; border-left:5px solid #c9a13c; cursor:pointer; text-align:left; border-top:none;border-right:none;border-bottom:none; font-family:'Pixelify Sans',monospace; }
.do-card .ic{ width:26px; height:26px; }
.do-card .t{ font-size:12px; font-weight:700; color:#16294a; }
.do-card .s{ font-size:10px; color:#5c7597; line-height:1.25; }
.do-card:disabled{ opacity:.4; cursor:not-allowed; }

/* ---------- genealogía (árbol vertical, una generación debajo de otra) ---------- */
.gentree{ display:flex; flex-direction:column; align-items:stretch; gap:2px; }
.genlevel{ display:flex; flex-direction:column; align-items:center; position:relative; padding-top:10px; }
.genlevel:not(:first-child)::before{ content:''; position:absolute; top:0; left:50%; width:2px; height:10px; background:#a9c0d8; }
.genlevel h4{ font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:#3d6491; margin:0 0 6px; text-align:center; }
.genlevel-row{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px 8px; width:100%; }
.genperson{ display:flex; flex-direction:column; align-items:center; width:66px; cursor:pointer; text-align:center; }
.genperson .portrait{ margin-bottom:3px; }
.genperson .n{ font-weight:600; color:#16294a; font-size:9.5px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.genperson .r{ color:#3d6491; font-size:8.5px; text-transform:uppercase; letter-spacing:.03em; }
.genperson .y{ color:#5c7597; font-size:9px; }
.genperson.you .portrait{ border-color:#c9a13c; box-shadow:inset 2px 2px 0 #fff6df, inset -3px -3px 0 #cba766, 0 0 0 2px #c9a13c; }
.genperson.you .n{ color:#8a5a12; }
.portrait.gen{ width:44px; height:44px; border-width:2px; }
.portrait.gen img{ width:30px; height:30px; }
.portrait.dead{ filter:grayscale(1); opacity:.75; }

/* ---------- escena de la hacienda ---------- */
.homestead{ display:flex; flex-direction:column; gap:6px; padding:8px 4px; }
.homestead .row-icons{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.homestead .row-icons .slot{ width:22px; height:22px; }
.homestead .cap{ font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:#3d6491; }

/* ---------- feed de vida (mejora de diseño 2026-09 #6): cada suceso es su propia tarjeta
   con icono y color por tipo, en vez de una lista plana de texto — "una imagen dice más
   que mil palabras". Reemplaza el viejo .hist-item plano (misma info, mejor legibilidad). */
.feed-item{ display:flex; gap:9px; padding:8px 9px; margin-bottom:6px; background:#f3f7ee; border-left:4px solid #7c93a8; }
.feed-item:last-child{ margin-bottom:0; }
.feed-item.tan{ background:#f4e7c4; border-left-color:#c9a13c; }
.feed-item.pink{ background:#fbe3e3; border-left-color:#d6483c; }
.feed-item.green{ background:#e3f0d8; border-left-color:#4f8f4a; }
.feed-item.navy{ background:#132b52; border-left-color:#f7c948; }
.feed-item.navy .feed-title{ color:#eaf1fb; }
.feed-item.navy .feed-desc{ color:#a9c6e8; }
.feed-item.navy .feed-year{ color:#7c93a8; }
.feed-icon{ flex:none; width:20px; height:20px; display:flex; align-items:center; justify-content:center; }
.feed-icon img.pixel{ width:18px; height:18px; }
.feed-icon .slot{ width:18px; height:18px; }
.feed-icon.dead-icon img{ filter:grayscale(1); opacity:.75; }
.feed-body{ flex:1; min-width:0; }
.feed-top{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.feed-title{ font-size:12px; font-weight:600; color:#16294a; }
.feed-year{ font-size:9.5px; color:#6b8199; flex:none; }
.feed-desc{ font-size:11px; color:#3d6491; margin-top:2px; line-height:1.3; }
/* compatibilidad: la Crónica completa reutiliza el mismo componente (eventItem) */
.hist-item{ display:flex; gap:10px; padding:8px 0; border-bottom:1px solid #b9d4ef; }
.hist-item:last-child{ border-bottom:none; }
.hist-year{ font-size:11px; font-weight:700; color:#8a6414; width:38px; flex:none; }
.hist-title{ font-size:12px; font-weight:600; color:#16294a; }
.hist-desc{ font-size:11px; color:#3d6491; }

/* ---------- footer + AGE UP ---------- */
.footer{ background:#0a2144; padding:10px 12px 8px; }
.actions-remaining{ text-align:center; font-size:11px; letter-spacing:.05em; color:#eaf1fb; margin-bottom:8px; }
.age-up{ position:relative; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
  background:#f7c948; border:3px solid #6b490f; box-shadow:inset 3px 3px 0 #fff3c4, inset -3px -3px 0 #c9922a, 0 5px 0 #6b490f;
  padding:12px 0 11px; margin-bottom:8px; cursor:pointer; overflow:hidden; transition:transform .06s steps(1); font-family:'Pixelify Sans',monospace; }
.age-up::before{ content:""; position:absolute; left:6px; top:5px; width:34%; height:9px; background:#fff9dd; opacity:.75; }
.age-up:active{ transform:translateY(5px); box-shadow:inset 3px 3px 0 #c9922a, inset -3px -3px 0 #fff3c4; }
.age-up .tri{ width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent; border-bottom:11px solid #5b3c06; }
.age-up span{ font-size:14px; font-weight:600; color:#5b3c06; letter-spacing:.03em; }
.age-up:disabled{ opacity:.55; cursor:not-allowed; }

.navbar{ display:grid; grid-template-columns:repeat(6,1fr); background:#1a4d8f; padding:8px 4px calc(10px + env(safe-area-inset-bottom)); }
.navitem{ display:flex; flex-direction:column; align-items:center; gap:5px; padding:5px 0; cursor:pointer; background:none; border:none; font-family:'Pixelify Sans',monospace; }
.navitem .slot{ width:18px; height:18px; background:#3f6ba0; box-shadow:inset 1px 1px 0 rgba(255,255,255,.25), inset -1px -1px 0 rgba(0,0,0,.3); }
.navitem.active .slot{ background:#f4726c; border:2px solid #7a231e; box-shadow:inset 2px 2px 0 #ffb1ab, inset -2px -2px 0 #c0453d, 2px 2px 0 #7a231e; }
.navitem span{ font-size:8.5px; letter-spacing:.02em; color:#7f9cc4; }
.navitem.active span{ color:#fff; }

/* ---------- modal (mismo lenguaje visual, tema pixel-art) ---------- */
.overlay{ position:fixed; inset:0; background:rgba(10,20,40,.65); display:flex; align-items:center; justify-content:center; padding:16px; z-index:100; }
.modal{ width:100%; max-width:400px; max-height:88vh; overflow-y:auto; background:#eef7ff; border:3px solid #1c3a63;
  box-shadow:inset 2px 2px 0 #fff, 6px 6px 0 #0a2144; padding:16px; font-family:'Pixelify Sans',monospace; color:#16294a; }
.modal h2{ margin:0 0 6px; font-size:15px; }
.modal .eyebrow{ font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; color:#c9922a; margin-bottom:6px; font-weight:700; }
.modal p{ font-size:12.5px; color:#3d6491; margin:8px 0; line-height:1.4; }
.option{ display:block; width:100%; text-align:left; background:#f3f7ee; border:2px solid #7c93a8; padding:9px 11px; margin-top:7px; cursor:pointer; color:#16294a; font-family:'Pixelify Sans',monospace; font-size:11.5px; }
.option:hover{ border-color:#1c3a63; }
.option b{ display:block; font-size:11.5px; margin-bottom:2px; }
.modal-close-row{ margin-top:14px; display:flex; justify-content:flex-end; }
.divider{ border:none; border-top:2px solid #bcd8f2; margin:12px 0; }
/* §13/14: postal panorámica del asentamiento (nacimiento + etapa de bebé). 3:1, pixel-art,
   sin distorsión. Si la imagen no existe todavía, onerror la oculta por completo: nunca un
   icono roto ni un hueco reservado (ver renderSettlementScene). */
.settlement-scene{ width:100%; aspect-ratio:3/1; object-fit:cover; margin:0 0 10px; border:3px solid #1c3a63; box-shadow:inset 1px 1px 0 #fff; }
.settlement-scene.small{ margin-bottom:8px; }
.animal-thumb{ width:34px; height:34px; flex:none; object-fit:contain; image-rendering:pixelated; background:#f3e8ca; border:2px solid #7a5a2c; }
/* §15 (sesión "cambios varios"): minijuego de pulso ("detén la aguja en la zona") */
.minigame-track{ position:relative; height:28px; background:#233047; border:3px solid #1c3a63; box-shadow:inset 2px 2px 0 rgba(0,0,0,.35); margin:12px 0; overflow:hidden; }
.minigame-zone{ position:absolute; top:0; bottom:0; background:#8fce6a; opacity:.6; }
.minigame-marker{ position:absolute; top:-3px; bottom:-3px; width:5px; background:#f2c94c; box-shadow:0 0 5px #000, 0 0 0 1px #7a5a2c; animation-name:mgsweep; animation-timing-function:linear; animation-iteration-count:infinite; animation-direction:alternate; left:0; }
@keyframes mgsweep{ from{ left:0%; } to{ left:calc(100% - 5px); } }

.autosave{ font-size:9px; color:#a9c6e8; }
.reset-link{ font-size:9px; color:#a9c6e8; text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<input type="file" id="importFileInput" accept="application/json,.json" style="display:none">

<script>
/* tiles reales del proyecto (16×16), embebidos como base64 — el resto de iconos son huecos
   marcados con .slot[data-icon] hasta que existan sus assets (ver lista pendiente) */

/* ---------- RNG de simulación con seed persistente (Fase "A ver qué pasa este año", §2.6) ----------
   Dos partidas con la misma seed y las mismas decisiones deben reproducir los mismos resultados
   principales. Por eso TODO el azar que afecta el futuro del mundo (rand/chance/pick/pickWeighted,
   y el par de Math.random() sueltos que había en assignNpcCareer/buildDisputaHermanosEvent) pasa
   por srandom(), que lee de un generador determinista (Mulberry32).
   Se guardan DOS cosas, no solo una: world.rngSeed es la seed original de la partida (estable,
   la que se muestra en Ajustes y se puede copiar), y world.rngState es el estado interno ACTUAL
   del generador (se actualiza en cada save()) — así una partida guardada se reanuda exactamente
   donde quedó, en vez de reiniciar la secuencia desde el principio de la seed en cada carga.
   uid() se deja FUERA a propósito: es un identificador técnico, no una decisión de simulación, y
   no debe consumir números de la secuencia (mezclarlo ahí haría que dos partidas con la misma seed
   diverjan en cuanto se creara un personaje más o menos, por una razón que no es gameplay). */
function randomSeed32(){ return (Math.random()*0xFFFFFFFF)>>>0; }
let rngState = randomSeed32();
function srandom(){
  rngState|=0; rngState=(rngState+0x6D2B79F5)|0;
  let t=Math.imul(rngState ^ (rngState>>>15), 1|rngState);
  t=(t+Math.imul(t ^ (t>>>7), 61|t)) ^ t;
  return ((t ^ (t>>>14))>>>0) / 4294967296;
}
/* llamar una vez al crear o cargar una partida: reanuda su secuencia exacta (o la arranca, si es nueva) */
function seedRngFor(w){
  if(w.rngSeed===undefined) w.rngSeed=randomSeed32();
  rngState=(w.rngState!==undefined ? w.rngState : w.rngSeed)>>>0;
}
/* snapshot del estado actual, para guardarlo junto al resto de la partida (llamado desde save()) */
function captureRngState(w){ w.rngState=rngState>>>0; }

/* ---------- utilidades ---------- */
function uid(){return 'x'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
function rand(min,max){return Math.floor(srandom()*(max-min+1))+min;}
function chance(p){return srandom()<p;}
function pick(arr){return arr[rand(0,arr.length-1)];}
function pickWeighted(items){ // items: [{w,...}]
  const total=items.reduce((s,i)=>s+i.w,0);
  let r=srandom()*total;
  for(const it of items){ r-=it.w; if(r<=0) return it; }
  return items[items.length-1];
}
function shuffle(arr){ // Fisher-Yates sobre srandom() — reemplaza los .sort(()=>Math.random()-0.5) que había
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=rand(0,i); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}

/* ---------- camino a la nobleza (v5, Parte 69) ----------
   Se apoya en house.prestige/house.titles, que existían desde v2 pero nunca se usaban.
   Escala 0-1000 para que la progresión de una dinastía sea lenta y se note por generaciones,
   no por una sola acción. prestige NUNCA se resetea al cambiar de personaje jugable: es del
   linaje (house), no del individuo. */
const NOBILITY_RANKS = [
  {key:'peasant', label:'Campesino/a', floor:0},
  {key:'squire',  label:'Escudero/a',  floor:200},
  {key:'knight',  label:'Caballero/a', floor:400},
  {key:'noble',   label:'Noble',       floor:600},
  {key:'baron',   label:'Barón/esa',   floor:800},
  {key:'king',    label:'Rey/Reina',   floor:950}
];
function getNobilityRankIndex(house){
  const p=clamp(house? house.prestige:0, 0, 1000);
  let idx=0;
  for(let i=0;i<NOBILITY_RANKS.length;i++) if(p>=NOBILITY_RANKS[i].floor) idx=i;
  return idx;
}
function getNobilityProgress(house){
  const idx=getNobilityRankIndex(house);
  const cur=NOBILITY_RANKS[idx], next=NOBILITY_RANKS[idx+1];
  const p=clamp(house? house.prestige:0, 0, 1000);
  if(!next) return {rank:cur, next:null, pct:100};
  const pct=Math.round(((p-cur.floor)/(next.floor-cur.floor))*100);
  return {rank:cur, next, pct:clamp(pct,0,99)};
}
function bumpPrestige(house, delta){ if(!house) return; house.prestige=clamp((house.prestige||0)+delta,0,1000); }

/* ---------- Ingenio (§2.3, §8) ----------
   Ingenio es una de las cuatro estadísticas del header, pero antes no tenía ningún uso real.
   No debe volverse "más ingenio = mejor en todo": se usa en situaciones concretas donde tiene
   sentido — mediar, negociar, detectar un mal trato o un engaño, resolver un problema de
   oficio, entender un rumor o una información — y witsCheck() es el único punto de esa lógica,
   para no repetir la fórmula suelta en cada evento. isWitty() es la versión sin dado, para
   frases que solo necesitan saber "¿es de los ingeniosos?" sin tirar por ello. No se muestran
   porcentajes: el texto puede señalar que el ingenio ayudó, pero nunca el número exacto. */
function witsCheck(ch, difficulty=0.5){
  let score=(ch.wits||0)/100;
  if(ch.traits && ch.traits.includes('ingenioso/a')) score+=0.15;
  return chance(clamp(score-difficulty+0.5, 0.05, 0.95));
}
function isWitty(ch){ return !!ch && ((ch.wits||0)>=60 || (ch.traits && ch.traits.includes('ingenioso/a'))); }

/* ---------- economía de la hacienda: Reservas / Seguridad / Lealtad (v5, Parte 70) ----------
   Reservas se deriva de hh.grainStores (ya existía); Seguridad y Lealtad son campos nuevos 0-100.
   Prosperidad = la MENOR de las tres — igual que en la pantalla HACIENDA. */
function getHoldingResources(hh){
  const stores=clamp(Math.round((hh.grainStores||0)/40*100),0,100);
  const security=clamp(Math.round(hh.security||0),0,100);
  const loyalty=clamp(Math.round(hh.loyalty||0),0,100);
  return {stores, security, loyalty, prosperity:Math.min(stores,security,loyalty)};
}
/* una orden de hacienda al año: el/la cabeza de hogar decide dónde invertir (Parte 70) */
/* §2.1: una sola orden de hacienda por año — antes se podía pulsar varias veces el mismo año
   mientras hubiera dinero. hh.estateOrderYear se compara contra world.year, así que se
   "reinicia" solo al avanzar de año, sin necesidad de tocarlo en advanceYear(). */
function canUseEstateOrder(hh){ return !!hh && hh.estateOrderYear!==world.year; }
function doEstateOrder(kind){
  const p=player(world); if(!canManageHousehold(p)) return; const hh=household(world); if(!hh) return;
  if(!canUseEstateOrder(hh)) return;
  if(hh.money<4) return;
  hh.estateOrderYear=world.year;
  hh.money=Math.round((hh.money-4)*10)/10;
  if(kind==='stores'){ hh.grainStores=(hh.grainStores||0)+rand(6,12); plog(world,'Orden de hacienda','Ordenaste reforzar los graneros y las reservas de la hacienda.','hacienda',[p.id]); }
  else if(kind==='security'){ hh.security=clamp((hh.security||0)+rand(6,12),0,100); plog(world,'Orden de hacienda','Ordenaste reforzar la seguridad de tus tierras.','hacienda',[p.id]); }
  else if(kind==='loyalty'){ hh.loyalty=clamp((hh.loyalty||0)+rand(6,12),0,100); plog(world,'Orden de hacienda','Pasaste tiempo con la gente de tu hacienda; su lealtad crece.','hacienda',[p.id]); }
  save(); render();
}
/* resolución anual de la hacienda (Parte 70): deriva lenta + premio de prosperidad + riesgo si algo se abandona */
function resolveHoldingEconomy(w, turnLog){
  for(const hh of Object.values(w.households)){
    if(hh.security===undefined) hh.security=rand(30,50);
    if(hh.loyalty===undefined) hh.loyalty=rand(30,50);
    hh.security=clamp(hh.security+rand(-2,1),0,100);
    hh.loyalty=clamp(hh.loyalty+rand(-2,1),0,100);
    const res=getHoldingResources(hh);
    const head=hh.headId?C(hh.headId):null;
    if(res.prosperity>=75){
      hh.money=Math.round((hh.money+5)*10)/10;
      if(head && head.alive) head.reputation=clamp(head.reputation+2,0,100);
      if(head && head.id===w.playerId) turnLog.push(log(w,'La hacienda prospera','Tu hacienda vive un buen año: reservas, seguridad y lealtad se sostienen altas.','hacienda',[head.id]));
    }
    // §6D: además de la penalización inmediata de abajo, un hogar con problemas o bonanza
    // sostenidos abre/avanza un hilo propio, que más tarde produce una decisión real
    // (no solo "dinero < X"). Solo se sigue para el hogar del jugador.
    const isPlayerHh = w.playerId && head && head.id===w.playerId;
    hh.highStreak = res.prosperity>=75 ? (hh.highStreak||0)+1 : 0;
    if(isPlayerHh){
      if(res.prosperity<25){
        let t=findStoryThread(w,'household_hardship', th=>th.relatedHouseholdIds.includes(hh.id));
        if(!t) createStoryThread(w,'household_hardship',{actorIds:[head.id], relatedHouseholdIds:[hh.id], stage:1});
      }
      if(hh.highStreak>=2){
        let t=findStoryThread(w,'household_prosperity', th=>th.relatedHouseholdIds.includes(hh.id));
        if(!t) createStoryThread(w,'household_prosperity',{actorIds:[head.id], relatedHouseholdIds:[hh.id], stage:1});
      }
    }
    hh.lowStreak = res.prosperity<15 ? (hh.lowStreak||0)+1 : 0;
    if(hh.lowStreak>=2 && head && head.alive){
      hh.lowStreak=0;
      const hit=pick(['stores','security','loyalty']);
      if(hit==='stores'){ hh.grainStores=Math.max(0,(hh.grainStores||0)-rand(3,8));
        if(head.id===w.playerId) turnLog.push(log(w,'Hambruna en tus tierras','Tus reservas llevaban demasiado tiempo bajas: parte del grano se pierde.','hacienda',[head.id])); }
      else if(hit==='security'){ hh.money=Math.max(0,hh.money-rand(2,6));
        if(head.id===w.playerId) turnLog.push(log(w,'Bandidaje','Sin vigilancia, unos bandidos saquean parte de tu hacienda.','hacienda',[head.id])); }
      else { bumpRelationship(w, head.id, head.id, 0);
        if(head.id===w.playerId) turnLog.push(log(w,'Descontento','La gente de tu hacienda murmura; la lealtad llevaba demasiado tiempo abandonada.','hacienda',[head.id])); }
    }
    /* población: si las tres reservas están altas, la hacienda atrae a alguien nuevo (Parte 70) */
    if(res.stores>=60 && res.security>=60 && res.loyalty>=60 && chance(0.12) && hh.memberIds.length<10){
      // se refleja como crecimiento del pueblo, no de este hogar concreto (el pueblo ya es persistente, Parte 9)
      w.flags.villageGrowthPoints=(w.flags.villageGrowthPoints||0)+1;
    }
  }
}
/* §6D: los problemas económicos —o la prosperidad sostenida— del hogar del jugador
   se acumulan en un hilo (creado/avanzado en resolveHoldingEconomy) y, con el tiempo,
   producen una decisión real: vender algo importante, pedir ayuda, mandar a un hijo/a
   a trabajar, tensión familiar, o —en el otro extremo— ayudar a un pariente, celebrar,
   invertir o simplemente ahorrar. No se implementa un sistema grande de propiedades:
   se usa lo que ya existe (dinero, grano, animales, relaciones, favores). */
function buildHouseholdThreadContinuation(w,p){
  if(eventOnCooldown(w,'household_thread_continuation',2)) return null;
  const hh=household(w); if(!hh) return null;
  const res=getHoldingResources(hh);
  const hardship=findStoryThread(w,'household_hardship', t=>t.relatedHouseholdIds.includes(hh.id));
  const prosperity=findStoryThread(w,'household_prosperity', t=>t.relatedHouseholdIds.includes(hh.id));
  if(hardship && res.prosperity>=35){ resolveStoryThread(w,hardship);
    return {id:'household_thread_continuation', interactive:false,
      resolve:(w,p)=> log(w,'Se endereza la hacienda','Después de un tiempo difícil, tu hogar vuelve poco a poco a levantar cabeza.','hacienda',[p.id])}; }
  if(prosperity && res.prosperity<50){ resolveStoryThread(w,prosperity); }
  if(hardship && chance(0.5)){
    const list=animalsOf(hh);
    const cf=closeFamily(p.id);
    const helper=[cf.father,cf.mother,...cf.siblings].filter(m=>m&&m.alive && m.householdId!==hh.id)[0];
    const kid=Object.values(w.characters).find(c=>c.alive && c.householdId===hh.id && c.id!==p.id && c.age>=8 && c.age<14 && (!c.career||!c.career.professionId));
    const options=['tension'];
    if(list.length) options.push('sell');
    if(helper) options.push('help');
    if(kid) options.push('child');
    const kind=pick(options);
    markEventUsed(w,'household_thread_continuation');
    if(kind==='sell'){
      return {id:'household_thread_continuation', interactive:true,
        text:'Los tiempos difíciles se alargan. Podrías vender uno de tus animales para conseguir algo de dinero.',
        options:[
          {label:'Vender un animal', desc:'+monedas, -1 animal',
            effect:(w,p)=>{ const a=pick(list); a.alive=false; a.sold=true; hh.money=Math.round((hh.money+rand(4,9))*10)/10;
              advanceStoryThread(w,hardship);
              return log(w,'Vender para sobrevivir','Vendiste uno de tus animales para hacer frente a los tiempos difíciles.','hacienda',[p.id]);}},
          {label:'Aguantar sin vender nada', desc:'sin efecto inmediato',
            effect:(w,p)=>{ advanceStoryThread(w,hardship);
              return log(w,'Aguantar un poco más','Decidiste no vender nada todavía, aunque las cosas sigan difíciles.','hacienda',[p.id]);}}
        ]};
    }
    if(kind==='help'){
      return {id:'household_thread_continuation', interactive:true, portraitId:helper.id,
        text:`Los tiempos son difíciles. Podrías pedirle ayuda a ${helper.firstName}.`,
        options:[
          {label:`Pedirle ayuda a ${helper.firstName}`, desc:'posible ayuda, quedas en deuda',
            effect:(w,p)=>{ const relGood=getRelationship(w,p.id,helper.id)>=20;
              if(relGood && chance(0.7)){ hh.money=Math.round((hh.money+rand(3,7))*10)/10; addDebt(w,helper.id);
                advanceStoryThread(w,hardship);
                return log(w,'Ayuda familiar',`${helper.firstName} te ayudó en un momento difícil. Se lo deberás.`,'family',[p.id,helper.id]);}
              bumpRelationship(w,p.id,helper.id,-2); advanceStoryThread(w,hardship);
              return log(w,'Sin ayuda',`Le pediste ayuda a ${helper.firstName}, pero no pudo o no quiso dártela.`,'family',[p.id,helper.id]);}},
          {label:'No pedir ayuda a nadie', desc:'sin efecto, orgullo intacto',
            effect:(w,p)=>{ advanceStoryThread(w,hardship);
              return log(w,'Sin pedir ayuda','Preferiste no pedirle ayuda a nadie, por orgullo.','hacienda',[p.id]);}}
        ]};
    }
    if(kind==='child'){
      return {id:'household_thread_continuation', interactive:true, portraitId:kid.id,
        text:`Con la hacienda pasando apuros, ${kid.firstName} podría empezar a trabajar antes de tiempo.`,
        options:[
          {label:`Poner a ${kid.firstName} a trabajar`, desc:'+monedas, menos infancia',
            effect:(w,p)=>{ hh.money=Math.round((hh.money+rand(2,4))*10)/10; bumpRelationship(w,p.id,kid.id,-3);
              advanceStoryThread(w,hardship);
              return log(w,'Una infancia más corta',`${kid.firstName} empezó a trabajar antes de tiempo para ayudar en casa.`,'family',[p.id,kid.id]);}},
          {label:genderText('Dejarle seguir siendo niño/a',kid.sex), desc:'sin ingreso extra',
            effect:(w,p)=>{ advanceStoryThread(w,hardship);
              return log(w,genderText('Todavía es un niño/a',kid.sex),`Decidiste que ${kid.firstName} siguiera siendo ${genderText('niño/a',kid.sex)} un tiempo más, pese a los apuros.`,'family',[p.id,kid.id]);}}
        ]};
    }
    // tension
    const spouse=p.spouseId?C(p.spouseId):null;
    if(spouse&&spouse.alive){ bumpRelationship(w,p.id,spouse.id,-rand(3,6)); }
    advanceStoryThread(w,hardship);
    return {id:'household_thread_continuation', interactive:false,
      resolve:(w,p)=> spouse&&spouse.alive
        ? log(w,'Tensión por el dinero',`Las estrecheces económicas empiezan a notarse también entre ${p.firstName} y ${spouse.firstName}.`,'family',[p.id,spouse.id])
        : log(w,'Un año más apretado','La hacienda sigue pasando estrecheces, sin que se vea una salida clara todavía.','hacienda',[p.id])};
  }
  if(prosperity && chance(0.5)){
    const cf=closeFamily(p.id);
    const poor=[...cf.siblings,...cf.children].find(m=>m&&m.alive && m.householdId && m.householdId!==hh.id && w.households[m.householdId] &&
      (householdStatus(w.households[m.householdId])==='poor'||householdStatus(w.households[m.householdId])==='destitute'));
    const options=['celebrate','invest','save'];
    if(poor) options.push('help_relative');
    const kind=pick(options);
    markEventUsed(w,'household_thread_continuation');
    if(kind==='help_relative'){
      return {id:'household_thread_continuation', interactive:true, portraitId:poor.id,
        text:`A tu hacienda le va bien. Podrías ayudar a ${poor.firstName}, que no tiene tu misma suerte.`,
        options:[
          {label:`Ayudar a ${poor.firstName}`, desc:'-monedas, +relación, favor recordado',
            effect:(w,p)=>{ const gift=Math.min(hh.money,rand(4,8)); hh.money=Math.round((hh.money-gift)*10)/10;
              const theirHh=w.households[poor.householdId]; if(theirHh) theirHh.money=Math.round((theirHh.money+gift)*10)/10;
              bumpRelationship(w,p.id,poor.id,10); addFavor(w,poor.id); advanceStoryThread(w,prosperity);
              return log(w,'Compartir la buena suerte',`Ayudaste a ${poor.firstName} ahora que a tu hacienda le sobra algo.`,'family',[p.id,poor.id]);}},
          {label:'Guardarlo para tu propia familia', desc:'sin efecto',
            effect:(w,p)=>{ advanceStoryThread(w,prosperity);
              return log(w,'Prudencia','Decidiste guardar tu buena fortuna para tu propia familia.','hacienda',[p.id]);}}
        ]};
    }
    if(kind==='celebrate'){
      return {id:'household_thread_continuation', interactive:true,
        text:'La hacienda vive un buen momento. Podrías celebrarlo con la gente del pueblo.',
        options:[
          {label:'Ofrecer un festín', desc:'-monedas, +relación con el pueblo, +reputación',
            effect:(w,p)=>{ const cost=Math.min(hh.money,rand(4,8)); hh.money=Math.round((hh.money-cost)*10)/10;
              p.reputation=clamp((p.reputation||0)+rand(3,6),0,100); advanceStoryThread(w,prosperity);
              return log(w,'Un festín para el pueblo',`Ofreciste un festín para compartir la buena fortuna de tu hacienda con ${WORLD_FLAVOR.villageName}.`,'hacienda',[p.id]);}},
          {label:'Celebrarlo solo en familia', desc:'+relación con tu hogar',
            effect:(w,p)=>{ advanceStoryThread(w,prosperity);
              return log(w,'Una celebración tranquila','Celebraste el buen momento de la hacienda en la intimidad de tu familia.','hacienda',[p.id]);}}
        ]};
    }
    if(kind==='invest'){
      return {id:'household_thread_continuation', interactive:true,
        text:'Con la hacienda próspera, podrías invertir en mejorarla todavía más.',
        options:[
          {label:'Invertir en la hacienda', desc:'-monedas, +seguridad y lealtad',
            effect:(w,p)=>{ const cost=Math.min(hh.money,rand(5,9)); hh.money=Math.round((hh.money-cost)*10)/10;
              hh.security=clamp(hh.security+rand(4,8),0,100); hh.loyalty=clamp(hh.loyalty+rand(4,8),0,100);
              advanceStoryThread(w,prosperity);
              return log(w,'Invertir en el futuro','Invertiste parte de tu fortuna en mejorar la hacienda para los años venideros.','hacienda',[p.id]);}},
          {label:'Ahorrar en vez de invertir', desc:'sin efecto',
            effect:(w,p)=>{ advanceStoryThread(w,prosperity);
              return log(w,'Ahorro prudente','Preferiste ahorrar antes que invertir de más.','hacienda',[p.id]);}}
        ]};
    }
    // save
    resolveStoryThread(w,prosperity);
    return {id:'household_thread_continuation', interactive:false,
      resolve:(w,p)=> log(w,'Años buenos','Tu hacienda lleva un tiempo próspera, y eso empieza a sentirse como algo normal.','hacienda',[p.id])};
  }
  return null;
}

/* ---------- ambición de vida (v5, Parte 68): se asigna una sola vez, al cumplir 18 ---------- */
const AMBITIONS = [
  {key:'earn_spurs', label:'Ganar tus espuelas', dataIcon:'ambition:knight',
    progress:(w,p)=> getNobilityProgress(lineage(w,p.id)).pct },
  {key:'master_craft', label:'Llegar a maestro/a en tu oficio', dataIcon:'ambition:craft',
    progress:(w,p)=> p.career && p.career.professionId ? Math.round(clamp(p.career.experience,0,100)) : 0 },
  {key:'rich_household', label:'Ver próspera tu hacienda', dataIcon:'ambition:coin',
    progress:(w,p)=> { const hh=household(w,p.id); return hh? getHoldingResources(hh).prosperity : 0; } },
  {key:'many_kin', label:'Formar una familia numerosa', dataIcon:'ambition:family',
    progress:(w,p)=> Math.min(100, (p.childrenIds||[]).length*25) },
  {key:'well_loved', label:'Ser querido/a por todo el pueblo', dataIcon:'ambition:heart',
    progress:(w,p)=> Math.round(clamp(p.reputation,0,100)) },
  {key:'devout_life', label:'Vivir una vida devota', dataIcon:'ambition:faith',
    progress:(w,p)=> Math.round(clamp(p.faith,0,100)) }
];
function resolveAmbition(w, p, turnLog){
  if(p.ambition || p.age!==18) return;
  const choice=pick(AMBITIONS);
  p.ambition={key:choice.key, assignedYear:w.year};
  turnLog.push(log(w, 'Tu ambición de vida', `Decides qué quieres hacer de tu vida: ${genderText(choice.label,p.sex).toLowerCase()}.`,'personaje',[p.id]));
}
function getAmbition(p){
  if(!p.ambition) return null;
  const def=AMBITIONS.find(a=>a.key===p.ambition.key); if(!def) return null;
  return {def, pct:clamp(def.progress(world,p),0,100)};
}

/* ---------- catálogo de actividades "Hacer" (v5, Parte 71) ----------
   Reutiliza acciones que ya existían (Campos/Forja/Mercado/Pueblo) y agrega las nuevas
   (Capilla/Taberna/Dados/Festín/Feria/Entrenar/Hurtar). Todas pasan por useAction() salvo
   las que ya eran administración libre del hogar (sembrar, vender grano). */
/* ---------- variedad contextual (sesión 2026-09 #2) ----------
   Las mismas 7 actividades de siempre, pero el resultado ya no depende solo del dado:
   depende de la edad, el estado civil, la economía del hogar y la reputación de quien
   juega. La variedad sale del PERSONAJE, no de una frase distinta pegada por encima. */
function doChapel(){ const p=player(world); if(!p||p.age<7) return; if(!useAction()) return;
  const devout=p.traits.includes('devoto/a'); // §8: la fe le sube más, y su devoción se nota más a ojos del linaje
  p.faith=clamp(p.faith+rand(3,7)+(devout?3:0),0,100);
  const house=lineage(world,p.id); if(chance(devout?0.4:0.25)) bumpPrestige(house,rand(1,3));
  const hh=household(world); const status=hh?householdStatus(hh):null;
  const spouse=p.spouseId?C(p.spouseId):null;
  let text;
  if(status==='destitute'||status==='poor') text='Rezaste pidiendo que la suerte de tu hacienda cambie pronto.';
  else if(spouse && spouse.alive) text=`Rezaste junto a ${spouse.firstName}, por la salud y la fortuna de los dos.`;
  else if(p.age<16) text='Te sentaste en un rincón de la capilla, en silencio, mientras los mayores rezaban.';
  else text='Pasaste tiempo en oración y en calma.';
  plog(world,'Oración en la capilla',text,'fe',[p.id]); save(); render(); }
function doTavern(){ const p=player(world); if(!p||p.age<14) return; const hh=household(world); if(!useAction()) return;
  const cost=Math.min(2,hh?hh.money:0); if(hh) hh.money=Math.round((hh.money-cost)*10)/10;
  p.charm=clamp(p.charm+rand(3,6),0,100); p.health=clamp(p.health-rand(1,3),0,100);
  const known=getKnownPeople(p).others.filter(c=>c.alive);
  const spouse=p.spouseId?C(p.spouseId):null;
  if(known.length && chance(0.6)) bumpRelationship(world,p.id,pick(known).id,rand(2,6));
  if(spouse && spouse.alive && chance(0.15)){
    bumpRelationship(world,p.id,spouse.id,-rand(2,5));
    plog(world,'Te esperaban en casa',`${spouse.firstName} te esperó ${genderText('despierto/a',spouse.sex)}, y no de buen humor.`,'ocio',[p.id,spouse.id]);
  } else if(chance(0.12)){
    p.reputation=clamp(p.reputation-rand(2,5),0,100);
    plog(world,'Riña en la taberna','La noche se torció en una pelea; algunos en el pueblo lo comentan.','ocio',[p.id]);
  } else if(hh && householdStatus(hh)==='destitute'){
    plog(world,'Ahogar las penas','Bebiste más de la cuenta, tratando de no pensar en las deudas de la hacienda.','ocio',[p.id]);
  } else {
    plog(world,'Noche en la taberna','Cantaste y bebiste con la gente del pueblo.','ocio',[p.id]);
  }
  save(); render(); }
function doDice(){ const p=player(world); if(!p||p.age<14) return; if(!useAction()) return;
  const hh=household(world); const poor = hh && (householdStatus(hh)==='poor'||householdStatus(hh)==='destitute');
  const stake=Math.min(3, Math.floor(p.personalMoney||0));
  if(chance(0.45)){
    p.personalMoney=Math.round(((p.personalMoney||0)+stake+rand(1,4))*10)/10; p.charm=clamp(p.charm+1,0,100);
    plog(world,'Suerte en los dados', poor?'Ganaste algo de dinero justo cuando más lo necesitabas.':'Ganaste unas monedas jugando a los dados.','ocio',[p.id]);
  } else {
    p.personalMoney=Math.round(Math.max(0,(p.personalMoney||0)-stake)*10)/10;
    if(poor && stake>0){ p.reputation=clamp(p.reputation-1,0,100);
      plog(world,'No podías perder eso','Perdiste unas monedas que tu familia necesitaba. Alguien se dio cuenta.','ocio',[p.id]); }
    else plog(world,'Mala suerte en los dados','Perdiste unas monedas jugando a los dados.','ocio',[p.id]);
  }
  save(); render(); }
function doFeast(){ const p=player(world); if(!canManageHousehold(p)) return; const hh=household(world); if(hh.money<5) return; if(!useAction()) return;
  hh.money=Math.round((hh.money-5)*10)/10;
  const family=closeFamilyFlat(p.id).filter(m=>m.alive);
  for(const m of family) bumpRelationship(world,p.id,m.id,rand(3,7));
  p.charm=clamp(p.charm+rand(2,5),0,100);
  const house=lineage(world,p.id); bumpPrestige(house,rand(1,2));
  const text = family.length>=4 ? 'Reuniste a toda tu familia en un festín que se recordará por años.' : 'Ofreciste un festín; tu familia y tu nombre salen fortalecidos.';
  plog(world,'Festín en el hogar',text,'ocio',[p.id]); save(); render(); }
function doFair(){ const p=player(world); if(!p||p.age<8) return; if(!useAction()) return;
  p.charm=clamp(p.charm+rand(2,5),0,100);
  const skilled = p.charm>=55;
  if(chance(skilled?0.65:0.5)){
    p.reputation=clamp(p.reputation+rand(1,3),0,100);
    plog(world,'Bufón por un día', p.age<12?'Hiciste tonterías en la feria del pueblo, y todos se rieron contigo.':'Hiciste malabares en la feria del pueblo, para deleite de todos.','ocio',[p.id]);
  } else {
    p.personalMoney=Math.round(((p.personalMoney||0)+rand(1,3))*10)/10;
    plog(world,'Unas monedas en la feria','La gente pagó unas monedas por verte actuar en la feria.','ocio',[p.id]);
  }
  save(); render(); }
function doTrain(quality=1){ const p=player(world); if(!p||p.age<12) return; if(!useAction()) return;
  // §15 (sesión "cambios varios"): quality (0..1) viene del minijuego "Estocada precisa" —
  // una buena estocada rinde más salud/reputación y mejores chances de destacar.
  p.health=clamp(p.health+Math.max(1,Math.round(rand(1,3)*quality)),0,100);
  p.reputation=clamp(p.reputation+Math.max(0,Math.round(rand(1,2)*quality)),0,100);
  const pursuingSpurs = p.ambition && p.ambition.key==='earn_spurs';
  const flourish = quality>=0.85?' Tu estocada fue impecable.':(quality<0.15?' Aun así, hoy tu puntería estuvo torpe.':'');
  if(pursuingSpurs && chance(0.1+quality*0.25)){
    const house=lineage(world,p.id); bumpPrestige(house,1);
    plog(world,'Un capitán se fija en ti','Entrenaste con tanto ahínco que un capitán de la guardia se fijó en ti.'+flourish,'marcial',[p.id]);
  } else {
    plog(world,'Entrenamiento','Entrenaste con la guardia del pueblo, arco y lanza.'+flourish,'marcial',[p.id]);
  }
  save(); render(); }
function doSteal(){ const p=player(world); if(!p||p.age<10) return; if(!useAction()) return;
  // §8: temerario/a se arriesga a un blanco mejor (más botín, más chance de que salga mal);
  // prudente elige un blanco más seguro (menos botín, más chance de que salga bien)
  const bold=p.traits.includes('temerario/a'), careful=p.traits.includes('prudente');
  const successChance = bold?0.42:(careful?0.68:0.55);
  const reward = bold?rand(4,10):rand(2,6);
  if(chance(successChance)){ p.personalMoney=Math.round(((p.personalMoney||0)+reward)*10)/10;
    plog(world,'Hurto sin testigos','Te llevaste algo de valor del mercado sin que nadie lo notara.','crimen',[p.id]);
  } else {
    p.reputation=clamp(p.reputation-rand(6,14),0,100);
    const witness=getOrIntroduceNeighbor(world,p);
    if(witness){
      bumpRelationship(world,p.id,witness.id,-rand(6,14));
      if(chance(0.5)) addGrudge(world,witness.id);
      plog(world,genderText('Sorprendido/a robando',p.sex),`${witness.firstName} te vio robando y se lo contó a medio pueblo.`,'crimen',[p.id,witness.id]);
    } else {
      plog(world,genderText('Sorprendido/a robando',p.sex),'Te sorprendieron robando; el pueblo entero lo sabe ya.','crimen',[p.id]);
    }
  }
  save(); render(); }

/* ---------- §15 (sesión "cambios varios"): minijuegos ligeros ----------
   "Detén la aguja en la zona" — el mismo minijuego sirve para varias actividades de Hacer, así
   el resultado depende un poco de tu pulso y no solo de un dado invisible. La dificultad se
   ajusta con tu habilidad relacionada (más hábil = zona más ancha, aguja algo más lenta) y con tu
   salud (mal herido/a = zona más angosta, la mano tiembla). No sustituye el sistema de habilidades
   existente: solo escala su resultado (quality, 0..1) en vez de sustituirlo por texto plano. */
const MINIGAME_ACTIVITIES = {
  fields:  {skill:'farming', label:'Sembrar con buen pulso', hint:'Detén la aguja sobre el surco marcado.'},
  pastures:{skill:'animal_husbandry', label:'Calmar al animal', hint:'Detén la aguja justo cuando el animal se calme.'},
  forge:   {skill:null, label:'Golpe certero', hint:'Detén la aguja en el momento justo del golpe.'},
  train:   {skill:null, label:'Estocada precisa', hint:'Detén la aguja al alcance justo del blanco.'}
};
function minigameDifficultyFor(p, key){
  const cfg=MINIGAME_ACTIVITIES[key]||{};
  const skillVal = cfg.skill ? (p.skills[cfg.skill]||0) : 0;
  const healthPenalty = clamp((60-(p.health||60))/6, 0, 8);
  const zoneWidth = clamp(16 + skillVal*0.13 - healthPenalty, 12, 32);
  const cycleMs = clamp(1900 - skillVal*3, 1200, 1900);
  return {zoneWidth, cycleMs};
}
/* onResult recibe un quality 0..1 (1 = aguja detenida justo al centro de la zona). */
function openMinigame(key, onResult){
  const p=player(world);
  const {zoneWidth, cycleMs}=minigameDifficultyFor(p,key);
  const zoneStart = rand(0, Math.round(100-zoneWidth));
  ui.modal={type:'minigame', key, zoneStart, zoneWidth, cycleMs, startTs:Date.now(), onResult};
  render();
}
function resolveMinigameClick(){
  const m=ui.modal; if(!m||m.type!=='minigame') return;
  const elapsed=Date.now()-m.startTs;
  const half=m.cycleMs/2;
  const t=elapsed%m.cycleMs;
  const pos = t<half ? (t/half)*100 : (1-(t-half)/half)*100;
  const center=m.zoneStart+m.zoneWidth/2, halfZone=m.zoneWidth/2;
  const dist=Math.abs(pos-center);
  const quality = dist<=halfZone ? clamp(1-(dist/halfZone)*0.5,0.5,1) : clamp(0.5-(dist-halfZone)/40,0,0.5);
  const cb=m.onResult;
  ui.modal=null;
  if(cb) cb(quality);
}

/* §2.2: cada entrada declara, además de "visible" (¿aparece la tarjeta?), un "enabled" opcional
   (¿de verdad hace algo si la pulsas?). Antes varias tarjetas podían verse activas y no pasar
   nada al pulsarlas (Campos para un niño de 6-8 años, antes de que exista ayuda en el campo;
   Mercado sin grano; Festín sin monedas) — getPlayerCapabilities() es la única fuente de verdad

  {id:'pastures', label:'Pastizales', sub:'Cuidar a los animales de la granja', category:'trabajo', dataIcon:'place:pastures',
