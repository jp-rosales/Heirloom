/* primer amigo real (Parte 11): un PERSONAJE concreto del mundo, no solo un texto */
function resolveFirstFriendMilestone(w,p,turnLog){
  const excluded=new Set([p.fatherId,p.motherId,...p.siblingIds].filter(Boolean));
  let pool=Object.values(w.characters).filter(c=>c.alive && c.id!==p.id && c.age<=9 &&
    Math.abs(c.age-p.age)<=3 && !excluded.has(c.id) && !(p.knownCharacterIds||[]).includes(c.id));
  const friend = pool.length? pick(pool) : spawnVillageFamily(w, clamp(p.age+rand(-1,1),0,9));
  introduceCharacter(p, friend);
  bumpRelationship(w,p.id,friend.id,rand(30,50));
  p.firstFriendId=friend.id;
  const entry=triggerMilestone(w,p,'first_friend',{icon:'🧸',title:'Primer amigo',desc:`Has hecho amistad con ${friend.firstName} ${friend.familyName}.`,major:false});
  if(entry) turnLog.push(entry);
}
function resolveMilestones(w, turnLog){
  const p=player(w);
  p.milestones = p.milestones||[];
  w.pendingMilestoneModals = w.pendingMilestoneModals||[];
  for(const m of MILESTONE_DEFS){
    if(p.age!==m.age || p.milestones.includes(m.key)) continue;
    if(m.chance && !chance(m.chance)) continue;
    if(m.custom){
      if(m.key==='first_friend') resolveFirstFriendMilestone(w,p,turnLog);
      continue;
    }
    p.milestones.push(m.key);
    if(m.minor){
      turnLog.push(log(w, m.title, m.text(p), 'personaje', [p.id]));
    } else {
      w.pendingMilestoneModals.push({key:m.key, title:m.title, text:m.modalText(w,p), buttonLabel:m.buttonLabel||'Continuar'});
      turnLog.push(log(w, m.title, m.title, 'personaje', [p.id]));
    }
  }
}

/* ---------- FamilySystem: nacimientos (Parte 9/10) ---------- */
function inheritTraits(a,b){
  const poolUnique=[...new Set([...a.traits,...b.traits])];
  const target=Math.min(2,poolUnique.length);
  const chosen=new Set();
  while(chosen.size<target) chosen.add(pick(poolUnique));
  if(chance(0.2)) chosen.add(pick(TRAITS));
  return [...chosen];
}
function resolveBirths(w, turnLog){
  for(const m of Object.values(w.characters)){
    if(!m.alive || m.sex!=='F' || !m.spouseId) continue;
    const spouse=C(m.spouseId);
    if(!spouse || !spouse.alive) continue;
    if(m.age<16 || m.age>45) continue;
    if(!chance(0.22)) continue;
    const father = spouse.sex==='M'?spouse:m;
    const mother = spouse.sex==='M'?m:spouse;
    const surname = determineChildSurname(father,mother);
    const lineageId = determineChildLineage(father,mother);
    // §1 (sesión "cambios varios"): que un hermano nuevo no se llame igual que un hermano
    // existente, ni que el padre o la madre — antes era pura coincidencia de azar.
    const existingSiblingIds = father.childrenIds.filter(id=>mother.childrenIds.includes(id));
    const avoidBirthNames = [father.firstName, mother.firstName, ...existingSiblingIds.map(id=>{ const s=w.characters[id]; return s?s.firstName:null; })];
    const child = makeCharacter({sex:pick(['M','F']), age:0, familyName:surname, houseId:lineageId, householdId:mother.householdId,
      fatherId:father.id, motherId:mother.id, traits:inheritTraits(father,mother), avoidNames:avoidBirthNames});
    child.skills.farming = Math.round((father.skills.farming+mother.skills.farming)/2*0.25);
    w.characters[child.id]=child;
    father.childrenIds.push(child.id); mother.childrenIds.push(child.id);
    if(w.houses[lineageId]) w.houses[lineageId].memberIds.push(child.id);
    if(mother.householdId && w.households[mother.householdId]) w.households[mother.householdId].memberIds.push(child.id);
    // hermanos existentes (mismo padre y madre): consistencia bidireccional (Parte 9 / Parte 23)
    const existingSiblings = father.childrenIds.filter(id=>id!==child.id && mother.childrenIds.includes(id)).map(id=>w.characters[id]).filter(Boolean);
    child.siblingIds = existingSiblings.map(s=>s.id);
    existingSiblings.forEach(s=>{ if(!s.siblingIds.includes(child.id)) s.siblingIds.push(child.id); });

    const birthEntry=log(w,birthTitle(child.sex),`${capitalize(personRef(w.playerId,mother.id))} y ${personRef(w.playerId,father.id)} han recibido ${child.sex==='M'?'a un hijo':'a una hija'}: ${personRef(w.playerId,child.id)}.`,'family',[father.id,mother.id,child.id],undefined,child.id);
    if(isNoteworthyToPlayer(w,father.id)||isNoteworthyToPlayer(w,mother.id)) turnLog.push(birthEntry);
    if(chance(0.02)){
      mother.alive=false; mother.deathYear=w.year; mother.causeOfDeath='complicaciones de parto';
      cacheLifeSummary(w,mother);
      const deathEntry=log(w,'Tragedia en el parto',`${capitalize(personRef(w.playerId,mother.id))} no sobrevivió al parto. Toda la casa guarda luto.`,'family',[mother.id],undefined,mother.id);
      if(isNoteworthyToPlayer(w,mother.id)) turnLog.push(deathEntry);
      if(mother.id===w.playerId) w.pendingPlayerDeath=mother.id;
    }
  }
}

/* ---------- MortalitySystem (Parte 19: mortalidad refinada por etapas de edad) ---------- */
function ageDeathChance(age,health,traits){
  let c;
  if(age<1) c=0.05;
  else if(age<=5) c=0.02;
  else if(age<=15) c=0.008;
  else if(age<40) c=0.006;
  else if(age<50) c=0.012;
  else if(age<60) c=0.03;
  else if(age<70) c=0.07;
  else if(age<80) c=0.15;
  else c=0.32;
  c *= (1 + (60-health)/110);
  if(traits.includes('enfermizo/a')) c*=1.35;
  if(traits.includes('fuerte de cuerpo')) c*=0.75;
  return clamp(c,0.002,0.9);
}
function causeOfDeath(age){
  if(age<=5) return pick(['unas fiebres infantiles','una enfermedad del invierno']);
  if(age<40) return pick(['un accidente en el campo','una fiebre repentina','una herida infectada']);
  if(age<65) return pick(['una enfermedad del invierno','un accidente','fiebres persistentes']);
  return pick(['la vejez','una enfermedad de invierno','el debilitamiento de los años']);
}
function cacheLifeSummary(w,ch){
  const spouse = ch.spouseId?C(ch.spouseId):null;
  const master = (ch.career && ch.career.masterId) ? C(ch.career.masterId) : null;
  ch.lifeSummary = {
    birth:ch.birthYear, death:ch.deathYear, profession:ch.profession,
    careerLabel: getDisplayOccupation(ch),
    masterName: master? (master.firstName+' '+master.familyName) : null,
    leftHomeAge: ch.leftHomeAge!==undefined ? ch.leftHomeAge : null,
    spouseName: spouse?(spouse.firstName+' '+spouse.familyName):null,
    marriedAge: ch.marriedAge||null,
    numChildren: ch.childrenIds.length,
    cause: ch.causeOfDeath,
    highlights: w.history.filter(h=>h.related.includes(ch.id)).slice(-5)
  };
}
function resolveMortality(w, turnLog){
  for(const ch of Object.values(w.characters)){
    if(!ch.alive) continue;
    ch.health = clamp(ch.health + rand(-4,3) - (ch.age>55?1:0), 0, 100);
    if(ch.traits.includes('fuerte de cuerpo')) ch.health=clamp(ch.health+1,0,100);
    if(ch.traits.includes('enfermizo/a')) ch.health=clamp(ch.health-1,0,100);
    const dc = ageDeathChance(ch.age, ch.health, ch.traits);
    if(chance(dc)){
      ch.alive=false; ch.deathYear=w.year; ch.causeOfDeath=causeOfDeath(ch.age);
      cacheLifeSummary(w,ch);
      const whoRef = ch.id===w.playerId ? `${ch.firstName} ${ch.familyName}` : capitalize(personRef(w.playerId,ch.id));
      const deathEntry=log(w,'Una muerte en la familia',`${whoRef} ha muerto, a los ${ch.age} años, por ${ch.causeOfDeath}.`,'family',[ch.id],undefined,ch.id);
      if(isNoteworthyToPlayer(w,ch.id)) turnLog.push(deathEntry);
      // Parte 38: si la cabeza de hogar muere, el hogar sigue teniendo alguien al mando con sentido
      if(ch.householdId && w.households[ch.householdId] && w.households[ch.householdId].headId===ch.id) resolveHouseholdHead(w.households[ch.householdId]);
      if(ch.id===w.playerId) w.pendingPlayerDeath=ch.id;
    }
  }
}

/* ================= NpcLifeSystem (Parte 3-8, 16) =================
   Cada año, los familiares vivos que el jugador NO controla pueden
   casarse, formar su propio hogar, encontrar oficio y prosperar o
   empobrecerse — todo por reglas/probabilidades, sin IA generativa. */
function npcMarriageChance(c){
  let base;
  const age=c.age;
  if(age<18) base=0.03;
  else if(age<=30) base=0.16;
  else if(age<=40) base=0.08;
  else if(age<=55) base=0.03;
  else base=0.01;
  if(c.traits.includes('sociable')) base*=1.4;
  if(c.traits.includes('reservado/a')) base*=0.6;
  base *= clamp(0.6+c.health/200,0.5,1.2);
  base *= clamp(0.7+c.reputation/200,0.6,1.3);
  return clamp(base,0.005,0.5);
}
function npcIndependenceChance(c){
  let base=0.05;
  if(c.traits.includes('ambicioso/a')) base*=1.8;
  if(c.traits.includes('prudente')) base*=0.6;
  return clamp(base,0.01,0.3);
}
function foundNewHousehold(w, headChar, turnLog, opts={}){
  const oldHousehold = headChar.householdId ? w.households[headChar.householdId] : null;
  const hhId=uid();
  const hh={id:hhId, name:'Casa de '+headChar.firstName+' '+headChar.familyName, headId:headChar.id,
    memberIds:[headChar.id], money:rand(1,4), grainStores:rand(2,6), propertyIds:[], createdYear:w.year};
  if(oldHousehold){
    const gift=Math.min(oldHousehold.money, rand(1,3));
    oldHousehold.money-=gift; hh.money+=gift;
    oldHousehold.memberIds = oldHousehold.memberIds.filter(id=>id!==headChar.id);
    if(oldHousehold.headId===headChar.id){
      oldHousehold.headId = oldHousehold.memberIds[0] || oldHousehold.headId;
    }
  }
  w.households[hhId]=hh;
  headChar.householdId=hhId;
  if(opts.extraMember){
    hh.memberIds.push(opts.extraMember.id);
    opts.extraMember.householdId=hhId;
  }
  const entry=log(w, opts.reason==='marriage'?'Nuevo hogar':'Independencia',
    `${headChar.firstName} ${headChar.familyName} formó su propio hogar${opts.extraMember?(' junto a '+opts.extraMember.firstName):''}.`,
    'family',[headChar.id]);
  if(turnLog && (isNoteworthyToPlayer(w,headChar.id)||(opts.extraMember&&isNoteworthyToPlayer(w,opts.extraMember.id)))) turnLog.push(entry);
  assignNpcCareer(headChar, turnLog);
  return hh;
}
function npcMarry(w, c, turnLog){
  const sex = c.sex==='M'?'F':'M';
  const spouse = spawnExternalSpouse(sex, [16, Math.min(50, Math.max(20,c.age+6))], w, namesKnownTo(c));
  w.characters[spouse.id]=spouse;
  spouse.spouseId=c.id; c.spouseId=spouse.id;
  c.marriedAge=c.age; spouse.marriedAge=spouse.age;
  bumpRelationship(w,c.id,spouse.id,50);
  const staysHome = c.householdId && w.households[c.householdId] && chance(0.45);
  if(staysHome){
    const hh=w.households[c.householdId];
    hh.memberIds.push(spouse.id);
    spouse.householdId=hh.id;
  } else {
    foundNewHousehold(w, c, turnLog, {reason:'marriage', extraMember:spouse});
  }
  const entry = log(w,'Matrimonio',`${c.firstName} ${c.familyName} se casó con ${spouse.firstName} ${spouse.familyName}.`,'family',[c.id,spouse.id]);
  if(turnLog && isNoteworthyToPlayer(w,c.id)) turnLog.push(entry);
  assignNpcCareer(spouse, turnLog);
}
/* gastos de los hogares NPC; los ingresos ya se aplicaron vía resolvePersonalEconomy(),
   que lee del mismo registro PROFESSIONS que usa el jugador (Partes 26, 48: una sola fuente) */
function resolveNpcEconomies(w, turnLog){
  const skipId=player(w).householdId;
  for(const hh of Object.values(w.households)){
    if(hh.id===skipId) continue;
    const members=hh.memberIds.map(id=>w.characters[id]).filter(c=>c&&c.alive);
    if(!members.length) continue;
    let expenses=0;
    for(const m of members) expenses+=1.5+(m.age<16?-0.4:0);
    if(members.some(mm=>mm.traits.includes('tacaño/a'))) expenses*=0.85;
    const before=householdStatus(hh);
    hh.money=Math.max(0, Math.round(hh.money-expenses));
    const after=householdStatus(hh);
    if(before!==after && isCloseFamily(w.playerId, hh.headId)){
      turnLog.push({year:w.year, title:'Cambia la suerte de la familia', desc:`${hh.name}: ${householdStatusLabel(after)}`, tag:'family', related:[hh.headId], minor:true});
    }
  }
}
function resolveNpcLife(w, turnLog){
  const livingCount = Object.values(w.characters).filter(c=>c.alive).length;
  const overCrowded = livingCount > 60; // límite ligero de rendimiento/legibilidad (Parte 49)
  for(const c of Object.values(w.characters)){
    if(!c.alive || c.id===w.playerId) continue;
    if(c.age<16) continue;
    const widowed = c.spouseId && C(c.spouseId) && !C(c.spouseId).alive;
    if((!c.spouseId || widowed) && c.age<=60 && !overCrowded){
      if(chance(npcMarriageChance(c))){ npcMarry(w,c,turnLog); continue; }
    }
    if(c.householdId && w.households[c.householdId] && w.households[c.householdId].headId!==c.id){
      if(!isCloseFamily(w.playerId, c.id) && chance(npcIndependenceChance(c))){
        foundNewHousehold(w, c, turnLog, {reason:'independence'});
        continue;
      }
    }
    assignNpcCareer(c, turnLog);
  }
  resolveNpcEconomies(w, turnLog);
}

/* ---------- EventSystem: eventos de ciclo vital (Parte 14) ----------
   Se generan como funciones (no como entradas planas de EVENTS) porque
   necesitan capturar a un familiar concreto para sus opciones. */
function resolveEnfermedad(w,p){
  const targets=closeFamilyFlat(p.id).filter(m=>m.alive);
  if(!targets.length) return null;
  const sick=pick(targets);
  const sickRef=capitalize(kinRef(p.id,sick.id));
  const sickSuffix=sick.sex==='M'?'o':'a';
  return {id:'enfermedad_familiar', interactive:true, portraitId:sick.id,
    text:pick([
      `${sickRef} ha caíd${sickSuffix} enferm${sickSuffix} durante el cambio de estación.`,
      `${sickRef} lleva días con fiebre y no mejora.`,
      `${sickRef} se queja de un dolor que no se le pasa.`
    ]),
    options:[
      {label:'Cuidarle '+genderText('tú mismo/a',p.sex), desc:'-tu salud, buena recuperación',
        effect:(w,p)=>{ p.health=clamp(p.health-rand(3,7),0,100); sick.health=clamp(sick.health+rand(8,16),0,100);
          return log(w,'Cuidados en casa',`Velaste a ${sick.firstName} noche y día hasta que la fiebre cedió.`,'family',[p.id,sick.id]);}},
      {label:'Pagar a un curandero', desc:'-monedas, recuperación segura',
        effect:(w,p)=>{ household(w).money=Math.max(0,household(w).money-4); sick.health=clamp(sick.health+rand(10,18),0,100);
          return log(w,'El curandero','Pagaste al curandero del pueblo, que atendió a '+sick.firstName+' con hierbas y ungüentos.','family',[p.id,sick.id]);}},
      {label:'Rezar y esperar', desc:'gratis, resultado incierto',
        effect:(w,p)=>{ if(chance(0.5)) sick.health=clamp(sick.health+rand(4,10),0,100); else sick.health=clamp(sick.health-rand(4,10),0,100);
          return log(w,'A la espera',`Encomendaste a ${sick.firstName} a ${WORLD_FLAVOR.faith} y esperaste.`,'family',[p.id,sick.id]);}}
    ]};
}
function buildAdolescenciaEvent(w,p){
  if(!p.fatherId && !p.motherId) return null;
  const parent = p.fatherId?C(p.fatherId):C(p.motherId);
  if(!parent || !parent.alive) return null;
  return {id:'adolescencia_responsabilidad', interactive:true, portraitId:parent.id,
    text:`${capitalize(kinRef(p.id,parent.id))} considera que ya tienes edad para asumir más responsabilidad en la granja.`,
    options:[
      {label:'Trabajar más en los campos', desc:'+labranza, -salud leve',
        effect:(w,p)=>{ p.skills.farming=clamp(p.skills.farming+rand(2,5),0,100); p.health=clamp(p.health-rand(1,3),0,100);
          return log(w,'Más responsabilidad','Empezaste a pasar largas jornadas en el campo.','personaje',[p.id]);}},
      {label:'Cuidar el ganado', desc:'+ganadería',
        effect:(w,p)=>{ p.skills.animal_husbandry=clamp(p.skills.animal_husbandry+rand(2,5),0,100);
          return log(w,'Más responsabilidad','Asumiste el cuidado diario del ganado familiar.','personaje',[p.id]);}},
      {label:'Evitar responsabilidades', desc:'sin ganancias, leve tensión',
        effect:(w,p)=>{ bumpRelationship(w,p.id,parent.id,-3);
          return log(w,'Evitas responsabilidades','Preferiste seguir como hasta ahora, para disgusto de tu familia.','personaje',[p.id]);}}
    ]};
}
/* ---------- eventos de vocación (v4, Partes 3, 8, 31): el oficio emerge de la vida,
   nunca de un menú de elección — se ofrece a través de personas y ocasiones concretas. ---------- */
function buildApprenticeshipOfferEvent(w,p){
  if(p.career && p.career.professionId) return null;
  const masters=findAvailableMasters(p);
  if(!masters.length) return null;
  const master=pick(masters);
  const prof=PROFESSIONS[master.career.professionId];
  return {id:'oferta_aprendizaje', interactive:true, minAge:12, portraitId:master.id,
    text:`${master.firstName} ${master.familyName}, ${genderText(prof.label,master.sex).toLowerCase()} de ${WORLD_FLAVOR.villageName}, necesita a alguien que le ayude.`,
    options:[
      {label:`Preguntar si puedes aprender con ${pronoun(master.sex)}`, desc:'comienzas tu aprendizaje',
        effect:(w,p)=>{ introduceCharacter(p,master); startApprenticeship(p,master);
          return log(w,'Un nuevo aprendizaje',`${master.firstName} aceptó enseñarte los primeros pasos de ${genderText(prof.label,master.sex).toLowerCase()}.`,'trabajo',[p.id,master.id]); }},
      {label:'Aceptar solo algunos trabajos sueltos', desc:'pequeño ingreso, sin compromiso',
        effect:(w,p)=>{ introduceCharacter(p,master); p.personalMoney=Math.round(((p.personalMoney||0)+rand(1,2))*10)/10;
          return log(w,'Trabajos sueltos',`Ayudaste a ${master.firstName} en algunas tareas sencillas a cambio de unas monedas.`,'trabajo',[p.id,master.id]); }},
      {label:'Rechazar', desc:'sin efecto',
        effect:(w,p)=> log(w,'No es el momento',`Le explicaste a ${master.firstName} que no era el momento.`,'trabajo',[p.id])},
      {label:'Decir que tu familia necesita tus manos en el campo', desc:'refuerza el vínculo familiar',
        effect:(w,p)=>{ const parent=p.fatherId?C(p.fatherId):(p.motherId?C(p.motherId):null);
          if(parent) bumpRelationship(w,p.id,parent.id,4);
          return log(w,'Tu lugar está en casa','Le dijiste que tu familia te necesita en las tierras familiares.','trabajo',[p.id]); }}
    ]};
}
function buildFamilyTradeEvent(w,p){
  if(p.career && p.career.professionId) return null;
  const hh=household(w); if(!propertiesOf(hh).length && !animalsOf(hh).length) return null;
  const parent=p.fatherId?C(p.fatherId):(p.motherId?C(p.motherId):null);
  if(!parent||!parent.alive) return null;
  return {id:'oferta_tierras_familiares', interactive:true, minAge:14, portraitId:parent.id,
    text:`${capitalize(kinRef(p.id,parent.id))} cree que ya es hora de que te dediques en serio a las tierras de la familia.`,
    options:[
      {label:'Sí, seguiré con las tierras familiares', desc:'comienzas tu propio oficio',
        effect:(w,p)=>{ const profId = p.skills.animal_husbandry>p.skills.farming ? 'shepherd' : 'peasant_farmer';
          const stage = (p.skills.farming>25||p.skills.animal_husbandry>25) ? 'worker' : 'helper';
          p.career={professionId:profId, stage, masterId:null, startedYear:w.year, experience: stage==='worker'?20:5, annualEarnings:0};
          triggerMilestone(w,p,'first_real_profession',{icon:PROFESSIONS[profId].icon,title:'Tu primer oficio',desc:`Te dedicas ahora a ${genderText(PROFESSIONS[profId].label,p.sex).toLowerCase()}.`,major:false});
          return log(w,'Las tierras familiares',`Aceptaste dedicarte a las tierras de la familia, como ${genderText(PROFESSIONS[profId].label,p.sex).toLowerCase()}.`,'trabajo',[p.id,parent.id]); }},
      {label:'Preferirías otra cosa', desc:'leve tensión con tu familia',
        effect:(w,p)=>{ bumpRelationship(w,p.id,parent.id,-3);
          return log(w,'Otros planes',`Le dijiste a ${kinRef(p.id,parent.id,{withName:false})} que preferirías buscar otro camino.`,'trabajo',[p.id,parent.id]); }},
      {label:'Todavía no lo sabes', desc:'sin efecto',
        effect:(w,p)=> log(w,'Aún sin decidir','Todavía no sabes bien qué quieres hacer con tu vida.','trabajo',[p.id])}
    ]};
}
function buildLaborerFallbackEvent(w,p){
  if(p.career && p.career.professionId) return null;
  if(p.age<18) return null;
  return {id:'oferta_jornal', interactive:true, minAge:16,
    text:'Necesitas empezar a ganarte la vida de algún modo.',
    options:[
      {label:'Trabajar como '+genderText('jornalero/a',p.sex), desc:'oficio sencillo, ingreso modesto',
        effect:(w,p)=>{ p.career={professionId:'laborer', stage:'worker', masterId:null, startedYear:w.year, experience:5, annualEarnings:0};
          triggerMilestone(w,p,'first_real_profession',{icon:PROFESSIONS.laborer.icon,title:'Tu primer oficio',desc:`Comienzas a trabajar como ${genderText('bracero/a',p.sex)}.`,major:false});
          return log(w,'Jornalero por necesidad',`Empezaste a trabajar como ${genderText('jornalero/a',p.sex)}, aceptando cualquier tarea a cambio de un jornal.`,'trabajo',[p.id]); }},
      {label:'Seguir buscando otra cosa', desc:'sin efecto',
        effect:(w,p)=> log(w,'Sigues buscando','Prefieres esperar antes de conformarte con cualquier trabajo.','trabajo',[p.id])}
    ]};
}
/* §7: los oficios ya existentes (progreso, habilidad, ingresos, maestro) ganan una capa de
   decisiones DISTINTIVAS — no "+3 artesanía porque eres herrero", sino decisiones que solo
   tienen sentido por ser precisamente ese oficio. Un evento bien diseñado por oficio real,
   con variaciones donde es fácil, usando habilidad/rasgos/ingenio/maestro/reputación. */
function buildFarmerEvent(w,p){
  const hh=household(w); if(!propertiesOf(hh).length) return null;
  const bold=p.traits.includes('temerario/a'), careful=p.traits.includes('prudente');
  return {id:'evento_profesional', interactive:true,
    text:'Un vecino te sugiere sembrar antes de lo habitual este año, apostando a que el tiempo acompañe.',
    options:[
      {label:'Sembrar antes de lo habitual', desc:'riesgo mayor, recompensa mayor'+(bold?' (encaja con tu carácter)':''),
        effect:(w,p)=>{ const skill=p.skills.farming||0; const okChance=clamp(0.35+skill/200+(bold?0.15:0)-(careful?0.1:0),0.15,0.85);
          if(chance(okChance)){ hh.grainStores=(hh.grainStores||0)+rand(6,12);
            return log(w,'La apuesta salió bien','Sembraste antes de lo habitual y el tiempo te dio la razón: la cosecha es mejor de lo esperado.','trabajo',[p.id]); }
          hh.grainStores=Math.max(0,(hh.grainStores||0)-rand(2,5));
          return log(w,'La apuesta salió mal','Sembraste antes de tiempo, pero una helada tardía se llevó parte de lo sembrado.','trabajo',[p.id]);}},
      {label:'Sembrar como siempre', desc:'sin riesgo extra'+(careful?' (encaja con tu carácter)':''),
        effect:(w,p)=> log(w,'Como cada año','Preferiste sembrar como siempre, sin arriesgar nada extra este año.','trabajo',[p.id])}
    ]};
}
function buildShepherdEvent(w,p){
  const hh=household(w); const list=animalsOf(hh).filter(a=>a.species==='sheep');
  if(!list.length) return null;
  const bold=p.traits.includes('temerario/a');
  return {id:'evento_profesional', interactive:true,
    text:'Durante la noche, algo ronda cerca del corral. Podrías quedarte a vigilar.',
    options:[
      {label:'Vigilar toda la noche', desc:'riesgo personal, protege el rebaño'+(bold?' (encaja con tu carácter)':''),
        effect:(w,p)=>{ if(chance(bold?0.75:0.6)) return log(w,'Noche en vela','Espantaste lo que rondaba el corral; el rebaño está a salvo.','trabajo',[p.id]);
          const a=pick(list); a.health=clamp((a.health===undefined?70:a.health)-rand(15,30),0,100);
          return log(w,'No fue suficiente','Pese a tu vigilancia, algo alcanzó a una de tus ovejas.','trabajo',[p.id]);}},
      {label:'Dejarlo para mañana', desc:'sin riesgo, el rebaño queda expuesto',
        effect:(w,p)=>{ if(chance(0.4)){ const a=pick(list); a.health=clamp((a.health===undefined?70:a.health)-rand(15,30),0,100);
            return log(w,'Un ataque nocturno','Algo atacó al rebaño durante la noche.','trabajo',[p.id]); }
          return log(w,'Sin novedad','No pasó nada esta noche, para tu alivio.','trabajo',[p.id]);}}
    ]};
}
function buildFarmWorkerEvent(w,p){
  const others=Object.values(w.characters).filter(c=>c.alive && c.id!==p.id && c.career && c.career.professionId==='peasant_farmer' && c.householdId!==p.householdId);
  if(!others.length) return null;
  const employer=pick(others);
  return {id:'evento_profesional', interactive:true, portraitId:employer.id,
    text:`${employer.firstName} te ofrece un jornal para ayudar con su cosecha, pero el trato suena mejor de lo que parece.`,
    options:[
      {label:'Examinar bien el trato antes de aceptar', desc:'mejor si eres ingenioso/a',
        effect:(w,p)=>{ if(witsCheck(p,0.4)){ p.personalMoney=Math.round(((p.personalMoney||0)+rand(2,4))*10)/10;
            return log(w,'Un trato justo, al final',`Detectaste que ${employer.firstName} pagaba menos de lo prometido y conseguiste que te pagara lo justo — tu ingenio ayudó.`,'trabajo',[p.id,employer.id]); }
          p.personalMoney=Math.round(((p.personalMoney||0)+rand(0,1))*10)/10;
          return log(w,'Un trato peor de lo esperado',`Aceptaste el trato de ${employer.firstName} y terminaste cobrando menos de lo que esperabas.`,'trabajo',[p.id,employer.id]);}},
      {label:'Aceptar sin más', desc:'ingreso inmediato, sin comprobar nada',
        effect:(w,p)=>{ p.personalMoney=Math.round(((p.personalMoney||0)+rand(1,3))*10)/10;
          return log(w,'Un jornal más',`Trabajaste para ${employer.firstName} a cambio de un jornal.`,'trabajo',[p.id,employer.id]);}}
    ]};
}
function buildLaborerEvent(w,p){
  const bold=p.traits.includes('temerario/a'), careful=p.traits.includes('prudente');
  return {id:'evento_profesional', interactive:true,
    text:'Te ofrecen una paga extra por encargarte de la parte más pesada y peligrosa del trabajo de hoy.',
    options:[
      {label:'Aceptar la tarea peligrosa', desc:'más paga, riesgo de lesión'+(bold?' (encaja con tu carácter)':''),
        effect:(w,p)=>{ if(chance(careful?0.15:(bold?0.25:0.3))){ p.health=clamp(p.health-rand(8,15),0,100);
            return log(w,'Un accidente de trabajo','Te lesionaste haciendo la parte más pesada del trabajo.','trabajo',[p.id]); }
          p.personalMoney=Math.round(((p.personalMoney||0)+rand(2,4))*10)/10;
          return log(w,'Trabajo duro, buena paga','Hiciste la parte más pesada del trabajo y cobraste bien por ello.','trabajo',[p.id]);}},
      {label:'Rechazar y hacer tu parte habitual', desc:'sin riesgo'+(careful?' (encaja con tu carácter)':''),
        effect:(w,p)=> log(w,'Sin riesgos innecesarios','Preferiste no arriesgarte por una paga extra.','trabajo',[p.id])}
    ]};
}
function buildCraftCommissionEvent(w,p,flavor){
  const skill=p.skills.craftsmanship||0;
  return {id:'evento_profesional', interactive:true,
    text:`Alguien te encarga un trabajo importante, pero el ${flavor.material} que te ofrecen para hacerlo no parece de la mejor calidad.`,
    options:[
      {label:'Examinar el material antes de aceptar', desc:'mejor si eres ingenioso/a o experimentado/a',
        effect:(w,p)=>{ const sharp=isWitty(p)||skill>=50;
          if(sharp){ p.reputation=clamp((p.reputation||0)+rand(2,5),0,100);
            return log(w,'Un ojo entrenado',`Notaste que el ${flavor.material} no era bueno y pediste otro antes de empezar — el encargo salió perfecto.`,'trabajo',[p.id]); }
          if(chance(0.5)){ p.reputation=clamp((p.reputation||0)+rand(1,3),0,100);
            return log(w,'Salió bien, por suerte',`El ${flavor.material} no era el mejor, pero el trabajo salió adelante de todas formas.`,'trabajo',[p.id]); }
          p.reputation=clamp((p.reputation||0)-rand(2,5),0,100);
          return log(w,'Un encargo fallido',`El ${flavor.material} de mala calidad arruinó el trabajo: entregaste ${flavor.itemBad} en vez de lo prometido.`,'trabajo',[p.id]);}},
      {label:'Aceptar el encargo tal cual', desc:'más rápido, más riesgo',
        effect:(w,p)=>{ p.personalMoney=Math.round(((p.personalMoney||0)+rand(2,4))*10)/10;
          if(chance(0.5)) return log(w,'Salió adelante',`Aceptaste el encargo sin más preguntas y terminaste entregando ${flavor.itemGood} digno.`,'trabajo',[p.id]);
          p.reputation=clamp((p.reputation||0)-rand(1,4),0,100);
          return log(w,'No salió como esperabas',`El encargo no salió como esperabas: entregaste ${flavor.itemBad}.`,'trabajo',[p.id]);}}
    ]};
}
function buildCarpenterEvent(w,p){ return buildCraftCommissionEvent(w,p,{material:'madera', itemGood:'un mueble sólido', itemBad:'una pieza torcida'}); }
function buildBlacksmithEvent(w,p){ return buildCraftCommissionEvent(w,p,{material:'metal', itemGood:'una herramienta firme', itemBad:'una hoja quebradiza'}); }
function buildBakerEvent(w,p){
  const generous=p.traits.includes('generoso/a'), stingy=p.traits.includes('tacaño/a');
  return {id:'evento_profesional', interactive:true,
    text:'El grano escasea este mes, y algunas familias pobres del pueblo no pueden pagar el pan al precio de siempre.',
    options:[
      {label:'Vender el pan más barato a quien lo necesite', desc:'-ingreso, +reputación'+(generous?' (encaja con tu carácter)':''),
        effect:(w,p)=>{ p.personalMoney=Math.max(0,(p.personalMoney||0)-rand(1,3)); p.reputation=clamp((p.reputation||0)+rand(4,8),0,100);
          return log(w,'Pan para quien lo necesita','Vendiste el pan más barato a las familias que pasaban apuros.','trabajo',[p.id]);}},
      {label:'Vender al precio de siempre', desc:'+ingreso, posible resentimiento'+(stingy?' (encaja con tu carácter)':''),
        effect:(w,p)=>{ p.personalMoney=Math.round(((p.personalMoney||0)+rand(2,4))*10)/10; p.reputation=clamp((p.reputation||0)-rand(2,5),0,100);
          return log(w,'Negocio es negocio','Mantuviste tus precios, aunque no a todos les sentó bien.','trabajo',[p.id]);}}
    ]};
}
function buildMillerEvent(w,p){
  const others=Object.values(w.characters).filter(c=>c.alive && c.id!==p.id && !isCloseFamily(p.id,c.id));
  const customer=others.length?pick(others):null;
  return {id:'evento_profesional', interactive:true, portraitId: customer?customer.id:null,
    text: customer? `${customer.firstName} viene a moler su grano, pero algo en la cantidad que trae no cuadra.` : 'Un cliente viene a moler su grano, pero algo en la cantidad que trae no cuadra.',
    options:[
      {label:'Comprobar la medida con cuidado', desc:'mejor si eres ingenioso/a',
        effect:(w,p)=>{ if(witsCheck(p,0.45)){ p.personalMoney=Math.round(((p.personalMoney||0)+rand(1,3))*10)/10;
            return log(w,'Cuentas claras',`Revisaste la medida con cuidado y evitaste perder parte de tu paga en el trato${customer?` con ${customer.firstName}`:''}.`,'trabajo',[p.id]); }
          return log(w,'Se te pasó por alto','No reparaste en la diferencia de medida, y probablemente perdiste algo en el trato.','trabajo',[p.id]);}},
      {label:'Confiar sin comprobar', desc:'más rápido, riesgo de pérdida',
        effect:(w,p)=>{ if(chance(0.5)) return log(w,'Sin problemas','Confiaste en la palabra del cliente, y no hubo ningún problema.','trabajo',[p.id]);
          return log(w,'Cuentas que no cuadran','Confiaste sin comprobar, y las cuentas del molino no cuadraron del todo.','trabajo',[p.id]);}}
    ]};
}
function buildGuardEvent(w,p){
  const bold=p.traits.includes('temerario/a'), careful=p.traits.includes('prudente');
  return {id:'evento_profesional', interactive:true,
    text:'Sorprendes a alguien intentando robar en el mercado durante tu guardia.',
    options:[
      {label:'Detenerlo tú mismo/a', desc:'riesgo físico'+(bold?' (encaja con tu carácter)':''),
        effect:(w,p)=>{ if(chance(bold?0.7:0.55)){ p.reputation=clamp((p.reputation||0)+rand(3,7),0,100);
            return log(w,'Un ladrón menos','Atrapaste al ladrón tú mismo/a, y la gente del mercado te lo agradeció.','trabajo',[p.id]); }
          p.health=clamp(p.health-rand(5,12),0,100);
          return log(w,'Se te escapó','El ladrón escapó, no sin antes dejarte un buen golpe.','trabajo',[p.id]);}},
      {label:'Pedir ayuda antes de actuar', desc:'más seguro, puede escapar'+(careful?' (encaja con tu carácter)':''),
        effect:(w,p)=>{ if(chance(0.5)){ p.reputation=clamp((p.reputation||0)+rand(1,4),0,100);
            return log(w,'Entre varios','Con ayuda, conseguiste atrapar al ladrón sin sobresaltos.','trabajo',[p.id]); }
          return log(w,'Escapó','Para cuando llegó la ayuda, el ladrón ya había escapado.','trabajo',[p.id]);}}

const PROFESSIONAL_EVENT_BUILDERS = {
  peasant_farmer: buildFarmerEvent, shepherd: buildShepherdEvent, farm_worker: buildFarmWorkerEvent,
  laborer: buildLaborerEvent, carpenter: buildCarpenterEvent, blacksmith: buildBlacksmithEvent,
  baker: buildBakerEvent, miller: buildMillerEvent, guard: buildGuardEvent
};
function buildProfessionalEvent(w,p){
  if(!p.career || !p.career.professionId) return null;
  if(p.career.stage==='helper'||p.career.stage==='apprentice') return null; // esos años ya los cubre el hilo de aprendizaje (§6B)
  const fn=PROFESSIONAL_EVENT_BUILDERS[p.career.professionId];
  if(!fn) return null;
  return fn(w,p);
}
/* §6B continuación: la relación con el maestro sigue viva después de empezar el aprendizaje.
   El maestro ya es un Character real; no todas las etapas tienen por qué aparecer. */
function buildApprenticeContinuationEvent(w,p){
  if(eventOnCooldown(w,'apprentice_thread_continuation',2)) return null;
  const thread=findStoryThread(w,'apprenticeship', t=> t.actorIds[0]===p.id && threadAge(w,t)>=1);
  if(!thread) return null;
  const master=C(thread.actorIds[1]);
  if(!master||!master.alive) return null; // la muerte del maestro ya se resuelve en resolveCareers
  if(!chance(0.4)) return null;
  markEventUsed(w,'apprentice_thread_continuation');
  const prof=PROFESSIONS[thread.data.professionId];
  const kind = pick(['harsh','trust','rival','help','recommendation']);
  if(kind==='harsh'){
    return {id:'apprentice_thread_continuation', interactive:true, portraitId:master.id,
      text:`${master.firstName} te corrige con dureza delante de otros por un error en tu trabajo.`,
      options:[
        {label:'Aguantar y aprender', desc:'+oficio, algo de orgullo herido',
          effect:(w,p)=>{ if(prof&&prof.primarySkill) p.skills[prof.primarySkill]=clamp(p.skills[prof.primarySkill]+rand(2,4),0,100);
            advanceStoryThread(w,thread,{stage:2});
            return log(w,'Una lección dura',`${master.firstName} te corrigió sin contemplaciones, pero algo de eso se te quedó.`,'trabajo',[p.id,master.id]);}},
        {label:'Responderle', desc:'-relación con tu maestro',
          effect:(w,p)=>{ bumpRelationship(w,p.id,master.id,-rand(5,10)); advanceStoryThread(w,thread,{stage:2});
            return log(w,'Le respondiste',`Le respondiste a ${master.firstName}, y no le sentó nada bien.`,'trabajo',[p.id,master.id]);}}
      ]};
  }
  if(kind==='trust'){
    return {id:'apprentice_thread_continuation', interactive:true, portraitId:master.id,
      text:`${master.firstName} decide confiarte un trabajo de verdad, algo que normalmente no dejaría hacer a un aprendiz.`,
      options:[
        {label:'Hacerlo lo mejor posible', desc:'riesgo y recompensa (mejor si eres hábil o ingenioso/a)',
          effect:(w,p)=>{ const skill=(prof&&prof.primarySkill)?(p.skills[prof.primarySkill]||0):0;
            const ok = chance(clamp(0.4+skill/200+(isWitty(p)?0.1:0),0.2,0.9));
            if(ok){ bumpRelationship(w,p.id,master.id,rand(6,10)); p.reputation=clamp((p.reputation||0)+rand(2,5),0,100);
              if(prof&&prof.primarySkill) p.skills[prof.primarySkill]=clamp(p.skills[prof.primarySkill]+rand(2,5),0,100);
              advanceStoryThread(w,thread,{stage:3});
              return log(w,'A la altura',`Hiciste bien el encargo de ${master.firstName}, y eso no pasó desapercibido.`,'trabajo',[p.id,master.id]);}
            bumpRelationship(w,p.id,master.id,-rand(3,7)); advanceStoryThread(w,thread,{stage:2});
            return log(w,'No estabas listo/a',`El encargo de ${master.firstName} te quedó grande, y ambos lo notaron.`,'trabajo',[p.id,master.id]);}}
      ]};
  }
  if(kind==='rival'){
    return {id:'apprentice_thread_continuation', interactive:true, portraitId:master.id,
      text:`${master.firstName} ha tomado a otro aprendiz, y ahora compites con alguien más por su atención.`,
      options:[
        {label:'Esforzarte más', desc:'+oficio, cansancio',
          effect:(w,p)=>{ if(prof&&prof.primarySkill) p.skills[prof.primarySkill]=clamp(p.skills[prof.primarySkill]+rand(2,4),0,100);
            advanceStoryThread(w,thread);
            return log(w,'Más empeño que nunca','La llegada de otro aprendiz te hizo esforzarte más de lo habitual.','trabajo',[p.id,master.id]);}},
        {label:'No darle importancia', desc:'sin efecto',
          effect:(w,p)=>{ advanceStoryThread(w,thread);
            return log(w,'Sin prisa','Decidiste no dejar que la llegada de otro aprendiz te alterara.','trabajo',[p.id,master.id]);}}
      ]};
  }
  if(kind==='recommendation'){
    return {id:'apprentice_thread_continuation', interactive:false,
      resolve:(w,p)=>{ p.reputation=clamp((p.reputation||0)+rand(2,5),0,100); advanceStoryThread(w,thread,{stage:Math.max(thread.stage,3)});
        return log(w,'Buenas palabras',`${master.firstName} habló bien de ti a quien quiso escucharlo, y eso ayuda a tu nombre en ${WORLD_FLAVOR.villageName}.`,'trabajo',[p.id,master.id]); }};
  }
  // help
  return {id:'apprentice_thread_continuation', interactive:true, portraitId:master.id,
    text:`${master.firstName} pasa por un mal momento y necesita ayuda, más allá del trabajo del taller.`,
    options:[
      {label:'Ayudarle', desc:'+relación, favor recordado',
        effect:(w,p)=>{ bumpRelationship(w,p.id,master.id,rand(6,10)); addFavor(w,master.id); advanceStoryThread(w,thread,{stage:3});
          return log(w,'Le devolviste el favor',`Ayudaste a ${master.firstName} cuando lo necesitaba, más allá de lo que te enseña.`,'trabajo',[p.id,master.id]);}},
      {label:'No puedes ayudar ahora', desc:'sin efecto',
        effect:(w,p)=>{ advanceStoryThread(w,thread);
          return log(w,'No pudiste ayudar',`No pudiste ayudar a ${master.firstName} esta vez.`,'trabajo',[p.id,master.id]);}}
    ]};
}

/* §6E: los hijos ya crecidos tienen su propia vida. El jugador puede apoyar, presionar,
   negar ayuda o aconsejar — pero el hijo/a decide según SU carácter, edad, relación y
   la economía del hogar, no automáticamente lo que el jugador prefiera. */
function buildChildFutureContinuation(w,p){
  if(eventOnCooldown(w,'child_future_continuation',2)) return null;
  const hh=household(w); if(!hh) return null;
  const cf=closeFamily(p.id);
  // limpiar hilos de hijos que ya se marcharon o se casaron: su vida sigue, pero fuera de este hilo
  for(const t of getActiveStoryThreads(w,'child_future')){
    const k=C(t.actorIds[0]);
    if(!k||!k.alive||k.householdId!==hh.id||k.spouseId) resolveStoryThread(w,t);
  }
  const kids=cf.children.filter(k=>k.alive && k.age>=10 && k.age<=26 && !k.spouseId && k.householdId===hh.id);
  if(!kids.length) return null;
  let thread=null, kid=null;
  for(const k of kids){ const t=findStoryThread(w,'child_future', th=>th.actorIds.includes(k.id)); if(t){ thread=t; kid=k; break; } }
  if(!thread){ if(!chance(0.3)) return null; kid=pick(kids); thread=createStoryThread(w,'child_future',{actorIds:[kid.id], stage:1}); }
  if(!chance(0.5)) return null;
  markEventUsed(w,'child_future_continuation');
  const ambitious=kid.traits.includes('ambicioso/a'), stubborn=kid.traits.includes('testarudo/a');
  const situations=['trade','love','support'];
  if(cf.children.filter(c=>c.alive&&c.id!==kid.id).length) situations.push('sibling_fight');
  if(kid.age>=16) situations.push('leave');
  const kind=pick(situations);
  if(kind==='trade' && !(kid.career&&kid.career.professionId)){
    return {id:'child_future_continuation', interactive:true, portraitId:kid.id,
      text:`${kid.firstName} tiene claro que quiere aprender un oficio propio, lejos de las tareas de siempre en casa.`,
      options:[
        {label:'Apoyar su decisión', desc:'+relación',
          effect:(w,p)=>{ bumpRelationship(w,p.id,kid.id,8); advanceStoryThread(w,thread,{stage:2});
            return log(w,'Un camino propio',`Apoyaste a ${kid.firstName} en su deseo de aprender un oficio.`,'family',[p.id,kid.id]);}},
        {label:'Pedirle que se quede a trabajar la tierra familiar', desc:'depende de su carácter',
          effect:(w,p)=>{ const stays = stubborn?chance(0.2):(ambitious?chance(0.25):chance(0.55));
            if(stays){ bumpRelationship(w,p.id,kid.id,3); advanceStoryThread(w,thread,{stage:2});
              return log(w,'Se queda, por ahora',`${kid.firstName} accedió a quedarse en las tierras familiares, aunque no del todo convencido/a.`,'family',[p.id,kid.id]);}
            bumpRelationship(w,p.id,kid.id,-4); advanceStoryThread(w,thread,{stage:2});
            return log(w,'Sigue su propio camino',`${kid.firstName} decidió aprender su oficio de todas formas, pese a tu petición.`,'family',[p.id,kid.id]);}}
      ]};
  }
  if(kind==='love'){
    return {id:'child_future_continuation', interactive:true, portraitId:kid.id,
      text:`${kid.firstName} se ha enamorado de alguien del pueblo, y no deja de hablar de ${pronoun(kid.sex)}.`,
      options:[
        {label:'Alegrarte con él/ella', desc:'+relación',
          effect:(w,p)=>{ bumpRelationship(w,p.id,kid.id,6); advanceStoryThread(w,thread,{stage:2});
            return log(w,'Cosas del corazón',`${kid.firstName} te contó, feliz, de quién se ha enamorado.`,'family',[p.id,kid.id]);}},
        {label:'Mostrarte cauteloso/a', desc:'depende de su carácter',
          effect:(w,p)=>{ if(stubborn) bumpRelationship(w,p.id,kid.id,-5);
            advanceStoryThread(w,thread,{stage:2});
            return log(w,'Con cautela',`Le pediste a ${kid.firstName} que no se precipitara. ${stubborn?'No pareció gustarle el consejo.':'Lo tomó con calma.'}`,'family',[p.id,kid.id]);}}
      ]};
  }
  if(kind==='sibling_fight'){
    const sib2=pick(cf.children.filter(c=>c.alive&&c.id!==kid.id));
    return {id:'child_future_continuation', interactive:true, portraitId:kid.id,
      text:`${kid.firstName} y ${sib2.firstName} han discutido, y ambos han venido a buscar tu opinión.`,
      options:[
        {label:'Escuchar a ambos sin tomar partido', desc:'+relación con ambos',
          effect:(w,p)=>{ bumpRelationship(w,p.id,kid.id,4); bumpRelationship(w,p.id,sib2.id,4); advanceStoryThread(w,thread,{stage:2});
            return log(w,'Hacer de árbitro',`Escuchaste a ${kid.firstName} y a ${sib2.firstName} sin tomar partido.`,'family',[p.id,kid.id,sib2.id]);}},
        {label:`Dar la razón a ${kid.firstName}`, desc:'+relación con uno, -con el otro',
          effect:(w,p)=>{ bumpRelationship(w,p.id,kid.id,6); bumpRelationship(w,p.id,sib2.id,-6); advanceStoryThread(w,thread,{stage:2});
            return log(w,'Tomaste partido',`Le diste la razón a ${kid.firstName} frente a ${sib2.firstName}.`,'family',[p.id,kid.id,sib2.id]);}}
      ]};
  }
  if(kind==='leave'){
    advanceStoryThread(w,thread,{stage:3});
    return {id:'child_future_continuation', interactive:false,
      resolve:(w,p)=> log(w,'Piensa en irse',`${kid.firstName} ha empezado a hablar de marcharse y buscar su propio camino.`,'family',[p.id,kid.id],undefined,kid.id)};
  }
  // support
  return {id:'child_future_continuation', interactive:true, portraitId:kid.id,
    text:`${kid.firstName} te pide ayuda económica para dar un paso importante en su vida.`,
    options:[
      {label:'Ayudarle', desc:'-monedas, +relación',
        effect:(w,p)=>{ const gift=Math.min(hh.money,rand(3,7)); hh.money=Math.round((hh.money-gift)*10)/10;
          bumpRelationship(w,p.id,kid.id,10); advanceStoryThread(w,thread,{stage:3});
          return log(w,'Un empujón',`Ayudaste a ${kid.firstName} a dar un paso importante en su vida.`,'family',[p.id,kid.id]);}},
      {label:'Negarte', desc:'-relación',
        effect:(w,p)=>{ bumpRelationship(w,p.id,kid.id,-8); advanceStoryThread(w,thread,{stage:3});
          return log(w,'Sin ayuda',`Le negaste la ayuda económica que te pidió ${kid.firstName}.`,'family',[p.id,kid.id]);}}
    ]};
}
function buildDisputaHermanosEvent(w,p){
  const cf=closeFamily(p.id);
  const candidates=cf.siblings.filter(s=>s.alive);
  if(candidates.length<2) return null;
  // §6A: si ya hay una tensión activa entre un par de hermanos, seguimos ESA historia
  // (misma pareja) en vez de sortear un par distinto cada vez que se dispara el evento.
  let thread=findStoryThread(w,'sibling_tension', t=> t.actorIds.every(id=>candidates.some(c=>c.id===id)));
  let a,b;
  if(thread){
    a=C(thread.actorIds[0]); b=C(thread.actorIds[1]);
    if(!a||!a.alive||!b||!b.alive){ resolveStoryThread(w,thread); thread=null; }
  }
  if(!thread){
    [a,b]=shuffle(candidates);
    thread=createStoryThread(w,'sibling_tension',{actorIds:[a.id,b.id], stage:1});
  }
  const th=thread;
  return {id:'disputa_hermanos', interactive:true, portraitId:a.id,
    text:`${a.firstName} y ${b.firstName} tienen un desacuerdo que empieza a tensar la casa.`,
    options:[
      {label:'Intervenir para mediar', desc:'+relación con ambos (mejor si eres ingenioso/a)',
        effect:(w,p)=>{
          const smart=witsCheck(p,0.45);
          const gain=smart?9:5;
          bumpRelationship(w,p.id,a.id,gain); bumpRelationship(w,p.id,b.id,gain); bumpRelationship(w,a.id,b.id,smart?10:6);
          if(smart) resolveStoryThread(w,th); else advanceStoryThread(w,th,{stage:1});
          const text = smart
            ? `Encontraste las palabras justas para que ${a.firstName} y ${b.firstName} se entendieran de verdad — tu ingenio hizo la diferencia.`
            : `Ayudaste a que ${a.firstName} y ${b.firstName} hicieran las paces, aunque el fondo del asunto sigue ahí.`;
          return log(w,'Mediaste en la disputa',text,'family',[p.id,a.id,b.id]);}},
      {label:'Apoyar a uno de los dos', desc:'+relación con uno, -con el otro',
        effect:(w,p)=>{ bumpRelationship(w,p.id,a.id,8); bumpRelationship(w,p.id,b.id,-6); bumpRelationship(w,a.id,b.id,-8);
          advanceStoryThread(w,th,{stage:2, data:{favoredId:a.id, disfavoredId:b.id}});
          return log(w,'Tomaste partido',`Te pusiste del lado de ${a.firstName} frente a ${b.firstName}.`,'family',[p.id,a.id,b.id]);}},
      {label:'Mantenerte al margen', desc:'sin efecto',
        effect:(w,p)=>{ advanceStoryThread(w,th,{stage:2});
          return log(w,'Te mantuviste al margen','Decidiste no meterte en la disputa entre tus hermanos.','family',[p.id,a.id,b.id]);}}
    ]};
}
/* §6A continuación: una tensión entre hermanos que ya se distanció puede, años después,
   convertirse en una oportunidad de reconciliación, un problema económico compartido,
   un conflicto por quién cuida a los padres, o simplemente diluirse con el tiempo. */
function buildSiblingTensionContinuation(w,p){
  if(eventOnCooldown(w,'sibling_tension_continuation',3)) return null;
  const thread=findStoryThread(w,'sibling_tension', t=> t.stage>=2 && threadAge(w,t)>=2);
  if(!thread) return null;
  const a=C(thread.actorIds[0]), b=C(thread.actorIds[1]);
  if(!a||!a.alive||!b||!b.alive){ resolveStoryThread(w,thread); return null; }
  if(!chance(0.45)) return null;
  markEventUsed(w,'sibling_tension_continuation');
  const other = (a.id!==p.id) ? a : b;
  const kind = pick(['reconciliation','economic','parents','fade']);
  if(kind==='fade'){
    resolveStoryThread(w,thread);
    return {id:'sibling_tension_continuation', interactive:false,
      resolve:(w,p)=> log(w,'Caminos distintos',`${a.firstName} y ${b.firstName} han terminado tan ocupados con sus propias vidas que la vieja disputa casi ya no importa.`,'family',[p.id,a.id,b.id])};
  }
  if(kind==='reconciliation'){
    const stubborn=other.traits.includes('testarudo/a'), prudent=other.traits.includes('prudente');
    return {id:'sibling_tension_continuation', interactive:true, portraitId:other.id,
      text:`Ha pasado tiempo desde el enfrentamiento entre ${a.firstName} y ${b.firstName}. Quizás ${other.firstName} esté dispuesto/a a dejarlo atrás.`,
      options:[
        {label:'Buscar la reconciliación', desc:'depende del carácter de tu hermano/a (mejor si eres ingenioso/a)',
          effect:(w,p)=>{ const smart=witsCheck(p,0.4);
            const base=stubborn?0.25:(prudent?0.7:0.5);
            if(smart||chance(base)){ bumpRelationship(w,a.id,b.id,12); bumpRelationship(w,p.id,other.id,6); resolveStoryThread(w,thread);
              return log(w,'Años después, la paz',`${a.firstName} y ${b.firstName} por fin volvieron a hablarse, después de tanto tiempo distanciados.`,'family',[p.id,a.id,b.id]);}
            bumpRelationship(w,p.id,other.id,-3); advanceStoryThread(w,thread);
            return log(w,'Todavía no',`Lo intentaste, pero ${other.firstName} no está ${genderText('listo/a',other.sex)} para dejar atrás lo ocurrido.`,'family',[p.id,other.id]);}},
        {label:'Dejarlo estar', desc:'sin efecto',
          effect:(w,p)=>{ advanceStoryThread(w,thread);
            return log(w,'Viejas heridas',`El distanciamiento entre ${a.firstName} y ${b.firstName} sigue ahí, sin que nadie lo mencione.`,'family',[p.id,a.id,b.id]);}}
      ]};
  }
  if(kind==='economic'){
    return {id:'sibling_tension_continuation', interactive:true, portraitId:other.id,
      text:`${other.firstName} atraviesa apuros económicos. Pese a lo ocurrido entre ustedes, no tiene a nadie más a quien pedir ayuda.`,
      options:[
        {label:'Ayudar de todas formas', desc:'-monedas, +relación, favor recordado',
          effect:(w,p)=>{ const hh=household(w); const gift=Math.min(hh.money,rand(3,7)); hh.money=Math.round((hh.money-gift)*10)/10;
            bumpRelationship(w,p.id,other.id,10); addFavor(w,other.id); advanceStoryThread(w,thread,{stage:3});
            return log(w,'Ayuda pese a todo',`Ayudaste a ${other.firstName} aunque las cosas entre ustedes no habían sido fáciles.`,'family',[p.id,other.id]);}},
        {label:'Recordarle lo ocurrido y negarte', desc:'-relación',
          effect:(w,p)=>{ bumpRelationship(w,p.id,other.id,-8); advanceStoryThread(w,thread,{stage:3});
            return log(w,'Viejas cuentas',`Le recordaste a ${other.firstName} lo sucedido entre ustedes y le negaste tu ayuda.`,'family',[p.id,other.id]);}}
      ]};
  }
  // kind === 'parents'
  return {id:'sibling_tension_continuation', interactive:true, portraitId:other.id,
    text:`Alguien debe hacerse cargo de los padres, y tú y ${other.firstName} no logran ponerse de acuerdo por el viejo desacuerdo entre ustedes.`,
    options:[
      {label:'Asumir tú la carga', desc:'evita más discusiones',
        effect:(w,p)=>{ advanceStoryThread(w,thread,{stage:3});
          return log(w,'Tú te haces cargo',`Decidiste ocuparte tú de tus padres, para evitar más discusiones con ${other.firstName}.`,'family',[p.id,other.id]);}},
      {label:'Exigir que se reparta el peso', desc:'-relación, reparto más justo',
        effect:(w,p)=>{ bumpRelationship(w,p.id,other.id,-5); advanceStoryThread(w,thread,{stage:3});
          return log(w,'Una discusión más',`Discutiste con ${other.firstName} sobre quién debe ocuparse de los padres. No llegaron a nada bueno.`,'family',[p.id,other.id]);}}
    ]};
}
function buildPeticionEconomicaEvent(w,p){
  const cf=closeFamily(p.id);
  const poor=[...cf.siblings,...cf.children].filter(m=>m.alive && m.householdId && m.householdId!==p.householdId && w.households[m.householdId] &&
    (householdStatus(w.households[m.householdId])==='poor'||householdStatus(w.households[m.householdId])==='destitute'));
  if(!poor.length) return null;
  const rel=pick(poor);
  return {id:'peticion_economica', interactive:true, portraitId:rel.id,
    text:`${rel.firstName}, que pasa apuros, te ha pedido ayuda económica.`,
    options:[
      {label:'Ayudarle', desc:'-monedas, +relación, mejora su hogar',
        effect:(w,p)=>{ const generous=p.traits.includes('generoso/a');
          const hh=household(w); const gift=Math.min(hh.money,rand(3,6)+(generous?2:0)); hh.money-=gift;
          const theirHh=w.households[rel.householdId]; if(theirHh) theirHh.money+=gift;
          bumpRelationship(w,p.id,rel.id,generous?14:10); addFavor(w,rel.id);
          return log(w,'Ayuda a la familia',`Ayudaste a ${rel.firstName} en un momento de necesidad.`,'family',[p.id,rel.id]);}},
      {label:'Negarse', desc:'-relación',
        effect:(w,p)=>{ bumpRelationship(w,p.id,rel.id,-10);
          return log(w,'Petición rechazada',`No pudiste o no quisiste ayudar a ${rel.firstName}.`,'family',[p.id,rel.id]);}}
    ]};
}
/* ---------- eventos con memoria (sesión 2026-09 #2, "decisiones que regresan") ----------
   Ya no basta con que una decisión tenga un efecto inmediato — algunas deben poder volver
   más adelante, atadas a un personaje real, no a una frase abstracta ("el vecino"). */
function buildDisputaVecinoEvent(w,p){
  const neighbor=getOrIntroduceNeighbor(w,p);
  if(!neighbor) return null;
  return {id:'disputa_vecino', interactive:true, portraitId:neighbor.id,
    text:pick([
      `Una de tus ovejas se metió en el sembrado de ${neighbor.firstName}. ${genderText('Este/a',neighbor.sex)} exige compensación, ${genderText('furioso/a',neighbor.sex)}.`,
      `${neighbor.firstName} te acusa de robar agua del pozo común. La discusión sube de tono.`,
      `Un cerdo de ${neighbor.firstName} destrozó parte de tu huerto. Ahora exige que TÚ le pagues a ${pronoun(neighbor.sex)}.`
    ]),
    options:[
      {label:'Pagarle para calmarlo', desc:'-monedas, +relación con el pueblo',
        effect:(w,p)=>{ household(w).money=Math.max(0,household(w).money-3); p.reputation=clamp(p.reputation+2,0,100);
          bumpRelationship(w,p.id,neighbor.id,rand(4,8)); clearGrudge(w,neighbor.id);
          return log(w,'Disputa resuelta',`Pagaste a ${neighbor.firstName} por los daños y las cosas volvieron a la calma.`,'social',[p.id,neighbor.id]);}},
      {label:'Defender tu posición', desc:'riesgo de -reputación, y un rencor que puede volver (menos riesgo si eres ingenioso/a)',
        effect:(w,p)=>{ const exposedTruth=witsCheck(p,0.5);
          if(!exposedTruth){ p.reputation=clamp(p.reputation-rand(2,6),0,100);
            bumpRelationship(w,p.id,neighbor.id,-rand(8,14)); addGrudge(w,neighbor.id);
            return log(w,'Disputa envenenada',`La discusión se agrió; ${neighbor.firstName} no lo va a olvidar.`,'social',[p.id,neighbor.id]); }
          const text = isWitty(p)
            ? `Encontraste el hueco en la versión de ${neighbor.firstName} y lo dejaste en evidencia delante de todos; tu ingenio te salvó de un problema mayor.`
            : `Te mantuviste firme y ${neighbor.firstName}, sin pruebas, terminó por dejarlo pasar.`;
          bumpRelationship(w,p.id,neighbor.id,-rand(2,5));
          return log(w,'Disputa olvidada',text,'social',[p.id,neighbor.id]); }}
    ]};
}
/* represalia de un rencor guardado: pasiva (no otro modal a clickear) — la decisión ya se
   tomó hace tiempo, esto solo es el pago. Da tiempo (2+ años) para que no se sienta injusto. */
function buildGrudgeRetaliationEvent(w,p){
  const ids=Object.keys(w.flags.grudges||{});
  if(!ids.length) return null;
  const id=pick(ids); const enemy=C(id);
  if(!enemy || !enemy.alive){ clearGrudge(w,id); return null; }
  if((grudgeAge(w,id)||0)<2) return null;
  clearGrudge(w,id);
  const options=[
    ()=>{ // §2.3: comprender un rumor a tiempo (ingenio) permite atajarlo antes de que corra del todo
      if(isWitty(p) && witsCheck(p,0.4)){ p.reputation=clamp(p.reputation-rand(1,3),0,100);
        return {title:'Un rumor que no cundió', desc:`${enemy.firstName} intentó hablar mal de ti por el pueblo, pero viste venir el cuento a tiempo y lo desmentiste antes de que corriera.`}; }
      p.reputation=clamp(p.reputation-rand(4,9),0,100);
      return {title:'Un rumor con nombre y apellido', desc:`${enemy.firstName} sigue ${genderText('resentido/a',enemy.sex)} por lo de antes: ahora cuenta por el pueblo cosas que no son ciertas sobre ti.`}; },
    ()=>{ bumpRelationship(w,p.id,enemy.id,-rand(3,6));
      return {title:'Puertas cerradas', desc:`${enemy.firstName} deja claro que, después de lo pasado, no piensa ayudarte en nada.`}; },
    ()=>{ const hh=household(w); if(hh.grainStores>3){ hh.grainStores=Math.max(0,hh.grainStores-rand(3,7));
        return {title:'Alguien tocó tu granero', desc:`Parte de tu grano desapareció una noche. Sospechas de ${enemy.firstName}, pero no puedes probarlo.`}; }
      return {title:'Rencor que no llegó a nada', desc:`${enemy.firstName} lo intentó, pero esta vez no consiguió hacerte daño.`}; }
  ];
  const r=pick(options)();
  return {id:'grudge_retaliation', interactive:false,
    resolve:(w,p)=> log(w,r.title,r.desc,'social',[p.id,enemy.id],undefined,enemy.id)};
}
/* a quien le debes un favor, tarde o temprano te lo cobra */
function buildDebtCalledEvent(w,p){

/* §6C: los favores positivos también se devuelven, no solo las deudas y rencores.
   Un vecino al que ayudaste hace años puede aparecer, sin que se lo pidieras, a devolvértelo. */
function buildFavorReturnedEvent(w,p){

          bumpRelationship(w,p.id,friend.id,rand(4,8));
          return log(w,'Un favor devuelto',`${friend.firstName} te devolvió, por su cuenta, algo de lo que le diste en su momento.`,'social',[p.id,friend.id]);}},
      {label:'Decirle que no es necesario', desc:'+relación, sin ganancia material',
        effect:(w,p)=>{ clearFavor(w,id); bumpRelationship(w,p.id,friend.id,rand(6,11));
          return log(w,'Gesto rechazado con cariño',`Le dijiste a ${friend.firstName} que no hacía falta, pero que el gesto significó mucho.`,'social',[p.id,friend.id]);}}

/* eventos "clásicos" (adultos/económicos) requieren esta edad para DECIDIRSE (Parte 32);
   por debajo de ella, el evento igual ocurre y un adulto del hogar resuelve por defecto,
   y el jugador solo lo ve reflejado en la Historia, no como una decisión suya. */
const ADULT_EVENT_MIN_AGE=12;
/* Parte 50: cuando un evento "adulto" se autorresuelve porque el jugador es demasiado
   pequeño para decidir, la narración debe venir del hogar, no en primera persona del niño. */
function resolveAdultDecisionMaker(p){
  const hh=p.householdId? world.households[p.householdId] : null;
  const head=hh? C(hh.headId) : null;
  if(head && head.alive && head.id!==p.id) return personRef(p.id,head.id);
  const father=p.fatherId?C(p.fatherId):null;
  if(father && father.alive) return kinRef(p.id,father.id);
  const mother=p.motherId?C(p.motherId):null;
  if(mother && mother.alive) return kinRef(p.id,mother.id);
  return 'Tu familia';
}
function autoResolveAdultEvent(e, w, p){
  const opt=e.options[0];
  const beforeLen=w.history.length;
  opt.effect(w,p);
  if(w.history.length>beforeLen){
    const entry=w.history[w.history.length-1];
    const decisor=resolveAdultDecisionMaker(p);
    entry.desc = `${capitalize(decisor)} decidió, en nombre del hogar: ${opt.label.toLowerCase()}.`;
    pushFeed(w, entry);
  }
}
/* ---------- prioridad de eventos (Fase "A ver qué pasa este año", sección 4) ----------
   Antes cada candidato competía solo por su propio chance() y por su posición en un array:
   si dos se disparaban el mismo año, ganaban las dos primeras casillas del "maybes" original,
   sin relación con lo importante que fuera cada una. Ahora cada candidato declara una
   PRIORIDAD (1 = consecuencia pendiente de algo anterior, más importante; 7 = relleno
   genérico), y de los que sí se disparan este año, los de prioridad más alta se quedan con
   los (hasta 2) turnos de decisión interactiva del año — un hilo de historia pendiente le
   gana el sitio a un accidente nuevo sin relación, en vez de competir en igualdad de
   condiciones. Esto no cambia SI algo pasa (eso sigue siendo cada chance() propio) — solo
   decide QUÉ se le muestra al jugador cuando varias cosas coinciden el mismo año. */
const EVENT_PRIORITY = {consequence:1, crisis:2, lifecycle:3, career:4, relationship:5, world:6, generic:7};
function rollEvents(w){
  const p=player(w);
  cancelInvalidStoryThreads(w);
  const pool=[]; // {priority, ev}
  const withCooldown=(id, gap, chanceP, build)=>{
    if(eventOnCooldown(w,id,gap) || !chance(chanceP)) return null;
    const ev=build(); if(ev) markEventUsed(w,id); return ev;
  };
  const addAll=(priority, fns)=>{ for(const fn of fns){ const ev=fn(); if(ev) pool.push({priority, ev}); } };

  // 1. consecuencias pendientes: hilos de historia y la memoria social que ya existía (rencores/deudas/favores)
  addAll(EVENT_PRIORITY.consequence, [
    ()=>withCooldown('grudge_retaliation',2,0.4,()=>buildGrudgeRetaliationEvent(w,p)),
    ()=>withCooldown('debt_called',2,0.35,()=>buildDebtCalledEvent(w,p)),
    ()=>withCooldown('favor_returned',2,0.3,()=>buildFavorReturnedEvent(w,p)),
    ()=>buildSiblingTensionContinuation(w,p),
    ()=>buildApprenticeContinuationEvent(w,p),
    ()=>buildHouseholdThreadContinuation(w,p),
    ()=>buildChildFutureContinuation(w,p)
  ]);
  // 2. crisis reales del estado actual
  addAll(EVENT_PRIORITY.crisis, [
    ()=>withCooldown('enfermedad_familiar',2,0.3,()=>resolveEnfermedad(w,p))
  ]);
  // 3. ciclo vital / familia
  addAll(EVENT_PRIORITY.lifecycle, [
    ()=>withCooldown('hermano_quiere_marcharse',3,0.15,()=>buildHermanoMarchaEvent(w,p)),
    ()=>withCooldown('hijo_quiere_independencia',3,0.15,()=>buildHijoIndependenciaEvent(w,p)),
    ()=>withCooldown('disputa_hermanos',2,0.12,()=>buildDisputaHermanosEvent(w,p)),
    ()=>p.age>=12 && p.age<=15 && chance(0.3) && buildAdolescenciaEvent(w,p),
    ()=>p.age>=3 && p.age<=5 && chance(0.4) && buildJuegoInfantilEvent(w,p),
    ()=>p.age>=6 && p.age<=8 && chance(0.35) && buildTareaGranjaMenorEvent(w,p),
    ()=>p.age>=9 && p.age<=11 && chance(0.3) && buildErrorCampoEvent(w,p)
  ]);
  // 4. profesión
  addAll(EVENT_PRIORITY.career, [
    ()=>p.age>=12 && chance(0.3) && buildApprenticeshipOfferEvent(w,p),
    ()=>p.age>=14 && chance(0.25) && buildFamilyTradeEvent(w,p),
    ()=>p.age>=18 && chance(0.3) && buildLaborerFallbackEvent(w,p),
    ()=>withCooldown('evento_profesional',3,0.28,()=>buildProfessionalEvent(w,p))
  ]);
  // 5. relaciones
  addAll(EVENT_PRIORITY.relationship, [
    ()=>withCooldown('peticion_economica',2,0.12,()=>buildPeticionEconomicaEvent(w,p)),
    ()=>withCooldown('disputa_vecino',3,0.25,()=>buildDisputaVecinoEvent(w,p))
  ]);
  // 6. contexto regional/mundo (y 7. genérico): el viejo fondo de EVENTS ya hacía de tómbola
  // de trasfondo — se mantiene como un único candidato de baja prioridad, con su cooldown propio.
  const worldCandidates=EVENTS.filter(e=>e.cond(w,p) && !eventOnCooldown(w,e.id,e.cooldown));
  if(worldCandidates.length){
    const chosen=pickWeighted(worldCandidates.map(e=>({w:e.weight,e}))).e; markEventUsed(w,chosen.id);
    pool.push({priority:EVENT_PRIORITY.world, ev:chosen});
  }

  pool.sort((a,b)=>a.priority-b.priority); // estable: dentro de la misma prioridad, se respeta el orden en que se generaron

  const queue=[];
  let interactiveCount=0;
  for(const {ev:e} of pool){
    if(e.interactive){
      const minAge = e.minAge!=null ? e.minAge : ADULT_EVENT_MIN_AGE;
      if(p.age<minAge){ autoResolveAdultEvent(e,w,p); continue; } // un adulto del hogar decide por defecto
      if(interactiveCount>=2) continue; // no saturar al jugador de decisiones en un mismo año (sección 5)
      queue.push({id:e.id, text: typeof e.text==='function'?e.text(w,p):e.text, options:e.options, portraitId:e.portraitId});
      interactiveCount++;
    } else {
      pushFeed(w, e.resolve(w,p));
    }
  }
  if(w.eventQueueSpecial && w.eventQueueSpecial.length){
    for(const ev of w.eventQueueSpecial){
      const minAge = ev.minAge!=null ? ev.minAge : ADULT_EVENT_MIN_AGE;
      if(p.age<minAge){ autoResolveAdultEvent(ev,w,p); continue; }
      queue.push(ev); // una crisis independiente (p. ej. mala cosecha) puede romper el máximo de 2 (sección 5)
    }
    w.eventQueueSpecial=[];
  }
  return queue;
}

/* ---------- TimeSystem ---------- */
/* ---------- tutorial implícito (idea #1): crecer ES el tutorial, sin pantalla aparte.
   getPlayerCapabilities ya es la única fuente de verdad de qué se desbloquea a cada edad;
   en vez de una lista de pasos, cada vez que cumples la edad justa el feed te avisa, breve
   y en el momento en que de verdad importa. Un solo aviso por año, para no saturar aunque
   varias cosas se desbloqueen juntas a la misma edad. */
const GROWTH_UNLOCKS=[
  {cap:'canSeeRelaciones', title:'Empiezas a reconocer a la gente', desc:'Ya identificas a quienes te rodean. Ahora puedes ver a tu familia y a la gente del pueblo en Gente.'},
  {cap:'canHandleAnimals', title:'Ya puedes ayudar en casa', desc:'Tienes edad para ayudar con tareas sencillas, como cuidar a los animales. Búscalas en Hacer.'},
  {cap:'canFarm', title:'Empiezas a hacerte útil de verdad', desc:'Ahora puedes ayudar en el campo, y en Vida vas a ir viendo cada vez más de lo que pasa a tu alrededor.'},
  {cap:'canSeekApprenticeship', title:'Ya casi eres adulto/a', desc:'Puedes ver con más detalle las propiedades y el dinero del hogar, y hasta buscar oficio como aprendiz.'},
  {cap:'canEarnPersonalMoney', title:'Puedes ganar tu propio dinero', desc:'Ahora puedes trabajar por tu cuenta y guardar dinero aparte del dinero del hogar.'},
  {cap:'canSeeExactMoney', title:'Ya ves el mundo con ojos de adulto/a', desc:'Conoces el dinero exacto del hogar, tu reputación en el pueblo, y cómo le va a la economía de tu alrededor.'},
  {cap:'canMarry', title:'Eres adulto/a', desc:'Puedes casarte, trabajar un oficio, comerciar con otros, formar tu propio hogar y, si te toca, hacerte cargo tú mismo/a de la hacienda. A partir de aquí, tu camino es cosa tuya.'}
];
function announceGrowthUnlocks(w,prevCap,newCap){
  const p=player(w); if(!p) return;
  for(const u of GROWTH_UNLOCKS){
    if(!prevCap[u.cap] && newCap[u.cap]){
      plog(w, genderText(u.title,p.sex), genderText(u.desc,p.sex), 'tutorial', [p.id], 'growth_'+u.cap);
    }
  }
}
function advanceYear(){
  const turnLog=[];
  const growthP=player(world);
  const prevCap=(growthP && growthP.alive)? getPlayerCapabilities(growthP) : null;
  world.year += 1;
  world.flags.restedThisYear=false;
  world.annualActionsUsed=0;
  world.summaryShown=false;

  const hh=household(world);
  const grainTribute=Math.min(hh.grainStores, world.tribute+2);
  hh.grainStores-=grainTribute; hh.money=Math.max(0,hh.money-world.tribute);
  // Parte 16: la perspectiva narrativa respeta la edad — el tributo lo paga el hogar, no el bebé
  turnLog.push(log(world,'Tributo anual',`Tu hogar entregó el tributo anual a ${WORLD_FLAVOR.lordName}: ${world.tribute} monedas y ${grainTribute} sacos de grano.`,'mundo'));

  resolveCareers(world,turnLog);
  resolvePersonalEconomy(world,turnLog);
  resolveAgriculture(world,turnLog);
  resolveLivestock(world,turnLog);
  resolveChildDevelopment(world);
  resolveNpcLife(world,turnLog);
  resolveBirths(world,turnLog);
  resolveMortality(world,turnLog);
  resolveMilestones(world,turnLog);
  { const p=player(world); if(p && p.alive) resolveAmbition(world,p,turnLog); }
  resolveHoldingEconomy(world,turnLog);

  world.lastTurnLog = turnLog;
  turnLog.forEach(e=>pushFeed(world,e));
  { const p=player(world); if(prevCap && p && p.alive) announceGrowthUnlocks(world,prevCap,getPlayerCapabilities(p)); }
  world.pendingEvents = rollEvents(world);
  save();
  advanceModalQueue();
}
/* ---------- mejora de diseño 2026-09 #6: el Resumen anual DEJÓ de ser un modal obligatorio.
   Ahora solo quedan como modal las cosas que de verdad requieren al jugador — una muerte, un
   hito importante, una decisión interactiva. Lo rutinario vive en el feed de la pantalla Vida,
   así que "VIVIR EL AÑO" se puede pulsar seguido, sin que un año tranquilo interrumpa nada,
   hasta que sí pase algo que merezca una pausa. ---------- */
function advanceModalQueue(){
  if(world.pendingPlayerDeath){
    const deadId = world.pendingPlayerDeath; world.pendingPlayerDeath=null;
    ui.modal={type:'death', charId:deadId};
  } else if(world.pendingMilestoneModals && world.pendingMilestoneModals.length){
    ui.modal={type:'milestone', data:world.pendingMilestoneModals.shift()};
  } else if(world.pendingEvents && world.pendingEvents.length){
    ui.modal={type:'event', event:world.pendingEvents.shift()};
  } else {
    ui.modal=null;
  }
  render();
}

/* ---------- SuccessionSystem (Parte 20: candidatos = familia cercana, no todo el linaje) ---------- */
function eligibleHeirs(deceased){
  const cf=closeFamily(deceased.id);
  const raw=[...cf.children, cf.spouse, ...cf.siblings].filter(m=>m && m.alive);
  const seen=new Set(); const out=[];
  for(const m of raw){ if(!seen.has(m.id)){ seen.add(m.id); out.push(m); } }
  out.sort((a,b)=>{
    const rank=(m)=> cf.children.some(c=>c.id===m.id) ? 0 : (cf.spouse && m.id===cf.spouse.id ? 1 : 2);
    return rank(a)-rank(b) || b.age-a.age;
  });
  return out;
}
