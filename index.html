/* ---------- apariencia (Partes 24-29) ----------
   v5 (Parte 72): ya no se traduce a una secuencia de emoji — el retrato visual
   es el tile real de personaje (TILE_B64.character) hasta tener arte por
   individuo. skinTone/hairType/beard se conservan como datos (para un futuro
   sistema de retratos reales) aunque hoy no cambien lo que se dibuja. */
const HAIR_TYPES = ['straight','curly','red','white','bald'];
function randomAppearance(){
  return { skinTone: rand(0,4), hairType: pick(HAIR_TYPES), beard: chance(0.35) };
}
/* herencia visual simple (Parte 28): sin genética real, solo continuidad visual del linaje */
function inheritAppearance(father, mother){
  const fa=father&&father.appearance, ma=mother&&mother.appearance;
  if(!fa && !ma) return randomAppearance();
  if(!fa) return { skinTone:clamp(ma.skinTone+rand(-1,1),0,4), hairType: chance(0.6)?ma.hairType:pick(HAIR_TYPES), beard:chance(0.35) };
  if(!ma) return { skinTone:clamp(fa.skinTone+rand(-1,1),0,4), hairType: chance(0.6)?fa.hairType:pick(HAIR_TYPES), beard:chance(0.35) };
  const avg = Math.round((fa.skinTone+ma.skinTone)/2);
  return { skinTone: clamp(avg+rand(-1,1),0,4), hairType: chance(0.5)?fa.hairType:ma.hairType, beard: chance(0.35) };
}

/* ---------- etapas de vida y capacidades del personaje (Partes 6-7) ---------- */
const LIFE_STAGES=[
  {key:'baby', min:0, max:2, label:'bebé'},
  {key:'earlyChildhood', min:3, max:5, label:'primera infancia'},
  {key:'childhood', min:6, max:8, label:'niñez'},
  {key:'olderChildhood', min:9, max:11, label:'niñez mayor'},
  {key:'adolescence', min:12, max:15, label:'adolescencia'},
  {key:'youth', min:16, max:19, label:'juventud'},
  {key:'adulthood', min:20, max:49, label:'adultez'},
  {key:'maturity', min:50, max:64, label:'madurez'},
  {key:'oldAge', min:65, max:9999, label:'vejez'}
];
function getLifeStage(ch){
  const age=ch.age;
  return LIFE_STAGES.find(s=>age>=s.min && age<=s.max) || LIFE_STAGES[LIFE_STAGES.length-1];
}
/* Parte 36: el título refleja el oficio real cuando ya existe, no solo la etapa de vida */
function getStageTitle(ch){
  const stage=getLifeStage(ch).key;
  const village=WORLD_FLAVOR.villageName;
  const occ = (typeof getDisplayOccupation==='function') ? getDisplayOccupation(ch) : null;
  if(stage==='baby') return (ch.sex==='M'?'Recién nacido':'Recién nacida')+' de '+village;
  if(stage==='earlyChildhood'||stage==='childhood'||stage==='olderChildhood') return (ch.sex==='M'?'Niño':'Niña')+' de '+village;
  if(stage==='adolescence') return (occ? 'Joven '+occ.toLowerCase() : (ch.sex==='M'?'Muchacho':'Muchacha'))+' de '+village;
  if(stage==='oldAge') return (occ || (ch.sex==='M'?'Anciano':'Anciana'))+' de '+village;
  if(occ) return occ+' de '+village;
  if(stage==='youth') return (ch.sex==='M'?'Joven campesino':'Joven campesina')+' de '+village;
  return (ch.sex==='M'?'Campesino':'Campesina')+' de '+village;
}
/* rasgos: se descubren con el tiempo, no se conocen todos desde el nacimiento (Parte 21) */
function getVisibleTraits(ch){
  const age=ch.age;
  const n = age<3?0 : age<7?1 : age<12?2 : ch.traits.length;
  return ch.traits.slice(0,n);
}
/* fuente de verdad central: qué puede ver/hacer un personaje según su edad (Parte 6) */
function getPlayerCapabilities(ch){
  const age=ch.age;
  return {
    stage: getLifeStage(ch).key,
    annualActionsMax: age<3?0 : age<9?1 : age<16?2 : 3,
    canSeeRelaciones: age>=3,
    canHandleAnimals: age>=6,
    canFarm: age>=9,
    canSeeMundo: age>=9,
    canSeeHistoria: age>=9,
    canSeePropiedades: age>=12,
    canSeeHouseholdDescriptive: age>=12,
    canSeekApprenticeship: age>=12,
    canSeeExactMoney: age>=15,
    canSeeReputation: age>=15,
    canSeeAdultEconomy: age>=15,
    canEarnPersonalMoney: age>=13,
    canSeePersonalMoney: age>=13,
    canSeeWorldFull: age>=16,
    canMarry: age>=16,
    canPursueRomance: age>=16,
    canSeeAdultProfession: age>=16,
    canTrade: age>=16,
    canWorkProfession: age>=16,
    canContributeMoney: age>=16,
    canLeaveHome: canLeaveHousehold(ch),
    canManageHousehold: canManageHousehold(ch)
  };
}
/* la edad NO da autoridad automática: solo la cabeza de hogar adulta administra (Parte 14) */
function canManageHousehold(ch){
  if(ch.age<16) return false;
  const hh = ch.householdId? world.households[ch.householdId] : null;
  return !!(hh && hh.headId===ch.id);
}
/* pestañas dinámicas (Parte 19) */
/* ---------- v5 (Parte 72): 6 pantallas de nav inferior, en vez del menú de pestañas anterior.
   'familia' y 'mundo' (v1-v4) no desaparecen: viven como filtros DENTRO de 'gente' y 'vida'. */
const TAB_DEFS=[
  ['vida','Vida',0],
  ['hacer','Hacer',6],
  ['gente','Gente',3],
  ['hacienda','Hacienda',12],
  ['tienda','Tienda',12],
  ['yo','Yo',0]
];
function getAvailableTabs(p){ return TAB_DEFS.filter(([,,minAge])=>p.age>=minAge).map(([k,l])=>[k,l]); }

/* ---------- economía del hogar dirigida por los adultos, no por un niño (Parte 15) ---------- */
function getHouseholdAdults(hh){
  return (hh?hh.memberIds:[]).map(C).filter(c=>c&&c.alive&&c.age>=16);
}
function getHouseholdFarmSkill(hh){
  const adults=getHouseholdAdults(hh);
  if(!adults.length) return 15; // hogar sin adultos (huérfanos): subsistencia mínima
  return adults.reduce((s,c)=>s+c.skills.farming,0)/adults.length;
}
function getHouseholdLabor(hh){
  const adults=getHouseholdAdults(hh).length;
  const helpers=(hh?hh.memberIds:[]).map(C).filter(c=>c&&c.alive&&c.age>=9&&c.age<16).length;
  return adults + helpers*0.3;
}
/* si la cabeza de hogar muere o se va, alguien más razonable toma su lugar (Parte 38) */
function resolveHouseholdHead(hh){
  if(!hh) return;
  const head=C(hh.headId);
  if(head && head.alive && hh.memberIds.includes(head.id)) return;
  const members=hh.memberIds.map(C).filter(Boolean);
  const spouse = head? members.find(m=>m.alive && m.id===head.spouseId) : null;
  const adultChild = members.filter(m=>m.alive && m.age>=16).sort((a,b)=>b.age-a.age)[0];
  const anyAdult = members.filter(m=>m.alive && m.age>=16)[0];
  const eldest = members.filter(m=>m.alive).sort((a,b)=>b.age-a.age)[0];
  const next = (spouse&&spouse.alive) ? spouse : (adultChild || anyAdult || eldest);
  if(next) hh.headId = next.id;
}
/* continuar jugando no es lo mismo que heredar legalmente (Parte 39) */
function eligiblePlayableRelatives(deceased){
  return eligibleHeirs(deceased); // misma lógica de cercanía familiar; ver nota en eligibleHeirs
}

/* ================= CareerSystem (v4, Partes 4-9, 26-34) =================
   Trayectoria profesional real, vinculada a PERSONAJES (maestros), no a un
   menú de elección. career.stage avanza con la experiencia; el dinero que
   genera es SIEMPRE del personaje (personalMoney), nunca directamente del
   hogar — ver PersonalEconomySystem más abajo. */
function getProfession(ch){ return (ch.career && ch.career.professionId) ? PROFESSIONS[ch.career.professionId] : null; }
function getCareerLabel(ch){
  const career=ch.career;
  if(!career || !career.professionId || !PROFESSIONS[career.professionId]) return null;
  const prof=PROFESSIONS[career.professionId];
  const base=prof.label;
  let label;
  switch(career.stage){
    case 'helper': label='Ayudante de '+base.toLowerCase(); break;
    case 'apprentice': label='Aprendiz de '+base.toLowerCase(); break;
    case 'worker': label=base; break;
    case 'skilled': label=base+' experimentado/a'; break;
    case 'master': label='Maestro/a de '+base.toLowerCase(); break;
    default: label=base;
  }
  return genderText(label, ch.sex);
}
/* compatibilidad: personajes migrados de v1-v3 solo tenían .profession (texto plano) */
function getDisplayOccupation(ch){
  const fromCareer = getCareerLabel(ch);
  if(fromCareer) return fromCareer;
  if(ch.profession && PROFESSIONS[ch.profession]) return genderText(PROFESSIONS[ch.profession].label, ch.sex);
  return null;
}
/* maestros reales disponibles para aprender un oficio artesanal (Parte 8, 30) */
function findAvailableMasters(ch){
  return Object.values(world.characters).filter(c=>
    c.alive && c.id!==ch.id && c.career && c.career.professionId &&
    PROFESSIONS[c.career.professionId] && PROFESSIONS[c.career.professionId].apprenticeshipRequired &&
    (c.career.stage==='skilled'||c.career.stage==='master') &&
    !isCloseFamily(ch.id, c.id)
  );
}
function startApprenticeship(ch, master){
  ch.career = {professionId:master.career.professionId, stage:'helper', masterId:master.id, startedYear:world.year, experience:0, annualEarnings:0};
  bumpRelationship(world, ch.id, master.id, 15);
  triggerMilestone(world, ch, 'first_apprenticeship', {icon:'🔨', title:'Primer maestro',
    desc:`Comienzas a aprender el oficio de ${genderText(PROFESSIONS[master.career.professionId].label,ch.sex).toLowerCase()} con ${master.firstName} ${master.familyName}.`, major:false});
  // §6B: la relación maestro-aprendiz es una historia propia, no solo un masterId.
  createStoryThread(world,'apprenticeship',{actorIds:[ch.id,master.id], stage:1, data:{professionId:master.career.professionId}});
}
/* profesiones NPC: mismo registro central que el jugador (Parte 26), sin simular cada detalle */
function assignNpcCareer(c, turnLog){
  if(c.id===world.playerId) return;
  if(c.career && c.career.professionId) return;
  const entries = Object.entries(PROFESSIONS).filter(([,p])=>!p.apprenticeshipRequired && p.category!=='service');
  const weighted = entries.map(([id,p])=>({w:p.familyLearned?3:1, id}));
  const total=weighted.reduce((s,x)=>s+x.w,0);
  let r=srandom()*total, chosenId=weighted[weighted.length-1].id;
  for(const it of weighted){ r-=it.w; if(r<=0){ chosenId=it.id; break; } }
  c.career = {professionId:chosenId, stage:'worker', masterId:null, startedYear:world.year, experience:40, annualEarnings:0};
  c.profession = chosenId; // compatibilidad con vistas/saves antiguas
  c.npcProfessionAssigned = true;
  if(turnLog && isCloseFamily(world.playerId, c.id)){
    turnLog.push({year:world.year, title:'Nuevo oficio', desc:`${capitalize(kinRef(world.playerId,c.id))} comenzó a trabajar como ${genderText(PROFESSIONS[chosenId].label,c.sex).toLowerCase()}.`, tag:'personaje', related:[c.id], minor:true});
  }
}
/* progresión anual de TODA carrera activa (jugador y NPC), fuente única (Parte 27, 48) */
function resolveCareers(w, turnLog){
  const p=player(w);
  for(const c of Object.values(w.characters)){
    if(!c.alive || !c.career || !c.career.professionId) continue;
    const prof=PROFESSIONS[c.career.professionId]; if(!prof) continue;
    const isPlayerOrKin = c.id===w.playerId || isCloseFamily(w.playerId, c.id);
    if(c.career.masterId){
      const master=C(c.career.masterId);
      if(!master || !master.alive){
        const thread=findStoryThread(w,'apprenticeship', t=> t.actorIds[0]===c.id && t.actorIds[1]===c.career.masterId);
        c.career.masterId=null;
        if(c.id===w.playerId){
          turnLog.push(log(w,'Tu maestro ha muerto','Tu aprendizaje se interrumpe con la muerte de tu maestro/a.','trabajo',master?[c.id,master.id]:[c.id],undefined,master?master.id:c.id));
          triggerMilestone(w,c,'master_died',{icon:'⚰️',title:'La pérdida de un maestro',desc:`${c.firstName} pierde a quien le enseñaba su oficio.`,major:false});
        }
        if(c.career.experience<25) c.career.stage='helper';
        // §6B: si ya había avanzado lo bastante, la muerte del maestro deja tras de sí
        // parte de su clientela y reputación; si no, el hilo simplemente se cierra.
        if(thread){
          if(c.career.experience>=25){
            advanceStoryThread(w,thread,{stage:4,data:{inherited:true}});
            resolveStoryThread(w,thread);
            if(isPlayerOrKin) turnLog.push(log(w,'Un legado recibido',`Al morir tu maestro, parte de su clientela y su buen nombre en el oficio pasaron a ti.`,'trabajo',[c.id]));
            c.reputation=clamp((c.reputation||0)+rand(3,7),0,100);
          } else resolveStoryThread(w,thread);
        }
      }
    }
    let gain=2+rand(0,3);
    if(c.traits.includes('trabajador/a')) gain+=1;
    if(c.traits.includes('perezoso/a')) gain-=1;
    if(c.traits.includes('ambicioso/a')) gain+=1;
    c.career.experience=clamp(c.career.experience+Math.max(0,gain),0,999);
    const stages=prof.stages, idx=stages.indexOf(c.career.stage);
    const thresholds={helper:15, apprentice:30, worker:55, skilled:90};
    const th=thresholds[c.career.stage];
    if(th!==undefined && idx>=0 && idx<stages.length-1 && c.career.experience>=th){
      c.career.stage=stages[idx+1];
      if(isPlayerOrKin) turnLog.push(log(w,'Progreso en el oficio',`${c.firstName} ahora es ${getCareerLabel(c).toLowerCase()}.`,'trabajo',[c.id]));
      if(c.id===w.playerId && c.career.stage==='worker') triggerMilestone(w,c,'first_real_profession',{icon:prof.icon,title:'Tu primer oficio',desc:`Te conviertes en ${genderText(prof.label,c.sex).toLowerCase()}.`,major:false});
      if(c.id===w.playerId && c.career.stage==='skilled') triggerMilestone(w,c,'became_skilled',{icon:'⭐',title:'Trabajador experimentado',desc:`Te has convertido en alguien experimentado en tu oficio.`,major:false});
      if(c.career.stage==='master'){
        // §6B: alcanzar la maestría cierra, con un buen final, el hilo de aprendizaje si sigue activo.
        const thread=findStoryThread(w,'apprenticeship', t=> t.actorIds[0]===c.id);
        if(thread) resolveStoryThread(w,thread);
        if(c.id===w.playerId) triggerMilestone(w,c,'became_master',{icon:'🏅',title:'Maestro/a del oficio',desc:`Te has convertido en ${genderText(prof.label,c.sex).toLowerCase()} maestro/a — ya puedes enseñar tu oficio a otros.`,major:false});
      }
    }
    const stageMult={helper:0.3, apprentice:0.4, worker:1.0, skilled:1.4, master:1.9};
    let earnings=prof.baseIncome*(stageMult[c.career.stage]||0.5);
    if(c.traits.includes('trabajador/a')) earnings*=1.15;
    if(c.traits.includes('perezoso/a')) earnings*=0.85;
    c.career.annualEarnings=Math.max(0, Math.round(earnings*10)/10);
    if(prof.primarySkill && c.skills[prof.primarySkill]!==undefined) c.skills[prof.primarySkill]=clamp(c.skills[prof.primarySkill]+rand(0,2),0,100);
  }
}
/* ================= PersonalEconomySystem (v4, Partes 15-19) =================
   Dos economías separadas: personalMoney (del personaje) y household.money
   (del hogar). Quien encabeza su propio hogar vuelca ahí sus ingresos —
   es su economía compartida. Quien vive bajo la jefatura de otro se queda
   la mayor parte de lo que gana, y aporta una parte razonable a la casa. */
const DEPENDENT_CONTRIBUTION_RATE = 0.35;
function calculatePersonalIncome(ch){ return (ch.career && ch.career.annualEarnings) || 0; }
function resolvePersonalEconomy(w, turnLog){
  for(const c of Object.values(w.characters)){
    if(!c.alive) continue;
    const earnings=calculatePersonalIncome(c);
    if(!earnings) continue;
    const hh=c.householdId? w.households[c.householdId] : null;
    const isHead = hh && hh.headId===c.id;
    let toPersonal=earnings;
    if(hh && !isHead){
      const toHousehold=Math.round(earnings*DEPENDENT_CONTRIBUTION_RATE*10)/10;
      toPersonal=Math.round((earnings-toHousehold)*10)/10;
      hh.money=Math.round((hh.money+toHousehold)*10)/10;
    } else if(hh && isHead){
      hh.money=Math.round((hh.money+earnings)*10)/10;
      toPersonal=0;
    }
    const before=c.personalMoney||0;
    c.personalMoney=Math.round((before+toPersonal)*10)/10;
    if(before<=0 && c.personalMoney>0 && c.id===w.playerId){
      triggerMilestone(w,c,'first_coin_earned',{icon:'🪙',title:'Tus primeras monedas',desc:`${c.firstName} gana sus primeras monedas propias.`,major:false});
    }
  }
}
/* independencia del jugador: dejar el hogar paterno no regala una granja (Parte 21) */
function canLeaveHousehold(ch){
  if(!ch || ch.age<16) return false;
  const hh = ch.householdId? world.households[ch.householdId] : null;
  if(hh && hh.headId===ch.id) return false; // ya administra su propio hogar
  return true;
}
/* §11 (sesión "cambios varios"): investigación histórica — en la Europa medieval (patrón de
   matrimonio/hogar "neolocal" del noroeste europeo) un campesino NO fundaba hogar propio solo por
   cumplir cierta edad. Necesitaba, en la práctica, uno de estos tres caminos:
   1) TIERRA O ARRIENDO propio (por herencia o licencia del señor, con su multa de entrada) — aquí
      se aproxima con un oficio/aprendizaje ya asentado, que representa un sustento verificable;
   2) AHORROS suficientes, típicamente tras años sirviendo como mozo/criada de labranza a cambio de
      salario (servant in husbandry) — el camino más común para quien no heredaba nada;
   3) MATRIMONIO — casarse combinaba el patrimonio de ambas familias (dote/arras) y solía ser el
      propio detonante para establecer un hogar nuevo, no una consecuencia de tenerlo ya.
   Sin ninguno de los tres, un joven campesino se quedaba de sirviente o jornalero en casa ajena
   hasta reunir alguno. Este umbral de ahorro (INDEPENDENCE_MIN_SAVINGS) representa justo eso. */
const INDEPENDENCE_MIN_SAVINGS = 8;
function independenceReadiness(ch){
  const hasTrade = !!(ch.career && ch.career.professionId);
  const hasSavings = (ch.personalMoney||0) >= INDEPENDENCE_MIN_SAVINGS;
  const isMarried = !!(ch.spouseId && C(ch.spouseId) && C(ch.spouseId).alive);
  const ready = hasTrade || hasSavings || isMarried;
  let reason = '';
  if(!ready) reason = `Todavía no tienes con qué sostener un hogar propio: te faltan un oficio asentado, unos ahorros de al menos ${INDEPENDENCE_MIN_SAVINGS} monedas, o un matrimonio con quien compartir patrimonio. Sigue sirviendo en casa de tu familia mientras tanto.`;
  return {ready, hasTrade, hasSavings, isMarried, reason};
}
function computeParentGift(oldHh, ch){
  let money=0, grain=0, animalId=null;
  const head=oldHh? C(oldHh.headId) : null;
  if(head && head.alive && oldHh){
    const rel=getRelationship(world, ch.id, head.id);
    const status=householdStatus(oldHh);
    if(status!=='destitute' && rel>-10){
      money=Math.min(oldHh.money, rand(1,4));
      oldHh.money-=money;
      if(status!=='poor' && chance(0.4)){ grain=Math.min(oldHh.grainStores, rand(2,6)); oldHh.grainStores-=grain; }
      const animals=animalsOf(oldHh);
      if(status!=='poor' && animals.length && chance(0.25)){ animalId=pick(animals).id; }
    }
  }
  return {money, grain, animalId};
}
function leaveHousehold(ch, w=world){
  const oldHh = ch.householdId? w.households[ch.householdId] : null;
  const gift = computeParentGift(oldHh, ch);
  const hhId=uid();
  const startMoney = Math.round((ch.personalMoney||0)*0.7*10)/10 + gift.money;
  const hh={id:hhId, name:'Casa de '+ch.firstName+' '+ch.familyName, headId:ch.id, memberIds:[ch.id],
    money:startMoney, grainStores:gift.grain, security:rand(25,40), loyalty:rand(25,40), propertyIds:[], createdYear:w.year};
  ch.personalMoney=Math.round((ch.personalMoney||0)*0.3*10)/10;
  if(oldHh){
    oldHh.memberIds=oldHh.memberIds.filter(id=>id!==ch.id);
  }
  w.households[hhId]=hh;
  ch.householdId=hhId;
  ch.leftHomeAge=ch.age;
  ch.foundedHouseholdYear=w.year;
  if(gift.animalId){ const a=w.animals[gift.animalId]; if(a) a.ownerHouseholdId=hhId; }
  return hh;
}
/* residencia tras el matrimonio: ya NO es automático que el cónyuge entre al hogar del jugador (Parte 24) */
function resolveMarriageResidence(w, a, b){
  const aHh=a.householdId? w.households[a.householdId] : null;
  const bHh=b.householdId? w.households[b.householdId] : null;
  const aIsHead = aHh && aHh.headId===a.id;
  const bIsHead = bHh && bHh.headId===b.id;
  if(aIsHead){ if(bHh) bHh.memberIds=bHh.memberIds.filter(id=>id!==b.id); b.householdId=aHh.id; if(!aHh.memberIds.includes(b.id)) aHh.memberIds.push(b.id); return aHh; }
  if(bIsHead){ if(aHh) aHh.memberIds=aHh.memberIds.filter(id=>id!==a.id); a.householdId=bHh.id; if(!bHh.memberIds.includes(a.id)) bHh.memberIds.push(a.id); return bHh; }
  const canStay = aHh && householdStatus(aHh)!=='destitute';
  if(canStay && chance(0.5)){
    if(bHh) bHh.memberIds=bHh.memberIds.filter(id=>id!==b.id);
    b.householdId=aHh.id; if(!aHh.memberIds.includes(b.id)) aHh.memberIds.push(b.id);
    return aHh;
  }
  if(bHh) bHh.memberIds=bHh.memberIds.filter(id=>id!==b.id);
  return foundNewHousehold(w, a, null, {reason:'marriage', extraMember:b});
}
/* conocidos: la gente del pueblo se descubre, no se conoce desde el nacimiento (Partes 9-13) */
function getKnownPeople(ch){
  const family = closeFamilyFlat(ch.id);
  const seen=new Set(family.map(m=>m.id));
  const others=(ch.knownCharacterIds||[]).map(C).filter(m=>m && m.alive && m.id!==ch.id && !seen.has(m.id));
  return {family, others};
}
function introduceCharacter(viewer, target){
  if(!viewer || !target || viewer.id===target.id) return;
  viewer.knownCharacterIds=viewer.knownCharacterIds||[];
  target.knownCharacterIds=target.knownCharacterIds||[];
  if(!viewer.knownCharacterIds.includes(target.id)) viewer.knownCharacterIds.push(target.id);
  if(!target.knownCharacterIds.includes(viewer.id)) target.knownCharacterIds.push(viewer.id);
}
function describeKnownRelation(viewer, target){
  let label;
  if(viewer.career && viewer.career.masterId===target.id) label='Tu maestro/a';
  else if(target.career && target.career.masterId===viewer.id) label='Tu aprendiz';
  else if(viewer.firstFriendId===target.id) label='Amigo/a de infancia';
  else if(viewer.spouseId===target.id) return 'Cónyuge';
  else { const rel=getRelationship(world,viewer.id,target.id); label = rel>=40 ? 'Buena amistad' : 'Conocido/a'; }
  return genderText(label, target.sex);
}
function getEligibleRomanticCandidates(ch){
  return getKnownPeople(ch).others.filter(c=> c.alive && !c.spouseId && c.sex!==ch.sex && c.age>=16 && Math.abs(c.age-ch.age)<=12);
}
/* hito genérico, reutilizable desde fuera de resolveMilestones (Partes 32, 46) */
function triggerMilestone(w, p, key, {icon,title,desc,major,buttonLabel}){
  p.milestones=p.milestones||[];
  if(p.milestones.includes(key)) return null;
  p.milestones.push(key);
  const entry=log(w, title, desc, 'personaje', [p.id], undefined, p.id);
  if(major){
    w.pendingMilestoneModals=w.pendingMilestoneModals||[];
    w.pendingMilestoneModals.push({key,title,text:desc,buttonLabel:buttonLabel||'Continuar'});
  }
  return entry;
}
/* nombres de animales: nunca un ID técnico en la interfaz (Parte 40) */
function giveAnimalName(species, hh){
  const pool=ANIMAL_NAMES[species]||['Animal'];
  const used=new Set((hh?animalsOf(hh):[]).map(a=>a.name).filter(Boolean));
  const free=pool.filter(n=>!used.has(n));
  return free.length? pick(free) : (pick(pool)+' '+rand(2,9));
}
/* §9 (sesión "cambios varios"): mismo patrón que giveAnimalName, pero para personas — evita que
   dos personajes que el jugador puede confundir entre sí (hermanos, padres, vecinos conocidos)
   terminen con el mismo nombre de pila por puro azar. Si el pool libre se agota (partidas muy
   largas), en vez de repetir en silencio se distingue con un sufijo de época (II, "el Joven"). */
function pickCharacterName(sex, avoidNames=[]){
  const pool = sex==='M' ? NAMES.male : NAMES.female;
  const avoid = new Set(avoidNames.filter(Boolean));
  const free = pool.filter(n=>!avoid.has(n));
  if(free.length) return pick(free);
  const base = pick(pool);
  return chance(0.5) ? base+' el Joven' : base+' II';
}
/* nombres de quienes el jugador ya reconoce por nombre: familia cercana + gente que conoce.
   Se usa como "avoidNames" al generar personajes nuevos para que no choquen con ellos. */
function namesKnownTo(ch){
  if(!ch) return [];
  const fam = closeFamilyFlat(ch.id).map(m=>m.firstName);
  const others = (ch.knownCharacterIds||[]).map(C).filter(Boolean).map(m=>m.firstName);
  return [ch.firstName, ...fam, ...others];
}
/* pequeña población persistente del pueblo, generada una sola vez (Parte 9, 49) */
function makeVillagerHousehold(w, {roleProfession, roleStage, hasSpouse=true, kidAges=[], adultAgeRange=[28,50], avoidNames=[]}){
  const houseId=uid(), householdId=uid();
  const familyName=pick(NAMES.family);
  const headSex=pick(['M','F']);
  const head=makeCharacter({sex:headSex, age:rand(adultAgeRange[0],adultAgeRange[1]), familyName, houseId, householdId, avoidNames});
  head.career={professionId:roleProfession, stage:roleStage, masterId:null, startedYear:w.year-rand(8,20), experience: roleStage==='master'?95:70, annualEarnings:0};
  head.profession=roleProfession;
  head.personalMoney=rand(3,10);
  const usedNames=[...avoidNames, head.firstName]; // §1/§9: nadie en este hogar (ni luego el pueblo) repite nombre
  const members=[head]; let spouse=null;
  if(hasSpouse){
    spouse=makeCharacter({sex: headSex==='M'?'F':'M', age:rand(Math.max(18,adultAgeRange[0]-4), adultAgeRange[1]-2), familyName, houseId, householdId, avoidNames:usedNames});
    spouse.spouseId=head.id; head.spouseId=spouse.id; spouse.personalMoney=rand(1,5);
    usedNames.push(spouse.firstName);
    members.push(spouse);
  }
  const kids=[];
  for(const age of kidAges){
    const kid=makeCharacter({sex:pick(['M','F']), age, familyName, houseId, householdId,
      fatherId: headSex==='M'?head.id:(spouse?spouse.id:null), motherId: headSex==='F'?head.id:(spouse?spouse.id:null),
      appearance:inheritAppearance(headSex==='M'?head:spouse, headSex==='F'?head:spouse), avoidNames:usedNames});
    usedNames.push(kid.firstName);
    kids.push(kid);
  }
  head.childrenIds=kids.map(k=>k.id);
  if(spouse) spouse.childrenIds=kids.map(k=>k.id);
  kids.forEach(k=>{ k.siblingIds=kids.filter(x=>x.id!==k.id).map(x=>x.id); });
  [...members,...kids].forEach(c=>{ w.characters[c.id]=c; });
  const allIds=[...members.map(m=>m.id), ...kids.map(k=>k.id)];
  w.houses[houseId]={id:houseId, name:familyName, memberIds:allIds, founderId:head.id, createdYear:w.year-30, titles:[], prestige:rand(10,30)};
  w.households[householdId]={id:householdId, name:familyName+'stead', headId:head.id, memberIds:allIds, money:rand(4,14), grainStores:rand(2,10), security:rand(35,55), loyalty:rand(35,55), propertyIds:[], createdYear:w.year-30};
  w.flags.villageHouseholdIds=w.flags.villageHouseholdIds||[]; w.flags.villageHouseholdIds.push(householdId);
  return {head, spouse, kids, householdId, houseId, names:usedNames};
}
function generateVillageResidents(w){
  // §9: los 9 hogares fundacionales del pueblo comparten una única lista de nombres ya usados,
  // para que dos vecinos del pueblo (aunque sean de familias distintas) no coincidan de nombre.
  let usedNames=[];
  const specs=[
    {roleProfession:'blacksmith', roleStage:'master', kidAges:[rand(2,9)], adultAgeRange:[38,54]},
    {roleProfession:'carpenter', roleStage:'skilled', kidAges:[rand(3,12)], adultAgeRange:[32,48]},
    {roleProfession:'miller', roleStage:'skilled', kidAges:[], adultAgeRange:[35,52]},
    {roleProfession:'baker', roleStage:'worker', hasSpouse:false, kidAges:[rand(4,10)], adultAgeRange:[28,45]},
    {roleProfession:'shepherd', roleStage:'skilled', kidAges:[rand(0,8)], adultAgeRange:[26,42]},
    {roleProfession:'guard', roleStage:'worker', hasSpouse:false, kidAges:[], adultAgeRange:[22,40]},
    {roleProfession:'guard', roleStage:'worker', hasSpouse:false, kidAges:[], adultAgeRange:[24,45]},
    {roleProfession:'peasant_farmer', roleStage:'worker', kidAges:[rand(1,7), rand(9,15)], adultAgeRange:[26,44]},
    {roleProfession:'peasant_farmer', roleStage:'worker', kidAges:[rand(0,6)], adultAgeRange:[24,40]}
  ];
  for(const spec of specs){
    const result = makeVillagerHousehold(w, {...spec, avoidNames:usedNames});
    usedNames = result.names;
  }
}
/* una familia nueva del pueblo, generada bajo demanda cuando hace falta un niño/a real (Parte 11) */
function spawnVillageFamily(w, childAge){
  const familyName=pick(NAMES.family);
  const houseId=uid(), householdId=uid();
  const fAge=rand(24,42), mAge=rand(22,38);
  const father=makeCharacter({sex:'M', age:fAge, familyName, houseId, householdId});
  const mother=makeCharacter({sex:'F', age:mAge, familyName, houseId, householdId, avoidNames:[father.firstName]});
  father.spouseId=mother.id; mother.spouseId=father.id;
  assignNpcCareer(father); assignNpcCareer(mother);
  const child=makeCharacter({sex:pick(['M','F']), age:clamp(childAge,0,14), familyName, houseId, householdId,
    fatherId:father.id, motherId:mother.id, appearance:inheritAppearance(father,mother), avoidNames:[father.firstName,mother.firstName]});
  father.childrenIds=[child.id]; mother.childrenIds=[child.id];
  [father,mother,child].forEach(c=>{ w.characters[c.id]=c; });
  w.houses[houseId]={id:houseId, name:familyName, memberIds:[father.id,mother.id,child.id], founderId:father.id, createdYear:w.year-fAge, titles:[], prestige:rand(10,30)};
  w.households[householdId]={id:householdId, name:familyName+'stead', headId:father.id, memberIds:[father.id,mother.id,child.id], money:rand(3,10), grainStores:rand(5,15), security:rand(30,50), loyalty:rand(30,50), propertyIds:[], createdYear:w.year-fAge};
  w.flags.villageHouseholdIds=w.flags.villageHouseholdIds||[]; w.flags.villageHouseholdIds.push(householdId);
  return child;
}
/* un/a adulto/a nuevo/a y persistente del pueblo (usado cuando hace falta un pretendiente real, Parte 25) */
function spawnVillageAdult(w, sex, age, avoidNames=[]){
  const c=spawnExternalSpouse(sex, [age,age], w, avoidNames);
  w.characters[c.id]=c;
  assignNpcCareer(c);
  c.personalMoney=rand(1,5);
  const hhId=uid();
  w.households[hhId]={id:hhId, name:'Casa de '+c.firstName+' '+c.familyName, headId:c.id, memberIds:[c.id], money:rand(2,6), grainStores:rand(2,5), security:rand(25,40), loyalty:rand(25,40), propertyIds:[], createdYear:w.year};
  c.householdId=hhId;
  w.flags.villageHouseholdIds=w.flags.villageHouseholdIds||[]; w.flags.villageHouseholdIds.push(hhId);
  return c;
}
/* encontrar/conocer a alguien nuevo, camino orgánico hacia el matrimonio (Partes 13, 25) */
function meetRomanticProspect(w, p){
  const oppositeSex=p.sex==='M'?'F':'M';
  const pool=Object.values(w.characters).filter(c=>c.alive && c.sex===oppositeSex && !c.spouseId && c.age>=16 &&
    Math.abs(c.age-p.age)<=10 && c.id!==p.id && !isCloseFamily(p.id,c.id) && !(p.knownCharacterIds||[]).includes(c.id));
  const met = pool.length? pick(pool) : spawnVillageAdult(w, oppositeSex, rand(Math.max(16,p.age-6), p.age+6), namesKnownTo(p));
  introduceCharacter(p, met);
  bumpRelationship(w,p.id,met.id,rand(4,10));
  w.marriageCandidates=w.marriageCandidates||[];
  if(!w.marriageCandidates.includes(met.id)) w.marriageCandidates.push(met.id);
  return met;
}

/* ---------- estado global ---------- */
let world = null;
const ui = {activeTab:'vida', modal:null, showAnimalDetail:false, doCategory:'all', peopleFilter:'all', lifeFilter:'all'};

/* ---------- helpers de acceso ---------- */
function C(id){return world.characters[id];}
function player(w=world){return w.characters[w.playerId];}
function lineage(w=world, charId=w.playerId){ const c=w.characters[charId]; return c? w.houses[c.houseId] : null; }
function household(w=world, charId=w.playerId){ const c=w.characters[charId]; return c? w.households[c.householdId] : null; }
function propertiesOf(hh){ return hh? hh.propertyIds.map(id=>world.properties[id]).filter(Boolean) : []; }
function animalsOf(hh){ return hh? Object.values(world.animals).filter(a=>a.alive && a.ownerHouseholdId===hh.id) : []; }
function relKey(a,b){return [a,b].sort().join('|');}
function bumpRelationship(w,a,b,delta){
  const k=relKey(a,b);
  if(!w.relationships[k]) w.relationships[k]={a,b,value:0};
  w.relationships[k].value=clamp(w.relationships[k].value+delta,-100,100);
}
function getRelationship(w,a,b){ const r=w.relationships[relKey(a,b)]; return r?r.value:0; }
function currentActionsMax(){ world.annualActionsMax = getPlayerCapabilities(player(world)).annualActionsMax; return world.annualActionsMax; }
function canUseAction(){ return world.annualActionsUsed < currentActionsMax(); }
function useAction(){ if(!canUseAction()) return false; world.annualActionsUsed++; return true; }

/* ---------- parentesco cercano (kinship por travesía de IDs, no por hogar) ---------- */
function closeFamily(charId=world.playerId){
  const c=C(charId);
  if(!c) return {father:null,mother:null,spouse:null,children:[],siblings:[]};
  return {
    father: c.fatherId?C(c.fatherId):null,
    mother: c.motherId?C(c.motherId):null,
    spouse: c.spouseId?C(c.spouseId):null,
    children: c.childrenIds.map(C).filter(Boolean),
    siblings: c.siblingIds.map(C).filter(Boolean)
  };
}
function closeFamilyFlat(charId=world.playerId){
  const cf=closeFamily(charId);
  const arr=[cf.father,cf.mother,cf.spouse,...cf.children,...cf.siblings].filter(Boolean);
  const seen=new Set(); const out=[];
  for(const m of arr){ if(!seen.has(m.id)){ seen.add(m.id); out.push(m); } }
  return out;
}
function isCloseFamily(viewerId, targetId){
  if(viewerId===targetId) return false;
  return closeFamilyFlat(viewerId).some(m=>m.id===targetId);
}

/* ---------- parentesco: función central única (Parte 11) ---------- */
function getKinshipLabel(viewerId, targetId){
  if(viewerId===targetId) return 'tú';
  const v=C(viewerId), t=C(targetId);
  if(!v||!t) return 'familiar';
  if(t.id===v.fatherId) return 'padre';
  if(t.id===v.motherId) return 'madre';
  if(t.id===v.spouseId) return t.alive===false ? (t.sex==='M'?'esposo (fallecido)':'esposa (fallecida)') : (t.sex==='M'?'esposo':'esposa');
  if(v.childrenIds.includes(t.id)) return t.sex==='M'?'hijo':'hija';
  if(v.siblingIds.includes(t.id)) return t.sex==='M'?'hermano':'hermana';
  const parents=[v.fatherId,v.motherId].filter(Boolean);
  const grandparentIds = parents.flatMap(pid=>{const p=C(pid); return p?[p.fatherId,p.motherId]:[];}).filter(Boolean);
  if(grandparentIds.includes(t.id)) return t.sex==='M'?'abuelo':'abuela';
  const grandchildIds = v.childrenIds.flatMap(cid=>{const c=C(cid); return c?c.childrenIds:[];});
  if(grandchildIds.includes(t.id)) return t.sex==='M'?'nieto':'nieta';
  const auntUncleIds = parents.flatMap(pid=>{const p=C(pid); return p?p.siblingIds:[];});
  if(auntUncleIds.includes(t.id)) return t.sex==='M'?'tío':'tía';
  const nieceNephewIds = v.siblingIds.flatMap(sid=>{const s=C(sid); return s?s.childrenIds:[];});
  if(nieceNephewIds.includes(t.id)) return t.sex==='M'?'sobrino':'sobrina';
  const cousinIds = auntUncleIds.flatMap(aid=>{const a=C(aid); return a?a.childrenIds:[];});
  if(cousinIds.includes(t.id)) return t.sex==='M'?'primo':'prima';
  if(t.houseId===v.houseId) return 'pariente lejano';
  return t.sex==='M'?'conocido':'conocida';
}
/* ---------- referencia narrativa por parentesco (mejora de diseño 2026-09 #3): en vez de un
   nombre propio que el jugador todavía no reconoce, "tu padre, Cedric" — la relación primero,
   el nombre como apoyo. withName:false para solo la relación ("tu padre"). ---------- */
/* ---------- género real en vez de "campesino/a" (mejora de diseño 2026-09 #3): en cuanto se conoce
   el sexo real de un personaje concreto, se resuelve la forma correcta en vez de mostrar la barra. ---------- */
function genderWord(masc, sex){
  if(sex!=='F') return masc;
  if(/[oe]$/.test(masc)) return masc.slice(0,-1)+'a';
  if(/or$/.test(masc)) return masc+'a';
  return masc+'a';
}
function pronoun(sex){ return sex==='F'?'ella':'él'; }
function capitalize(s){ return s? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function genderText(text, sex){
  if(!text) return text;
  return text.replace(/(\p{L}+)\/a/gu, (_,masc)=> genderWord(masc, sex));
}
function birthTitle(sex){ return sex==='M' ? 'Nació un hijo' : 'Nació una hija'; }
/* alguien cercano al jugador se referencia por parentesco (tu hermano, X); alguien apenas
   conocido se referencia por su nombre, como ya se hacía (mejora de diseño 2026-09 #3) */
function personRef(viewerId, targetId){
  if(viewerId===targetId) return 'tú';
  if(isCloseFamily(viewerId, targetId)) return kinRef(viewerId, targetId);
  const t=C(targetId); return t? t.firstName : 'alguien';
}
function kinRef(viewerId, targetId, opts={}){
  const t=C(targetId);
  if(!t) return 'alguien';
  const label=getKinshipLabel(viewerId, targetId);
  if(label==='tú') return 'tú';
  if(opts.withName===false) return 'tu '+label;
  const m=label.match(/^(.*?)(\s*\(.*\))?$/);
  return `tu ${m[1]}, ${t.firstName}${m[2]||''}`;
}

/* ---------- descriptores (números para la simulación, palabras para el jugador) ---------- */
function healthLabel(v, sex){
  let label;
  if(v>=85) label='rebosante de salud';
  else if(v>=65) label='saludable';
  else if(v>=45) label='con algunas molestias';
  else if(v>=25) label='delicado/a de salud';
  else label='gravemente enfermo/a';
  return genderText(label, sex);
}
function reputationLabel(v, sex){
  let label;
  if(v>=75) label='muy respetado/a en el pueblo';
  else if(v>=50) label='bien visto/a';
  else if(v>=25) label='apenas conocido/a';
  else label='mal visto/a en el pueblo';
  return genderText(label, sex);
}
function relationshipLabel(v){
  if(v>=60) return 'unión muy estrecha';
  if(v>=25) return 'buena relación';
  if(v>=-10) return 'trato cordial';
  if(v>=-40) return 'relación tensa';
  return 'enemistad abierta';
}
function skillLabel(v, sex){
  let label;
  if(v>=75) label='maestro/a';
  else if(v>=45) label='competente';
  else if(v>=20) label='aprendiz avanzado/a';
  else label='novato/a';
  return genderText(label, sex);
}
function meterClass(v){ return v<35?'low':(v<65?'mid':''); }
function householdStatus(hh){
  if(hh.money<3 && hh.grainStores<4) return 'destitute';
  if(hh.money<8) return 'poor';
  if(hh.money<20) return 'stable';
  if(hh.money<45) return 'comfortable';
  return 'prosperous';
}
function householdStatusLabel(status){
  const map={
    destitute:'La familia pasa auténticas penurias.',
    poor:'La familia vive con dificultades.',
    stable:'La familia se mantiene sin sobresaltos.',
    comfortable:'La familia vive con cierta comodidad.',
    prosperous:'La familia prospera notablemente.'
  };
  return map[status];
}
/* §2.4: antes esto era un texto fijo puesto una vez al nacer ("Campesinado") que nunca se
   actualizaba, aunque el oficio o la economía del hogar cambiaran por completo. Se calcula
   cada vez a partir de la condición socioeconómica REAL — a propósito SEPARADO del prestigio
   del linaje (house.prestige) y del rango nobiliario futuro (NOBILITY_RANKS): esos dos son
   otra cosa, y no se mezclan aquí para que la UI nunca de a entender que el jugador gobierna
   algo (un título, una corte) que este juego todavía no simula. */
function getSocialClass(ch){
  const prof=getProfession(ch);
  if(prof){
    if(prof.category==='craft') return genderText(ch.career.stage==='master' ? 'Artesano/a maestro/a' : 'Artesano/a', ch.sex);
    if(prof.category==='service') return genderText('Gente de servicio del pueblo', ch.sex);
  }
  const hh = ch.householdId ? world.households[ch.householdId] : null;
  const status = hh ? householdStatus(hh) : null;
  if(status==='destitute') return genderText('Campesinado en la ruina', ch.sex);
  if(status==='poor') return genderText('Campesinado humilde', ch.sex);
  if(status==='comfortable' || status==='prosperous') return genderText('Campesinado acomodado', ch.sex);
  return genderText('Campesinado', ch.sex);
}

/* ---------- generación de personajes ---------- */
function makeCharacter({sex,age,familyName,houseId,householdId=null,fatherId=null,motherId=null,traits=null,appearance=null,avoidNames=[]}){
  const year = world? world.year : 516;
  const first = pickCharacterName(sex, avoidNames);
  const father = fatherId?C(fatherId):null, mother=motherId?C(motherId):null;
  return {
    id:uid(), firstName:first, familyName, sex, birthYear:year-age, deathYear:null, alive:true,
    houseId, householdId, profession:'peasant_farmer', npcProfessionAssigned:false, socialClass:'Campesinado',
    health:rand(60,90), reputation:rand(30,55),
    /* v5 (Parte 67): atributos reales para la barra de stats — mismo patrón que health/reputation,
       solo cambian por eventos y acciones concretas, nunca por deriva automática silenciosa. */
    charm:rand(20,40), wits:rand(20,40), faith:rand(20,40),
    skills: age<9 ? {farming:0, animal_husbandry:0, craftsmanship:0, commerce:0} : {farming:rand(0,15), animal_husbandry:rand(0,15), craftsmanship:0, commerce:0},
    traits: traits || [pick(TRAITS), pick(TRAITS)].filter((v,i,a)=>a.indexOf(v)===i),
    appearance: appearance || ((father||mother) ? inheritAppearance(father,mother) : randomAppearance()),
    fatherId, motherId, spouseId:null, childrenIds:[], siblingIds:[],
    marriedAge:null, causeOfDeath:null, lifeSummary:null, milestones:[],
    /* v4 (Partes 6, 9, 15): vida propia dentro del mundo, más allá de la granja familiar */
    personalMoney:0, knownCharacterIds:[], firstFriendId:null,
    career:{ professionId:null, stage:'none', masterId:null, startedYear:null, experience:0, annualEarnings:0 },
    /* v5 (Parte 68): ambición de vida, se asigna sola al cumplir 18 (resolveAmbition) */
    ambition:null,
    get age(){ return world.year - this.birthYear; }
  };
}
/* un personaje "de fuera" (pretendiente/cónyuge) trae su propio linaje aparte */
function spawnExternalSpouse(sex, ageRange=[16,32], w=world, avoidNames=[]){
  const familyName=pick(NAMES.family);
  const c=makeCharacter({sex, age:rand(ageRange[0],ageRange[1]), familyName, houseId:null, householdId:null, avoidNames});
  const lineageId=uid();
  w.houses[lineageId]={id:lineageId, name:familyName, memberIds:[c.id], founderId:c.id, createdYear:w.year, titles:[], prestige:rand(10,30)};
  c.houseId=lineageId;
  return c;
}
/* determina linaje/apellido de un hijo: función centralizada y aislada (Parte 10),
   para poder cambiar la regla más adelante (cultura, matrimonio, nobleza...) sin
   tocar resolveBirths(). Por ahora: convención patrilineal simple. */
function determineChildLineage(father, mother){ return father ? father.houseId : mother.houseId; }
function determineChildSurname(father, mother){ return father ? father.familyName : mother.familyName; }

/* ---------- generación del mundo inicial (Parte 2-5) ----------
   playerAge=0 (por defecto): partida nueva, el jugador NACE dentro del mundo.
   playerAge=16: usado solo por el flujo de "la línea se extingue, comienza otra
   familia en este mismo mundo" — ahí sí hace falta un fundador ya adulto y jugable. */
function generateInitialWorld({startYear=null, playerAge=0, seed=null, carryOn=false}={}){
  // nueva partida de cero -> seed nueva (o la que pida quien llama) y el generador SE REINICIA ahí;
  // "sigue la misma partida" (p. ej. la familia se extingue y se empieza otra dentro del mismo
  // mundo, carryOn:true) -> se conserva la seed original solo para mostrarla, pero el generador
  // (rngState) sigue avanzando en su propia secuencia, sin reiniciarse (Parte §2.6) — reiniciarlo
  // ahí haría que la "nueva familia" siempre reviviera exactamente los mismos primeros años.
  let usedSeed;
  // §13: si seguimos la misma partida (la línea se extinguió y empieza otra familia en el
  // mismo mundo), el asentamiento no cambia; una partida realmente nueva sortea uno de los 5.
  const priorRegionKey = (carryOn && world && world.regionKey) ? world.regionKey : null;
  if(carryOn){ usedSeed = (world && world.rngSeed!=null) ? world.rngSeed : (rngState>>>0); }
  else { usedSeed = (seed!=null) ? (seed>>>0) : randomSeed32(); rngState=usedSeed; }
  const year = startYear!=null ? startYear : rand(495,505);
  const w = {
    year, campaignStartYear:year, playerId:null, characters:{}, houses:{}, households:{}, properties:{}, animals:{},
    relationships:{}, history:[], lastTurnLog:[], marriageCandidates:[], flags:{}, tribute:3,
    annualActionsUsed:0, annualActionsMax:3, summaryShown:false, pendingBirthIntro:false,
    rngSeed:usedSeed, rngState:rngState>>>0, storyThreads:[],
    regionKey: priorRegionKey || pick(Object.keys(REGIONS)),
    schema_version:6
  };
  world = w;
  const familyName = pick(NAMES.family);
  const houseId = uid();       // linaje
  const householdId = uid();   // hogar económico inicial

  const fatherAge = playerAge>=16 ? rand(38,46) : rand(20,38);
  const motherAge = playerAge>=16 ? rand(34,44) : rand(18,34);
  const father = makeCharacter({sex:'M', age:fatherAge, familyName, houseId, householdId});
  const mother = makeCharacter({sex:'F', age:motherAge, familyName, houseId, householdId});
  father.spouseId=mother.id; mother.spouseId=father.id;
  father.marriedAge=rand(16,Math.min(24,fatherAge)); mother.marriedAge=Math.min(father.marriedAge,motherAge);
  // el padre ya vive de las tierras familiares (Parte 5: la profesión emerge de la vida, no de un menú)
  father.career = {professionId:'peasant_farmer', stage: fatherAge>=35?'skilled':'worker', masterId:null,
    startedYear: year-Math.min(fatherAge-16,20), experience: fatherAge>=35?70:45, annualEarnings:0};
  father.profession='peasant_farmer';

  // §1 (sesión "cambios varios"): ningún miembro de la familia inicial debe compartir nombre
  // de pila con otro — se va acumulando la lista de nombres ya usados en esta familia.
  const usedFamilyNames = [father.firstName, mother.firstName];
  const playerSex = pick(['M','F']);
  const plr = makeCharacter({sex:playerSex, age:playerAge, familyName, houseId, householdId,
    fatherId:father.id, motherId:mother.id, appearance:inheritAppearance(father,mother), avoidNames:usedFamilyNames});
  usedFamilyNames.push(plr.firstName);

  // hermanos: en una partida nueva (jugador recién nacido) son mayores que el jugador;
  // en el flujo de fundador adulto, siguen la regla previa (más jóvenes que el jugador).
  const siblings=[];
  if(playerAge<16){
    const nSib = rand(0,3);
    for(let i=0;i<nSib;i++){
      const maxAge = Math.min(9, Math.max(1, motherAge-16)); // la madre no pudo tenerlo antes de sus ~16
      if(maxAge<1) break;
      const s = makeCharacter({sex:pick(['M','F']), age:rand(1,maxAge), familyName, houseId, householdId,
        fatherId:father.id, motherId:mother.id, appearance:inheritAppearance(father,mother), avoidNames:usedFamilyNames});
      usedFamilyNames.push(s.firstName);
      siblings.push(s);
    }
  } else {
    const nSib = rand(1,2);
    for(let i=0;i<nSib;i++){
      const s = makeCharacter({sex:pick(['M','F']), age:rand(6,14), familyName, houseId, householdId,
        fatherId:father.id, motherId:mother.id, appearance:inheritAppearance(father,mother), avoidNames:usedFamilyNames});
      usedFamilyNames.push(s.firstName);
      siblings.push(s);
    }
  }
  const allKids=[plr,...siblings];
  father.childrenIds = allKids.map(k=>k.id);
  mother.childrenIds = allKids.map(k=>k.id);
  allKids.forEach(k=>{ k.siblingIds = allKids.filter(x=>x.id!==k.id).map(x=>x.id); });

  [father,mother,plr,...siblings].forEach(ch=> w.characters[ch.id]=ch);

  const farmId = uid();
  w.properties[farmId] = {id:farmId, type:'farm', name:familyName+'stead', ownerHouseholdId:householdId,
    landQuality:rand(45,68), sownCrop:'wheat', size:1};

  const memberIds=[father.id,mother.id,plr.id,...siblings.map(s=>s.id)];
  w.houses[houseId] = {id:houseId, name:familyName, memberIds:[...memberIds],
    founderId:father.id, createdYear:year-20, titles:[], prestige:rand(8,20)};
  w.households[householdId] = {id:householdId, name:familyName+'stead', headId:father.id,
    memberIds:[...memberIds], money:rand(9,16), grainStores:rand(22,38), security:rand(35,55), loyalty:rand(35,55), propertyIds:[farmId], createdYear:year-20};

  const hhRef = w.households[householdId];
  const seedAnimals=[['cow',2],['sheep',5],['chicken',7]];
  seedAnimals.forEach(([sp,n])=>{
    for(let i=0;i<n;i++){
      const id=uid();
      w.animals[id]={id, species:sp, sex:pick(['M','F']), birthYear:w.year-rand(0,3), alive:true,
        health:rand(60,90), ownerHouseholdId:householdId, name: giveAnimalName(sp, hhRef)};
    }
  });

  // pequeña población persistente del pueblo (Parte 9): existe desde el principio, pero el jugador
  // todavía no la CONOCE — knownCharacterIds empieza vacío y se va llenando con la vida (Parte 10)
  generateVillageResidents(w);
  w.flags.villageGenerated = true;

  w.playerId = plr.id;
  if(playerAge<16){
    w.pendingBirthIntro = true;
    log(w,'Naces',`Naces en ${WORLD_FLAVOR.villageName}, ${plr.sex==='M'?'hijo':'hija'} de ${kinRef(plr.id,father.id)} y ${kinRef(plr.id,mother.id)}.`,'family',[plr.id,father.id,mother.id],undefined,plr.id);
  } else {
    log(w,'Comienza tu historia',`${plr.firstName} ${plr.familyName} cumple 16 años y toma su lugar en las tierras de la familia, en ${WORLD_FLAVOR.villageName}, bajo el señorío de ${WORLD_FLAVOR.lordName}.`,'family',[plr.id]);
  }
  return w;
}

/* ---------- migración de saves v1 -> v2 (Parte 2) ----------
   v1: world.houses[id] = {id,name,memberIds,money,grainStores,propertyIds} (hacía de household)
   v2: world.houses = solo linaje; world.households = economía; personajes con houseId+householdId */
function migrateV1toV2(w){
  w.households = w.households || {};
  for(const houseId in (w.houses||{})){
    const oldHouse = w.houses[houseId];
    const hhId = uid();
    w.households[hhId] = {
      id:hhId, name:(oldHouse.name||'Hogar')+'stead', headId: w.playerId,
      memberIds:[...(oldHouse.memberIds||[])],
      money: oldHouse.money||0, grainStores: oldHouse.grainStores||0,
      propertyIds:[...(oldHouse.propertyIds||[])], createdYear: 516
    };
    for(const cid of (oldHouse.memberIds||[])){
      const c=w.characters[cid];
      if(c) c.householdId = hhId;
    }
    for(const pid in (w.properties||{})){
      const prop=w.properties[pid];
      if(prop.ownerHouseId===houseId){ prop.ownerHouseholdId=hhId; delete prop.ownerHouseId; }
    }
    for(const aid in (w.animals||{})){
      const a=w.animals[aid];
      if(a.ownerHouseId===houseId){ a.ownerHouseholdId=hhId; delete a.ownerHouseId; }
    }
    oldHouse.founderId = (oldHouse.memberIds && oldHouse.memberIds[0]) || null;
    oldHouse.createdYear = 516;
    oldHouse.titles = [];
    oldHouse.prestige = 30;
    delete oldHouse.money; delete oldHouse.grainStores; delete oldHouse.propertyIds;
  }
  const firstHH = Object.keys(w.households)[0];
  for(const cid in w.characters){
    const c=w.characters[cid];
    if(!c.householdId && firstHH) c.householdId=firstHH;
    if(c.npcProfessionAssigned===undefined) c.npcProfessionAssigned=false;
    if(c.marriedAge===undefined) c.marriedAge=null;
  }
  w.marriageCandidates = w.marriageCandidates || [];
  w.annualActionsUsed=0;
  w.annualActionsMax=3;
  w.summaryShown=false;
  w.schema_version=2;
  return w;
}

/* ---------- migración de saves v2 -> v3 (Parte 40) ----------
   IMPORTANTE: no se cambia retroactivamente la edad de nadie. Una partida v2 en la
   que el personaje tenía 35 años sigue teniendo 35 — solo las partidas NUEVAS nacen
   con 0 años. Esta migración solo añade campos que antes no existían. */
function migrateV2toV3(w){
  if(!w.campaignStartYear) w.campaignStartYear = (w.history && w.history.length) ? w.history[0].year : w.year;
  const chars=Object.values(w.characters||{});
  // apariencia coherente cuando es posible (dos pasadas para alcanzar cadenas padre->hijo->nieto)
  for(let pass=0; pass<2; pass++){
    for(const c of chars){
      if(c.appearance) continue;
      const father=c.fatherId?w.characters[c.fatherId]:null;
      const mother=c.motherId?w.characters[c.motherId]:null;
      if((father&&father.appearance)||(mother&&mother.appearance)) c.appearance=inheritAppearance(father,mother);
    }
  }
  for(const c of chars){
    if(!c.appearance) c.appearance=randomAppearance();
    if(!c.milestones) c.milestones=[];
    if(c.marriedAge===undefined) c.marriedAge=null;
  }
  (w.marriageCandidates||[]).forEach(c=>{ if(!c.appearance) c.appearance=randomAppearance(); });
  if(w.annualActionsMax===undefined) w.annualActionsMax=3;
  if(w.pendingMilestoneModals===undefined) w.pendingMilestoneModals=[];
  w.schema_version=3;
  return w;
}

/* ---------- migración de saves v3 -> v4 (Parte 57-61) ----------
   NO se toca edad, año, matrimonios, hijos, hogares, propiedades, dinero de hogar,
   historia ni apariencia existentes. Solo se añaden los campos nuevos de v4 y se
   completa la pequeña población persistente del pueblo que las partidas v3 no tenían. */
function migrateV3toV4(w){
  world = w; // varias funciones auxiliares (household(), C(), etc.) leen del global `world`
  const chars=Object.values(w.characters||{});
  for(const c of chars){
    if(c.personalMoney===undefined) c.personalMoney=0;
    if(!c.knownCharacterIds) c.knownCharacterIds=[];
    if(c.firstFriendId===undefined) c.firstFriendId=null;
    if(!c.skills) c.skills={farming:0,animal_husbandry:0};
    if(c.skills.craftsmanship===undefined) c.skills.craftsmanship=0;
    if(c.skills.commerce===undefined) c.skills.commerce=0;
    if(!c.career){
      // ojo: en load(), migrateV3toV4 corre ANTES de reattachGetters(), así que c.age
      // (el getter) todavía no existe aquí — hay que calcular la edad a mano.
      const ageNow = w.year - c.birthYear;
      const hadProfession = c.profession && ageNow>=16;
      c.career = hadProfession
        ? {professionId:c.profession, stage: ageNow>=30?'skilled':'worker', masterId:null,
           startedYear:(w.campaignStartYear||w.year), experience: ageNow>=30?70:40, annualEarnings:0}
        : {professionId:null, stage:'none', masterId:null, startedYear:null, experience:0, annualEarnings:0};
    }
  }
  for(const a of Object.values(w.animals||{})){
    if(!a.name){ const hh=w.households[a.ownerHouseholdId]; a.name = giveAnimalName(a.species, hh); }
  }
  // Parte 60: los candidatos de matrimonio embebidos (v3) se convierten en personajes reales persistentes
  if(Array.isArray(w.marriageCandidates) && w.marriageCandidates.length && typeof w.marriageCandidates[0]==='object'){
    const ids=[];
    for(const cand of w.marriageCandidates){
      if(!w.characters[cand.id]){
        if(cand.personalMoney===undefined) cand.personalMoney=0;
        if(!cand.knownCharacterIds) cand.knownCharacterIds=[];
        if(cand.firstFriendId===undefined) cand.firstFriendId=null;
        if(!cand.skills) cand.skills={farming:0,animal_husbandry:0};
        if(cand.skills.craftsmanship===undefined) cand.skills.craftsmanship=0;
        if(cand.skills.commerce===undefined) cand.skills.commerce=0;
        if(!cand.career) cand.career={professionId:null,stage:'none',masterId:null,startedYear:null,experience:0,annualEarnings:0};
        w.characters[cand.id]=cand;
        if(!cand.householdId){
          const hhId=uid();
          w.households[hhId]={id:hhId,name:'Casa de '+cand.firstName+' '+cand.familyName, headId:cand.id, memberIds:[cand.id],
            money:rand(1,4), grainStores:rand(1,4), propertyIds:[], createdYear:w.year};
          cand.householdId=hhId;
        }
        assignNpcCareer(cand);
      }
      ids.push(cand.id);
    }
    w.marriageCandidates=ids;
    const p=w.characters[w.playerId];
    if(p){ p.knownCharacterIds=p.knownCharacterIds||[]; ids.forEach(id=>{ if(!p.knownCharacterIds.includes(id)) p.knownCharacterIds.push(id); }); }
  } else if(!Array.isArray(w.marriageCandidates)){
    w.marriageCandidates=[];
  }
  if(!w.flags) w.flags={};
  // Parte 61: población persistente mínima del pueblo, generada una sola vez, sin tocar la familia existente
  if(!w.flags.villageGenerated){ generateVillageResidents(w); w.flags.villageGenerated=true; }
  w.schema_version=4;
  return w;
}

/* ---------- migración de saves v4 -> v5 (Parte 72): atributos, nobleza, hacienda, nav nuevo ----------
   Estrictamente aditiva, igual que las anteriores. c.age (getter) todavía no existe aquí. */
function migrateV4toV5(w){
  world = w;
  for(const c of Object.values(w.characters||{})){
    if(c.charm===undefined) c.charm=rand(20,40);
    if(c.wits===undefined) c.wits=rand(20,40);
    if(c.faith===undefined) c.faith=rand(20,40);
    if(c.ambition===undefined) c.ambition=null;
  }
  for(const h of Object.values(w.houses||{})){
    if(h.prestige===undefined || h.prestige>200) h.prestige=rand(10,30); // reescala v4 (0-100) a v5 (0-1000)
    if(!h.titles) h.titles=[];
  }
  for(const hh of Object.values(w.households||{})){
    if(hh.security===undefined) hh.security=rand(30,50);
    if(hh.loyalty===undefined) hh.loyalty=rand(30,50);
  }
  w.schema_version=5;
  return w;
}
/* v4 usaba otros nombres de pestaña; v5 tiene el nuevo nav de 6 pantallas (Parte 72) */
const TAB_NAME_V4_TO_V5={personaje:'yo', familia:'gente', relaciones:'gente', trabajo:'hacer', propiedades:'hacienda', mundo:'vida', historia:'vida'};

/* ---------- migración de saves v5 -> v6 (Fase "A ver qué pasa este año") ----------
   Estrictamente aditiva, igual que las anteriores: no se toca personaje, matrimonio,
   descendencia, hogar, dinero, propiedad, relación, historia, feed, carrera ni prestigio
   existente. Solo se añade el estado nuevo de esta fase: seed/estado del RNG, hilos de
   historia (storyThreads), favores positivos, la región de nacimiento (arquitectura de
   postales) y un par de campos de seguridad para datos que ya existían pero podían faltar
   en saves muy viejos (salud de un animal, orden de hacienda del año). */
function migrateV5toV6(w){
  world = w;
  if(w.rngSeed===undefined) w.rngSeed=randomSeed32();
  if(w.rngState===undefined) w.rngState=w.rngSeed;
  if(!Array.isArray(w.storyThreads)) w.storyThreads=[];
  if(!w.flags) w.flags={};
  if(!w.flags.favors) w.flags.favors={};
  if(!w.regionKey) w.regionKey='fenwold'; // toda partida anterior a esta fase vivía en Wistleigh/Fenwold
  for(const a of Object.values(w.animals||{})){
    if(a.health===undefined) a.health=rand(60,90);
  }
  for(const hh of Object.values(w.households||{})){
    if(hh.estateOrderYear===undefined) hh.estateOrderYear=null;
    if(hh.highStreak===undefined) hh.highStreak=0;
    if(hh.lowStreak===undefined) hh.lowStreak=0;
  }
  w.schema_version=6;
  return w;
}

/* ---------- historia (Parte 17: solo lo relevante entra aquí; lo menor va solo a lastTurnLog) ---------- */
function log(w,title,desc,tag,related=[],kind,mainCharId=null){
  // mainCharId (opcional, §2/§3/§7): quién es el protagonista real de este suceso, para poder
  // mostrar su retrato en el feed sin adivinar a partir de `related` (que a veces lista primero
  // a otra persona, p. ej. un nacimiento lista al padre antes que al bebé).
  const entry={year:w.year, title, desc, tag, related, kind: kind||title, mainCharId};
  w.history.push(entry);
  return entry;
}
/* ---------- feed persistente (mejora de diseño 2026-09 #6): el Resumen anual dejó de ser un
   modal obligatorio — esta lista es lo que alimenta la pantalla Vida, acumulando entradas de
   varios años (a diferencia de lastTurnLog, que un año nuevo sobreescribe). También cuenta
   cuántas veces se repitió cada "kind" para poder ir mostrando cada vez menos texto sobre lo
   que ya es familiar (SIMULAR MUCHO, MOSTRAR POCO, aplicado con el tiempo y no solo de entrada). */
function pushFeed(w, entry){
  if(!entry) return;
  w.flags.seenKinds = w.flags.seenKinds || {};
  const k=entry.kind||entry.title;
  w.flags.seenKinds[k] = (w.flags.seenKinds[k]||0)+1;
  entry.seenCount = w.flags.seenKinds[k]; // cuántas veces ya se vio ESTE tipo, al momento de ocurrir
  w.feed = w.feed || [];
  w.feed.push(entry);
  if(w.feed.length>80) w.feed.splice(0, w.feed.length-80);
  return entry;
}
/* atajo: lo que el jugador hace por su cuenta (Hacer, Gente, Hacienda...) siempre importa —
   nunca hace falta el filtrado de isNoteworthyToPlayer para una acción que el jugador mismo eligió. */
function plog(w,title,desc,tag,related,kind,mainCharId){ return pushFeed(w, log(w,title,desc,tag,related,kind,mainCharId)); }
/* ---------- reducción de ruido (mejora de diseño, sesión 2026-09): el mundo entero sigue
   simulándose (world.history conserva TODO para el linaje/árbol), pero el jugador solo debe
   LEER lo que le importa a él. Nacimientos/matrimonios/independencias de aldeanos que nunca
   conoció NO deben aparecer en turnLog (lo que alimenta el Resumen y "Sucesos recientes"). */
function isNoteworthyToPlayer(w, id){
  if(!id) return false;
  if(id===w.playerId) return true;
  if(isCloseFamily(w.playerId, id)) return true;
  const p=player(w);
  return !!(p && p.knownCharacterIds && p.knownCharacterIds.includes(id));
}
/* ---------- cooldowns de eventos (mejora de diseño, sesión 2026-09): evita que el mismo
   evento genérico ("fiesta del pueblo", "te tuerces el tobillo"...) se repita palabra por
   palabra año tras año. No aplica a eventos que nacen de un estado real (mala cosecha),
   esos ya varían solo por ser consecuencia directa de lo que pasó. */
function eventOnCooldown(w, id, minGap){
  if(!minGap) return false;
  const last=(w.flags.eventCooldowns||{})[id];
  return last!=null && (w.year-last)<minGap;
}
function markEventUsed(w, id){
  w.flags.eventCooldowns = w.flags.eventCooldowns||{};
  w.flags.eventCooldowns[id]=w.year;
}

/* ---------- rencores y favores pendientes (mejora de diseño, sesión 2026-09 #2) ----------
   "Vendí la única vaca y dos años después hubo una hambruna" — para que una decisión pueda
   volver más adelante, tiene que estar atada a un PERSONAJE real, no a "el vecino" abstracto.
   Este ledger vive en world.flags y se apoya en el sistema de relaciones que ya existía. */
function addGrudge(w, charId){ if(!charId) return; w.flags.grudges=w.flags.grudges||{}; w.flags.grudges[charId]=w.year; }
function clearGrudge(w, charId){ if(w.flags.grudges) delete w.flags.grudges[charId]; }
function grudgeAge(w, charId){ const y=w.flags.grudges&&w.flags.grudges[charId]; return y==null?null:(w.year-y); }
function addDebt(w, charId){ if(!charId) return; w.flags.debts=w.flags.debts||{}; w.flags.debts[charId]=(w.flags.debts[charId]||0)+1; }
function clearDebt(w, charId){ if(w.flags.debts) delete w.flags.debts[charId]; }
function debtorIds(w){ return Object.keys(w.flags.debts||{}).filter(id=>w.flags.debts[id]>0); }
/* ---------- favores positivos (§6C): el espejo bueno de grudges/debts ----------
   grudges/debts ya existían y son cosas que TÚ debes o que alguien te guarda en tu contra.
   Faltaba el favor bueno: alguien a quien ayudaste y que, más adelante, puede devolvértelo
   por su cuenta — no una deuda que tú tengas que pagar, sino una que otro recuerda. */
function addFavor(w, charId){ if(!charId) return; w.flags.favors=w.flags.favors||{}; w.flags.favors[charId]=w.year; }
function clearFavor(w, charId){ if(w.flags.favors) delete w.flags.favors[charId]; }
function favorAge(w, charId){ const y=w.flags.favors&&w.flags.favors[charId]; return y==null?null:(w.year-y); }
function favorIds(w){ return Object.keys(w.flags.favors||{}); }

/* ---------- StoryThreads (Fase "A ver qué pasa este año", sección 3) ----------
   Generaliza la filosofía que ya usaban grudges/debts/cooldowns: "algo empezó y puede volver
   a importar más adelante". Un hilo NO es un evento aislado — es una situación con actores
   reales que puede avanzar de etapa en etapa a lo largo de los años, sobrevive guardar/cargar
   (vive en world.storyThreads, se serializa con el resto de la partida), cambiar de personaje
   jugable (no depende del jugador, depende de sus actores) y la muerte del protagonista, y
   puede seguir teniendo sentido incluso entre generaciones si sus actores originales ya no
   viven (cada continuación decide si eso lo cierra o lo hace pivotar a un descendiente). */
function createStoryThread(w, type, {actorIds=[], relatedHouseholdIds=[], relatedHouseIds=[], stage=0, data={}}={}){
  const t = {id:uid(), type, status:'active', createdYear:w.year, lastTouchedYear:w.year, resolvedYear:null,
    actorIds, relatedHouseholdIds, relatedHouseIds, stage, data};
  w.storyThreads.push(t);
  return t;
}
function getActiveStoryThreads(w, type){
  return w.storyThreads.filter(t=>t.status==='active' && (!type || t.type===type));
}
function findStoryThread(w, type, pred){
  return w.storyThreads.find(t=>t.status==='active' && t.type===type && (!pred || pred(t)));
}
function advanceStoryThread(w, t, {stage, data, year}={}){
  if(stage!==undefined) t.stage=stage;
  if(data) t.data=Object.assign({}, t.data, data);
  t.lastTouchedYear = year!==undefined ? year : w.year;
  return t;
}
function resolveStoryThread(w, t, year){ t.status='resolved'; t.resolvedYear = year!==undefined?year:w.year; return t; }
function threadAge(w, t){ return w.year - t.lastTouchedYear; }
/* limpieza defensiva: un hilo cuyo actor principal ya no existe en absoluto (no debería pasar,
   los personajes no se borran nunca, solo mueren) se cancela para no quedar colgando para siempre */
function cancelInvalidStoryThreads(w){
  for(const t of w.storyThreads){
    if(t.status!=='active') continue;
    if(t.actorIds.length && !t.actorIds.some(id=>w.characters[id])) resolveStoryThread(w,t);
  }
}
/* alguien real del pueblo con quien tener una disputa/un favor — prioriza gente que el
   jugador ya conoce (más peso narrativo), y si no conoce a nadie más, presenta a alguien
   nuevo que se vuelve su vecino/a de ahí en adelante (nunca un personaje "de usar y tirar"). */
function getOrIntroduceNeighbor(w,p){
  const known=getKnownPeople(p).others.filter(c=>c.alive);
  if(known.length && chance(0.7)) return pick(known);
  const pool=Object.values(w.characters).filter(c=>c.alive && c.id!==p.id && c.age>=16 &&
    !isCloseFamily(p.id,c.id) && !(p.knownCharacterIds||[]).includes(c.id));
  const person = pool.length? pick(pool) : spawnVillageAdult(w, pick(['M','F']), rand(20,55), namesKnownTo(p));
  introduceCharacter(p, person);
  return person;
}

/* ---------- AgricultureSystem (siempre sobre el hogar del jugador) ---------- */
function resolveAgriculture(w, turnLog){
  const hh=household(w);
  for(const prop of propertiesOf(hh)){
    if(prop.sownCrop!=='wheat') { prop.landQuality=clamp(prop.landQuality+1,0,100); continue; }
    const p=player(w);
    // Parte 15: la cosecha depende de los ADULTOS que trabajan el hogar, no del skill de un niño jugado
    const farmSkill = getHouseholdFarmSkill(hh);
    const quality = clamp(prop.landQuality*0.5 + farmSkill*0.3 + rand(-20,20), 0, 100);
    const yieldAmt = Math.max(0, Math.round(CROP.base*(quality/100)));
    hh.grainStores += yieldAmt;
    if(p.age>=9) p.skills.farming = clamp(p.skills.farming + rand(0,1), 0, 100); // ayudar de niño enseña, poco a poco
    if(quality<28){
      w.eventQueueSpecial = w.eventQueueSpecial||[];
      w.eventQueueSpecial.push(makeMalaCosechaEvent(w,p,yieldAmt));
    } else if(quality>=78){
      turnLog.push(log(w,'Cosecha excelente',`El trigo creció espléndido este año; recogiste ${yieldAmt} sacos de grano.`,'agricultura'));
      p.health=clamp(p.health+1,0,100);
    } else {
      /* mejora de diseño (2026-09): una cosecha normal es mantenimiento, no una noticia — se
         registra en la Crónica completa (progressive disclosure) pero ya no interrumpe el
         Resumen del año. Las cosechas EXCELENTE/MALA sí siguen siendo notables arriba/abajo. */
      log(w,'Cosecha del año',`La cosecha de trigo rindió ${yieldAmt} sacos de grano, guardados en el granero.`,'agricultura');
    }
  }
}
function makeMalaCosechaEvent(w,p,yieldAmt){
  /* mejora de diseño (sesión 2 — "decisiones que regresan"): pedir ayuda ya no es a
     "un vecino" abstracto — es a un personaje real que puede acordarse de ese favor
     más adelante (ver buildDebtCalledEvent). */
  const neighbor=getOrIntroduceNeighbor(w,p);
  return {id:'mala_cosecha', interactive:true, portraitId:neighbor.id,
    text:pick([
      `La cosecha de este año ha sido mala — apenas ${yieldAmt} sacos de grano. El invierno podría ser difícil.`,
      `El trigo no rindió lo esperado: solo ${yieldAmt} sacos. Habrá que apretarse el cinturón.`,
      `Una plaga de gorgojos arruinó parte de la cosecha: apenas ${yieldAmt} sacos se salvaron.`
    ]),
    options:[
      {label:'Guardar el grano y racionar', desc:'seguro, sin ganancias',
        effect:(w,p)=> log(w,'Racionamiento','Decidiste guardar cada saco de grano y racionar las comidas del invierno.','agricultura',[p.id])},
      {label:'Vender antes de que baje más la calidad', desc:'+monedas, menos grano guardado',
        effect:(w,p)=>{ const hh=household(w); const sell=Math.min(hh.grainStores,6); hh.grainStores-=sell; hh.money+=Math.round(sell*1.1);
          return log(w,'Venta apresurada','Vendiste parte del grano restante antes de que perdiera valor.','agricultura',[p.id]);}},
      {label:`Pedir ayuda a ${neighbor.firstName}`, desc:'riesgo social, posible grano extra (más fácil si sabes cómo pedirlo) — pero quedarías en deuda',
        effect:(w,p)=>{ if(witsCheck(p,0.3)){ household(w).grainStores+=rand(4,9); addDebt(w,neighbor.id);
            const text = isWitty(p)
              ? `Supiste exactamente cómo plantearlo, y ${neighbor.firstName} compartió parte de su propio grano contigo. Algún día te lo recordará.`
              : `${neighbor.firstName}, ${genderText('apiadado/a',neighbor.sex)}, compartió parte de su propio grano contigo. Algún día te lo recordará.`;
            return log(w,'Ayuda vecinal',text,'agricultura',[p.id,neighbor.id]); }
          else { p.reputation=clamp(p.reputation-3,0,100); bumpRelationship(w,p.id,neighbor.id,-2);
            return log(w,'Petición rechazada',`Le pediste ayuda a ${neighbor.firstName}, pero con lo suyo escaso, se negó. La vergüenza pesa.`,'agricultura',[p.id,neighbor.id]); } }},
      {label:'Sacrificar un animal para reducir el consumo', desc:'-1 animal, +monedas/comida',
        effect:(w,p)=>{ const hh=household(w); const list=animalsOf(hh); if(list.length){ const a=pick(list); a.alive=false; hh.money+=6;
            return log(w,'Sacrificio necesario',`Sacrificaste a ${animalName(a)} para aliviar el granero.`,'ganado',[p.id]); }
          return log(w,'Sin animales que sacrificar','No quedaba ganado que sacrificar; apretaste el cinturón.','ganado',[p.id]);}}
    ]};
}

/* ---------- LivestockSystem (siempre sobre el hogar del jugador) ---------- */
function animalName(a){ return a.name || giveAnimalName(a.species, world.households[a.ownerHouseholdId]); }
function markPlagueRisk(w,extra){ w.flags.plagueRisk=(w.flags.plagueRisk||0)+extra; }
/* §2.5: a.health se veía en Hacienda pero no afectaba a nada — ahora sí decide mortalidad,
   reproducción y cómo golpea una plaga. Se mantiene ligero: nada de "simulador veterinario",
   solo que un animal sano viva y críe mejor que uno débil, y que la plaga pese más sobre
   quienes ya estaban mal. */
function resolveLivestock(w, turnLog){
  const hh=household(w);
  let births=0, deaths=0, income=0;
  const risk=w.flags.plagueRisk||0; w.flags.plagueRisk=0;
  const prosperity=getHoldingResources(hh).prosperity;
  for(const a of animalsOf(hh)){
    const age=w.year-a.birthYear;
    income += ANIMAL_TYPES[a.species].income;
    // deriva anual de salud: una hacienda próspera cuida mejor a su ganado; una plaga en curso lo enferma
    a.health = clamp((a.health===undefined?rand(60,90):a.health) + rand(-3,2) + (prosperity>=60?1:(prosperity<25?-2:0)) - Math.round(risk*20), 0, 100);
    const healthPenalty = a.health<30 ? 0.14 : (a.health<55 ? 0.05 : 0);
    const deathChance = 0.02 + (age>8?0.05:0) + risk + healthPenalty;
    if(chance(deathChance)){ a.alive=false; deaths++; continue; }
    const healthFertility = a.health<35 ? 0.4 : (a.health<55 ? 0.75 : 1);
    if(a.sex==='F' && age>=1 && chance((a.species==='chicken'?0.35:(a.species==='sheep'?0.3:0.18))*healthFertility)){
      const twins = a.species==='sheep' && chance(0.15);
      const n = twins?2:1;
      for(let i=0;i<n;i++){
        const id=uid();
        w.animals[id]={id,species:a.species, sex:pick(['M','F']), birthYear:w.year, alive:true, health:rand(60,90), ownerHouseholdId:hh.id, name: giveAnimalName(a.species, hh)};
      }
      births+=n;
    }
  }
  hh.money += income;
  /* mejora de diseño (2026-09): el goteo rutinario del ganado (nace algo, muere algo, se vende
     leche) queda registrado siempre en la Crónica, pero solo entra al Resumen/feed inmediato
     cuando el número es realmente notable — el dinero y el grano ya se ven siempre en Hacienda. */
  if(births>0){ const e=log(w,'Nuevas crías',`El rebaño y el corral crecieron: ${births} nueva(s) cría(s) este año.`,'ganado'); if(births>=3) turnLog.push(e); }
  if(deaths>0){ const e=log(w,'Pérdidas en el ganado',`${deaths} animal(es) murieron este año por vejez o enfermedad.`,'ganado'); if(deaths>=2) turnLog.push(e); }
  if(income>0) log(w,'Venta de leche, lana y huevos',`El ganado y las aves produjeron bienes vendidos por ${income} monedas.`,'ganado');

  let culled=0, culledIncome=0;
  for(const sp of Object.keys(ANIMAL_TYPES)){
    const list = animalsOf(hh).filter(a=>a.species===sp).sort((a,b)=>b.birthYear-a.birthYear);
    const cap = ANIMAL_TYPES[sp].cap;
    for(let i=cap;i<list.length;i++){ list[i].alive=false; culledIncome+=ANIMAL_TYPES[sp].sell; culled++; }
  }
  if(culled>0){
    hh.money+=culledIncome;
    const e=log(w,'Venta de excedente',`La granja no daba para más animales de los que ya tenías: vendiste ${culled} en el mercado por ${culledIncome} monedas.`,'ganado');
    if(culled>=3) turnLog.push(e);
  }
}

/* ---------- desarrollo infantil (Partes 10-11: el aprendizaje llega por etapas) ---------- */
function resolveChildDevelopment(w){
  for(const c of Object.values(w.characters)){
    if(!c.alive) continue;
    if(c.age>=6 && c.age<=8){
      c.skills.animal_husbandry = clamp(c.skills.animal_husbandry+rand(0,1),0,100);
    } else if(c.age>=9 && c.age<=11){
      c.skills.farming = clamp(c.skills.farming+rand(0,1),0,100);
      c.skills.animal_husbandry = clamp(c.skills.animal_husbandry+rand(0,1),0,100);
    } else if(c.age>=12 && c.age<=15){
      c.skills.farming = clamp(c.skills.farming+rand(0,2),0,100);
      c.skills.animal_husbandry = clamp(c.skills.animal_husbandry+rand(0,2),0,100);
    }
  }
}

/* ---------- hitos de vida (Parte 32, 36-38): momentos one-shot que construyen biografía.
   Nota: "first_profession" YA NO es automático al cumplir 16 (Parte 33) — el oficio real
   se registra desde donde de verdad ocurre (aprendizaje, tierras familiares, jornal), vía
   triggerMilestone('first_real_profession', ...) llamado desde esos puntos concretos. ---------- */
const MILESTONE_DEFS=[
  {key:'first_steps', age:1, minor:true, icon:'🚶', title:'Primeros pasos', text:(p)=>`Das tus primeros pasos.`},
  {key:'first_words', age:2, minor:true, icon:'🗣️', title:'Primeras palabras', text:(p)=>`Empiezas a decir tus primeras palabras.`},

  {key:'first_walk_alone', age:13, minor:true, icon:'🏘️', title:'Sin compañía', text:(p)=>`Recorres el pueblo por primera vez sin compañía.`},
  {key:'first_animal_chore', age:7, minor:false, icon:'🐑', title:'Una nueva responsabilidad',
    modalText:(w,p)=>{ const parentId=p.fatherId||p.motherId;
      return (parentId? kinRef(p.id,parentId)+' considera':'Tu familia considera')+' que ya eres suficientemente mayor para ayudar con los animales.###Desde ahora puedes participar en algunas tareas de la granja.'; },
    buttonLabel:'Ayudaré'},
  {key:'first_harvest_help', age:10, minor:false, icon:'🌾', title:'El campo',
    modalText:()=>'Por primera vez te dejan participar seriamente durante la cosecha.###Has desbloqueado nuevas tareas de trabajo.',
    buttonLabel:'Participar'},
  {key:'value_of_things', age:15, minor:false, icon:'🪙', title:'El valor de las cosas',

    buttonLabel:'Entendido'}
