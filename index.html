/* ---------- SaveSystem (Parte 2: migración v1 -> v2) ---------- */
function save(){
  try{
    captureRngState(world);
    const data = JSON.stringify({world, ui:{activeTab:ui.activeTab}});
    localStorage.setItem('libro_de_linaje_save', data);
    ui.lastSaved = Date.now();
  }catch(e){ /* almacenamiento no disponible: continuar sin guardar */ }
}
function reattachGetters(w){
  Object.values(w.characters).forEach(c=>{
    Object.defineProperty(c,'age',{get(){return world.year-this.birthYear;}, configurable:true});
  });
  // v4: world.marriageCandidates guarda IDs (string), no objetos embebidos — su getter de edad
  // ya vive en w.characters, reasignado arriba.
}
/* cadena de migraciones, compartida por load() (localStorage) e importSave() (archivo externo) */
function runMigrations(w){
  if(!w.schema_version || w.schema_version<2){ world=w; w = migrateV1toV2(w); }
  if(w.schema_version<3){ world=w; w = migrateV2toV3(w); }
  if(w.schema_version<4){ world=w; w = migrateV3toV4(w); }
  if(w.schema_version<5){ world=w; w = migrateV4toV5(w); }
  if(w.schema_version<6){ world=w; w = migrateV5toV6(w); }
  return w;
}
function load(){
  try{
    const raw = localStorage.getItem('libro_de_linaje_save');
    if(!raw) return false;
    const data = JSON.parse(raw);
    let w = runMigrations(data.world);
    world = w;
    seedRngFor(world); // reanuda la secuencia exacta donde quedó esta partida (o le da una seed nueva si nunca tuvo)
    if(data.ui && data.ui.activeTab) ui.activeTab=TAB_NAME_V4_TO_V5[data.ui.activeTab] || data.ui.activeTab;
    reattachGetters(world);
    return true;
  }catch(e){ return false; }
}

/* ---------- Exportar / Importar partida (§2.7): backup local robusto, sin backend ni nube.
   Heirloom está pensado para campañas de siglos — no debería depender solo de localStorage. ---------- */
function exportSave(){
  try{
    captureRngState(world);
    const payload = {app:'libro_de_linaje', exportedAt:new Date().toISOString(), schema_version:world.schema_version, world};
    const json = JSON.stringify(payload);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const p = player(world);
    const nameBit = (p? (p.firstName+'-'+p.familyName) : 'partida').toLowerCase().replace(/[^a-z0-9-]+/g,'-');
    const a = document.createElement('a');
    a.href=url; a.download = `libro-de-linaje-${nameBit}-anio${world.year}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    ui.modal.exportMessage = 'Partida exportada. Guarda el archivo en un lugar seguro.';
  }catch(e){ ui.modal.exportMessage = 'No se pudo exportar la partida.'; }
  render();
}
/* rechaza archivos obviamente inválidos ANTES de tocar el estado del juego (§2.7) */
function validateImportedPayload(data){
  if(!data || typeof data!=='object') return 'El archivo no es una partida válida.';
  const w = data.world || data; // admite tanto el formato exportado como un world.json pelado
  if(!w || typeof w!=='object') return 'El archivo no contiene una partida.';
  if(typeof w.year!=='number') return 'Falta el año de la partida; el archivo parece dañado.';
  if(!w.characters || typeof w.characters!=='object' || !Object.keys(w.characters).length) return 'El archivo no tiene personajes; no parece una partida de Libro de Linaje.';
  if(!w.playerId || !w.characters[w.playerId]) return 'El archivo no identifica a un personaje jugable válido.';
  if(!w.houses || !w.households) return 'Faltan datos de linaje u hogar; el archivo parece incompleto.';
  return null; // válido
}
function beginImportFlow(){ document.getElementById('importFileInput').click(); }
function handleImportFileChosen(e){
  const file = e.target.files && e.target.files[0];
  e.target.value=''; // permite volver a elegir el mismo archivo más adelante
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(err){ ui.modal={type:'settings', importError:'El archivo no es un JSON válido.'}; render(); return; }
    const err = validateImportedPayload(data);
    if(err){ ui.modal={type:'settings', importError:err}; render(); return; }
    const w = data.world || data;
    const p = w.characters[w.playerId];
    ui.modal={type:'settings', importPending:{raw:data, preview:{
      year:w.year, playerName:(p.firstName+' '+p.familyName), age:(w.year-p.birthYear),
      chars:Object.keys(w.characters).length, schema:w.schema_version||1
    }}};
    render();
  };
  reader.onerror = () => { ui.modal={type:'settings', importError:'No se pudo leer el archivo.'}; render(); };
  reader.readAsText(file);
}
function confirmImport(){
  if(!ui.modal || !ui.modal.importPending) return;
  const raw = ui.modal.importPending.raw;
  const w = raw.world || raw;
  const migrated = runMigrations(w);
  world = migrated;
  seedRngFor(world);
  reattachGetters(world);
  save();
  ui.modal=null; ui.activeTab='yo';
  render();
}
function cancelImport(){ ui.modal={type:'settings'}; render(); }

/* ---------- herramientas de depuración (Parte 25) ---------- */
function maxGenerationDepth(){
  const chars=world.characters;
  const memo={};
  function depth(id){
    if(memo[id]!==undefined) return memo[id];
    memo[id]=0; // evita ciclos accidentales durante el cálculo
    const c=chars[id];
    if(!c || (!c.fatherId && !c.motherId)) return memo[id]=0;
    const df = c.fatherId && chars[c.fatherId] ? depth(c.fatherId)+1 : 0;
    const dm = c.motherId && chars[c.motherId] ? depth(c.motherId)+1 : 0;
    return memo[id]=Math.max(df,dm);
  }
  let max=0;
  for(const id in chars) max=Math.max(max, depth(id));
  return max;
}
function validateWorld(){
  const errors=[];
  const chars=world.characters;
  for(const c of Object.values(chars)){
    if(c.fatherId && !chars[c.fatherId]) errors.push(`Character ${c.id} (${c.firstName}) references missing father ${c.fatherId}`);
    if(c.motherId && !chars[c.motherId]) errors.push(`Character ${c.id} (${c.firstName}) references missing mother ${c.motherId}`);
    if(c.id===c.spouseId) errors.push(`Character ${c.id} is married to themselves`);
    if(c.spouseId){
      if(!chars[c.spouseId]) errors.push(`Character ${c.id} references missing spouse ${c.spouseId}`);
      // un cónyuge fallecido conserva el puntero histórico aunque el viudo/a se case de nuevo:
      // eso es correcto (no es un bug), así que solo exigimos reciprocidad desde el lado de los vivos.
      else if(c.alive && chars[c.spouseId].spouseId!==c.id) errors.push(`Spouse relation is not reciprocal for ${c.id} <-> ${c.spouseId}`);
    }
    for(const cid of c.childrenIds){
      const kid=chars[cid];
      if(!kid) errors.push(`Character ${c.id} references missing child ${cid}`);
      else if(kid.fatherId!==c.id && kid.motherId!==c.id) errors.push(`Child relation is not reciprocal for ${c.id} -> ${cid}`);
    }
    for(const sid of c.siblingIds){
      const sib=chars[sid];
      if(!sib) errors.push(`Character ${c.id} references missing sibling ${sid}`);
      else if(!sib.siblingIds.includes(c.id)) errors.push(`Sibling relation is not reciprocal for ${c.id} <-> ${sid}`);
    }
    if(c.householdId && !world.households[c.householdId]) errors.push(`Character ${c.id} references missing household ${c.householdId}`);
    if(c.houseId && !world.houses[c.houseId]) errors.push(`Character ${c.id} references missing house/lineage ${c.houseId}`);
    // v4: registro de carreras/conocidos/dinero (Parte 66)
    if(c.career){
      if(c.career.professionId && !PROFESSIONS[c.career.professionId]) errors.push(`Character ${c.id} has invalid career.professionId ${c.career.professionId}`);
      if(c.career.masterId && !chars[c.career.masterId]) errors.push(`Character ${c.id} references missing master ${c.career.masterId}`);
    }
    if(c.knownCharacterIds){
      for(const kid of c.knownCharacterIds) if(!chars[kid]) errors.push(`Character ${c.id} has unknown reference in knownCharacterIds: ${kid}`);
    }
    if(c.personalMoney!==undefined && (typeof c.personalMoney!=='number' || isNaN(c.personalMoney))) errors.push(`Character ${c.id} has invalid personalMoney`);
  }
  for(const hh of Object.values(world.households)){
    for(const mid of hh.memberIds) if(!chars[mid]) errors.push(`Household ${hh.id} references missing member ${mid}`);
    for(const pid of hh.propertyIds) if(!world.properties[pid]) errors.push(`Household ${hh.id} references missing property ${pid}`);
    if(typeof hh.money!=='number' || isNaN(hh.money)) errors.push(`Household ${hh.id} has invalid money`);
  }
  for(const a of Object.values(world.animals)){
    if(a.alive && !world.households[a.ownerHouseholdId]) errors.push(`Animal ${a.id} belongs to missing household ${a.ownerHouseholdId}`);
    if(a.alive && !a.name) errors.push(`Animal ${a.id} has no name`);
  }
  for(const p of Object.values(world.properties)){
    if(!world.households[p.ownerHouseholdId]) errors.push(`Property ${p.id} has no valid owning household ${p.ownerHouseholdId}`);
  }
  if(!Array.isArray(world.marriageCandidates) || world.marriageCandidates.some(id=>typeof id!=='string')) errors.push('world.marriageCandidates should be an array of character ids (v4)');
  if(errors.length){ console.log(errors.length+' problema(s) encontrados:'); errors.forEach(e=>console.log(' - '+e)); }
  else { console.log('validateWorld: sin problemas.'); }
  return errors;
}
function simulateYears(n){
  const startYear=world.year;
  for(let i=0;i<n;i++){
    advanceYear();
    let guard=0;
    while(ui.modal && guard++<25){
      if(ui.modal.type==='event'){ doResolveEventOption(ui.modal.event.options[0]); }
      else if(ui.modal.type==='death'){ ui.modal={type:'chooseHeir', deadId:ui.modal.charId}; render(); }
      else if(ui.modal.type==='chooseHeir'){
        const list=eligibleHeirs(C(ui.modal.deadId));
        if(list.length){ doChooseNext(list[0].id); }
        else {
          const oldHistory=world.history, oldYear=world.year, oldThreads=world.storyThreads;
          const fresh=generateInitialWorld({startYear:oldYear, playerAge:16, carryOn:true});
          fresh.history=[...oldHistory,...fresh.history];
          fresh.storyThreads=[...(oldThreads||[])];
          world=fresh; ui.modal=null; save(); render();
        }
      } else { ui.modal=null; advanceModalQueue(); } // summary/milestone/birthIntro/charDetail: avanza la cola sola
    }
  }
  const chars=Object.values(world.characters);
  const stats={
    aniosSimulados:n, anioInicial:startYear, anioFinal:world.year,
    personajesCreados: chars.length,
    vivos: chars.filter(c=>c.alive).length,
    muertos: chars.filter(c=>!c.alive).length,
    matrimonios: Math.round(chars.filter(c=>c.spouseId).length/2),
    nacimientosRegistrados: world.history.filter(h=>h.title==='Nació un hijo'||h.title==='Nació una hija'||h.title==='Naces').length,
    households: Object.keys(world.households).length,
    lineages: Object.keys(world.houses).length,
    generacionesMax: maxGenerationDepth()
  };
  console.log('simulateYears('+n+') completado:');
  if(console.table) console.table([stats]); else console.log(stats);
  return stats;
}
window.simulateYears = simulateYears;
window.validateWorld = validateWorld;

function debugCapabilities(){

/* ================= RENDER ================= */
/* =========================================================
   CAPA VISUAL v5 — pixel-art, 6 pantallas, sin emojis (Parte 72)
   Todo icono es o bien un tile real (personaje/moneda/corazón/cruz/flor,
   TILE_B64) o un bloque .slot marcado con data-icon="categoría:clave",
   a la espera de su asset — ver la lista pendiente en ARCHITECTURE.md.
   ========================================================= */
function tileImg(key, cls=''){ return `<img class="pixel ${cls}" src="data:image/png;base64,${TILE_B64[key]}" alt="">`; }
function slotIcon(dataIcon, cls=''){ return `<span class="slot ${cls}" data-icon="${dataIcon}"></span>`; }
function icon(key, dataIcon, cls=''){ return (key && TILE_B64[key]) ? tileImg(key,cls) : slotIcon(dataIcon||key||'icon', cls); }
/* §10 (sesión "cambios varios"): antes TODA cantidad de dinero (de un campesino o de un
   hogar noble por igual) se mostraba con el mismo ícono de moneda de oro — raro para la bolsa de
   un campesino. Ahora el dinero se desglosa en cobre/plata/oro (patrón histórico inglés:
   12 peniques de cobre = 1 chelín de plata, 20 chelines de plata = 1 libra de oro), así que en la
   práctica casi toda la economía campesina del juego se ve y se cuenta en cobre y plata, y el oro
   solo aparece para fortunas grandes. El número interno de "monedas" no cambia (sigue siendo el
   mismo que ya equilibraba precios y umbrales); esto es solo la capa de presentación.
   Las imágenes reales (assets/coins/{copper,silver,gold}.png) las pondrá el usuario después — hasta
   entonces cada denominación cae de vuelta al tile genérico de moneda ya incluido, con un tinte
   distinto para poder distinguirlas mientras tanto. */
const COPPER_PER_SILVER = 12, SILVER_PER_GOLD = 20;
const COIN_LABEL = {copper:'cobre', silver:'plata', gold:'oro'};
function coinFallback(img, denom){ img.onerror=null; img.src='data:image/png;base64,'+TILE_B64.coin; img.classList.add('coin-fallback','coin-'+denom); }
function coinIcon(denom){ return `<img class="coin-ic" src="assets/coins/${denom}.png" alt="${COIN_LABEL[denom]}" loading="lazy" onerror="coinFallback(this,'${denom}')">`; }
function coinBreakdown(n){
  n=Math.max(0,Math.floor(n||0));
  const gold=Math.floor(n/(COPPER_PER_SILVER*SILVER_PER_GOLD));
  const rem=n%(COPPER_PER_SILVER*SILVER_PER_GOLD);
  const silver=Math.floor(rem/COPPER_PER_SILVER);
  const copper=rem%COPPER_PER_SILVER;
  return {gold,silver,copper};
}
/* representación completa (para "tu bolsa"/"dinero del hogar"): omite denominaciones en 0,
   salvo que sea la única (0 cobre se muestra igual si no hay nada de nada). */
function formatCoins(n){
  const {gold,silver,copper}=coinBreakdown(n);
  const parts=[];
  if(gold) parts.push(`<span class="coin-amt">${gold}${coinIcon('gold')}</span>`);
  if(silver) parts.push(`<span class="coin-amt">${silver}${coinIcon('silver')}</span>`);
  if(copper||!parts.length) parts.push(`<span class="coin-amt">${copper}${coinIcon('copper')}</span>`);
  return `<span class="coins">${parts.join(' ')}</span>`;
}
/* versión compacta (para el badge del header, donde no cabe el desglose completo): solo la
   denominación más alta que tengas — así un campesino sin oro nunca ve un ícono de oro. */
function formatCoinsCompact(n){
  const {gold,silver,copper}=coinBreakdown(n);
  if(gold) return `<span class="coin-amt">${gold}${coinIcon('gold')}</span>`;
  if(silver) return `<span class="coin-amt">${silver}${coinIcon('silver')}</span>`;
  return `<span class="coin-amt">${copper}${coinIcon('copper')}</span>`;
}
/* retrato real por personaje: bebés (0-2 años) usan su tono de piel real
   (character.appearance.skinTone, 0-4 -> baby1..baby5); mujeres usan el
   retrato femenino como reemplazo temporal ("la podemos utilizar mientras");
   el resto usa el retrato genérico original. Limitación conocida: solo hay
   un retrato masculino adulto, no varía por tono de piel todavía. */
function portraitKey(ch){
  if(!ch) return 'character';
  if(ch.age<=2){ const t=(ch.appearance&&typeof ch.appearance.skinTone==='number')?ch.appearance.skinTone:2; return 'baby'+(clamp(t,0,4)+1); }
  return ch.sex==='F' ? 'woman' : 'character';
}
function avatar(ch, cls=''){ const deadCls = ch && ch.alive===false ? ' dead' : ''; return `<div class="portrait ${cls}${deadCls}">${tileImg(portraitKey(ch))}</div>`; }
/* §3/§7 (sesión "cambios varios"): portraitKey()/avatar() reflejan el estado ACTUAL del
   personaje (edad de hoy, vivo/muerto de hoy) — correcto para el árbol genealógico o la lista
   de gente del pueblo, donde se muestra "cómo está ahora". Pero un suceso de la Crónica/Vida
   describe un momento del PASADO: si se usa el estado actual ahí, un hermano que nació y murió
   poco después aparece en gris incluso en su propio evento de nacimiento, y un personaje sigue
   "creciendo" de retrato (o encogiendo a bebé) en sucesos viejos según pasan los años. Estas
   variantes "at" fijan la instantánea al año del suceso en vez de al año actual del mundo. */
function isDeadByYear(ch, year){ return !!(ch && ch.deathYear!=null && ch.deathYear<=year); }
function ageAtYear(ch, year){
  if(!ch) return 0;
  const clampedYear = (ch.deathYear!=null) ? Math.min(year, ch.deathYear) : year;
  return Math.max(0, clampedYear - ch.birthYear);
}
function portraitKeyAt(ch, year){
  if(!ch) return 'character';
  if(ageAtYear(ch,year)<=2){ const t=(ch.appearance&&typeof ch.appearance.skinTone==='number')?ch.appearance.skinTone:2; return 'baby'+(clamp(t,0,4)+1); }
  return ch.sex==='F' ? 'woman' : 'character';
}
function avatarAt(ch, year, cls=''){ const deadCls = isDeadByYear(ch,year) ? ' dead' : ''; return `<div class="portrait ${cls}${deadCls}">${tileImg(portraitKeyAt(ch,year))}</div>`; }
function row(k,v){ return `<div class="row"><span class="k">${k}</span><span class="leader"></span><span class="v">${v}</span></div>`; }
function bar(v){ return `<div class="bar ${meterClass(v)}"><i style="width:${clamp(v,0,100)}%"></i></div>`; }
/* §6 (sesión "cambios varios"): la barra de una habilidad en entrenamiento (Ganadería, Labranza...)
   se veía desde el primer punto ganado, arrancando siempre en 0-1%, lo cual no comunicaba nada.
   Ahora la barra permanece oculta hasta alcanzar un nivel mínimo — antes de eso ya estás entrenando
   "por dentro" (el valor sigue acumulándose), solo que la interfaz no lo muestra todavía. */
const SKILL_BAR_MIN_LEVEL = 5;
function skillBarRow(label, value, sex){
  if((value||0) < SKILL_BAR_MIN_LEVEL) return '';
  return `${row(label, skillLabel(value,sex))}${bar(value)}`;
}
/* icono + color por categoría (mejora de diseño 2026-09 #6): "una imagen dice más que mil
   palabras" — cada suceso del feed se distingue de un vistazo, sin tener que leer el texto. */
const TAG_ICON={family:'heart', agricultura:'hoe', ganado:'cow', fe:'cross', ocio:'barrel',
  marcial:'shield', crimen:'knife', mundo:'moneybag', trabajo:'anvil', hacienda:'chest',
  personaje:'character', social:'character', tutorial:'wizard'};
function feedIcon(e){ const key=TAG_ICON[e.tag]; return key? tileImg(key,'') : slotIcon('category:'+(e.tag||'otro')); }
const FEED_NEGATIVE=/muri|muert|tragedia|rechaz|perdiste|no sobrevivió|hambruna|bandidaje|descontento|riña|resentid|puertas cerradas|tocó tu granero|deuda sin pagar|sorprendid|no salió bien|no podías perder|mala suerte/i;
function feedCardClass(e){
  if(e.tag==='tutorial') return 'navy';
  if(FEED_NEGATIVE.test(e.title)) return 'pink';
  if(e.tag==='mundo'||e.tag==='hacienda'||e.tag==='trabajo') return 'green';
  return 'tan';
}
/* después de ver el mismo TIPO de suceso varias veces, ya no hace falta explicarlo entero
   cada vez — se condensa a solo el título (SIMULAR MUCHO, MOSTRAR POCO, con el tiempo). */
const FEED_FAMILIARITY_THRESHOLD=3;
function eventItem(e){
  const familiar = (e.seenCount||1) > FEED_FAMILIARITY_THRESHOLD;
  const showDesc = e.desc && e.desc!==e.title && !familiar;
  // §2/§3/§7: cuando el suceso tiene un protagonista real (mainCharId), mostramos SU retrato
  // tal como era ESE año (avatarAt) — no su estado de hoy — para que un nacimiento no salga
  // en gris solo porque ese personaje murió después, ni "crezca" en retratos ya viejos.
  const mainChar = e.mainCharId ? C(e.mainCharId) : null;
  const year = e.year||world.year;
  const iconHtml = mainChar
    ? `<div class="feed-icon${isDeadByYear(mainChar,year)?' dead-icon':''}">${tileImg(portraitKeyAt(mainChar,year))}</div>`
    : `<div class="feed-icon">${feedIcon(e)}</div>`;
  return `<div class="feed-item ${feedCardClass(e)}">
    ${iconHtml}
    <div class="feed-body">
      <div class="feed-top"><span class="feed-title">${e.title}</span><span class="feed-year">Año ${e.year||world.year}</span></div>
      ${showDesc?`<div class="feed-desc">${e.desc}</div>`:''}
    </div>
  </div>`;
}

/* §12 (sesión "cambios varios"): el contador de monedas del header leía SIEMPRE personalMoney,

/* ---------- VIDA: el mundo + la crónica (antes Mundo + Historia) ---------- */
function panelVida(){
  const p=player(world), cap=getPlayerCapabilities(p);

  else if(ui.lifeFilter==='mundo') body=mundoBody(p,cap);
  else body=vidaFeedBody(p,cap);
  return {head, body};
}
function vidaFeedBody(p,cap){
  let html='';
  const amb=getAmbition(p);
  if(amb) html += `<div class="card tan"><h3>Tu ambición</h3><div class="body" style="display:flex;align-items:center;gap:6px">${ambitionIcon(amb)}${genderText(amb.def.label,p.sex)}</div>${bar(amb.pct)}</div>`;
  /* mejora de diseño 2026-09 #6: esto YA NO es un resumen aparte que interrumpe con un modal —
     es la pantalla principal de "Tu vida", siempre disponible, que se va llenando sola a medida
     que se pulsa VIVIR EL AÑO. Lee de world.feed (persistente entre años), no de lastTurnLog
     (que un año nuevo sobreescribía). */
  const items=(world.feed||[]).slice(-20);
  html += items.length? items.slice().reverse().map(eventItem).join('') : '<p class="empty">Aún no ha pasado nada. Pulsa VIVIR EL AÑO para empezar.</p>';
  return html;
}
function mundoBody(p,cap){

  if(p.age>=12) html += `<div class="card"><h3>Costumbre de sucesión</h3><div class="body">${WORLD_FLAVOR.law}</div></div>`;

/* ---------- GENTE: familia + pueblo + árbol (antes Familia + Relaciones) ---------- */
function panelGente(){
  const p=player(world), cap=getPlayerCapabilities(p);

  const head=`<div class="screen-head"><h2>Gente</h2><p class="sub">Quienes forman tu mundo cercano.</p></div>

  let body;

  // más importante (mayor vínculo, bueno o malo) — el pueblo completo vive en su propio subtab.
  else body = familyBody(p,cap) + importantPeopleBody(p,cap);

function relPctClass(rel){ return rel>=25?'warm':(rel>=-10?'cool':'hostile'); }
function familyBody(p,cap){
  let html = genealogyBody(p);
  const widowed = !!(p.spouseId && C(p.spouseId) && !C(p.spouseId).alive);
  if(cap.canMarry || p.spouseId){
    let marriageBody;
    if(p.spouseId && !widowed){
      marriageBody = `<div class="body">Estás ${genderText('casado/a',p.sex)} con ${C(p.spouseId).firstName} ${C(p.spouseId).familyName}.</div>`;
    } else if(!cap.canMarry){
      marriageBody = `<p class="empty">Aún eres joven para pensar en matrimonio.</p>`;
    } else {
      const intro = widowed? `<div class="body">Enviudaste de ${C(p.spouseId).firstName}. Con tiempo, podrías volver a buscar pareja.</div>` : '';
      const candidates=getEligibleRomanticCandidates(p);
      marriageBody = intro + `<div class="actions-row"><button class="btn" data-action="findSuitor" ${!canUseAction()?'disabled':''}>Conocer gente nueva en el pueblo</button></div>`
        + (candidates.length? candidates.map(c=>`<div class="list-row"><div class="info"><div class="name">${c.firstName} ${c.familyName}</div><div class="role">${c.age} años · ${relLabelText(getRelationship(world,p.id,c.id))}</div></div><button class="btn small" data-action="propose" data-id="${c.id}">Proponer</button></div>`).join('') : '<p class="empty">Aún no conoces a nadie que pudiera convertirse en tu pareja.</p>');
    }
    html += `<div class="card pink"><h3>Matrimonio</h3>${marriageBody}</div>`;
  }
  return html;
}
function relLabelText(v){ return relationshipLabel(v); }
function personListRow(p,m,cap){
  const occ=getDisplayOccupation(m);
  const showOcc = occ && (cap.canSeeAdultProfession || p.age>=13);
  const rel=getRelationship(world,p.id,m.id);
  return `<div class="list-row clickable" data-action="viewChar" data-id="${m.id}">${avatar(m,'sm')}
    <div class="info"><div class="name">${m.firstName} ${m.familyName}</div><div class="role">${describeKnownRelation(p,m)}${showOcc?' · '+occ:''} · ${m.age} años</div></div>
    <div class="side"><div class="pct ${relPctClass(rel)}">${rel>=0?'+':''}${rel}</div></div>
  </div>`;
}
function villageBody(p,cap){
  if(!cap.canSeeRelaciones) return '';
  const knownOthers=getKnownPeople(p).others;
  let html=`<div class="card"><h3>Gente del pueblo</h3>`;
  html += knownOthers.length? knownOthers.map(m=>personListRow(p,m,cap)).join('') : '<p class="empty">Todavía no conoces a nadie fuera de tu familia.</p>';
  html += `</div>`;
  if(p.age>=9) html += `<div class="actions-row"><button class="btn" data-action="meetVillage" ${!canUseAction()?'disabled':''}>Pasar tiempo en el pueblo</button></div>`;
  return html;
}
/* §14 (sesión "cambios varios"): versión resumida de villageBody() para el subtab "Todo" — solo
   los vínculos más fuertes (para bien o para mal), con acceso directo a la lista completa. */
const IMPORTANT_PEOPLE_MAX = 4;
function importantPeopleBody(p,cap){
  if(!cap.canSeeRelaciones) return '';
  const knownOthers=getKnownPeople(p).others;
  if(!knownOthers.length) return `<div class="card"><h3>Gente importante</h3><p class="empty">Todavía no conoces a nadie fuera de tu familia.</p></div>`;
  const ranked=[...knownOthers].sort((a,b)=>Math.abs(getRelationship(world,p.id,b.id))-Math.abs(getRelationship(world,p.id,a.id)));
  const important=ranked.slice(0,IMPORTANT_PEOPLE_MAX);
  let html=`<div class="card"><h3>Gente importante</h3>${important.map(m=>personListRow(p,m,cap)).join('')}</div>`;
  if(knownOthers.length>important.length) html += `<div class="actions-row"><button class="btn ghost small" data-action="setPeopleFilter" data-filter="pueblo">Ver a todo el pueblo (${knownOthers.length})</button></div>`;
  return html;
}
/* árbol genealógico vertical: una generación debajo de otra, con retrato de
   cada quien; los fallecidos aparecen en gris (ver avatar()/.portrait.dead) */
function genPerson(p,m){
  const isSelf = m.id===p.id;
  const label = isSelf? 'Tú' : getKinshipLabel(p.id,m.id);
  const years = m.alive? m.age+' años' : `${m.birthYear}–${m.deathYear}`;
  return `<div class="genperson ${isSelf?'you':''} clickable" data-action="viewChar" data-id="${m.id}">
    ${avatar(m,'gen')}
    <div class="n">${m.firstName}</div>
    <div class="r">${label}</div>
    <div class="y">${years}</div>
  </div>`;
}
function genealogyBody(p){
  const father=p.fatherId?C(p.fatherId):null, mother=p.motherId?C(p.motherId):null;
  const grandparents=[father,mother].filter(Boolean).flatMap(par=>[par.fatherId?C(par.fatherId):null,par.motherId?C(par.motherId):null]).filter(Boolean);
  const siblings=p.siblingIds.map(C).filter(Boolean);
  const children=p.childrenIds.map(C).filter(Boolean);
  const grandchildren=children.flatMap(c=>c.childrenIds.map(C)).filter(Boolean);
  const level=(title,list)=>list.length? `<div class="genlevel"><h4>${title}</h4><div class="genlevel-row">${list.map(m=>genPerson(p,m)).join('')}</div></div>` : '';
  return `<div class="card"><h3>Árbol genealógico</h3><div class="gentree">
    ${level('Abuelos',grandparents)}
    ${level('Padres',[father,mother].filter(Boolean))}
    ${level('Tu generación',[p,...siblings])}
    ${level('Hijos',children)}
    ${level('Nietos',grandchildren)}
  </div></div>`;
}

      <button class="btn small" data-action="estateOrder" data-kind="loyalty" ${(!canUseEstateOrder(hh)||hh.money<4)?'disabled':''}>Cuidar la lealtad (-4 mn)</button>
    </div><p class="empty">${!canUseEstateOrder(hh) ? 'Ya diste una orden de hacienda este año — vuelve a intentarlo el año que viene.' : 'Puedes dar una orden de hacienda por año.'}</p>`

    ${row('Cabeza del hogar', hh.headId===p.id?'Tú':(C(hh.headId)?C(hh.headId).firstName:'—'))}
    ${row('Economía', householdStatusLabel(householdStatus(hh)))}
    ${cap.canSeeExactMoney? `${row('Dinero del hogar', formatCoins(hh.money))}${row('Grano almacenado', hh.grainStores+' sacos')}${prop?row('Tierra', prop.name):''}` : ''}
    ${cap.canContributeMoney && !authority? `<div class="actions-row"><button class="btn ghost" data-action="contributeMoney" ${((p.personalMoney||0)<=0||!canUseAction())?'disabled':''}>Aportar dinero al hogar</button></div>` : ''}
    ${cap.canLeaveHome? (()=>{ const ir=independenceReadiness(p);
      return `<div class="actions-row"><button class="btn" data-action="leaveHousehold" ${ir.ready?'':'disabled'}>Formar mi propio hogar</button></div>${ir.ready?'':`<p class="empty">${ir.reason}</p>`}`; })() : ''}
  </div>

function animalDetailBody(animals){

    const list=animals.filter(a=>a.species===sp); if(!list.length) return '';

    ${list.map(a=>`<div class="list-row">${animalThumb(a.species)}<div class="info"><div class="name">${animalName(a)}</div><div class="role">${a.sex==='M'?'macho':'hembra'} · ${world.year-a.birthYear} años · ${healthLabel(a.health,a.sex)}</div></div><button class="btn small" data-action="sellAnimal" data-id="${a.id}">Vender</button></div>`).join('')}</div>`;
  }).join('');
}

function panelYo(){

  if(cap.stage==='baby'){
    // §13: la etapa de bebé tenía mucho espacio vacío; la postal del pueblo le da identidad
    // de lugar sin añadir más texto (se oculta sola si la imagen todavía no existe).
    const father=p.fatherId?C(p.fatherId):null, mother=p.motherId?C(p.motherId):null;
    const body=`${renderSettlementScene(world,{small:true})}<div class="card">
      ${row(genderText('Nacido/a en',p.sex), p.birthYear+', '+WORLD_FLAVOR.villageName)}

    return {head, body};
  }
  const widowed=!!(p.spouseId && C(p.spouseId) && !C(p.spouseId).alive);
  const civilStatus = genderText(p.spouseId ? (widowed? 'viudo/a de '+C(p.spouseId).firstName : 'casado/a con '+C(p.spouseId).firstName) : 'soltero/a', p.sex);

  let estado = `${row(genderText('Nacido/a en',p.sex),p.birthYear)}${row('Sexo', p.sex==='M'?'Hombre':'Mujer')}`;
  if(cap.canSeeAdultProfession) estado += row('Clase social', getSocialClass(p));
  if(cap.canMarry || p.spouseId) estado += row('Estado civil', civilStatus);
  estado += row('Hogar', hh?hh.name:'—');
  let body = `<div class="card"><h3>Estado</h3>${estado}</div>`;
  if(visibleTraits.length) body += `<div class="taglist">${visibleTraits.map(t=>`<span class="tag">${genderText(t,p.sex)}</span>`).join('')}</div>`;
  else body += `<p class="empty">Todavía se está descubriendo tu carácter.</p>`;
  if(cap.canHandleAnimals || cap.canFarm){
    let rows='';
    const occ=getDisplayOccupation(p);
    if(occ) rows += row('Oficio', occ);
    if(cap.canHandleAnimals) rows += skillBarRow('Ganadería', p.skills.animal_husbandry, p.sex);
    if(cap.canFarm) rows += skillBarRow('Labranza', p.skills.farming, p.sex);
    if(cap.canSeeExactMoney) rows += row('Grano almacenado (hogar)', hh.grainStores+' sacos');
    // §8 (sesión "cambios varios"): este botón llama a doWorkHarder(), que exige ser adulto
    // (edad>=16); antes se mostraba también para niños de 9-15 años (con canFarm/canHandleAnimals
    // ya activos) y al pulsarlo no pasaba nada. Ahora solo aparece cuando de verdad hace algo.
    if(p.age>=16) body += `<div class="card"><h3>${occ?'Oficio':'Tus tareas'}</h3>${rows}
      <div class="actions-row"><button class="btn ghost small" data-action="workHarder" ${(world.flags.restedThisYear||!canUseAction())?'disabled':''}>Dedicarte más este año</button></div>
    </div>`;
    else if(rows) body += `<div class="card"><h3>${occ?'Oficio':'Tus tareas'}</h3>${rows}</div>`;
  }
  const amb=getAmbition(p);
  if(amb) body += `<div class="card tan"><h3>Tu ambición</h3><div class="body" style="display:flex;align-items:center;gap:6px">${ambitionIcon(amb)}${genderText(amb.def.label,p.sex)}</div>${bar(amb.pct)}</div>`;

  return {head, body};
}

    const main = ev.portraitId ? C(ev.portraitId) : null;

    </div></div>`;

  if(ui.modal.type==='independence'){
    const p=player(world); const hh=household(world);
    return `<div class="overlay"><div class="modal">
      <div class="eyebrow">Tu propio hogar</div>
      <h2>Año ${world.year}</h2>
      <p>Por primera vez, ya no duermes bajo el techo de tus padres. Tus posesiones son pocas, pero esta casa depende ahora de ti.</p>
      ${row('Dinero personal', formatCoins(p.personalMoney||0))}
      ${row('Capital del hogar', formatCoins(hh.money))}
      ${row('Oficio', getDisplayOccupation(p)||'aún por definir')}
      ${row('Tierra propia', propertiesOf(hh).length? 'sí' : 'no, todavía')}
      <div class="modal-close-row"><button class="btn primary" data-action="closeIndependence">Continuar</button></div>
    </div></div>`;
  }
  if(ui.modal.type==='chooseHeir'){
    const list=eligibleHeirs(C(ui.modal.deadId));
    if(!list.length){
      return `<div class="overlay"><div class="modal">
      <div class="eyebrow">La línea se extingue</div>
      <h2>No queda descendencia elegible</h2>
      <p>Nadie de tu familia cercana sigue con vida para tomar las riendas. Puedes comenzar con una nueva familia campesina en el año ${world.year}, mientras el mundo y su historia continúan.</p>
      <div class="modal-close-row"><button class="btn primary" data-action="newFamilySameWorld">Comenzar nueva familia</button></div>
      </div></div>`;
    }
    return `<div class="overlay"><div class="modal">
      <div class="eyebrow">Elige a quién encarnar</div>
      <h2>¿Quién continúa el linaje?</h2>
      <p>Según ${WORLD_FLAVOR.law.toLowerCase()}</p>
      ${list.map(m=>{
        const hh=m.householdId?world.households[m.householdId]:null;
        const kin=getKinshipLabel(ui.modal.deadId, m.id);
        const homeNote = hh ? (hh.headId===m.id? 'posee su propio hogar ('+hh.name+')' : 'vive en '+hh.name) : '';
        const roleNote = (m.age>=16 && getDisplayOccupation(m)) ? getDisplayOccupation(m) : getStageTitle(m);
        return `<button class="option" data-action="chooseNext" data-id="${m.id}"><b>${m.firstName} ${m.familyName}</b>${kin} · ${m.age} años · ${roleNote}${homeNote?(' · '+homeNote):''}</button>`;
      }).join('')}
    </div></div>`;
  }
  if(ui.modal.type==='settings'){
    if(ui.modal.importPending){
      const pv=ui.modal.importPending.preview;
      return `<div class="overlay"><div class="modal">
        <div class="eyebrow">Importar partida</div>
        <h2>¿Sustituir tu partida actual?</h2>
        <p>Esto va a reemplazar tu partida en curso por la del archivo:</p>
        ${row('Año', pv.year)}${row('Personaje', pv.playerName)}${row('Edad', pv.age+' años')}${row('Personajes guardados', pv.chars)}
        <p style="font-size:11px;color:#8a231e">Tu partida actual se perderá si no la exportaste antes.</p>
        <div class="modal-close-row" style="justify-content:space-between">
          <button class="btn ghost small" data-action="cancelImport">Cancelar</button>
          <button class="btn danger small" data-action="confirmImport">Sí, sustituir</button>
        </div>
      </div></div>`;
    }
    const seed = world.rngSeed!=null ? world.rngSeed : '—';
    return `<div class="overlay"><div class="modal">
      <div class="eyebrow">Ajustes</div>
      <h2>Partida</h2>
      <p style="font-size:11px;color:#6b7280">Guardado automático activo.</p>
      <div class="row"><span class="k">Seed de esta partida</span><span class="leader"></span><span class="v" style="font-size:11px">${seed}</span></div>
      <div class="actions-row"><button class="btn ghost small" data-action="copySeed">Copiar seed</button></div>
      ${ui.modal.copyFeedback? `<p style="font-size:10.5px;color:#3f8a3f;margin:4px 0 0">${ui.modal.copyFeedback}</p>` : ''}
      <hr class="divider">
      <p style="font-size:11px;color:#3d6491">Libro de Linaje es una campaña de generaciones — no dependas solo de este dispositivo.</p>
      <div class="actions-row">
        <button class="btn small" data-action="exportSave">Exportar partida</button>
        <button class="btn ghost small" data-action="importSave">Importar partida</button>
      </div>
      ${ui.modal.exportMessage? `<p style="font-size:10.5px;color:#3f8a3f;margin:4px 0 0">${ui.modal.exportMessage}</p>` : ''}
      ${ui.modal.importError? `<p style="font-size:10.5px;color:#8a231e;margin:4px 0 0">${ui.modal.importError}</p>` : ''}
      <hr class="divider">
      <div class="actions-row"><button class="btn danger small" data-action="resetGame">Reiniciar partida</button></div>
      <div class="modal-close-row"><button class="btn primary" data-action="closeModal">Cerrar</button></div>
    </div></div>`;
  }
  if(ui.modal.type==='charDetail'){ return renderCharDetailModal(ui.modal.id); }
  return '';
}

/* ---------- eventos de click delegados ---------- */
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const a = btn.dataset.action;
  // §13 (sesión "cambios varios"): "Gente" siempre debe abrir en el subtab "Todo", nunca recordar
  // el subtab (Familia/Pueblo) en el que te habías quedado la última vez que estuviste ahí.
  if(a==='setTab'){ ui.activeTab=btn.dataset.tab; if(btn.dataset.tab==='gente') ui.peopleFilter='all'; render(); }
  else if(a==='advanceYear'){ advanceYear(); }
  else if(a==='sow'){ doSow(); }
  else if(a==='sellGrain'){ doSellGrain(); }
  else if(a==='workHarder'){ openMinigame('forge', q=>doWorkHarder(q)); }
  else if(a==='minigameStop'){ resolveMinigameClick(); }
  else if(a==='helpAnimals'){ doHelpAnimals(); }
  else if(a==='helpFarm'){ doHelpFarm(); }
  else if(a==='buyAnimal'){ doBuyAnimal(btn.dataset.species); }
  else if(a==='sellAnimal'){ doSellAnimal(btn.dataset.id); }
  else if(a==='spendTime'){ doSpendTime(btn.dataset.id); }
  else if(a==='help'){ doHelp(btn.dataset.id); }
  else if(a==='findSuitor'){ doFindSuitor(); }
  else if(a==='propose'){ doPropose(btn.dataset.id); }
  else if(a==='meetVillage'){ doMeetVillage(); }
  else if(a==='contributeMoney'){ doContributeMoney(); }
  else if(a==='leaveHousehold'){ doLeaveHousehold(); }
  else if(a==='activity'){ const act=DO_ACTIVITIES.find(x=>x.id===btn.dataset.id); if(act) act.run(); }
  else if(a==='setDoCategory'){ ui.doCategory=btn.dataset.cat; render(); }
  else if(a==='setPeopleFilter'){ ui.peopleFilter=btn.dataset.filter; render(); }
  else if(a==='setLifeFilter'){ ui.lifeFilter=btn.dataset.filter; render(); }
  else if(a==='estateOrder'){ doEstateOrder(btn.dataset.kind); }
  else if(a==='toggleAnimalDetail'){ ui.showAnimalDetail=!ui.showAnimalDetail; render(); }
  else if(a==='openSettings'){ ui.modal={type:'settings'}; render(); }
  else if(a==='copySeed'){
    const text=String(world.rngSeed);
    const done=()=>{ ui.modal.copyFeedback='Seed copiada.'; render(); };
    const fail=()=>{ ui.modal.copyFeedback='No se pudo copiar: '+text; render(); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
    else fail();
  }
  else if(a==='exportSave'){ exportSave(); }
  else if(a==='importSave'){ beginImportFlow(); }
  else if(a==='confirmImport'){ confirmImport(); }
  else if(a==='cancelImport'){ cancelImport(); }
  else if(a==='resetGame'){ doResetGame(); }
  else if(a==='resolveEvent'){ const ev=ui.modal.event; doResolveEventOption(ev.options[+btn.dataset.idx]); }
  else if(a==='afterDeath'){ ui.modal={type:'chooseHeir', deadId: ui.modal.charId}; render(); }
  else if(a==='chooseNext'){ doChooseNext(btn.dataset.id); }
  else if(a==='viewChar'){ ui.modal={type:'charDetail', id:btn.dataset.id}; render(); }
  else if(a==='closeModal'){ ui.modal=null; render(); }
  else if(a==='closeBirthIntro'){ ui.modal=null; render(); }
  else if(a==='closeMilestone'){ ui.modal=null; advanceModalQueue(); }
  else if(a==='closeIndependence'){ ui.modal=null; render(); }
  else if(a==='newFamilySameWorld'){
    const oldHistory=world.history, oldYear=world.year, oldThreads=world.storyThreads;
    const fresh=generateInitialWorld({startYear:oldYear, playerAge:16, carryOn:true});
    fresh.history=[...oldHistory, ...fresh.history];
    fresh.storyThreads=[...(oldThreads||[])];
    world=fresh; ui.modal=null; save(); render();
  }
});

/* ---------- render + init ---------- */
function render(){
  // Parte 20: si cambia el personaje jugado (o su edad), las pestañas disponibles se recalculan siempre
  if(world && world.playerId && !getAvailableTabs(player(world)).some(([k])=>k===ui.activeTab)) ui.activeTab='yo';
  renderApp();
}
document.getElementById('importFileInput').addEventListener('change', handleImportFileChosen);
if(!load()){ world = generateInitialWorld(); save(); }
if(world.pendingBirthIntro){ world.pendingBirthIntro=false; ui.modal={type:'birthIntro'}; }
render();

</script>
</body>
</html>
