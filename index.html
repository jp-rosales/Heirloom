<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Libro de Linaje</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --page-bg:#eef1f6; --page-ink:#1c2233; --page-muted:#6b7280;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page-bg:#0b0f1a; --page-ink:#e8ecf5; --page-muted:#8891a5; }
}
:root[data-theme="dark"]{ --page-bg:#0b0f1a; --page-ink:#e8ecf5; --page-muted:#8891a5; }

/* ---------- paleta ambiental por región/bioma (mejora de diseño 2026-09 #5/P5) ----------
   Los mismos contenedores/tarjetas de siempre, solo cambian sus colores. "valle" (Fenwold) es
   la paleta por defecto y coincide EXACTAMENTE con los colores originales del juego, así que
   quien empieza en esa región no ve ningún cambio visual. Las demás regiones re-tiñen el mismo
   fondo/oscuridad (para que el texto blanco/oscuro que ya existe siga siendo legible) sin tocar
   estructura, ni las tarjetas de color semántico (tan/rosa/verde/navy), ni los botones. */
.app{
  --pal-app:#0a2144; --pal-screen:#2c6bb0; --pal-stats:#1e5290; --pal-stats-border:#163f70;
  --pal-band:#9ecef6; --pal-content:#cfe4ff;
  --pal-navbar:#1a4d8f; --pal-navitem:#193f70; --pal-navitem-border:#143255;
  --pal-card:#f3f7ee; --pal-card-border:#7c93a8;
}
.app[data-palette="mountain"]{
  --pal-app:#1b232e; --pal-screen:#55677a; --pal-stats:#3e4d5e; --pal-stats-border:#2c3846;
  --pal-band:#cfd9e0; --pal-content:#e3e9ee;
  --pal-navbar:#3a4a5c; --pal-navitem:#2f3d4d; --pal-navitem-border:#232d3a;
  --pal-card:#f4f6f3; --pal-card-border:#8c9aa6;
}
.app[data-palette="coast"]{
  --pal-app:#0c2e33; --pal-screen:#2a7a82; --pal-stats:#1f5d64; --pal-stats-border:#164549;
  --pal-band:#a8d9d6; --pal-content:#d4ecea;
  --pal-navbar:#1c5a63; --pal-navitem:#184a52; --pal-navitem-border:#123a40;
  --pal-card:#f2f7ee; --pal-card-border:#7ca39a;
}
.app[data-palette="dry"]{
  --pal-app:#3a2416; --pal-screen:#b3703f; --pal-stats:#8f5730; --pal-stats-border:#6b3f20;
  --pal-band:#e8cfa0; --pal-content:#f0e0bd;
  --pal-navbar:#8a5a34; --pal-navitem:#714a2b; --pal-navitem-border:#573a20;
  --pal-card:#f8f0e0; --pal-card-border:#b58a56;
}
.app[data-palette="marsh"]{
  --pal-app:#22261a; --pal-screen:#5c6b3f; --pal-stats:#454f2e; --pal-stats-border:#333a20;
  --pal-band:#c7c9a0; --pal-content:#dcdcb8;
  --pal-navbar:#4a5530; --pal-navitem:#3c4527; --pal-navitem-border:#2c331c;
  --pal-card:#f2f2e2; --pal-card-border:#8f9464;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--page-bg); color:var(--page-ink);
  font-family:'Pixelify Sans', monospace;
  height:100vh; height:100dvh;
  display:flex; justify-content:center;
  overflow:hidden;
}
button{font:inherit;}
img.pixel{image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
* { border-radius:0 !important; }

/* ---------- marco de la app: mismo lenguaje visual pixel-art del mockup "Thy Life So Far" ----------
   Interfaz fija (mejora de diseño 2026-09 #11): .app/.screen usan height (no min-height), así el
   flexbox queda estrictamente acotado a la altura de la ventana y SOLO .content (flex:1 + overflow-y)
   puede hacer scroll — header y navegación quedan siempre visibles, como una app de juego móvil. */
.app{ width:100%; max-width:460px; height:100vh; height:100dvh; background:var(--pal-app); display:flex; overflow:hidden; }
.screen{ width:100%; display:flex; flex-direction:column; background:var(--pal-screen); height:100%; color:#16294a; overflow:hidden; min-height:0; }

/* placeholder: bloque plano sin arte, mismo recurso que usa la propia referencia para su nav */
.slot{ display:flex; align-items:center; justify-content:center; flex:none; background:rgba(255,255,255,.16); }
.slot.on-tan{ background:rgba(20,30,50,.14); }

/* ---------- header ---------- */
.header{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:calc(12px + env(safe-area-inset-top)) 12px 10px; background:var(--pal-screen); }
.identity{ display:flex; align-items:center; gap:10px; min-width:0; }
.portrait{ width:52px; height:52px; flex:none; background:#f3e8ca; border:3px solid #7a5a2c;
  box-shadow:inset 2px 2px 0 #fff6df, inset -3px -3px 0 #cba766, 3px 3px 0 rgba(8,18,38,.4);
  display:flex; align-items:center; justify-content:center; cursor:pointer; }
.portrait img{ width:36px; height:36px; }
.portrait.sm{ width:34px; height:34px; border-width:2px; }
.portrait.sm img{ width:22px; height:22px; }
.portrait.xs{ width:22px; height:22px; border-width:2px; box-shadow:inset 1px 1px 0 #fff6df, inset -2px -2px 0 #cba766, 2px 2px 0 rgba(8,18,38,.3); }
.portrait.xs img{ width:15px; height:15px; }
.identity-text{ min-width:0; }
.char-name{ font-size:16px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.char-sub{ margin-top:2px; font-size:12px; color:#a9c6e8; }
.header-actions{ display:flex; align-items:center; gap:6px; flex:none; margin-top:2px; }
.coin-badge{ display:flex; align-items:center; gap:4px; }
.coin-badge img{ width:16px; height:16px; }
.coin-badge span{ font-size:14px; font-weight:600; color:#fff; }
.icon-btn{ position:relative; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  background:none; border:none; padding:0; transition:transform .06s steps(1); }
.icon-btn.chest{ background:#e8a93c; border:2px solid #5c3413; box-shadow:inset 2px 2px 0 #ffd77a, inset -2px -2px 0 #a86a1f, 3px 3px 0 #5c3413; }
.icon-btn.gear{ background:#8fd0ea; border:2px solid #245571; box-shadow:inset 2px 2px 0 #d6f3ff, inset -2px -2px 0 #4a8ab0, 3px 3px 0 #245571; }
.icon-btn:active{ transform:translate(3px,3px); }
.icon-btn .slot{ width:16px; height:16px; }

/* ---------- stats bar (salud / encanto / ingenio / fe) ---------- */
.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:9px 12px 10px; background:var(--pal-stats); border-top:2px solid var(--pal-stats-border); border-bottom:2px solid var(--pal-stats-border); }
.stat{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.stat-top{ display:flex; align-items:center; gap:5px; }
.stat img.pixel{ width:17px; height:17px; flex:none; }
.stat .slot{ width:17px; height:17px; }
.stat-num{ font-size:13px; font-weight:600; color:#fff; }
.stat-bar{ position:relative; height:7px; background:#123863; box-shadow:inset 1px 1px 0 rgba(0,0,0,.4); overflow:hidden; }
.stat-bar>i{ position:absolute; inset:0 auto 0 0; height:100%; box-shadow:inset 0 2px 0 rgba(255,255,255,.45), inset 0 -2px 0 rgba(0,0,0,.2); }
.stat-heart>i{ background:#ef4f5c; } .stat-charm>i{ background:#f7c948; } .stat-wits>i{ background:#63b3ec; } .stat-faith>i{ background:#5cbf72; }

/* ---------- caption / cabecera de pantalla ---------- */
.caption{ text-align:center; padding:9px 0 8px; font-size:12.5px; letter-spacing:.05em; color:#1c3a63; background:var(--pal-band); }
.screen-head{ padding:12px 14px 6px; background:var(--pal-band); }
.screen-head h2{ margin:0; font-size:16px; color:#12294e; }
.screen-head .sub{ margin:3px 0 0; font-size:11.5px; color:#3d6491; }

/* ---------- barra de sub-pestañas (usada en VIDA / HACER / GENTE) ---------- */
.subtabs{ display:flex; gap:6px; padding:8px 12px 10px; background:var(--pal-band); overflow-x:auto; }
.subtab{ flex:none; text-align:center; padding:7px 10px; font-size:10.5px; letter-spacing:.02em; color:#3d6491; background:var(--pal-band); border:2px solid transparent; cursor:pointer; white-space:nowrap; }
.subtab.active{ color:#122c4e; font-weight:600; background:#eef7ff; border-color:#1c3a63; box-shadow:inset 2px 2px 0 #fff, inset -2px -2px 0 #bcd8f2, 2px 2px 0 #1c3a63; }

/* ---------- contenido desplazable ---------- */
.content{ flex:1; min-height:0; overflow-y:auto; background:var(--pal-content); padding:10px 12px 14px; display:flex; flex-direction:column; gap:9px; }
.content h2{ font-size:15px; margin:2px 0 0; color:#12294e; }
.content .lead{ font-size:11.5px; color:#3d6491; margin:2px 0 4px; }

/* ---------- tarjetas ---------- */
.card{ padding:10px 12px; background:var(--pal-card); border-left:5px solid var(--pal-card-border); }
.card h3{ margin:0 0 8px; font-size:11px; letter-spacing:.06em; color:#3d6491; text-transform:uppercase; }
.card.tan{ background:#f4e7c4; border-left-color:#c9a13c; }
.card.pink{ background:#fbe3e3; border-left-color:#d6483c; }
.card.green{ background:#e3f0d8; border-left-color:#4f8f4a; }
.card.navy{ background:#132b52; border-left-color:#f7c948; color:#eaf1fb; }
.card.navy h3{ color:#a9c6e8; }
.card .label{ display:block; font-size:9.5px; letter-spacing:.06em; margin-bottom:4px; }
.card .body{ font-size:12.5px; font-weight:500; line-height:1.35; color:#1c2b45; }
.card.navy .body{ color:#dfe9fb; }
.empty{ font-size:12px; color:#5c7597; font-style:italic; }

/* ---------- filas estilo "ledger" (etiqueta ... valor) ---------- */
.row{ display:flex; align-items:baseline; gap:6px; padding:3px 0; font-size:12.5px; }
.row .k{ color:#3d6491; white-space:nowrap; }
.row .leader{ flex:1; border-bottom:1px dotted #9ab6d8; transform:translateY(-3px); min-width:10px; }
.row .v{ font-weight:600; color:#16294a; text-align:right; max-width:56%; }

/* ---------- barra genérica (atributos, nobleza, hacienda) ---------- */
.bar{ position:relative; height:8px; background:#d8e6f7; box-shadow:inset 1px 1px 0 rgba(0,0,0,.15); overflow:hidden; margin-top:3px; }
.bar>i{ position:absolute; inset:0 auto 0 0; height:100%; background:#4f8f4a; box-shadow:inset 0 2px 0 rgba(255,255,255,.4); }
.bar.low>i{ background:#d6483c; } .bar.mid>i{ background:#c9a13c; }

/* ---------- botones pixel-art ---------- */
.btn{ position:relative; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:8px 12px; font-family:'Pixelify Sans',monospace; font-size:11.5px; font-weight:600; letter-spacing:.02em;
  background:#eef7ff; color:#16294a; border:2px solid #1c3a63; cursor:pointer;
  box-shadow:inset 2px 2px 0 #fff, inset -2px -2px 0 #bcd8f2, 2px 2px 0 #1c3a63;
  transition:transform .06s steps(1); }
.btn:active{ transform:translate(2px,2px); box-shadow:inset 2px 2px 0 #bcd8f2, inset -2px -2px 0 #fff; }
.btn.primary{ background:#f7c948; border-color:#6b490f; box-shadow:inset 2px 2px 0 #fff3c4, inset -2px -2px 0 #c9922a, 2px 2px 0 #6b490f; }
.btn.primary:active{ box-shadow:inset 2px 2px 0 #c9922a, inset -2px -2px 0 #fff3c4; }
.btn.ghost{ background:#cfe4ff; box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 #9ab6d8, 2px 2px 0 #6f8bab; border-color:#3d6491; }
.btn.danger{ background:#f7c9c9; border-color:#8a231e; box-shadow:inset 2px 2px 0 #ffe4e4, inset -2px -2px 0 #d6483c, 2px 2px 0 #8a231e; }
.btn:disabled{ opacity:.4; cursor:not-allowed; transform:none !important; }
.btn.small{ padding:5px 9px; font-size:10px; }
.btn.block{ width:100%; }
.actions-row{ display:flex; flex-wrap:wrap; gap:7px; margin-top:9px; }

/* ---------- insignias / tags ---------- */
.taglist{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.tag{ font-size:10px; padding:3px 8px; background:#eef7ff; border:2px solid #1c3a63; color:#16294a; letter-spacing:.02em; }
.tag.on-tan{ background:#fff8e6; }

/* ---------- filas de persona (familia / pueblo / listas) ---------- */
.list-row{ display:flex; align-items:center; gap:9px; padding:9px 10px; background:var(--pal-card); border-left:5px solid var(--pal-card-border); }
.list-row + .list-row{ margin-top:7px; }
.list-row .info{ flex:1; min-width:0; }
.list-row .name{ font-size:13px; font-weight:600; color:#16294a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.list-row .role{ font-size:10.5px; color:#5c7597; margin-top:1px; }
.list-row .side{ text-align:right; flex:none; }
.list-row .pct{ font-size:13px; font-weight:700; }
.list-row .pct.warm{ color:#3f8a3f; } .list-row .pct.cool{ color:#8a6414; } .list-row .pct.hostile{ color:#b5352a; }
.list-row .tiny{ font-size:9.5px; color:#5c7597; text-transform:uppercase; letter-spacing:.03em; }
.list-row.dead{ opacity:.55; }
.list-row.clickable{ cursor:pointer; }

/* ---------- rejilla de actividades HACER ---------- */
.do-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.do-card{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; padding:10px; background:#f4e7c4; border-left:5px solid #c9a13c; cursor:pointer; text-align:left; border-top:none;border-right:none;border-bottom:none; font-family:'Pixelify Sans',monospace; }
.do-card .ic{ width:26px; height:26px; }
.do-card .t{ font-size:12px; font-weight:700; color:#16294a; }
.do-card .s{ font-size:10px; color:#5c7597; line-height:1.25; }
.do-card:disabled{ opacity:.4; cursor:not-allowed; }

/* ---------- genealogía (árbol vertical, una generación debajo de otra) ---------- */
.gentree{ display:flex; flex-direction:column; align-items:stretch; gap:2px; }
.genlevel{ display:flex; flex-direction:column; align-items:center; position:relative; padding-top:10px; }
.genlevel:not(:first-child)::before{ content:''; position:absolute; top:0; left:50%; width:2px; height:10px; background:#a9c0d8; }
.genlevel h4{ font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:#3d6491; margin:0 0 6px; text-align:center; }
.genlevel-row{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px 8px; width:100%; }
.genperson{ display:flex; flex-direction:column; align-items:center; width:66px; cursor:pointer; text-align:center; }
.genperson .portrait{ margin-bottom:3px; }
.genperson .n{ font-weight:600; color:#16294a; font-size:9.5px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.genperson .r{ color:#3d6491; font-size:8.5px; text-transform:uppercase; letter-spacing:.03em; }
.genperson .y{ color:#5c7597; font-size:9px; }
.genperson.you .portrait{ border-color:#c9a13c; box-shadow:inset 2px 2px 0 #fff6df, inset -3px -3px 0 #cba766, 0 0 0 2px #c9a13c; }
.genperson.you .n{ color:#8a5a12; }
.portrait.gen{ width:44px; height:44px; border-width:2px; }
.portrait.gen img{ width:30px; height:30px; }
.portrait.dead{ filter:grayscale(1); opacity:.75; }

/* ---------- escena de la hacienda ---------- */
.homestead{ display:flex; flex-direction:column; gap:6px; padding:8px 4px; }
.homestead .row-icons{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.homestead .row-icons .slot{ width:22px; height:22px; }
.homestead .cap{ font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:#3d6491; }

/* ---------- feed de vida (mejora de diseño 2026-09 #6): cada suceso es su propia tarjeta
   con icono y color por tipo, en vez de una lista plana de texto — "una imagen dice más
   que mil palabras". Reemplaza el viejo .hist-item plano (misma info, mejor legibilidad). */
.feed-item{ display:flex; gap:9px; padding:8px 9px; margin-bottom:6px; background:var(--pal-card); border-left:4px solid var(--pal-card-border); }
.feed-item:last-child{ margin-bottom:0; }
.feed-item.tan{ background:#f4e7c4; border-left-color:#c9a13c; }
.feed-item.pink{ background:#fbe3e3; border-left-color:#d6483c; }
.feed-item.green{ background:#e3f0d8; border-left-color:#4f8f4a; }
.feed-item.navy{ background:#132b52; border-left-color:#f7c948; }
.feed-item.navy .feed-title{ color:#eaf1fb; }
.feed-item.navy .feed-desc{ color:#a9c6e8; }
.feed-item.navy .feed-year{ color:#7c93a8; }
.feed-icon{ flex:none; width:22px; height:22px; display:flex; align-items:center; justify-content:center; }
.feed-icon img.pixel{ width:18px; height:18px; }
.feed-icon .slot{ width:18px; height:18px; }
.feed-body{ flex:1; min-width:0; }
.feed-top{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.feed-title{ font-size:12px; font-weight:600; color:#16294a; }
.feed-year{ font-size:9.5px; color:#6b8199; flex:none; }
.feed-desc{ font-size:11px; color:#3d6491; margin-top:2px; line-height:1.3; }
/* ---------- separador de año, minimalista (mejora de diseño 2026-09 #10): entre bloques de años
   distintos en el feed continuo de VIDA, sin encabezados grandes ni ocupar demasiado espacio. */
.year-sep{ display:flex; align-items:center; gap:8px; margin:12px 2px 2px; }
.year-sep:first-child{ margin-top:2px; }
.year-sep-line{ flex:1; height:2px; background:#9ab6d8; opacity:.55; }
.year-sep-label{ font-size:9px; letter-spacing:.07em; color:#3d6491; text-transform:uppercase; white-space:nowrap; font-weight:600; }
/* compatibilidad: la Crónica completa reutiliza el mismo componente (eventItem) */
.hist-item{ display:flex; gap:10px; padding:8px 0; border-bottom:1px solid #b9d4ef; }
.hist-item:last-child{ border-bottom:none; }
.hist-year{ font-size:11px; font-weight:700; color:#8a6414; width:38px; flex:none; }
.hist-title{ font-size:12px; font-weight:600; color:#16294a; }
.hist-desc{ font-size:11px; color:#3d6491; }

/* ---------- footer + AGE UP ---------- */
.footer{ background:var(--pal-app); padding:10px 12px 8px; }
.actions-remaining{ text-align:center; font-size:11px; letter-spacing:.05em; color:#eaf1fb; margin-bottom:8px; }
.age-up{ position:relative; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
  background:#f7c948; border:3px solid #6b490f; box-shadow:inset 3px 3px 0 #fff3c4, inset -3px -3px 0 #c9922a, 0 5px 0 #6b490f;
  padding:12px 0 11px; margin-bottom:8px; cursor:pointer; overflow:hidden; transition:transform .06s steps(1); font-family:'Pixelify Sans',monospace; }
.age-up::before{ content:""; position:absolute; left:6px; top:5px; width:34%; height:9px; background:#fff9dd; opacity:.75; }
.age-up:active{ transform:translateY(5px); box-shadow:inset 3px 3px 0 #c9922a, inset -3px -3px 0 #fff3c4; }
.age-up .tri{ width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent; border-bottom:11px solid #5b3c06; }
.age-up span{ font-size:14px; font-weight:600; color:#5b3c06; letter-spacing:.03em; }
.age-up:disabled{ opacity:.55; cursor:not-allowed; }

/* ---------- nav inferior sin ilustraciones (mejora de diseño 2026-09 #9): solo cajas/botones,
   la pestaña activa se marca con el propio botón relleno, no con un ícono. */
.navbar{ display:grid; grid-template-columns:repeat(6,1fr); background:var(--pal-navbar); padding:8px 4px calc(10px + env(safe-area-inset-bottom)); gap:4px; }
.navitem{ display:flex; align-items:center; justify-content:center; padding:9px 2px; cursor:pointer; background:var(--pal-navitem); border:2px solid var(--pal-navitem-border); font-family:'Pixelify Sans',monospace; box-shadow:inset 1px 1px 0 rgba(255,255,255,.08); }
.navitem.active{ background:#f4726c; border-color:#7a231e; box-shadow:inset 2px 2px 0 #ffb1ab, inset -2px -2px 0 #c0453d; }
.navitem span{ font-size:9px; letter-spacing:.02em; color:#a9c0dd; text-align:center; line-height:1.2; }
.navitem.active span{ color:#fff; font-weight:600; }

/* ---------- modal (mismo lenguaje visual, tema pixel-art) ---------- */
.overlay{ position:fixed; inset:0; background:rgba(10,20,40,.65); display:flex; align-items:center; justify-content:center; padding:16px; z-index:100; }
.modal{ width:100%; max-width:400px; max-height:88vh; overflow-y:auto; background:#eef7ff; border:3px solid #1c3a63;
  box-shadow:inset 2px 2px 0 #fff, 6px 6px 0 #0a2144; padding:16px; font-family:'Pixelify Sans',monospace; color:#16294a; }
.modal h2{ margin:0 0 6px; font-size:15px; }
.modal .eyebrow{ font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; color:#c9922a; margin-bottom:6px; font-weight:700; }
.modal p{ font-size:12.5px; color:#3d6491; margin:8px 0; line-height:1.4; }
.option{ display:block; width:100%; text-align:left; background:#f3f7ee; border:2px solid #7c93a8; padding:9px 11px; margin-top:7px; cursor:pointer; color:#16294a; font-family:'Pixelify Sans',monospace; font-size:11.5px; }
.option:hover{ border-color:#1c3a63; }
.option b{ display:block; font-size:11.5px; margin-bottom:2px; }
.modal-close-row{ margin-top:14px; display:flex; justify-content:flex-end; }
.divider{ border:none; border-top:2px solid #bcd8f2; margin:12px 0; }

/* ---------- tutorial guiado tipo spotlight (mejora de diseño 2026-09 #13) ----------
   .tut-hole no tiene fondo propio: su enorme box-shadow oscurece TODO menos su propio hueco,
   dejando ver (y, como pointer-events:none, pulsar) el botón real que hay debajo sin necesidad
   de recortar la superposición con clip-path. El bloqueo de cualquier otro click se hace en JS
   (ver el listener de clicks), no aquí — así este overlay puede quedarse puramente visual. */
.tut-hole{ position:fixed; pointer-events:none; border:2px solid #f7c948; z-index:201;
  box-shadow:0 0 0 3000px rgba(8,14,28,.74), inset 0 0 0 2px rgba(255,255,255,.35); transition:all .15s steps(3); }
.tut-card{ position:fixed; z-index:202; width:230px; max-width:calc(100vw - 24px); pointer-events:none;
  background:#eef7ff; border:3px solid #1c3a63; box-shadow:inset 2px 2px 0 #fff, 5px 5px 0 #0a2144;
  padding:11px 13px; font-family:'Pixelify Sans',monospace; color:#16294a; }
.tut-card .tut-eyebrow{ font-size:9px; text-transform:uppercase; letter-spacing:.1em; color:#c9922a; font-weight:700; margin-bottom:4px; }
.tut-card .tut-title{ font-size:13px; font-weight:700; margin-bottom:4px; }
.tut-card .tut-text{ font-size:11px; color:#3d6491; line-height:1.35; }
.tut-card .tut-hint{ font-size:9px; color:#8a6414; margin-top:8px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; }

.autosave{ font-size:9px; color:#a9c6e8; }
.reset-link{ font-size:9px; color:#a9c6e8; text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; }
</style>

/* ---------- camino a la nobleza (v5, Parte 69) ----------
   Se apoya en house.prestige/house.titles, que existían desde v2 pero nunca se usaban.
   Escala 0-1000 para que la progresión de una dinastía sea lenta y se note por generaciones,
   no por una sola acción. prestige NUNCA se resetea al cambiar de personaje jugable: es del
   linaje (house), no del individuo. */
const NOBILITY_RANKS = [
  {key:'peasant', label:'Campesino/a', floor:0},
  {key:'squire',  label:'Escudero/a',  floor:200},
  {key:'knight',  label:'Caballero/a', floor:400},
  {key:'noble',   label:'Noble',       floor:600},
  {key:'baron',   label:'Barón/esa',   floor:800},
  {key:'king',    label:'Rey/Reina',   floor:950}
];
function getNobilityRankIndex(house){
  const p=clamp(house? house.prestige:0, 0, 1000);
  let idx=0;
  for(let i=0;i<NOBILITY_RANKS.length;i++) if(p>=NOBILITY_RANKS[i].floor) idx=i;
  return idx;
}
function getNobilityProgress(house){
  const idx=getNobilityRankIndex(house);
  const cur=NOBILITY_RANKS[idx], next=NOBILITY_RANKS[idx+1];
  const p=clamp(house? house.prestige:0, 0, 1000);
  if(!next) return {rank:cur, next:null, pct:100};
  const pct=Math.round(((p-cur.floor)/(next.floor-cur.floor))*100);
  return {rank:cur, next, pct:clamp(pct,0,99)};
}
function bumpPrestige(house, delta){ if(!house) return; house.prestige=clamp((house.prestige||0)+delta,0,1000); }

/* ---------- economía de la hacienda: Reservas / Seguridad / Lealtad (v5, Parte 70) ----------
   Reservas se deriva de hh.grainStores (ya existía); Seguridad y Lealtad son campos nuevos 0-100.
   Prosperidad = la MENOR de las tres — igual que en la pantalla HACIENDA. */
function getHoldingResources(hh){
  const stores=clamp(Math.round((hh.grainStores||0)/40*100),0,100);
  const security=clamp(Math.round(hh.security||0),0,100);
  const loyalty=clamp(Math.round(hh.loyalty||0),0,100);
  return {stores, security, loyalty, prosperity:Math.min(stores,security,loyalty)};
}
/* una orden de hacienda al año: el/la cabeza de hogar decide dónde invertir (Parte 70) */
function doEstateOrder(kind){
  const p=player(world); if(!canManageHousehold(p)) return; const hh=household(world); if(!hh) return;
  if(hh.money<4) return;
  hh.money=Math.round((hh.money-4)*10)/10;
  if(kind==='stores'){ hh.grainStores=(hh.grainStores||0)+rand(6,12); plog(world,'Orden de hacienda','Ordenaste reforzar los graneros y las reservas de la hacienda.','hacienda',[p.id]); }
  else if(kind==='security'){ hh.security=clamp((hh.security||0)+rand(6,12),0,100); plog(world,'Orden de hacienda','Ordenaste reforzar la seguridad de tus tierras.','hacienda',[p.id]); }
  else if(kind==='loyalty'){ hh.loyalty=clamp((hh.loyalty||0)+rand(6,12),0,100); plog(world,'Orden de hacienda','Pasaste tiempo con la gente de tu hacienda; su lealtad crece.','hacienda',[p.id]); }
  save(); render();
}
/* resolución anual de la hacienda (Parte 70): deriva lenta + premio de prosperidad + riesgo si algo se abandona */
function resolveHoldingEconomy(w, turnLog){
  for(const hh of Object.values(w.households)){
    if(hh.security===undefined) hh.security=rand(30,50);
    if(hh.loyalty===undefined) hh.loyalty=rand(30,50);
    hh.security=clamp(hh.security+rand(-2,1),0,100);
    hh.loyalty=clamp(hh.loyalty+rand(-2,1),0,100);
    const res=getHoldingResources(hh);
    const head=hh.headId?C(hh.headId):null;
    if(res.prosperity>=75){
      hh.money=Math.round((hh.money+5)*10)/10;
      if(head && head.alive) head.reputation=clamp(head.reputation+2,0,100);
      if(head && head.id===w.playerId) turnLog.push(log(w,'La hacienda prospera','Tu hacienda vive un buen año: reservas, seguridad y lealtad se sostienen altas.','hacienda',[head.id]));
    }
    hh.lowStreak = res.prosperity<15 ? (hh.lowStreak||0)+1 : 0;
    if(hh.lowStreak>=2 && head && head.alive){
      hh.lowStreak=0;
      const hit=pick(['stores','security','loyalty']);
      if(hit==='stores'){ hh.grainStores=Math.max(0,(hh.grainStores||0)-rand(3,8));
        if(head.id===w.playerId) turnLog.push(log(w,'Hambruna en tus tierras','Tus reservas llevaban demasiado tiempo bajas: parte del grano se pierde.','hacienda',[head.id])); }
      else if(hit==='security'){ hh.money=Math.max(0,hh.money-rand(2,6));
        if(head.id===w.playerId) turnLog.push(log(w,'Bandidaje','Sin vigilancia, unos bandidos saquean parte de tu hacienda.','hacienda',[head.id])); }
      else { bumpRelationship(w, head.id, head.id, 0);
        if(head.id===w.playerId) turnLog.push(log(w,'Descontento','La gente de tu hacienda murmura; la lealtad llevaba demasiado tiempo abandonada.','hacienda',[head.id])); }
    }
    /* población: si las tres reservas están altas, la hacienda atrae a alguien nuevo (Parte 70) */
    if(res.stores>=60 && res.security>=60 && res.loyalty>=60 && chance(0.12) && hh.memberIds.length<10){
      // se refleja como crecimiento del pueblo, no de este hogar concreto (el pueblo ya es persistente, Parte 9)
      w.flags.villageGrowthPoints=(w.flags.villageGrowthPoints||0)+1;
    }
  }
}

/* ---------- ambición de vida (v5, Parte 68): se asigna una sola vez, al cumplir 18 ---------- */
const AMBITIONS = [
  {key:'earn_spurs', label:'Ganar tus espuelas', dataIcon:'ambition:knight',
    progress:(w,p)=> getNobilityProgress(lineage(w,p.id)).pct },
  {key:'master_craft', label:'Llegar a maestro/a en tu oficio', dataIcon:'ambition:craft',
    progress:(w,p)=> p.career && p.career.professionId ? Math.round(clamp(p.career.experience,0,100)) : 0 },
  {key:'rich_household', label:'Ver próspera tu hacienda', dataIcon:'ambition:coin',
    progress:(w,p)=> { const hh=household(w,p.id); return hh? getHoldingResources(hh).prosperity : 0; } },
  {key:'many_kin', label:'Formar una familia numerosa', dataIcon:'ambition:family',
    progress:(w,p)=> Math.min(100, (p.childrenIds||[]).length*25) },
  {key:'well_loved', label:'Ser querido/a por todo el pueblo', dataIcon:'ambition:heart',
    progress:(w,p)=> Math.round(clamp(p.reputation,0,100)) },
  {key:'devout_life', label:'Vivir una vida devota', dataIcon:'ambition:faith',
    progress:(w,p)=> Math.round(clamp(p.faith,0,100)) }
];
function resolveAmbition(w, p, turnLog){
  if(p.ambition || p.age!==18) return;
  const choice=pick(AMBITIONS);
  p.ambition={key:choice.key, assignedYear:w.year};
  turnLog.push(log(w, 'Tu ambición de vida', `Decides qué quieres hacer de tu vida: ${genderText(choice.label,p.sex).toLowerCase()}.`,'personaje',[p.id]));
}
function getAmbition(p){
  if(!p.ambition) return null;
  const def=AMBITIONS.find(a=>a.key===p.ambition.key); if(!def) return null;
  return {def, pct:clamp(def.progress(world,p),0,100)};
}

function doChapel(){ const p=player(world); if(!p||p.age<7) return; if(!useAction()) return;

  else if(p.age<16) text='Te sentaste en un rincón de la capilla, en silencio, mientras los mayores rezaban.';
  else text='Pasaste tiempo en oración y en calma.';

function doTavern(){ const p=player(world); if(!p||p.age<14) return; const hh=household(world); if(!useAction()) return;

  const spouse=p.spouseId?C(p.spouseId):null;
  if(known.length && chance(0.6)) bumpRelationship(world,p.id,pick(known).id,rand(2,6));
  if(spouse && spouse.alive && chance(0.15)){
    bumpRelationship(world,p.id,spouse.id,-rand(2,5));
    plog(world,'Te esperaban en casa',`${spouse.firstName} te esperó ${genderText('despierto/a',spouse.sex)}, y no de buen humor.`,'ocio',[p.id,spouse.id]);
  } else if(chance(0.12)){
    p.reputation=clamp(p.reputation-rand(2,5),0,100);

  } else if(hh && householdStatus(hh)==='destitute'){
    plog(world,'Ahogar las penas','Bebiste más de la cuenta, tratando de no pensar en las deudas de la hacienda.','ocio',[p.id]);
  } else {

function doDice(){ const p=player(world); if(!p||p.age<14) return; if(!useAction()) return;

  } else {
    p.personalMoney=Math.round(Math.max(0,(p.personalMoney||0)-stake)*10)/10;
    if(poor && stake>0){ p.reputation=clamp(p.reputation-1,0,100);
      plog(world,'No podías perder eso','Perdiste unas monedas que tu familia necesitaba. Alguien se dio cuenta.','ocio',[p.id]); }
    else plog(world,'Mala suerte en los dados','Perdiste unas monedas jugando a los dados.','ocio',[p.id]);

function doFeast(){ const p=player(world); if(!canManageHousehold(p)) return; const hh=household(world); if(hh.money<5) return; if(!useAction()) return;

function doFair(){ const p=player(world); if(!p||p.age<8) return; if(!useAction()) return;

function doTrain(){ const p=player(world); if(!p||p.age<12) return; if(!useAction()) return;

/* ---------- genética de apariencia (Partes 24-29, reescrito v7) ----------
   Reemplaza la "herencia visual" de v5 (promedio ± ruido, sin base real)
   por un modelo mendeliano de verdad: cada rasgo heredable es un genotipo
   diploide (2 alelos por locus, uno de cada progenitor) que se combina por
   meiosis real — cada hijo recibe UN alelo al azar de cada par de CADA
   progenitor, no un promedio de los dos. Pensado para casar con el arte
   real de pack/variantes (5 tonos de piel × 11 colores de pelo, 43 de 55
   combinaciones piel+pelo con sprite dibujado — ver
   generar_sprites_medievales.bat / manifest.csv).

   - PIEL: rasgo POLIGÉNICO aditivo, como en la genética real (varios genes
     — SLC24A5, SLC45A2, OCA2, TYR, KITLG... — suman melanina, no hay un
     solo gen "dominante" que decida el tono). 4 loci × 2 alelos
     (0=claro,1=oscuro) → suma 0-8 → 5 tonos. Al ser una suma de variables
     al azar, la distribución sale en campana (tonos intermedios más
     comunes que los extremos) en vez de plana — efecto real de la
     herencia poligénica, no un ajuste manual.
   - PELO (pigmento): mismo tipo de modelo, 3 loci × 2 alelos → suma 0-6 →
     de negro (0) a rubio claro (6).
   - PELIRROJO: un gen aparte, recesivo, al estilo del MC1R real — solo se
     expresa en homocigoto (rr). Un portador (Rr) no lo muestra pero puede
     transmitirlo: dos padres de pelo oscuro sin pelirrojos visibles
     pueden tener un hijo pelirrojo "sorpresa", igual que en la vida real.
     Frecuencia del alelo ~15% → ~2% de la población nace rr, similar al
     porcentaje real de pelirrojos.
   - El gen pelirrojo interactúa con el eje de pigmento en vez de ser un
     color más de la lista: activo + pigmento claro = pelirrojo; activo +
     pigmento oscuro = auburn/rojizo oscuro. Son la misma mutación
     expresándose sobre una base clara u oscura, no dos genes distintos.
   - CANOSO y BLANCO NO son genotipo — son el pelo natural cubierto por la
     edad (ver displayedHairColorKey): todo el mundo encanece si vive lo
     bastante, así que no tiene sentido "heredar" ser canoso. Cada
     personaje recibe su propia edad de inicio (rollGrayOnset) una sola
     vez, no una edad fija para todo el mundo.
   - BARBA sigue ligada al color de pelo real del personaje (mismo tile,
     "1 por pelo" como pide el catálogo de arte), pero llevarla o no es
     aseo/elección personal, no genotipo.
   - ROPA (camisa/pantalón/vestido/accesorio) NO es genética — es elección/
     posición social, y queda fuera de este sistema a propósito (unidad
     aparte pendiente).
   - Límite del arte real: solo 43 de las 55 combinaciones piel+pelo
     teóricas tienen sprite dibujado (allowedHairBySkin en
     generar_sprites_medievales.bat — más claro el pelo, más se restringe
     al oscurecer la piel; pelirrojo natural solo dibujado en piel 1-3,
     auburn en las 5). clampHairPigment() recorta SOLO lo que se muestra
     este retrato; el genotipo completo se guarda igual, así que un tono
     de pelo claro "latente" puede reaparecer en un descendiente de piel
     más clara. Es una limitación del arte disponible, no una regla
     biológica real — documentado así para no confundir una cosa con otra. */
const HAIR_PIGMENT_NAMES = ['black','dark_brown','brown','light_brown','dark_blond','blond','light_blond'];
const HAIR_CODE = {black:'bk',dark_brown:'db',brown:'br',light_brown:'lb',dark_blond:'dd',blond:'bd',light_blond:'ld',ginger:'gi',auburn:'au',gray:'gy',white:'wh'};
const SKIN_LOCI_N = 4, HAIR_LOCI_N = 3;
const RED_ALLELE_FREQ = 0.15; // frecuencia del alelo recesivo -> ~2% homocigotos (rr) al nacer, similar a la frecuencia real de pelirrojos
const MUTATION_RATE = 0.015; // por alelo, en cada concepción — no es la tasa real (muchísimo más baja), es para que 40-60 años de partida no agoten la diversidad de un pueblo de 12-20 fundadores

function randomLocusPair(pDark){ const a=()=>chance(pDark)?1:0; return [a(),a()]; }
function randomGenotype(){
  return {
    skinLoci: Array.from({length:SKIN_LOCI_N},()=>randomLocusPair(0.5)),
    hairLoci: Array.from({length:HAIR_LOCI_N},()=>randomLocusPair(0.5)),
    redAlleles: [chance(RED_ALLELE_FREQ)?1:0, chance(RED_ALLELE_FREQ)?1:0]
  };
}
function gameteAllele(pair){ const a = pair[chance(0.5)?0:1]; return chance(MUTATION_RATE) ? (a?0:1) : a; }
function inheritLocusPair(fatherPair, motherPair){ return [gameteAllele(fatherPair), gameteAllele(motherPair)]; }
function inheritGenotype(fatherGenotype, motherGenotype){
  const fg = fatherGenotype || randomGenotype(), mg = motherGenotype || randomGenotype();
  return {
    skinLoci: fg.skinLoci.map((fp,i)=>inheritLocusPair(fp, mg.skinLoci[i])),
    hairLoci: fg.hairLoci.map((fp,i)=>inheritLocusPair(fp, mg.hairLoci[i])),
    redAlleles: inheritLocusPair(fg.redAlleles, mg.redAlleles)
  };
}
function sumLoci(loci){ return loci.reduce((s,pair)=>s+pair[0]+pair[1],0); }
function skinIndexFromGenotype(g){
  const s = sumLoci(g.skinLoci); // 0-8
  if(s<=1) return 1; if(s<=3) return 2; if(s===4) return 3; if(s<=6) return 4; return 5;
}
function rawHairPigmentIndex(g){ return sumLoci(g.hairLoci); } // 0-6, 0=negro .. 6=rubio claro
function hasRedGene(g){ return g.redAlleles[0]===1 && g.redAlleles[1]===1; }
/* recorta el eje de pigmento a lo que existe dibujado para ese tono de piel
   (pack/variantes: allowedHairBySkin, maxH = 7-tonoDePiel reproduce la
   tabla exacta del generador sin tener que copiarla entera aquí) */
function clampHairPigment(skinIndex, rawH){ return Math.min(rawH, 7-skinIndex); }
function naturalHairColorKey(genotype, skinIndex){
  const h = clampHairPigment(skinIndex, rawHairPigmentIndex(genotype));
  if(hasRedGene(genotype)) return h>=4 ? 'ginger' : 'auburn';
  return HAIR_PIGMENT_NAMES[h];
}

/* encanecer es un fenómeno de la edad, no del genotipo: misma lógica para
   cualquier color de pelo natural. Edades de inicio propias de cada
   individuo, sorteadas una sola vez al crear el personaje (no en cada
   render) para que no cambien de un año a otro. */
function rollGrayOnset(){ const start = rand(38,55); return { grayOnsetAge: start, whiteOnsetAge: start + rand(12,25) }; }
function displayedHairColorKey(ch){
  const a = ch && ch.appearance; if(!a) return 'brown';
  if(typeof a.grayOnsetAge==='number'){
    if(ch.age >= a.whiteOnsetAge) return 'white';
    if(ch.age >= a.grayOnsetAge) return 'gray';
  }
  return a.hairColorKey || 'brown';
}

/* migra apariencias de antes de la genética real (solo guardaban
   {skinTone 0-4, hairType textura, beard} sin genotipo) a un genotipo
   sintético compatible, para no "resetear" el aspecto de personajes ya
   vivos en una partida guardada. hairType nunca fue un color (era textura:
   straight/curly/red/white/bald) así que no hay color previo que
   preservar ahí — el pelo nuevo sale al azar; la piel sí se reconstruye
   sesgada hacia el tono que ya tenía. Perezoso: una sola vez por
   personaje, la primera vez que hace falta su genotipo real (hoy: al
   convertirse en padre/madre). */
function ensureGenotypeSync(ch){
  const a = ch && ch.appearance; if(!a || a.genotype) return;
  const priorSkinIndex = clamp((typeof a.skinTone==='number'?a.skinTone:2)+1, 1, 5);
  const pDark = (priorSkinIndex-1)/4;
  const genotype = {
    skinLoci: Array.from({length:SKIN_LOCI_N},()=>randomLocusPair(pDark)),
    hairLoci: Array.from({length:HAIR_LOCI_N},()=>randomLocusPair(0.5)),
    redAlleles: [chance(RED_ALLELE_FREQ)?1:0, chance(RED_ALLELE_FREQ)?1:0]
  };
  const skinIndex = skinIndexFromGenotype(genotype);
  a.genotype = genotype;
  a.skinIndex = skinIndex;
  a.skinTone = skinIndex-1;
  a.hairColorKey = naturalHairColorKey(genotype, skinIndex);
  if(typeof a.grayOnsetAge!=='number') Object.assign(a, rollGrayOnset());
  if(typeof a.beard!=='boolean') a.beard = chance(0.35);
}

function randomAppearance(){
  const genotype = randomGenotype();
  const skinIndex = skinIndexFromGenotype(genotype);
  return {
    genotype, skinIndex, skinTone: skinIndex-1,
    hairColorKey: naturalHairColorKey(genotype, skinIndex),
    ...rollGrayOnset(),
    beard: chance(0.35)
  };
}
function inheritAppearance(father, mother){
  ensureGenotypeSync(father); ensureGenotypeSync(mother);
  const genotype = inheritGenotype(father&&father.appearance&&father.appearance.genotype, mother&&mother.appearance&&mother.appearance.genotype);
  const skinIndex = skinIndexFromGenotype(genotype);
  return {
    genotype, skinIndex, skinTone: skinIndex-1,
    hairColorKey: naturalHairColorKey(genotype, skinIndex),
    ...rollGrayOnset(),
    beard: chance(0.35)
  };
}

/* ---------- etapas de vida y capacidades del personaje (Partes 6-7) ---------- */
const LIFE_STAGES=[
  {key:'baby', min:0, max:2, label:'bebé'},
  {key:'earlyChildhood', min:3, max:5, label:'primera infancia'},
  {key:'childhood', min:6, max:8, label:'niñez'},
  {key:'olderChildhood', min:9, max:11, label:'niñez mayor'},
  {key:'adolescence', min:12, max:15, label:'adolescencia'},
  {key:'youth', min:16, max:19, label:'juventud'},
  {key:'adulthood', min:20, max:49, label:'adultez'},
  {key:'maturity', min:50, max:64, label:'madurez'},
  {key:'oldAge', min:65, max:9999, label:'vejez'}
];
function getLifeStage(ch){
  const age=ch.age;
  return LIFE_STAGES.find(s=>age>=s.min && age<=s.max) || LIFE_STAGES[LIFE_STAGES.length-1];
}
/* Parte 36: el título refleja el oficio real cuando ya existe, no solo la etapa de vida */
function getStageTitle(ch){
  const stage=getLifeStage(ch).key;
  const village=WORLD_FLAVOR.villageName;
  const occ = (typeof getDisplayOccupation==='function') ? getDisplayOccupation(ch) : null;
  if(stage==='baby') return (ch.sex==='M'?'Recién nacido':'Recién nacida')+' de '+village;
  if(stage==='earlyChildhood'||stage==='childhood'||stage==='olderChildhood') return (ch.sex==='M'?'Niño':'Niña')+' de '+village;
  if(stage==='adolescence') return (occ? 'Joven '+occ.toLowerCase() : (ch.sex==='M'?'Muchacho':'Muchacha'))+' de '+village;
  if(stage==='oldAge') return (occ || (ch.sex==='M'?'Anciano':'Anciana'))+' de '+village;
  if(occ) return occ+' de '+village;
  if(stage==='youth') return (ch.sex==='M'?'Joven campesino':'Joven campesina')+' de '+village;
  return (ch.sex==='M'?'Campesino':'Campesina')+' de '+village;
}
/* rasgos: se descubren con el tiempo, no se conocen todos desde el nacimiento (Parte 21) */
function getVisibleTraits(ch){
  const age=ch.age;
  const n = age<3?0 : age<7?1 : age<12?2 : ch.traits.length;
  return ch.traits.slice(0,n);
}
/* fuente de verdad central: qué puede ver/hacer un personaje según su edad (Parte 6) */
function getPlayerCapabilities(ch){
  const age=ch.age;
  const jailed=isJailed(ch);
  return {
    stage: getLifeStage(ch).key,
    annualActionsMax: jailed?0:(age<3?0 : age<9?1 : age<16?2 : 3),
    jailed,
    canSeeRelaciones: age>=3,
    canHandleAnimals: age>=6,
    canFarm: age>=9,
    canSeeMundo: age>=9,
    canSeeHistoria: age>=9,
    canSeePropiedades: age>=12,
    canSeeHouseholdDescriptive: age>=12,
    canSeekApprenticeship: age>=12,
    canSeeExactMoney: age>=15,
    canSeeReputation: age>=15,
    canSeeAdultEconomy: age>=15,
    canEarnPersonalMoney: age>=13,
    canSeePersonalMoney: age>=13,
    canSeeWorldFull: age>=16,
    canMarry: age>=16,
    canPursueRomance: age>=16,
    canSeeAdultProfession: age>=16,
    canTrade: age>=16,
    canWorkProfession: age>=16,
    canContributeMoney: age>=16,
    canLeaveHome: canLeaveHousehold(ch),
    canManageHousehold: canManageHousehold(ch)
  };
}
/* la edad NO da autoridad automática: solo la cabeza de hogar adulta administra (Parte 14).
   Mejora de diseño 2026-09 #14: mientras se cumple una condena tampoco se puede administrar
   nada — un único punto de verdad, así todas las acciones de hacienda/mercado/oficio que ya
   llamaban a esta función quedan bloqueadas sin tener que tocarlas una por una. */
function canManageHousehold(ch){
  if(ch.age<16) return false;
  if(isJailed(ch)) return false;
  const hh = ch.householdId? world.households[ch.householdId] : null;
  return !!(hh && hh.headId===ch.id);
}
/* pestañas dinámicas (Parte 19) */
/* ---------- v5 (Parte 72): 6 pantallas de nav inferior, en vez del menú de pestañas anterior.
   'familia' y 'mundo' (v1-v4) no desaparecen: viven como filtros DENTRO de 'gente' y 'vida'. */
const TAB_DEFS=[
  ['vida','Vida',0],
  ['hacer','Hacer',6],
  ['gente','Gente',3],
  ['hacienda','Hacienda',12],
  ['tienda','Tienda',12],
  ['yo','Yo',0]
];
function getAvailableTabs(p){ return TAB_DEFS.filter(([,,minAge])=>p.age>=minAge).map(([k,l])=>[k,l]); }

/* ---------- economía del hogar dirigida por los adultos, no por un niño (Parte 15) ---------- */
function getHouseholdAdults(hh){
  return (hh?hh.memberIds:[]).map(C).filter(c=>c&&c.alive&&c.age>=16);
}
function getHouseholdFarmSkill(hh){
  const adults=getHouseholdAdults(hh);
  if(!adults.length) return 15; // hogar sin adultos (huérfanos): subsistencia mínima
  return adults.reduce((s,c)=>s+c.skills.farming,0)/adults.length;
}
function getHouseholdLabor(hh){
  const adults=getHouseholdAdults(hh).length;
  const helpers=(hh?hh.memberIds:[]).map(C).filter(c=>c&&c.alive&&c.age>=9&&c.age<16).length;
  return adults + helpers*0.3;
}
/* si la cabeza de hogar muere o se va, alguien más razonable toma su lugar (Parte 38) */
function resolveHouseholdHead(hh){
  if(!hh) return;
  const head=C(hh.headId);
  if(head && head.alive && hh.memberIds.includes(head.id)) return;
  const members=hh.memberIds.map(C).filter(Boolean);
  const spouse = head? members.find(m=>m.alive && m.id===head.spouseId) : null;
  const adultChild = members.filter(m=>m.alive && m.age>=16).sort((a,b)=>b.age-a.age)[0];
  const anyAdult = members.filter(m=>m.alive && m.age>=16)[0];
  const eldest = members.filter(m=>m.alive).sort((a,b)=>b.age-a.age)[0];
  const next = (spouse&&spouse.alive) ? spouse : (adultChild || anyAdult || eldest);
  if(next) hh.headId = next.id;
}
/* continuar jugando no es lo mismo que heredar legalmente (Parte 39) */
function eligiblePlayableRelatives(deceased){
  return eligibleHeirs(deceased); // misma lógica de cercanía familiar; ver nota en eligibleHeirs
}

/* ================= CareerSystem (v4, Partes 4-9, 26-34) =================
   Trayectoria profesional real, vinculada a PERSONAJES (maestros), no a un
   menú de elección. career.stage avanza con la experiencia; el dinero que
   genera es SIEMPRE del personaje (personalMoney), nunca directamente del
   hogar — ver PersonalEconomySystem más abajo. */
function getProfession(ch){ return (ch.career && ch.career.professionId) ? PROFESSIONS[ch.career.professionId] : null; }
function getCareerLabel(ch){
  const career=ch.career;
  if(!career || !career.professionId || !PROFESSIONS[career.professionId]) return null;
  const prof=PROFESSIONS[career.professionId];
  const base=prof.label;
  let label;
  switch(career.stage){
    case 'helper': label='Ayudante de '+base.toLowerCase(); break;
    case 'apprentice': label='Aprendiz de '+base.toLowerCase(); break;
    case 'worker': label=base; break;
    case 'skilled': label=base+' experimentado/a'; break;
    case 'master': label='Maestro/a de '+base.toLowerCase(); break;
    default: label=base;
  }
  return genderText(label, ch.sex);
}
/* compatibilidad: personajes migrados de v1-v3 solo tenían .profession (texto plano) */
function getDisplayOccupation(ch){
  const fromCareer = getCareerLabel(ch);
  if(fromCareer) return fromCareer;
  if(ch.profession && PROFESSIONS[ch.profession]) return genderText(PROFESSIONS[ch.profession].label, ch.sex);
  return null;
}
/* maestros reales disponibles para aprender un oficio artesanal (Parte 8, 30) */
function findAvailableMasters(ch){
  return Object.values(world.characters).filter(c=>
    c.alive && c.id!==ch.id && c.career && c.career.professionId &&
    PROFESSIONS[c.career.professionId] && PROFESSIONS[c.career.professionId].apprenticeshipRequired &&
    (c.career.stage==='skilled'||c.career.stage==='master') &&
    !isCloseFamily(ch.id, c.id)
  );
}
function startApprenticeship(ch, master){
  ch.career = {professionId:master.career.professionId, stage:'helper', masterId:master.id, startedYear:world.year, experience:0, annualEarnings:0};
  bumpRelationship(world, ch.id, master.id, 15);
  triggerMilestone(world, ch, 'first_apprenticeship', {icon:'🔨', title:'Primer maestro',
    desc:`Comienzas a aprender el oficio de ${genderText(PROFESSIONS[master.career.professionId].label,ch.sex).toLowerCase()} con ${master.firstName} ${master.familyName}.`, major:false});
}
/* profesiones NPC: mismo registro central que el jugador (Parte 26), sin simular cada detalle */
function assignNpcCareer(c, turnLog){
  if(c.id===world.playerId) return;
  if(c.career && c.career.professionId) return;
  // el sesgo de oficios de la región (mejora #4) también pesa en la gente del pueblo, no solo
  // en el fundador de la familia — así un pueblo de montaña de verdad tiene más pastores y
  // mineros que agricultores de trigo.
  const reg=getRegion(world.regionId||'fenwold');
  const entries = Object.entries(PROFESSIONS).filter(([,p])=>!p.apprenticeshipRequired && p.category!=='service');
  const weighted = entries.map(([id,p])=>({w:(reg.professionBias.includes(id)?3:1)*(p.familyLearned?2:1), id}));
  const total=weighted.reduce((s,x)=>s+x.w,0);
  let r=Math.random()*total, chosenId=weighted[weighted.length-1].id;
  for(const it of weighted){ r-=it.w; if(r<=0){ chosenId=it.id; break; } }
  c.career = {professionId:chosenId, stage:'worker', masterId:null, startedYear:world.year, experience:40, annualEarnings:0};
  c.profession = chosenId; // compatibilidad con vistas/saves antiguas
  c.npcProfessionAssigned = true;
  if(turnLog && isCloseFamily(world.playerId, c.id)){
    turnLog.push({year:world.year, title:'Nuevo oficio', desc:`${capitalize(kinRef(world.playerId,c.id))} comenzó a trabajar como ${genderText(PROFESSIONS[chosenId].label,c.sex).toLowerCase()}.`, tag:'personaje', related:[c.id], minor:true});
  }
}
/* progresión anual de TODA carrera activa (jugador y NPC), fuente única (Parte 27, 48) */
function resolveCareers(w, turnLog){
  const p=player(w);
  for(const c of Object.values(w.characters)){
    if(!c.alive || !c.career || !c.career.professionId) continue;
    const prof=PROFESSIONS[c.career.professionId]; if(!prof) continue;
    const isPlayerOrKin = c.id===w.playerId || isCloseFamily(w.playerId, c.id);
    if(c.career.masterId){
      const master=C(c.career.masterId);
      if(!master || !master.alive){
        c.career.masterId=null;
        if(c.id===w.playerId){
          turnLog.push(log(w,'Tu maestro ha muerto','Tu aprendizaje se interrumpe con la muerte de tu maestro/a.','trabajo',[c.id]));
          triggerMilestone(w,c,'master_died',{icon:'⚰️',title:'La pérdida de un maestro',desc:`${c.firstName} pierde a quien le enseñaba su oficio.`,major:false});
        }
        if(c.career.experience<25) c.career.stage='helper';
      }
    }
    let gain=2+rand(0,3);
    if(c.traits.includes('trabajador/a')) gain+=1;
    if(c.traits.includes('perezoso/a')) gain-=1;
    if(c.traits.includes('ambicioso/a')) gain+=1;
    c.career.experience=clamp(c.career.experience+Math.max(0,gain),0,999);
    const stages=prof.stages, idx=stages.indexOf(c.career.stage);
    const thresholds={helper:15, apprentice:30, worker:55, skilled:90};
    const th=thresholds[c.career.stage];
    if(th!==undefined && idx>=0 && idx<stages.length-1 && c.career.experience>=th){
      c.career.stage=stages[idx+1];
      if(isPlayerOrKin) turnLog.push(log(w,'Progreso en el oficio',`${c.firstName} ahora es ${getCareerLabel(c).toLowerCase()}.`,'trabajo',[c.id]));
      if(c.id===w.playerId && c.career.stage==='worker') triggerMilestone(w,c,'first_real_profession',{icon:prof.icon,title:'Tu primer oficio',desc:`Te conviertes en ${genderText(prof.label,c.sex).toLowerCase()}.`,major:false});
      if(c.id===w.playerId && c.career.stage==='skilled') triggerMilestone(w,c,'became_skilled',{icon:'⭐',title:'Trabajador experimentado',desc:`Te has convertido en alguien experimentado en tu oficio.`,major:false});
    }
    const stageMult={helper:0.3, apprentice:0.4, worker:1.0, skilled:1.4, master:1.9};
    let earnings=prof.baseIncome*(stageMult[c.career.stage]||0.5);
    if(c.traits.includes('trabajador/a')) earnings*=1.15;
    if(c.traits.includes('perezoso/a')) earnings*=0.85;
    c.career.annualEarnings=Math.max(0, Math.round(earnings*10)/10);
    if(prof.primarySkill && c.skills[prof.primarySkill]!==undefined) c.skills[prof.primarySkill]=clamp(c.skills[prof.primarySkill]+rand(0,2),0,100);
  }
}
/* ================= PersonalEconomySystem (v4, Partes 15-19) =================
   Dos economías separadas: personalMoney (del personaje) y household.money
   (del hogar). Quien encabeza su propio hogar vuelca ahí sus ingresos —
   es su economía compartida. Quien vive bajo la jefatura de otro se queda
   la mayor parte de lo que gana, y aporta una parte razonable a la casa. */
const DEPENDENT_CONTRIBUTION_RATE = 0.35;
function calculatePersonalIncome(ch){ return (ch.career && ch.career.annualEarnings) || 0; }
function resolvePersonalEconomy(w, turnLog){
  for(const c of Object.values(w.characters)){
    if(!c.alive) continue;
    const earnings=calculatePersonalIncome(c);
    if(!earnings) continue;
    const hh=c.householdId? w.households[c.householdId] : null;
    const isHead = hh && hh.headId===c.id;
    let toPersonal=earnings;
    if(hh && !isHead){
      const toHousehold=Math.round(earnings*DEPENDENT_CONTRIBUTION_RATE*10)/10;
      toPersonal=Math.round((earnings-toHousehold)*10)/10;
      hh.money=Math.round((hh.money+toHousehold)*10)/10;
    } else if(hh && isHead){
      hh.money=Math.round((hh.money+earnings)*10)/10;
      toPersonal=0;
    }
    const before=c.personalMoney||0;
    c.personalMoney=Math.round((before+toPersonal)*10)/10;
    if(before<=0 && c.personalMoney>0 && c.id===w.playerId){
      triggerMilestone(w,c,'first_coin_earned',{icon:'🪙',title:'Tus primeras monedas',desc:`${c.firstName} gana sus primeras monedas propias.`,major:false});
    }
  }
}
/* independencia del jugador: dejar el hogar paterno no regala una granja (Parte 21) */
function canLeaveHousehold(ch){
  if(!ch || ch.age<16) return false;
  const hh = ch.householdId? world.households[ch.householdId] : null;
  if(hh && hh.headId===ch.id) return false; // ya administra su propio hogar
  return true;
}
function computeParentGift(oldHh, ch){
  let money=0, grain=0, animalId=null;
  const head=oldHh? C(oldHh.headId) : null;
  if(head && head.alive && oldHh){
    const rel=getRelationship(world, ch.id, head.id);
    const status=householdStatus(oldHh);
    if(status!=='destitute' && rel>-10){
      money=Math.min(oldHh.money, rand(1,4));
      oldHh.money-=money;
      if(status!=='poor' && chance(0.4)){ grain=Math.min(oldHh.grainStores, rand(2,6)); oldHh.grainStores-=grain; }
      const animals=animalsOf(oldHh);
      if(status!=='poor' && animals.length && chance(0.25)){ animalId=pick(animals).id; }
    }
  }
  return {money, grain, animalId};
}
function leaveHousehold(ch, w=world){
  const oldHh = ch.householdId? w.households[ch.householdId] : null;
  const gift = computeParentGift(oldHh, ch);
  const hhId=uid();
  const startMoney = Math.round((ch.personalMoney||0)*0.7*10)/10 + gift.money;
  const hh={id:hhId, name:'Casa de '+ch.firstName+' '+ch.familyName, headId:ch.id, memberIds:[ch.id],
    money:startMoney, grainStores:gift.grain, security:rand(25,40), loyalty:rand(25,40), propertyIds:[], createdYear:w.year};
  ch.personalMoney=Math.round((ch.personalMoney||0)*0.3*10)/10;
  if(oldHh){
    oldHh.memberIds=oldHh.memberIds.filter(id=>id!==ch.id);
  }
  w.households[hhId]=hh;
  ch.householdId=hhId;
  ch.leftHomeAge=ch.age;
  ch.foundedHouseholdYear=w.year;
  if(gift.animalId){ const a=w.animals[gift.animalId]; if(a) a.ownerHouseholdId=hhId; }
  return hh;
}
/* residencia tras el matrimonio: ya NO es automático que el cónyuge entre al hogar del jugador (Parte 24) */
function resolveMarriageResidence(w, a, b){
  const aHh=a.householdId? w.households[a.householdId] : null;
  const bHh=b.householdId? w.households[b.householdId] : null;
  const aIsHead = aHh && aHh.headId===a.id;
  const bIsHead = bHh && bHh.headId===b.id;
  if(aIsHead){ if(bHh) bHh.memberIds=bHh.memberIds.filter(id=>id!==b.id); b.householdId=aHh.id; if(!aHh.memberIds.includes(b.id)) aHh.memberIds.push(b.id); return aHh; }
  if(bIsHead){ if(aHh) aHh.memberIds=aHh.memberIds.filter(id=>id!==a.id); a.householdId=bHh.id; if(!bHh.memberIds.includes(a.id)) bHh.memberIds.push(a.id); return bHh; }
  const canStay = aHh && householdStatus(aHh)!=='destitute';
  if(canStay && chance(0.5)){
    if(bHh) bHh.memberIds=bHh.memberIds.filter(id=>id!==b.id);
    b.householdId=aHh.id; if(!aHh.memberIds.includes(b.id)) aHh.memberIds.push(b.id);
    return aHh;
  }
  if(bHh) bHh.memberIds=bHh.memberIds.filter(id=>id!==b.id);
  return foundNewHousehold(w, a, null, {reason:'marriage', extraMember:b});
}
/* conocidos: la gente del pueblo se descubre, no se conoce desde el nacimiento (Partes 9-13) */
function getKnownPeople(ch){
  const family = closeFamilyFlat(ch.id);
  const seen=new Set(family.map(m=>m.id));
  const others=(ch.knownCharacterIds||[]).map(C).filter(m=>m && m.alive && m.id!==ch.id && !seen.has(m.id));
  return {family, others};
}
function introduceCharacter(viewer, target){
  if(!viewer || !target || viewer.id===target.id) return;
  viewer.knownCharacterIds=viewer.knownCharacterIds||[];
  target.knownCharacterIds=target.knownCharacterIds||[];
  if(!viewer.knownCharacterIds.includes(target.id)) viewer.knownCharacterIds.push(target.id);
  if(!target.knownCharacterIds.includes(viewer.id)) target.knownCharacterIds.push(viewer.id);
}
function describeKnownRelation(viewer, target){
  let label;
  if(viewer.career && viewer.career.masterId===target.id) label='Tu maestro/a';
  else if(target.career && target.career.masterId===viewer.id) label='Tu aprendiz';
  else if(viewer.firstFriendId===target.id) label='Amigo/a de infancia';
  else if(viewer.spouseId===target.id) return 'Cónyuge';
  else { const rel=getRelationship(world,viewer.id,target.id); label = rel>=40 ? 'Buena amistad' : 'Conocido/a'; }
  return genderText(label, target.sex);
}
function getEligibleRomanticCandidates(ch){
  return getKnownPeople(ch).others.filter(c=> c.alive && !c.spouseId && c.sex!==ch.sex && c.age>=16 && Math.abs(c.age-ch.age)<=12);
}
/* hito genérico, reutilizable desde fuera de resolveMilestones (Partes 32, 46) */
function triggerMilestone(w, p, key, {icon,title,desc,major,buttonLabel}){
  p.milestones=p.milestones||[];
  if(p.milestones.includes(key)) return null;
  p.milestones.push(key);
  const entry=log(w, title, desc, 'personaje', [p.id]);
  if(major){
    w.pendingMilestoneModals=w.pendingMilestoneModals||[];
    w.pendingMilestoneModals.push({key,title,text:desc,buttonLabel:buttonLabel||'Continuar'});
  }
  return entry;
}
/* nombres de animales: nunca un ID técnico en la interfaz (Parte 40) */
function giveAnimalName(species, hh){
  const pool=ANIMAL_NAMES[species]||['Animal'];
  const used=new Set((hh?animalsOf(hh):[]).map(a=>a.name).filter(Boolean));
  const free=pool.filter(n=>!used.has(n));
  return free.length? pick(free) : (pick(pool)+' '+rand(2,9));
}
/* pequeña población persistente del pueblo, generada una sola vez (Parte 9, 49) */
function makeVillagerHousehold(w, {roleProfession, roleStage, hasSpouse=true, kidAges=[], adultAgeRange=[28,50]}){
  const houseId=uid(), householdId=uid();
  const familyName=pick(NAMES.family);
  const headSex=pick(['M','F']);
  const head=makeCharacter({sex:headSex, age:rand(adultAgeRange[0],adultAgeRange[1]), familyName, houseId, householdId});
  head.career={professionId:roleProfession, stage:roleStage, masterId:null, startedYear:w.year-rand(8,20), experience: roleStage==='master'?95:70, annualEarnings:0};
  head.profession=roleProfession;
  head.personalMoney=rand(3,10);
  const members=[head]; let spouse=null;
  if(hasSpouse){
    spouse=makeCharacter({sex: headSex==='M'?'F':'M', age:rand(Math.max(18,adultAgeRange[0]-4), adultAgeRange[1]-2), familyName, houseId, householdId});
    spouse.spouseId=head.id; head.spouseId=spouse.id; spouse.personalMoney=rand(1,5);
    members.push(spouse);
  }
  const kids=[];
  for(const age of kidAges){
    const kid=makeCharacter({sex:pick(['M','F']), age, familyName, houseId, householdId,
      fatherId: headSex==='M'?head.id:(spouse?spouse.id:null), motherId: headSex==='F'?head.id:(spouse?spouse.id:null),
      appearance:inheritAppearance(headSex==='M'?head:spouse, headSex==='F'?head:spouse)});
    kids.push(kid);
  }
  head.childrenIds=kids.map(k=>k.id);
  if(spouse) spouse.childrenIds=kids.map(k=>k.id);
  kids.forEach(k=>{ k.siblingIds=kids.filter(x=>x.id!==k.id).map(x=>x.id); });
  [...members,...kids].forEach(c=>{ w.characters[c.id]=c; });
  const allIds=[...members.map(m=>m.id), ...kids.map(k=>k.id)];
  w.houses[houseId]={id:houseId, name:familyName, memberIds:allIds, founderId:head.id, createdYear:w.year-30, titles:[], prestige:rand(10,30)};
  w.households[householdId]={id:householdId, name:familyName+'stead', headId:head.id, memberIds:allIds, money:rand(4,14), grainStores:rand(2,10), security:rand(35,55), loyalty:rand(35,55), propertyIds:[], createdYear:w.year-30};
  w.flags.villageHouseholdIds=w.flags.villageHouseholdIds||[]; w.flags.villageHouseholdIds.push(householdId);
  return {head, spouse, kids, householdId, houseId};
}

/* una familia nueva del pueblo, generada bajo demanda cuando hace falta un niño/a real (Parte 11) */
function spawnVillageFamily(w, childAge){
  const familyName=pick(NAMES.family);
  const houseId=uid(), householdId=uid();
  const fAge=rand(24,42), mAge=rand(22,38);
  const father=makeCharacter({sex:'M', age:fAge, familyName, houseId, householdId});

  father.spouseId=mother.id; mother.spouseId=father.id;

  const child=makeCharacter({sex:pick(['M','F']), age:clamp(childAge,0,14), familyName, houseId, householdId,
    fatherId:father.id, motherId:mother.id, appearance:inheritAppearance(father,mother)});

  [father,mother,child].forEach(c=>{ w.characters[c.id]=c; });
  w.houses[houseId]={id:houseId, name:familyName, memberIds:[father.id,mother.id,child.id], founderId:father.id, createdYear:w.year-fAge, titles:[], prestige:rand(10,30)};

/* un/a adulto/a nuevo/a y persistente del pueblo (usado cuando hace falta un pretendiente real, Parte 25) */
function spawnVillageAdult(w, sex, age){
  const c=spawnExternalSpouse(sex, [age,age], w);

/* encontrar/conocer a alguien nuevo, camino orgánico hacia el matrimonio (Partes 13, 25) */
function meetRomanticProspect(w, p){
  const oppositeSex=p.sex==='M'?'F':'M';
  const pool=Object.values(w.characters).filter(c=>c.alive && c.sex===oppositeSex && !c.spouseId && c.age>=16 &&
    Math.abs(c.age-p.age)<=10 && c.id!==p.id && !isCloseFamily(p.id,c.id) && !(p.knownCharacterIds||[]).includes(c.id));
  const met = pool.length? pick(pool) : spawnVillageAdult(w, oppositeSex, rand(Math.max(16,p.age-6), p.age+6));
  introduceCharacter(p, met);
  bumpRelationship(w,p.id,met.id,rand(4,10));
  w.marriageCandidates=w.marriageCandidates||[];
  if(!w.marriageCandidates.includes(met.id)) w.marriageCandidates.push(met.id);
  return met;
}

/* ---------- estado global ---------- */
let world = null;
const ui = {activeTab:'vida', modal:null, showAnimalDetail:false, doCategory:'all', peopleFilter:'all', lifeFilter:'all'};

/* ---------- helpers de acceso ---------- */
function C(id){return world.characters[id];}
function player(w=world){return w.characters[w.playerId];}
function lineage(w=world, charId=w.playerId){ const c=w.characters[charId]; return c? w.houses[c.houseId] : null; }
function household(w=world, charId=w.playerId){ const c=w.characters[charId]; return c? w.households[c.householdId] : null; }
function propertiesOf(hh){ return hh? hh.propertyIds.map(id=>world.properties[id]).filter(Boolean) : []; }
function animalsOf(hh){ return hh? Object.values(world.animals).filter(a=>a.alive && a.ownerHouseholdId===hh.id) : []; }
function relKey(a,b){return [a,b].sort().join('|');}
function bumpRelationship(w,a,b,delta){
  const k=relKey(a,b);
  if(!w.relationships[k]) w.relationships[k]={a,b,value:0};
  w.relationships[k].value=clamp(w.relationships[k].value+delta,-100,100);
}
function getRelationship(w,a,b){ const r=w.relationships[relKey(a,b)]; return r?r.value:0; }
function currentActionsMax(){ world.annualActionsMax = getPlayerCapabilities(player(world)).annualActionsMax; return world.annualActionsMax; }
function canUseAction(){ return world.annualActionsUsed < currentActionsMax(); }
function useAction(){ if(!canUseAction()) return false; world.annualActionsUsed++; return true; }

/* ---------- parentesco cercano (kinship por travesía de IDs, no por hogar) ---------- */
function closeFamily(charId=world.playerId){
  const c=C(charId);
  if(!c) return {father:null,mother:null,spouse:null,children:[],siblings:[]};
  return {
    father: c.fatherId?C(c.fatherId):null,
    mother: c.motherId?C(c.motherId):null,
    spouse: c.spouseId?C(c.spouseId):null,
    children: c.childrenIds.map(C).filter(Boolean),
    siblings: c.siblingIds.map(C).filter(Boolean)
  };
}
function closeFamilyFlat(charId=world.playerId){
  const cf=closeFamily(charId);
  const arr=[cf.father,cf.mother,cf.spouse,...cf.children,...cf.siblings].filter(Boolean);
  const seen=new Set(); const out=[];
  for(const m of arr){ if(!seen.has(m.id)){ seen.add(m.id); out.push(m); } }
  return out;
}
function isCloseFamily(viewerId, targetId){
  if(viewerId===targetId) return false;
  return closeFamilyFlat(viewerId).some(m=>m.id===targetId);
}

/* ---------- parentesco: función central única (Parte 11) ---------- */
function getKinshipLabel(viewerId, targetId){
  if(viewerId===targetId) return 'tú';
  const v=C(viewerId), t=C(targetId);
  if(!v||!t) return 'familiar';
  if(t.id===v.fatherId) return 'padre';
  if(t.id===v.motherId) return 'madre';
  if(t.id===v.spouseId) return t.alive===false ? (t.sex==='M'?'esposo (fallecido)':'esposa (fallecida)') : (t.sex==='M'?'esposo':'esposa');
  if(v.childrenIds.includes(t.id)) return t.sex==='M'?'hijo':'hija';
  if(v.siblingIds.includes(t.id)) return t.sex==='M'?'hermano':'hermana';
  const parents=[v.fatherId,v.motherId].filter(Boolean);
  const grandparentIds = parents.flatMap(pid=>{const p=C(pid); return p?[p.fatherId,p.motherId]:[];}).filter(Boolean);
  if(grandparentIds.includes(t.id)) return t.sex==='M'?'abuelo':'abuela';
  const grandchildIds = v.childrenIds.flatMap(cid=>{const c=C(cid); return c?c.childrenIds:[];});
  if(grandchildIds.includes(t.id)) return t.sex==='M'?'nieto':'nieta';
  const auntUncleIds = parents.flatMap(pid=>{const p=C(pid); return p?p.siblingIds:[];});
  if(auntUncleIds.includes(t.id)) return t.sex==='M'?'tío':'tía';
  const nieceNephewIds = v.siblingIds.flatMap(sid=>{const s=C(sid); return s?s.childrenIds:[];});
  if(nieceNephewIds.includes(t.id)) return t.sex==='M'?'sobrino':'sobrina';
  const cousinIds = auntUncleIds.flatMap(aid=>{const a=C(aid); return a?a.childrenIds:[];});
  if(cousinIds.includes(t.id)) return t.sex==='M'?'primo':'prima';
  if(t.houseId===v.houseId) return 'pariente lejano';
  return t.sex==='M'?'conocido':'conocida';
}
/* ---------- referencia narrativa por parentesco (mejora de diseño 2026-09 #3): en vez de un
   nombre propio que el jugador todavía no reconoce, "tu padre, Cedric" — la relación primero,
   el nombre como apoyo. withName:false para solo la relación ("tu padre"). ---------- */
/* ---------- género real en vez de "campesino/a" (mejora de diseño 2026-09 #3): en cuanto se conoce
   el sexo real de un personaje concreto, se resuelve la forma correcta en vez de mostrar la barra. ---------- */
function genderWord(masc, sex){
  if(sex!=='F') return masc;
  if(/[oe]$/.test(masc)) return masc.slice(0,-1)+'a';
  if(/or$/.test(masc)) return masc+'a';
  return masc+'a';
}
function pronoun(sex){ return sex==='F'?'ella':'él'; }
function capitalize(s){ return s? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function genderText(text, sex){
  if(!text) return text;
  return text.replace(/(\p{L}+)\/a/gu, (_,masc)=> genderWord(masc, sex));
}
function birthTitle(sex){ return sex==='M' ? 'Nació un hijo' : 'Nació una hija'; }
/* alguien cercano al jugador se referencia por parentesco (tu hermano, X); alguien apenas
   conocido se referencia por su nombre, como ya se hacía (mejora de diseño 2026-09 #3) */
function personRef(viewerId, targetId){
  if(viewerId===targetId) return 'tú';
  if(isCloseFamily(viewerId, targetId)) return kinRef(viewerId, targetId);
  const t=C(targetId); return t? t.firstName : 'alguien';
}
function kinRef(viewerId, targetId, opts={}){
  const t=C(targetId);
  if(!t) return 'alguien';
  const label=getKinshipLabel(viewerId, targetId);
  if(label==='tú') return 'tú';
  if(opts.withName===false) return 'tu '+label;
  const m=label.match(/^(.*?)(\s*\(.*\))?$/);
  return `tu ${m[1]}, ${t.firstName}${m[2]||''}`;
}

/* ---------- descriptores (números para la simulación, palabras para el jugador) ---------- */
function healthLabel(v, sex){
  let label;
  if(v>=85) label='rebosante de salud';
  else if(v>=65) label='saludable';
  else if(v>=45) label='con algunas molestias';
  else if(v>=25) label='delicado/a de salud';
  else label='gravemente enfermo/a';
  return genderText(label, sex);
}
function reputationLabel(v, sex){

  if(v>=75) label='muy respetado/a en el pueblo';
  else if(v>=50) label='bien visto/a';
  else if(v>=25) label='apenas conocido/a';
  else label='mal visto/a en el pueblo';
  return genderText(label, sex);
}
function relationshipLabel(v){

  if(v>=25) return 'buena relación';
  if(v>=-10) return 'trato cordial';
  if(v>=-40) return 'relación tensa';

}
function skillLabel(v, sex){

  if(v>=75) label='maestro/a';
  else if(v>=45) label='competente';

function meterClass(v){ return v<35?'low':(v<65?'mid':''); }
function householdStatus(hh){

function householdStatusLabel(status){

/* ---------- generación de personajes ---------- */
function makeCharacter({sex,age,familyName,houseId,householdId=null,fatherId=null,motherId=null,traits=null,appearance=null}){
  const year = world? world.year : 516;
  const first = sex==='M'?pick(NAMES.male):pick(NAMES.female);
  const father = fatherId?C(fatherId):null, mother=motherId?C(motherId):null;
  return {
    id:uid(), firstName:first, familyName, sex, birthYear:year-age, deathYear:null, alive:true,
    houseId, householdId, profession:'peasant_farmer', npcProfessionAssigned:false, socialClass:'Campesinado',
    health:rand(60,90), reputation:rand(30,55),
    /* v5 (Parte 67): atributos reales para la barra de stats — mismo patrón que health/reputation,
       solo cambian por eventos y acciones concretas, nunca por deriva automática silenciosa. */
    charm:rand(20,40), wits:rand(20,40), faith:rand(20,40),
    skills: age<9 ? {farming:0, animal_husbandry:0, craftsmanship:0, commerce:0} : {farming:rand(0,15), animal_husbandry:rand(0,15), craftsmanship:0, commerce:0},
    traits: traits || [pick(TRAITS), pick(TRAITS)].filter((v,i,a)=>a.indexOf(v)===i),
    appearance: appearance || ((father||mother) ? inheritAppearance(father,mother) : randomAppearance()),
    fatherId, motherId, spouseId:null, childrenIds:[], siblingIds:[],
    marriedAge:null, causeOfDeath:null, lifeSummary:null, milestones:[],
    /* v4 (Partes 6, 9, 15): vida propia dentro del mundo, más allá de la granja familiar */
    personalMoney:0, knownCharacterIds:[], firstFriendId:null,
    career:{ professionId:null, stage:'none', masterId:null, startedYear:null, experience:0, annualEarnings:0 },
    /* v5 (Parte 68): ambición de vida, se asigna sola al cumplir 18 (resolveAmbition) */
    ambition:null,
    get age(){ return world.year - this.birthYear; }
  };
}
/* un personaje "de fuera" (pretendiente/cónyuge) trae su propio linaje aparte */
function spawnExternalSpouse(sex, ageRange=[16,32], w=world){
  const familyName=pick(NAMES.family);

  const lineageId=uid();
