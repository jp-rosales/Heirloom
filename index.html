/* determina linaje/apellido de un hijo: función centralizada y aislada (Parte 10),
   para poder cambiar la regla más adelante (cultura, matrimonio, nobleza...) sin
   tocar resolveBirths(). Por ahora: convención patrilineal simple. */
function determineChildLineage(father, mother){ return father ? father.houseId : mother.houseId; }
function determineChildSurname(father, mother){ return father ? father.familyName : mother.familyName; }

/* ---------- generación del mundo inicial (Parte 2-5) ----------
   playerAge=0 (por defecto): partida nueva, el jugador NACE dentro del mundo.
   playerAge=16: usado solo por el flujo de "la línea se extingue, comienza otra
   familia en este mismo mundo" — ahí sí hace falta un fundador ya adulto y jugable. */
function generateInitialWorld({startYear=null, playerAge=0, regionId=null}={}){
  // mejora de diseño 2026-09 #1/#4: cada partida nueva nace en una región concreta del reino
  // (no siempre Fenwold) y en un año mucho más amplio que antes (ya no siempre ~500) — pero
  // nunca antes de que esa región exista según su propia fecha de fundación (WORLD_TIMELINE).
  const chosenRegionId = regionId || pick(Object.keys(REGIONS));
  const reg = getRegion(chosenRegionId);
  const minStart = Math.max(150, reg.foundedYear+15);
  const year = startYear!=null ? startYear : rand(minStart, 850);
  const w = {
    year, campaignStartYear:year, regionId:chosenRegionId, playerId:null, characters:{}, houses:{}, households:{}, properties:{}, animals:{},
    relationships:{}, history:[], lastTurnLog:[], marriageCandidates:[], flags:{}, tribute:3,
    annualActionsUsed:0, annualActionsMax:3, summaryShown:false, pendingBirthIntro:false,
    schema_version:5
  };
  world = w;
  applyWorldFlavorForYear(chosenRegionId, year);
  const familyName = pick(NAMES.family);
  const houseId = uid();       // linaje
  const householdId = uid();   // hogar económico inicial

  const fatherAge = playerAge>=16 ? rand(38,46) : rand(20,38);
  const motherAge = playerAge>=16 ? rand(34,44) : rand(18,34);
  const father = makeCharacter({sex:'M', age:fatherAge, familyName, houseId, householdId});
  const mother = makeCharacter({sex:'F', age:motherAge, familyName, houseId, householdId});
  father.spouseId=mother.id; mother.spouseId=father.id;
  father.marriedAge=rand(16,Math.min(24,fatherAge)); mother.marriedAge=Math.min(father.marriedAge,motherAge);
  // el padre ya vive de las tierras familiares (Parte 5: la profesión emerge de la vida, no de un
  // menú); desde la geografía del mundo (mejora #4), su oficio de partida sigue el sesgo de la
  // región — un padre de los Altos de Kelmarsh es tan probable pastor o minero como agricultor.
  const founderProfessionId = pick(reg.professionBias);
  father.career = {professionId:founderProfessionId, stage: fatherAge>=35?'skilled':'worker', masterId:null,
    startedYear: year-Math.min(fatherAge-16,20), experience: fatherAge>=35?70:45, annualEarnings:0};
  father.profession=founderProfessionId;

  const playerSex = pick(['M','F']);
  const plr = makeCharacter({sex:playerSex, age:playerAge, familyName, houseId, householdId,
    fatherId:father.id, motherId:mother.id, appearance:inheritAppearance(father,mother)});

  // hermanos: en una partida nueva (jugador recién nacido) son mayores que el jugador;
  // en el flujo de fundador adulto, siguen la regla previa (más jóvenes que el jugador).
  const siblings=[];
  if(playerAge<16){
    const nSib = rand(0,3);
    for(let i=0;i<nSib;i++){
      const maxAge = Math.min(9, Math.max(1, motherAge-16)); // la madre no pudo tenerlo antes de sus ~16
      if(maxAge<1) break;
      const s = makeCharacter({sex:pick(['M','F']), age:rand(1,maxAge), familyName, houseId, householdId,
        fatherId:father.id, motherId:mother.id, appearance:inheritAppearance(father,mother)});
      siblings.push(s);
    }
  } else {
    const nSib = rand(1,2);
    for(let i=0;i<nSib;i++){
      const s = makeCharacter({sex:pick(['M','F']), age:rand(6,14), familyName, houseId, householdId,
        fatherId:father.id, motherId:mother.id, appearance:inheritAppearance(father,mother)});
      siblings.push(s);
    }
  }
  const allKids=[plr,...siblings];
  father.childrenIds = allKids.map(k=>k.id);
  mother.childrenIds = allKids.map(k=>k.id);
  allKids.forEach(k=>{ k.siblingIds = allKids.filter(x=>x.id!==k.id).map(x=>x.id); });

  [father,mother,plr,...siblings].forEach(ch=> w.characters[ch.id]=ch);

  const farmId = uid();
  // el bioma también sesga la tierra de partida (mejora #4): un huerto de subsistencia en
  // Ashdry nunca rinde como un campo de la Marca de Fenwold, aunque toda familia tenga uno.
  w.properties[farmId] = {id:farmId, type:'farm', name:familyName+'stead', ownerHouseholdId:householdId,
    landQuality:clamp(rand(45,68)+reg.fertilityBias,10,95), sownCrop:'wheat', size:1};

  const memberIds=[father.id,mother.id,plr.id,...siblings.map(s=>s.id)];
  w.houses[houseId] = {id:houseId, name:familyName, memberIds:[...memberIds],
    founderId:father.id, createdYear:year-20, titles:[], prestige:rand(8,20)};
  w.households[householdId] = {id:householdId, name:familyName+'stead', headId:father.id,
    memberIds:[...memberIds], money:rand(9,16), grainStores:rand(22,38), security:rand(35,55), loyalty:rand(35,55), propertyIds:[farmId], createdYear:year-20};

  const hhRef = w.households[householdId];
  const SEED_ANIMAL_COUNTS={cow:2,sheep:5,chicken:7,goat:6};
  const seedAnimals=reg.animals.map(sp=>[sp, SEED_ANIMAL_COUNTS[sp]||4]);
  seedAnimals.forEach(([sp,n])=>{
    for(let i=0;i<n;i++){
      const id=uid();
      w.animals[id]={id, species:sp, sex:pick(['M','F']), birthYear:w.year-rand(0,3), alive:true,
        health:rand(60,90), ownerHouseholdId:householdId, name: giveAnimalName(sp, hhRef)};
    }
  });

  // pequeña población persistente del pueblo (Parte 9): existe desde el principio, pero el jugador
  // todavía no la CONOCE — knownCharacterIds empieza vacío y se va llenando con la vida (Parte 10)
  generateVillageResidents(w);
  w.flags.villageGenerated = true;

  w.playerId = plr.id;
  if(playerAge<16){
    w.pendingBirthIntro = true;
    log(w,'Naces',`Naces en ${WORLD_FLAVOR.villageName}, ${plr.sex==='M'?'hijo':'hija'} de ${kinRef(plr.id,father.id)} y ${kinRef(plr.id,mother.id)}.`,'family',[plr.id,father.id,mother.id]);
  } else {
    log(w,'Comienza tu historia',`${plr.firstName} ${plr.familyName} cumple 16 años y toma su lugar en las tierras de la familia, en ${WORLD_FLAVOR.villageName}, bajo el señorío de ${WORLD_FLAVOR.lordName}.`,'family',[plr.id]);
  }
  return w;
}

/* ---------- migración de saves v1 -> v2 (Parte 2) ----------
   v1: world.houses[id] = {id,name,memberIds,money,grainStores,propertyIds} (hacía de household)
   v2: world.houses = solo linaje; world.households = economía; personajes con houseId+householdId */
function migrateV1toV2(w){
  w.households = w.households || {};
  for(const houseId in (w.houses||{})){
    const oldHouse = w.houses[houseId];
    const hhId = uid();
    w.households[hhId] = {
      id:hhId, name:(oldHouse.name||'Hogar')+'stead', headId: w.playerId,
      memberIds:[...(oldHouse.memberIds||[])],
      money: oldHouse.money||0, grainStores: oldHouse.grainStores||0,
      propertyIds:[...(oldHouse.propertyIds||[])], createdYear: 516
    };
    for(const cid of (oldHouse.memberIds||[])){
      const c=w.characters[cid];
      if(c) c.householdId = hhId;
    }
    for(const pid in (w.properties||{})){
      const prop=w.properties[pid];
      if(prop.ownerHouseId===houseId){ prop.ownerHouseholdId=hhId; delete prop.ownerHouseId; }
    }
    for(const aid in (w.animals||{})){
      const a=w.animals[aid];
      if(a.ownerHouseId===houseId){ a.ownerHouseholdId=hhId; delete a.ownerHouseId; }
    }
    oldHouse.founderId = (oldHouse.memberIds && oldHouse.memberIds[0]) || null;
    oldHouse.createdYear = 516;
    oldHouse.titles = [];
    oldHouse.prestige = 30;
    delete oldHouse.money; delete oldHouse.grainStores; delete oldHouse.propertyIds;
  }
  const firstHH = Object.keys(w.households)[0];
  for(const cid in w.characters){
    const c=w.characters[cid];
    if(!c.householdId && firstHH) c.householdId=firstHH;
    if(c.npcProfessionAssigned===undefined) c.npcProfessionAssigned=false;
    if(c.marriedAge===undefined) c.marriedAge=null;
  }
  w.marriageCandidates = w.marriageCandidates || [];
  w.annualActionsUsed=0;
  w.annualActionsMax=3;
  w.summaryShown=false;
  w.schema_version=2;
  return w;
}

/* ---------- migración de saves v2 -> v3 (Parte 40) ----------
   IMPORTANTE: no se cambia retroactivamente la edad de nadie. Una partida v2 en la
   que el personaje tenía 35 años sigue teniendo 35 — solo las partidas NUEVAS nacen
   con 0 años. Esta migración solo añade campos que antes no existían. */
function migrateV2toV3(w){
  if(!w.campaignStartYear) w.campaignStartYear = (w.history && w.history.length) ? w.history[0].year : w.year;
  const chars=Object.values(w.characters||{});
  // apariencia coherente cuando es posible (dos pasadas para alcanzar cadenas padre->hijo->nieto)
  for(let pass=0; pass<2; pass++){
    for(const c of chars){
      if(c.appearance) continue;
      const father=c.fatherId?w.characters[c.fatherId]:null;
      const mother=c.motherId?w.characters[c.motherId]:null;
      if((father&&father.appearance)||(mother&&mother.appearance)) c.appearance=inheritAppearance(father,mother);
    }
  }
  for(const c of chars){
    if(!c.appearance) c.appearance=randomAppearance();
    if(!c.milestones) c.milestones=[];
    if(c.marriedAge===undefined) c.marriedAge=null;
  }
  (w.marriageCandidates||[]).forEach(c=>{ if(!c.appearance) c.appearance=randomAppearance(); });
  if(w.annualActionsMax===undefined) w.annualActionsMax=3;
  if(w.pendingMilestoneModals===undefined) w.pendingMilestoneModals=[];
  w.schema_version=3;
  return w;
}

/* ---------- migración de saves v3 -> v4 (Parte 57-61) ----------
   NO se toca edad, año, matrimonios, hijos, hogares, propiedades, dinero de hogar,
   historia ni apariencia existentes. Solo se añaden los campos nuevos de v4 y se
   completa la pequeña población persistente del pueblo que las partidas v3 no tenían. */
function migrateV3toV4(w){
  world = w; // varias funciones auxiliares (household(), C(), etc.) leen del global `world`
  const chars=Object.values(w.characters||{});
  for(const c of chars){
    if(c.personalMoney===undefined) c.personalMoney=0;
    if(!c.knownCharacterIds) c.knownCharacterIds=[];
    if(c.firstFriendId===undefined) c.firstFriendId=null;
    if(!c.skills) c.skills={farming:0,animal_husbandry:0};
    if(c.skills.craftsmanship===undefined) c.skills.craftsmanship=0;
    if(c.skills.commerce===undefined) c.skills.commerce=0;
    if(!c.career){
      // ojo: en load(), migrateV3toV4 corre ANTES de reattachGetters(), así que c.age
      // (el getter) todavía no existe aquí — hay que calcular la edad a mano.
      const ageNow = w.year - c.birthYear;
      const hadProfession = c.profession && ageNow>=16;
      c.career = hadProfession
        ? {professionId:c.profession, stage: ageNow>=30?'skilled':'worker', masterId:null,
           startedYear:(w.campaignStartYear||w.year), experience: ageNow>=30?70:40, annualEarnings:0}
        : {professionId:null, stage:'none', masterId:null, startedYear:null, experience:0, annualEarnings:0};
    }
  }
  for(const a of Object.values(w.animals||{})){
    if(!a.name){ const hh=w.households[a.ownerHouseholdId]; a.name = giveAnimalName(a.species, hh); }
  }
  // Parte 60: los candidatos de matrimonio embebidos (v3) se convierten en personajes reales persistentes
  if(Array.isArray(w.marriageCandidates) && w.marriageCandidates.length && typeof w.marriageCandidates[0]==='object'){
    const ids=[];
    for(const cand of w.marriageCandidates){
      if(!w.characters[cand.id]){
        if(cand.personalMoney===undefined) cand.personalMoney=0;
        if(!cand.knownCharacterIds) cand.knownCharacterIds=[];
        if(cand.firstFriendId===undefined) cand.firstFriendId=null;
        if(!cand.skills) cand.skills={farming:0,animal_husbandry:0};
        if(cand.skills.craftsmanship===undefined) cand.skills.craftsmanship=0;
        if(cand.skills.commerce===undefined) cand.skills.commerce=0;
        if(!cand.career) cand.career={professionId:null,stage:'none',masterId:null,startedYear:null,experience:0,annualEarnings:0};
        w.characters[cand.id]=cand;
        if(!cand.householdId){
          const hhId=uid();
          w.households[hhId]={id:hhId,name:'Casa de '+cand.firstName+' '+cand.familyName, headId:cand.id, memberIds:[cand.id],
            money:rand(1,4), grainStores:rand(1,4), propertyIds:[], createdYear:w.year};
          cand.householdId=hhId;
        }
        assignNpcCareer(cand);
      }
      ids.push(cand.id);
    }
    w.marriageCandidates=ids;
    const p=w.characters[w.playerId];
    if(p){ p.knownCharacterIds=p.knownCharacterIds||[]; ids.forEach(id=>{ if(!p.knownCharacterIds.includes(id)) p.knownCharacterIds.push(id); }); }
  } else if(!Array.isArray(w.marriageCandidates)){
    w.marriageCandidates=[];
  }
  if(!w.flags) w.flags={};
  // Parte 61: población persistente mínima del pueblo, generada una sola vez, sin tocar la familia existente
  if(!w.flags.villageGenerated){ generateVillageResidents(w); w.flags.villageGenerated=true; }
  w.schema_version=4;
  return w;
}

/* ---------- migración de saves v4 -> v5 (Parte 72): atributos, nobleza, hacienda, nav nuevo ----------
   Estrictamente aditiva, igual que las anteriores. c.age (getter) todavía no existe aquí. */
function migrateV4toV5(w){
  world = w;
  for(const c of Object.values(w.characters||{})){
    if(c.charm===undefined) c.charm=rand(20,40);
    if(c.wits===undefined) c.wits=rand(20,40);
    if(c.faith===undefined) c.faith=rand(20,40);
    if(c.ambition===undefined) c.ambition=null;
  }
  for(const h of Object.values(w.houses||{})){
    if(h.prestige===undefined || h.prestige>200) h.prestige=rand(10,30); // reescala v4 (0-100) a v5 (0-1000)
    if(!h.titles) h.titles=[];
  }
  for(const hh of Object.values(w.households||{})){
    if(hh.security===undefined) hh.security=rand(30,50);
    if(hh.loyalty===undefined) hh.loyalty=rand(30,50);
  }
  w.schema_version=5;
  return w;
}
/* v4 usaba otros nombres de pestaña; v5 tiene el nuevo nav de 6 pantallas (Parte 72) */
const TAB_NAME_V4_TO_V5={personaje:'yo', familia:'gente', relaciones:'gente', trabajo:'hacer', propiedades:'hacienda', mundo:'vida', historia:'vida'};

/* ---------- historia (Parte 17: solo lo relevante entra aquí; lo menor va solo a lastTurnLog) ---------- */
function log(w,title,desc,tag,related=[],kind){
  const entry={year:w.year, title, desc, tag, related, kind: kind||title};
  w.history.push(entry);
  return entry;
}
/* ---------- feed persistente (mejora de diseño 2026-09 #6): el Resumen anual dejó de ser un
   modal obligatorio — esta lista es lo que alimenta la pantalla Vida, acumulando entradas de
   varios años (a diferencia de lastTurnLog, que un año nuevo sobreescribe). También cuenta
   cuántas veces se repitió cada "kind" para poder ir mostrando cada vez menos texto sobre lo
   que ya es familiar (SIMULAR MUCHO, MOSTRAR POCO, aplicado con el tiempo y no solo de entrada). */
function pushFeed(w, entry){
  if(!entry) return;
  w.flags.seenKinds = w.flags.seenKinds || {};
  const k=entry.kind||entry.title;
  w.flags.seenKinds[k] = (w.flags.seenKinds[k]||0)+1;
  entry.seenCount = w.flags.seenKinds[k]; // cuántas veces ya se vio ESTE tipo, al momento de ocurrir
  w.feed = w.feed || [];
  w.feed.push(entry);
  if(w.feed.length>80) w.feed.splice(0, w.feed.length-80);
  // mejora de diseño 2026-09 #15/#16: todo lo que llega al feed le importa al jugador por
  // definición (isNoteworthyToPlayer ya filtró antes de esto) — así que la consecuencia se ve
  // de inmediato en VIDA, nunca en silencio mientras el jugador mira otra pestaña.
  ui.activeTab='vida'; ui.lifeFilter='all';
  return entry;
}
/* atajo: lo que el jugador hace por su cuenta (Hacer, Gente, Hacienda...) siempre importa —
   nunca hace falta el filtrado de isNoteworthyToPlayer para una acción que el jugador mismo eligió. */
function plog(w,title,desc,tag,related,kind){ return pushFeed(w, log(w,title,desc,tag,related,kind)); }
/* ---------- reducción de ruido (mejora de diseño, sesión 2026-09): el mundo entero sigue
   simulándose (world.history conserva TODO para el linaje/árbol), pero el jugador solo debe
   LEER lo que le importa a él. Nacimientos/matrimonios/independencias de aldeanos que nunca
   conoció NO deben aparecer en turnLog (lo que alimenta el Resumen y "Sucesos recientes"). */
function isNoteworthyToPlayer(w, id){
  if(!id) return false;
  if(id===w.playerId) return true;
  if(isCloseFamily(w.playerId, id)) return true;
  const p=player(w);
  return !!(p && p.knownCharacterIds && p.knownCharacterIds.includes(id));
}
/* ---------- cooldowns de eventos (mejora de diseño, sesión 2026-09): evita que el mismo
   evento genérico ("fiesta del pueblo", "te tuerces el tobillo"...) se repita palabra por
   palabra año tras año. No aplica a eventos que nacen de un estado real (mala cosecha),
   esos ya varían solo por ser consecuencia directa de lo que pasó. */
function eventOnCooldown(w, id, minGap){
  if(!minGap) return false;
  const last=(w.flags.eventCooldowns||{})[id];
  return last!=null && (w.year-last)<minGap;
}
function markEventUsed(w, id){
  w.flags.eventCooldowns = w.flags.eventCooldowns||{};
  w.flags.eventCooldowns[id]=w.year;
}

/* ---------- rencores y favores pendientes (mejora de diseño, sesión 2026-09 #2) ----------
   "Vendí la única vaca y dos años después hubo una hambruna" — para que una decisión pueda
   volver más adelante, tiene que estar atada a un PERSONAJE real, no a "el vecino" abstracto.
   Este ledger vive en world.flags y se apoya en el sistema de relaciones que ya existía. */
function addGrudge(w, charId){ if(!charId) return; w.flags.grudges=w.flags.grudges||{}; w.flags.grudges[charId]=w.year; }
function clearGrudge(w, charId){ if(w.flags.grudges) delete w.flags.grudges[charId]; }
function grudgeAge(w, charId){ const y=w.flags.grudges&&w.flags.grudges[charId]; return y==null?null:(w.year-y); }
function addDebt(w, charId){ if(!charId) return; w.flags.debts=w.flags.debts||{}; w.flags.debts[charId]=(w.flags.debts[charId]||0)+1; }
function clearDebt(w, charId){ if(w.flags.debts) delete w.flags.debts[charId]; }
function debtorIds(w){ return Object.keys(w.flags.debts||{}).filter(id=>w.flags.debts[id]>0); }
/* alguien real del pueblo con quien tener una disputa/un favor — prioriza gente que el
   jugador ya conoce (más peso narrativo), y si no conoce a nadie más, presenta a alguien
   nuevo que se vuelve su vecino/a de ahí en adelante (nunca un personaje "de usar y tirar"). */
function getOrIntroduceNeighbor(w,p){
  const known=getKnownPeople(p).others.filter(c=>c.alive);
  if(known.length && chance(0.7)) return pick(known);
  const pool=Object.values(w.characters).filter(c=>c.alive && c.id!==p.id && c.age>=16 &&
    !isCloseFamily(p.id,c.id) && !(p.knownCharacterIds||[]).includes(c.id));
  const person = pool.length? pick(pool) : spawnVillageAdult(w, pick(['M','F']), rand(20,55));
  introduceCharacter(p, person);
  return person;
}

/* ---------- LegalConsequenceSystem (mejora de diseño 2026-09 #14/#15) ----------
   Antes, que te atraparan robando casi no tenía efecto (solo un golpe de reputación).
   Este sistema es GENERALIZABLE: cualquier delito futuro puede llamar a
   applyCrimeConsequence(w, ch, {crimeKey, crimeLabel, witnessId}) y obtiene multa,
   reputación, enfado familiar y, si es grave o hay reincidencia, una temporada sin poder
   ocuparse de sus asuntos (calabozo) — nunca pena de muerte ni castigos desproporcionados
   para un delito menor. La gravedad depende de reincidencia (mismo delito y en general) y de
   la edad: un menor nunca va al calabozo del señorío, se queda castigado en casa el resto del
   año. ch.legal.record guarda el historial completo (nunca se olvida, aunque ya esté cumplido). */
function ensureLegal(ch){ if(!ch.legal) ch.legal={record:[], jailedUntilYear:null}; return ch.legal; }
function isJailed(ch){ return !!(ch && ch.legal && ch.legal.jailedUntilYear!=null && world.year<ch.legal.jailedUntilYear); }
function crimeSeverityFor(w,ch,crimeKey){
  const L=ensureLegal(ch);
  const priorSame=L.record.filter(r=>r.crimeKey===crimeKey).length;
  const priorTotal=L.record.length;
  if(priorSame>=2 || priorTotal>=4) return 'severe';
  if(priorSame>=1 || priorTotal>=2) return 'moderate';
  return 'minor';
}
function applyCrimeConsequence(w, ch, {crimeKey, crimeLabel, witnessId}={}){
  const L=ensureLegal(ch);
  const sev=crimeSeverityFor(w,ch,crimeKey);
  L.record.push({year:w.year, crimeKey, severity:sev});
  const isMinorAge = ch.age<16;
  const hh = ch.householdId? w.households[ch.householdId] : null;
  const repHit = sev==='minor'?rand(5,9) : sev==='moderate'?rand(9,16) : rand(15,25);
  ch.reputation=clamp(ch.reputation-repHit,0,100);
  const fineAmt = sev==='minor'?rand(1,3) : sev==='moderate'?rand(3,6) : rand(6,10);
  let fineText='';
  if(fineAmt>0 && hh && hh.money>0){
    const paid=Math.min(fineAmt, Math.round(hh.money));
    hh.money=Math.round((hh.money-paid)*10)/10;
    fineText = ` Tu hogar pagó ${paid} monedas de multa.`;
  } else if(fineAmt>0 && (ch.personalMoney||0)>0){
    const paid=Math.min(fineAmt, ch.personalMoney);
    ch.personalMoney=Math.round((ch.personalMoney-paid)*10)/10;
    fineText = ` Pagaste ${paid} monedas de tu bolsa.`;
  }
  let restrictionText='';
  if(sev!=='minor'){
    // pierdes lo que quedaba de este año, sea cárcel de verdad o quedarte castigado en casa
    world.annualActionsUsed = currentActionsMax();
    restrictionText = isMinorAge? ` Te quedas castigado/a en casa el resto del año.` : ` Pasas unos meses en el calabozo del señorío.`;
    if(sev==='severe' && !isMinorAge){
      // +2 (no +1): este año ya quedó perdido arriba: isJailed exige world.year<jailedUntilYear,
      // así que +2 es lo que de verdad cubre TODO el año siguiente completo, no solo el resto de este.
      L.jailedUntilYear = w.year+2;
      restrictionText += ` No podrás ocuparte de tus asuntos hasta el año ${L.jailedUntilYear}.`;
    }
  }
  let familyText='';
  const kin=closeFamilyFlat(ch.id).filter(m=>m.alive && m.id!==ch.id);
  if(kin.length){ const rel=pick(kin); bumpRelationship(w,ch.id,rel.id,-rand(4,10));
    familyText = ` ${rel.firstName} está ${genderText('furioso/a',rel.sex)} contigo.`; }
  const witness = witnessId? C(witnessId) : null;
  const witnessText = witness? `${witness.firstName} te vio y dio parte a la guardia. ` : '';
  const related = witness? [witness.id, ch.id] : [ch.id];
  return plog(w, crimeLabel||genderText('Consecuencias',ch.sex),
    `${witnessText}Te atraparon.${fineText}${restrictionText}${familyText}`, 'crimen', related);
}

/* ---------- AgricultureSystem (siempre sobre el hogar del jugador) ---------- */
function resolveAgriculture(w, turnLog){
  const hh=household(w);
  for(const prop of propertiesOf(hh)){
    if(prop.sownCrop!=='wheat') { prop.landQuality=clamp(prop.landQuality+1,0,100); continue; }
    const p=player(w);
    // Parte 15: la cosecha depende de los ADULTOS que trabajan el hogar, no del skill de un niño jugado
    const farmSkill = getHouseholdFarmSkill(hh);
    const quality = clamp(prop.landQuality*0.5 + farmSkill*0.3 + rand(-20,20), 0, 100);
    const yieldAmt = Math.max(0, Math.round(CROP.base*(quality/100)));
    hh.grainStores += yieldAmt;
    if(p.age>=9) p.skills.farming = clamp(p.skills.farming + rand(0,1), 0, 100); // ayudar de niño enseña, poco a poco
    if(quality<28){
      w.eventQueueSpecial = w.eventQueueSpecial||[];
      w.eventQueueSpecial.push(makeMalaCosechaEvent(w,p,yieldAmt));
    } else if(quality>=78){
      turnLog.push(log(w,'Cosecha excelente',`El trigo creció espléndido este año; recogiste ${yieldAmt} sacos de grano.`,'agricultura'));
      p.health=clamp(p.health+1,0,100);
    } else {
      /* mejora de diseño (2026-09): una cosecha normal es mantenimiento, no una noticia — se
         registra en la Crónica completa (progressive disclosure) pero ya no interrumpe el
         Resumen del año. Las cosechas EXCELENTE/MALA sí siguen siendo notables arriba/abajo. */
      log(w,'Cosecha del año',`La cosecha de trigo rindió ${yieldAmt} sacos de grano, guardados en el granero.`,'agricultura');
    }
  }
}
function makeMalaCosechaEvent(w,p,yieldAmt){
  /* mejora de diseño (sesión 2 — "decisiones que regresan"): pedir ayuda ya no es a
     "un vecino" abstracto — es a un personaje real que puede acordarse de ese favor
     más adelante (ver buildDebtCalledEvent). */
  const neighbor=getOrIntroduceNeighbor(w,p);
  return {id:'mala_cosecha', interactive:true,
    text:pick([
      `La cosecha de este año ha sido mala — apenas ${yieldAmt} sacos de grano. El invierno podría ser difícil.`,
      `El trigo no rindió lo esperado: solo ${yieldAmt} sacos. Habrá que apretarse el cinturón.`,
      `Una plaga de gorgojos arruinó parte de la cosecha: apenas ${yieldAmt} sacos se salvaron.`
    ]),
    options:[
      {label:'Guardar el grano y racionar', desc:'seguro, sin ganancias',
        effect:(w,p)=> log(w,'Racionamiento','Decidiste guardar cada saco de grano y racionar las comidas del invierno.','agricultura',[p.id])},
      {label:'Vender antes de que baje más la calidad', desc:'+monedas, menos grano guardado',
        effect:(w,p)=>{ const hh=household(w); const sell=Math.min(hh.grainStores,6); hh.grainStores-=sell; hh.money+=Math.round(sell*1.1);
          return log(w,'Venta apresurada','Vendiste parte del grano restante antes de que perdiera valor.','agricultura',[p.id]);}},
      {label:`Pedir ayuda a ${neighbor.firstName}`, desc:'riesgo social, posible grano extra — pero quedarías en deuda',
        effect:(w,p)=>{ if(chance(0.55)){ household(w).grainStores+=rand(4,9); addDebt(w,neighbor.id);
            return log(w,'Ayuda vecinal',`${neighbor.firstName}, ${genderText('apiadado/a',neighbor.sex)}, compartió parte de su propio grano contigo. Algún día te lo recordará.`,'agricultura',[p.id,neighbor.id]); }
          else { p.reputation=clamp(p.reputation-3,0,100); bumpRelationship(w,p.id,neighbor.id,-2);
            return log(w,'Petición rechazada',`Le pediste ayuda a ${neighbor.firstName}, pero con lo suyo escaso, se negó. La vergüenza pesa.`,'agricultura',[p.id,neighbor.id]); } }},
      {label:'Sacrificar un animal para reducir el consumo', desc:'-1 animal, +monedas/comida',
        effect:(w,p)=>{ const hh=household(w); const list=animalsOf(hh); if(list.length){ const a=pick(list); a.alive=false; hh.money+=6;
            return log(w,'Sacrificio necesario',`Sacrificaste a ${animalName(a)} para aliviar el granero.`,'ganado',[p.id]); }
          return log(w,'Sin animales que sacrificar','No quedaba ganado que sacrificar; apretaste el cinturón.','ganado',[p.id]);}}
    ]};
}

/* ---------- LivestockSystem (siempre sobre el hogar del jugador) ---------- */
function animalName(a){ return a.name || giveAnimalName(a.species, world.households[a.ownerHouseholdId]); }
function markPlagueRisk(w,extra){ w.flags.plagueRisk=(w.flags.plagueRisk||0)+extra; }
function resolveLivestock(w, turnLog){
  const hh=household(w);
  let births=0, deaths=0, income=0;
  const risk=w.flags.plagueRisk||0; w.flags.plagueRisk=0;
  for(const a of animalsOf(hh)){
    const age=w.year-a.birthYear;
    income += ANIMAL_TYPES[a.species].income;
    const deathChance = 0.02 + (age>8?0.05:0) + risk;
    if(chance(deathChance)){ a.alive=false; deaths++; continue; }
    if(a.sex==='F' && age>=1 && chance(a.species==='chicken'?0.35:(a.species==='sheep'?0.3:0.18))){
      const twins = a.species==='sheep' && chance(0.15);
      const n = twins?2:1;
      for(let i=0;i<n;i++){
        const id=uid();
        w.animals[id]={id,species:a.species, sex:pick(['M','F']), birthYear:w.year, alive:true, health:rand(60,90), ownerHouseholdId:hh.id, name: giveAnimalName(a.species, hh)};
      }
      births+=n;
    }
  }
  hh.money += income;
  /* mejora de diseño (2026-09): el goteo rutinario del ganado (nace algo, muere algo, se vende
     leche) queda registrado siempre en la Crónica, pero solo entra al Resumen/feed inmediato
     cuando el número es realmente notable — el dinero y el grano ya se ven siempre en Hacienda. */
  if(births>0){ const e=log(w,'Nuevas crías',`El rebaño y el corral crecieron: ${births} nueva(s) cría(s) este año.`,'ganado'); if(births>=3) turnLog.push(e); }
  if(deaths>0){ const e=log(w,'Pérdidas en el ganado',`${deaths} animal(es) murieron este año por vejez o enfermedad.`,'ganado'); if(deaths>=2) turnLog.push(e); }
  if(income>0) log(w,'Venta de leche, lana y huevos',`El ganado y las aves produjeron bienes vendidos por ${income} monedas.`,'ganado');

  let culled=0, culledIncome=0;
  for(const sp of Object.keys(ANIMAL_TYPES)){
    const list = animalsOf(hh).filter(a=>a.species===sp).sort((a,b)=>b.birthYear-a.birthYear);
    const cap = ANIMAL_TYPES[sp].cap;
    for(let i=cap;i<list.length;i++){ list[i].alive=false; culledIncome+=ANIMAL_TYPES[sp].sell; culled++; }
  }
  if(culled>0){
    hh.money+=culledIncome;
    const e=log(w,'Venta de excedente',`La granja no daba para más animales de los que ya tenías: vendiste ${culled} en el mercado por ${culledIncome} monedas.`,'ganado');
    if(culled>=3) turnLog.push(e);
  }
}

/* ---------- desarrollo infantil (Partes 10-11: el aprendizaje llega por etapas) ---------- */
function resolveChildDevelopment(w){
  for(const c of Object.values(w.characters)){
    if(!c.alive) continue;
    if(c.age>=6 && c.age<=8){
      c.skills.animal_husbandry = clamp(c.skills.animal_husbandry+rand(0,1),0,100);
    } else if(c.age>=9 && c.age<=11){
      c.skills.farming = clamp(c.skills.farming+rand(0,1),0,100);
      c.skills.animal_husbandry = clamp(c.skills.animal_husbandry+rand(0,1),0,100);
    } else if(c.age>=12 && c.age<=15){
      c.skills.farming = clamp(c.skills.farming+rand(0,2),0,100);
      c.skills.animal_husbandry = clamp(c.skills.animal_husbandry+rand(0,2),0,100);
    }
  }
}

/* ---------- hitos de vida (Parte 32, 36-38): momentos one-shot que construyen biografía.
   Nota: "first_profession" YA NO es automático al cumplir 16 (Parte 33) — el oficio real
   se registra desde donde de verdad ocurre (aprendizaje, tierras familiares, jornal), vía
   triggerMilestone('first_real_profession', ...) llamado desde esos puntos concretos. ---------- */
const MILESTONE_DEFS=[
  {key:'first_steps', age:1, minor:true, icon:'🚶', title:'Primeros pasos', text:(p)=>`Das tus primeros pasos.`},
  {key:'first_words', age:2, minor:true, icon:'🗣️', title:'Primeras palabras', text:(p)=>`Empiezas a decir tus primeras palabras.`},
  {key:'first_friend', age:4, custom:true, chance:0.85},
  {key:'sees_the_lord', age:11, minor:true, chance:0.5, icon:'🏰', title:'El señor local', text:(p)=>`Ves por primera vez a ${WORLD_FLAVOR.lordName} pasar por el pueblo.`},
  {key:'first_walk_alone', age:13, minor:true, icon:'🏘️', title:'Sin compañía', text:(p)=>`Recorres el pueblo por primera vez sin compañía.`},
  {key:'first_animal_chore', age:7, minor:false, icon:'🐑', title:'Una nueva responsabilidad',
    modalText:(w,p)=>{ const parentId=p.fatherId||p.motherId;
      return (parentId? kinRef(p.id,parentId)+' considera':'Tu familia considera')+' que ya eres suficientemente mayor para ayudar con los animales.###Desde ahora puedes participar en algunas tareas de la granja.'; },
    buttonLabel:'Ayudaré'},
  {key:'first_harvest_help', age:10, minor:false, icon:'🌾', title:'El campo',
    modalText:()=>'Por primera vez te dejan participar seriamente durante la cosecha.###Has desbloqueado nuevas tareas de trabajo.',
    buttonLabel:'Participar'},
  {key:'value_of_things', age:15, minor:false, icon:'🪙', title:'El valor de las cosas',
    modalText:()=>'Empiezas a comprender cuánto cuesta mantener una casa, alimentar animales y pagar al señor.###Ahora puedes entender mejor la economía familiar.',
    buttonLabel:'Entendido'}
];
/* primer amigo real (Parte 11): un PERSONAJE concreto del mundo, no solo un texto */
function resolveFirstFriendMilestone(w,p,turnLog){
  const excluded=new Set([p.fatherId,p.motherId,...p.siblingIds].filter(Boolean));
  let pool=Object.values(w.characters).filter(c=>c.alive && c.id!==p.id && c.age<=9 &&
    Math.abs(c.age-p.age)<=3 && !excluded.has(c.id) && !(p.knownCharacterIds||[]).includes(c.id));
  const friend = pool.length? pick(pool) : spawnVillageFamily(w, clamp(p.age+rand(-1,1),0,9));
  introduceCharacter(p, friend);
  bumpRelationship(w,p.id,friend.id,rand(30,50));
  p.firstFriendId=friend.id;
  const entry=triggerMilestone(w,p,'first_friend',{icon:'🧸',title:'Primer amigo',desc:`Has hecho amistad con ${friend.firstName} ${friend.familyName}.`,major:false});
  if(entry) turnLog.push(entry);
}
function resolveMilestones(w, turnLog){
  const p=player(w);
  p.milestones = p.milestones||[];
  w.pendingMilestoneModals = w.pendingMilestoneModals||[];
  for(const m of MILESTONE_DEFS){
    if(p.age!==m.age || p.milestones.includes(m.key)) continue;
    if(m.chance && !chance(m.chance)) continue;
    if(m.custom){
      if(m.key==='first_friend') resolveFirstFriendMilestone(w,p,turnLog);
      continue;
    }
    p.milestones.push(m.key);
    if(m.minor){
      turnLog.push(log(w, m.title, m.text(p), 'personaje', [p.id]));
    } else {
      w.pendingMilestoneModals.push({key:m.key, title:m.title, text:m.modalText(w,p), buttonLabel:m.buttonLabel||'Continuar'});
      turnLog.push(log(w, m.title, m.title, 'personaje', [p.id]));
    }
  }
}

/* ---------- FamilySystem: nacimientos (Parte 9/10) ---------- */
function inheritTraits(a,b){
  const poolUnique=[...new Set([...a.traits,...b.traits])];
  const target=Math.min(2,poolUnique.length);
  const chosen=new Set();
  while(chosen.size<target) chosen.add(pick(poolUnique));
  if(chance(0.2)) chosen.add(pick(TRAITS));
  return [...chosen];
}
function resolveBirths(w, turnLog){
  for(const m of Object.values(w.characters)){
    if(!m.alive || m.sex!=='F' || !m.spouseId) continue;
    const spouse=C(m.spouseId);
    if(!spouse || !spouse.alive) continue;
    if(m.age<16 || m.age>45) continue;
    if(!chance(0.22)) continue;
    const father = spouse.sex==='M'?spouse:m;
    const mother = spouse.sex==='M'?m:spouse;
    const surname = determineChildSurname(father,mother);
    const lineageId = determineChildLineage(father,mother);
    const child = makeCharacter({sex:pick(['M','F']), age:0, familyName:surname, houseId:lineageId, householdId:mother.householdId,
      fatherId:father.id, motherId:mother.id, traits:inheritTraits(father,mother)});
    child.skills.farming = Math.round((father.skills.farming+mother.skills.farming)/2*0.25);
    w.characters[child.id]=child;
    father.childrenIds.push(child.id); mother.childrenIds.push(child.id);
    if(w.houses[lineageId]) w.houses[lineageId].memberIds.push(child.id);
    if(mother.householdId && w.households[mother.householdId]) w.households[mother.householdId].memberIds.push(child.id);
    // hermanos existentes (mismo padre y madre): consistencia bidireccional (Parte 9 / Parte 23)
    const existingSiblings = father.childrenIds.filter(id=>id!==child.id && mother.childrenIds.includes(id)).map(id=>w.characters[id]).filter(Boolean);
    child.siblingIds = existingSiblings.map(s=>s.id);
    existingSiblings.forEach(s=>{ if(!s.siblingIds.includes(child.id)) s.siblingIds.push(child.id); });

    const birthEntry=log(w,birthTitle(child.sex),`${capitalize(personRef(w.playerId,mother.id))} y ${personRef(w.playerId,father.id)} han recibido ${child.sex==='M'?'a un hijo':'a una hija'}: ${personRef(w.playerId,child.id)}.`,'family',[father.id,mother.id,child.id]);
    if(isNoteworthyToPlayer(w,father.id)||isNoteworthyToPlayer(w,mother.id)) turnLog.push(birthEntry);
    if(chance(0.02)){
      mother.alive=false; mother.deathYear=w.year; mother.causeOfDeath='complicaciones de parto';
      cacheLifeSummary(w,mother);
      const deathEntry=log(w,'Tragedia en el parto',`${capitalize(personRef(w.playerId,mother.id))} no sobrevivió al parto. Toda la casa guarda luto.`,'family',[mother.id]);
      if(isNoteworthyToPlayer(w,mother.id)) turnLog.push(deathEntry);
      if(mother.id===w.playerId) w.pendingPlayerDeath=mother.id;
    }
  }
}

/* ---------- MortalitySystem (Parte 19: mortalidad refinada por etapas de edad) ---------- */
function ageDeathChance(age,health,traits){
  let c;
  if(age<1) c=0.05;
  else if(age<=5) c=0.02;
  else if(age<=15) c=0.008;
  else if(age<40) c=0.006;
  else if(age<50) c=0.012;
  else if(age<60) c=0.03;
  else if(age<70) c=0.07;
  else if(age<80) c=0.15;
  else c=0.32;
  c *= (1 + (60-health)/110);
  if(traits.includes('enfermizo/a')) c*=1.35;
  if(traits.includes('fuerte de cuerpo')) c*=0.75;
  return clamp(c,0.002,0.9);
}
function causeOfDeath(age){
  if(age<=5) return pick(['unas fiebres infantiles','una enfermedad del invierno']);
  if(age<40) return pick(['un accidente en el campo','una fiebre repentina','una herida infectada']);
  if(age<65) return pick(['una enfermedad del invierno','un accidente','fiebres persistentes']);
  return pick(['la vejez','una enfermedad de invierno','el debilitamiento de los años']);
}
function cacheLifeSummary(w,ch){
  const spouse = ch.spouseId?C(ch.spouseId):null;
  const master = (ch.career && ch.career.masterId) ? C(ch.career.masterId) : null;
  ch.lifeSummary = {
    birth:ch.birthYear, death:ch.deathYear, profession:ch.profession,
    careerLabel: getDisplayOccupation(ch),
    masterName: master? (master.firstName+' '+master.familyName) : null,
    leftHomeAge: ch.leftHomeAge!==undefined ? ch.leftHomeAge : null,
    spouseName: spouse?(spouse.firstName+' '+spouse.familyName):null,
    marriedAge: ch.marriedAge||null,
    numChildren: ch.childrenIds.length,
    cause: ch.causeOfDeath,
    highlights: w.history.filter(h=>h.related.includes(ch.id)).slice(-5)
  };
}
function resolveMortality(w, turnLog){
  for(const ch of Object.values(w.characters)){
    if(!ch.alive) continue;
    ch.health = clamp(ch.health + rand(-4,3) - (ch.age>55?1:0), 0, 100);
    if(ch.traits.includes('fuerte de cuerpo')) ch.health=clamp(ch.health+1,0,100);
    if(ch.traits.includes('enfermizo/a')) ch.health=clamp(ch.health-1,0,100);
    const dc = ageDeathChance(ch.age, ch.health, ch.traits);
    if(chance(dc)){
      ch.alive=false; ch.deathYear=w.year; ch.causeOfDeath=causeOfDeath(ch.age);
      cacheLifeSummary(w,ch);
      const whoRef = ch.id===w.playerId ? `${ch.firstName} ${ch.familyName}` : capitalize(personRef(w.playerId,ch.id));
      const deathEntry=log(w,'Una muerte en la familia',`${whoRef} ha muerto, a los ${ch.age} años, por ${ch.causeOfDeath}.`,'family',[ch.id]);
      if(isNoteworthyToPlayer(w,ch.id)) turnLog.push(deathEntry);
      // Parte 38: si la cabeza de hogar muere, el hogar sigue teniendo alguien al mando con sentido
      if(ch.householdId && w.households[ch.householdId] && w.households[ch.householdId].headId===ch.id) resolveHouseholdHead(w.households[ch.householdId]);
      if(ch.id===w.playerId) w.pendingPlayerDeath=ch.id;
    }
  }
}

/* ---------- HistoryImpactSystem (mejora de diseño 2026-09 #2/#3/#18) ----------
   "No importa tanto que haya una guerra entre dos reinos. Importa que tu padre sea reclutado,
   que suba el precio del trigo..." — cuando un suceso de WORLD_TIMELINE cae dentro del año que
   se está viviendo Y toca la región del jugador (o es de todo el reino), el personaje lo VIVE
   directamente: se añade a su conocimiento del mundo (knownHistoryIds, punto 18) y, si el tipo
   de suceso tiene un efecto real, aterriza en algo concreto para su hogar o su familia — nunca
   silencioso ni solo informativo. */
function resolveLivedHistory(w, turnLog){
  const p=player(w); if(!p || !p.alive) return;
  const regionId = w.regionId||'fenwold';
  const entries = WORLD_TIMELINE.filter(e=> e.year===w.year && (e.regionId==='global'||e.regionId===regionId));
  for(const entry of entries){
    p.knownHistoryIds = p.knownHistoryIds||[];
    if(!p.knownHistoryIds.includes(entry.id)) p.knownHistoryIds.push(entry.id);
    const impact = applyHistoricalImpact(w,p,entry);
    const desc = impact ? `${entry.text} ${impact}` : entry.text;
    turnLog.push(log(w, entry.title, desc, 'mundo', [p.id]));
  }
}
function applyHistoricalImpact(w,p,entry){
  const hh=household(w);
  if(entry.type==='war'){
    if(hh){ const grainHit=Math.round(hh.grainStores*0.15); hh.grainStores=Math.max(0,hh.grainStores-grainHit); hh.money=Math.max(0,Math.round((hh.money-rand(1,3))*10)/10); }
    if(chance(0.18)){
      const candidates=closeFamilyFlat(p.id).filter(m=>m.alive && m.id!==p.id && m.sex==='M' && m.age>=16 && m.age<=42);
      if(candidates.length){
        const victim=pick(candidates);
        victim.alive=false; victim.deathYear=w.year; victim.causeOfDeath='la guerra';
        cacheLifeSummary(w,victim);
        if(victim.householdId && w.households[victim.householdId] && w.households[victim.householdId].headId===victim.id) resolveHouseholdHead(w.households[victim.householdId]);
        return `${capitalize(personRef(w.playerId,victim.id))} no volvió de la guerra.`;
      }
    }
    return 'Tu hogar sintió la guerra: menos grano en el granero y el pan más caro en el mercado.';
  }
  if(entry.type==='famine'){
    if(hh){ const grainHit=Math.round(hh.grainStores*0.2); hh.grainStores=Math.max(0,hh.grainStores-grainHit); }
    return 'Tu hogar pasó hambre como el resto del pueblo ese año.';
  }
  if(entry.type==='prosperity'){
    if(hh) hh.money=Math.round((hh.money+rand(2,5))*10)/10;
    return 'Tu hogar también notó los buenos tiempos.';
  }
  if(entry.type==='disaster'){
    if(hh) hh.money=Math.max(0,Math.round((hh.money-rand(1,4))*10)/10);
    return 'Tu hogar tuvo que reponerse como pudo.';
  }
  return null;
}
/* ---------- descubrimiento gradual de historia pasada (punto 18) ----------
   knownHistoryIds solo crece con lo vivido (arriba) o con lo que alguien le cuenta al
   personaje — nunca de golpe. Prioriza sucesos de su propia región sobre los del reino
   entero, y nunca revela algo posterior a su propio nacimiento como si lo hubiera vivido. */
const HISTORY_SOURCES=['Tu abuela te contó que','Un anciano del pueblo recordó que','Un viajero de paso contó que',
  'El sacerdote mencionó una vez que','Un mercader comentó en el mercado que','En la feria alguien recordó que',
  'Tu padre te contó que','Un soldado de paso contó que'];
function pickUndiscoveredHistory(w,p){
  const known=new Set(p.knownHistoryIds||[]);
  const regionId=w.regionId||'fenwold';
  const pastEntries=historyForRegion(regionId,w.year).filter(e=>e.year<p.birthYear && !known.has(e.id));
  if(!pastEntries.length) return null;
  const local=pastEntries.filter(e=>e.regionId===regionId);
  return pick(local.length?local:pastEntries);
}

/* ================= NpcLifeSystem (Parte 3-8, 16) =================
   Cada año, los familiares vivos que el jugador NO controla pueden
   casarse, formar su propio hogar, encontrar oficio y prosperar o
   empobrecerse — todo por reglas/probabilidades, sin IA generativa. */
function npcMarriageChance(c){
  let base;
  const age=c.age;
  if(age<18) base=0.03;
  else if(age<=30) base=0.16;
  else if(age<=40) base=0.08;
  else if(age<=55) base=0.03;
  else base=0.01;
  if(c.traits.includes('sociable')) base*=1.4;
  if(c.traits.includes('reservado/a')) base*=0.6;
  base *= clamp(0.6+c.health/200,0.5,1.2);
  base *= clamp(0.7+c.reputation/200,0.6,1.3);
  return clamp(base,0.005,0.5);
}
function npcIndependenceChance(c){
  let base=0.05;
  if(c.traits.includes('ambicioso/a')) base*=1.8;
  if(c.traits.includes('prudente')) base*=0.6;
  return clamp(base,0.01,0.3);
}
function foundNewHousehold(w, headChar, turnLog, opts={}){
  const oldHousehold = headChar.householdId ? w.households[headChar.householdId] : null;
  const hhId=uid();
  const hh={id:hhId, name:'Casa de '+headChar.firstName+' '+headChar.familyName, headId:headChar.id,
    memberIds:[headChar.id], money:rand(1,4), grainStores:rand(2,6), propertyIds:[], createdYear:w.year};
  if(oldHousehold){
    const gift=Math.min(oldHousehold.money, rand(1,3));
    oldHousehold.money-=gift; hh.money+=gift;
    oldHousehold.memberIds = oldHousehold.memberIds.filter(id=>id!==headChar.id);
    if(oldHousehold.headId===headChar.id){
      oldHousehold.headId = oldHousehold.memberIds[0] || oldHousehold.headId;
    }
  }
  w.households[hhId]=hh;
  headChar.householdId=hhId;
  if(opts.extraMember){
    hh.memberIds.push(opts.extraMember.id);
    opts.extraMember.householdId=hhId;
  }
  const entry=log(w, opts.reason==='marriage'?'Nuevo hogar':'Independencia',
    `${headChar.firstName} ${headChar.familyName} formó su propio hogar${opts.extraMember?(' junto a '+opts.extraMember.firstName):''}.`,
    'family',[headChar.id]);
  if(turnLog && (isNoteworthyToPlayer(w,headChar.id)||(opts.extraMember&&isNoteworthyToPlayer(w,opts.extraMember.id)))) turnLog.push(entry);
  assignNpcCareer(headChar, turnLog);
  return hh;
}
function npcMarry(w, c, turnLog){
  const sex = c.sex==='M'?'F':'M';
  const spouse = spawnExternalSpouse(sex, [16, Math.min(50, Math.max(20,c.age+6))], w);
  w.characters[spouse.id]=spouse;
  spouse.spouseId=c.id; c.spouseId=spouse.id;
  c.marriedAge=c.age; spouse.marriedAge=spouse.age;
  bumpRelationship(w,c.id,spouse.id,50);
  const staysHome = c.householdId && w.households[c.householdId] && chance(0.45);
  if(staysHome){
    const hh=w.households[c.householdId];
    hh.memberIds.push(spouse.id);
    spouse.householdId=hh.id;
  } else {
    foundNewHousehold(w, c, turnLog, {reason:'marriage', extraMember:spouse});
  }
  const entry = log(w,'Matrimonio',`${c.firstName} ${c.familyName} se casó con ${spouse.firstName} ${spouse.familyName}.`,'family',[c.id,spouse.id]);
  if(turnLog && isNoteworthyToPlayer(w,c.id)) turnLog.push(entry);
  assignNpcCareer(spouse, turnLog);
}
/* gastos de los hogares NPC; los ingresos ya se aplicaron vía resolvePersonalEconomy(),
   que lee del mismo registro PROFESSIONS que usa el jugador (Partes 26, 48: una sola fuente) */
function resolveNpcEconomies(w, turnLog){
  const skipId=player(w).householdId;
  for(const hh of Object.values(w.households)){
    if(hh.id===skipId) continue;
    const members=hh.memberIds.map(id=>w.characters[id]).filter(c=>c&&c.alive);
    if(!members.length) continue;
    let expenses=0;
    for(const m of members) expenses+=1.5+(m.age<16?-0.4:0);
    if(members.some(mm=>mm.traits.includes('tacaño/a'))) expenses*=0.85;
    const before=householdStatus(hh);
    hh.money=Math.max(0, Math.round(hh.money-expenses));
    const after=householdStatus(hh);
    if(before!==after && isCloseFamily(w.playerId, hh.headId)){
      turnLog.push({year:w.year, title:'Cambia la suerte de la familia', desc:`${hh.name}: ${householdStatusLabel(after)}`, tag:'family', related:[hh.headId], minor:true});
    }
  }
}
function resolveNpcLife(w, turnLog){
  const livingCount = Object.values(w.characters).filter(c=>c.alive).length;
  const overCrowded = livingCount > 60; // límite ligero de rendimiento/legibilidad (Parte 49)
  for(const c of Object.values(w.characters)){
    if(!c.alive || c.id===w.playerId) continue;
    if(c.age<16) continue;
    const widowed = c.spouseId && C(c.spouseId) && !C(c.spouseId).alive;
    if((!c.spouseId || widowed) && c.age<=60 && !overCrowded){
      if(chance(npcMarriageChance(c))){ npcMarry(w,c,turnLog); continue; }
    }
    if(c.householdId && w.households[c.householdId] && w.households[c.householdId].headId!==c.id){
      if(!isCloseFamily(w.playerId, c.id) && chance(npcIndependenceChance(c))){
        foundNewHousehold(w, c, turnLog, {reason:'independence'});
        continue;
      }
    }
    assignNpcCareer(c, turnLog);
  }
  resolveNpcEconomies(w, turnLog);
}

/* ---------- EventSystem: eventos base (data-driven) ---------- */
const EVENTS = [

/* ---------- EventSystem: eventos de ciclo vital (Parte 14) ----------
   Se generan como funciones (no como entradas planas de EVENTS) porque
   necesitan capturar a un familiar concreto para sus opciones. */
function resolveEnfermedad(w,p){
  const targets=closeFamilyFlat(p.id).filter(m=>m.alive);
  if(!targets.length) return null;
  const sick=pick(targets);
  const sickRef=capitalize(kinRef(p.id,sick.id));
  const sickSuffix=sick.sex==='M'?'o':'a';
  return {id:'enfermedad_familiar', interactive:true,
    text:pick([
      `${sickRef} ha caíd${sickSuffix} enferm${sickSuffix} durante el cambio de estación.`,
      `${sickRef} lleva días con fiebre y no mejora.`,
      `${sickRef} se queja de un dolor que no se le pasa.`
    ]),
    options:[
      {label:'Cuidarle '+genderText('tú mismo/a',p.sex), desc:'-tu salud, buena recuperación',
        effect:(w,p)=>{ p.health=clamp(p.health-rand(3,7),0,100); sick.health=clamp(sick.health+rand(8,16),0,100);
          return log(w,'Cuidados en casa',`Velaste a ${sick.firstName} noche y día hasta que la fiebre cedió.`,'family',[p.id,sick.id]);}},
      {label:'Pagar a un curandero', desc:'-monedas, recuperación segura',
        effect:(w,p)=>{ household(w).money=Math.max(0,household(w).money-4); sick.health=clamp(sick.health+rand(10,18),0,100);
          return log(w,'El curandero','Pagaste al curandero del pueblo, que atendió a '+sick.firstName+' con hierbas y ungüentos.','family',[p.id,sick.id]);}},
      {label:'Rezar y esperar', desc:'gratis, resultado incierto',
        effect:(w,p)=>{ if(chance(0.5)) sick.health=clamp(sick.health+rand(4,10),0,100); else sick.health=clamp(sick.health-rand(4,10),0,100);
          return log(w,'A la espera',`Encomendaste a ${sick.firstName} a ${WORLD_FLAVOR.faith} y esperaste.`,'family',[p.id,sick.id]);}}
    ]};
}
function buildAdolescenciaEvent(w,p){
  if(!p.fatherId && !p.motherId) return null;
  const parent = p.fatherId?C(p.fatherId):C(p.motherId);
  if(!parent || !parent.alive) return null;
  return {id:'adolescencia_responsabilidad', interactive:true,
    text:`${capitalize(kinRef(p.id,parent.id))} considera que ya tienes edad para asumir más responsabilidad en la granja.`,
    options:[
      {label:'Trabajar más en los campos', desc:'+labranza, -salud leve',
        effect:(w,p)=>{ p.skills.farming=clamp(p.skills.farming+rand(2,5),0,100); p.health=clamp(p.health-rand(1,3),0,100);
          return log(w,'Más responsabilidad','Empezaste a pasar largas jornadas en el campo.','personaje',[p.id]);}},
      {label:'Cuidar el ganado', desc:'+ganadería',
        effect:(w,p)=>{ p.skills.animal_husbandry=clamp(p.skills.animal_husbandry+rand(2,5),0,100);
          return log(w,'Más responsabilidad','Asumiste el cuidado diario del ganado familiar.','personaje',[p.id]);}},
      {label:'Evitar responsabilidades', desc:'sin ganancias, leve tensión',
        effect:(w,p)=>{ bumpRelationship(w,p.id,parent.id,-3);
          return log(w,'Evitas responsabilidades','Preferiste seguir como hasta ahora, para disgusto de tu familia.','personaje',[p.id]);}}
    ]};
}
/* ---------- eventos de vocación (v4, Partes 3, 8, 31): el oficio emerge de la vida,
   nunca de un menú de elección — se ofrece a través de personas y ocasiones concretas. ---------- */
function buildApprenticeshipOfferEvent(w,p){
  if(p.career && p.career.professionId) return null;
  const masters=findAvailableMasters(p);
  if(!masters.length) return null;
  const master=pick(masters);
  const prof=PROFESSIONS[master.career.professionId];
  return {id:'oferta_aprendizaje', interactive:true, minAge:12,
    text:`${master.firstName} ${master.familyName}, ${genderText(prof.label,master.sex).toLowerCase()} de ${WORLD_FLAVOR.villageName}, necesita a alguien que le ayude.`,
    options:[
      {label:`Preguntar si puedes aprender con ${pronoun(master.sex)}`, desc:'comienzas tu aprendizaje',
        effect:(w,p)=>{ introduceCharacter(p,master); startApprenticeship(p,master);
          return log(w,'Un nuevo aprendizaje',`${master.firstName} aceptó enseñarte los primeros pasos de ${genderText(prof.label,master.sex).toLowerCase()}.`,'trabajo',[p.id,master.id]); }},
      {label:'Aceptar solo algunos trabajos sueltos', desc:'pequeño ingreso, sin compromiso',
        effect:(w,p)=>{ introduceCharacter(p,master); p.personalMoney=Math.round(((p.personalMoney||0)+rand(1,2))*10)/10;
          return log(w,'Trabajos sueltos',`Ayudaste a ${master.firstName} en algunas tareas sencillas a cambio de unas monedas.`,'trabajo',[p.id,master.id]); }},
      {label:'Rechazar', desc:'sin efecto',
        effect:(w,p)=> log(w,'No es el momento',`Le explicaste a ${master.firstName} que no era el momento.`,'trabajo',[p.id])},
      {label:'Decir que tu familia necesita tus manos en el campo', desc:'refuerza el vínculo familiar',
        effect:(w,p)=>{ const parent=p.fatherId?C(p.fatherId):(p.motherId?C(p.motherId):null);
          if(parent) bumpRelationship(w,p.id,parent.id,4);
          return log(w,'Tu lugar está en casa','Le dijiste que tu familia te necesita en las tierras familiares.','trabajo',[p.id]); }}
    ]};
}
function buildFamilyTradeEvent(w,p){
  if(p.career && p.career.professionId) return null;
  const hh=household(w); if(!propertiesOf(hh).length && !animalsOf(hh).length) return null;
  const parent=p.fatherId?C(p.fatherId):(p.motherId?C(p.motherId):null);
  if(!parent||!parent.alive) return null;
  return {id:'oferta_tierras_familiares', interactive:true, minAge:14,
    text:`${capitalize(kinRef(p.id,parent.id))} cree que ya es hora de que te dediques en serio a las tierras de la familia.`,
    options:[
      {label:'Sí, seguiré con las tierras familiares', desc:'comienzas tu propio oficio',
        effect:(w,p)=>{ const profId = p.skills.animal_husbandry>p.skills.farming ? 'shepherd' : 'peasant_farmer';
          const stage = (p.skills.farming>25||p.skills.animal_husbandry>25) ? 'worker' : 'helper';
          p.career={professionId:profId, stage, masterId:null, startedYear:w.year, experience: stage==='worker'?20:5, annualEarnings:0};
          triggerMilestone(w,p,'first_real_profession',{icon:PROFESSIONS[profId].icon,title:'Tu primer oficio',desc:`Te dedicas ahora a ${genderText(PROFESSIONS[profId].label,p.sex).toLowerCase()}.`,major:false});
          return log(w,'Las tierras familiares',`Aceptaste dedicarte a las tierras de la familia, como ${genderText(PROFESSIONS[profId].label,p.sex).toLowerCase()}.`,'trabajo',[p.id,parent.id]); }},
      {label:'Preferirías otra cosa', desc:'leve tensión con tu familia',
        effect:(w,p)=>{ bumpRelationship(w,p.id,parent.id,-3);
          return log(w,'Otros planes',`Le dijiste a ${kinRef(p.id,parent.id,{withName:false})} que preferirías buscar otro camino.`,'trabajo',[p.id,parent.id]); }},
      {label:'Todavía no lo sabes', desc:'sin efecto',
        effect:(w,p)=> log(w,'Aún sin decidir','Todavía no sabes bien qué quieres hacer con tu vida.','trabajo',[p.id])}
    ]};
}
function buildLaborerFallbackEvent(w,p){

      {label:'Seguir buscando otra cosa', desc:'sin efecto',

    ]};
}
/* ---------- eventos apropiados a la infancia (Parte 31) ---------- */
function buildJuegoInfantilEvent(w,p){
  const cf=closeFamily(p.id);
  const targets=[cf.mother,cf.father,...cf.siblings].filter(m=>m&&m.alive);
  if(!targets.length) return null;
  const t=pick(targets);
  const isParent = t.id===p.fatherId||t.id===p.motherId;
  return {id:'juego_infantil', interactive:true, minAge:3,
    text:`Un día tranquilo en casa. ${isParent?('Podrías seguir a '+t.firstName+' a todas partes.'):('Podrías jugar con '+t.firstName+'.')}`,
    options:[
      {label:'Jugar con '+t.firstName, desc:'+relación',
        effect:(w,p)=>{ bumpRelationship(w,p.id,t.id,rand(5,10)); return log(w,'Juegos de infancia',`Jugaste con ${t.firstName} durante horas.`,'personaje',[p.id,t.id]);}},
      {label:'Compartir algo tuyo con '+t.firstName, desc:'+relación',
        effect:(w,p)=>{ bumpRelationship(w,p.id,t.id,rand(3,7));
          return log(w,'Un pequeño gesto',`Compartiste tu tiempo con ${t.firstName}.`,'personaje',[p.id,t.id]);}},
      {label:'Pelear con '+t.firstName, desc:'-relación',
        effect:(w,p)=>{ bumpRelationship(w,p.id,t.id,-rand(2,6)); return log(w,'Un pequeño enfado',`Te peleaste con ${t.firstName} por una tontería.`,'personaje',[p.id,t.id]);}}
    ]};
}

function buildHermanoMarchaEvent(w,p){

function buildDisputaHermanosEvent(w,p){

  const shuffled=[...candidates].sort(()=>Math.random()-0.5);
  const [a,b]=shuffled;
  return {id:'disputa_hermanos', interactive:true,
    text:`${a.firstName} y ${b.firstName} tienen un desacuerdo que empieza a tensar la casa.`,

        effect:(w,p)=>{ bumpRelationship(w,p.id,a.id,5); bumpRelationship(w,p.id,b.id,5); bumpRelationship(w,a.id,b.id,6);
          return log(w,'Mediaste en la disputa',`Ayudaste a que ${a.firstName} y ${b.firstName} hicieran las paces.`,'family',[p.id,a.id,b.id]);}},
      {label:'Apoyar a uno de los dos', desc:'+relación con uno, -con el otro',

        effect:(w,p)=> log(w,'Te mantuviste al margen','Decidiste no meterte en la disputa entre tus hermanos.','family',[p.id,a.id,b.id])}
    ]};
}
function buildPeticionEconomicaEvent(w,p){
  const cf=closeFamily(p.id);
  const poor=[...cf.siblings,...cf.children].filter(m=>m.alive && m.householdId && m.householdId!==p.householdId && w.households[m.householdId] &&
    (householdStatus(w.households[m.householdId])==='poor'||householdStatus(w.households[m.householdId])==='destitute'));
  if(!poor.length) return null;
  const rel=pick(poor);
  return {id:'peticion_economica', interactive:true,
    text:`${rel.firstName}, que pasa apuros, te ha pedido ayuda económica.`,
    options:[
      {label:'Ayudarle', desc:'-monedas, +relación, mejora su hogar',
        effect:(w,p)=>{ const hh=household(w); const gift=Math.min(hh.money,rand(3,6)); hh.money-=gift;
          const theirHh=w.households[rel.householdId]; if(theirHh) theirHh.money+=gift;
          bumpRelationship(w,p.id,rel.id,10);
          return log(w,'Ayuda a la familia',`Ayudaste a ${rel.firstName} en un momento de necesidad.`,'family',[p.id,rel.id]);}},
      {label:'Negarse', desc:'-relación',
        effect:(w,p)=>{ bumpRelationship(w,p.id,rel.id,-10);
          return log(w,'Petición rechazada',`No pudiste o no quisiste ayudar a ${rel.firstName}.`,'family',[p.id,rel.id]);}}
    ]};
}
/* ---------- eventos con memoria (sesión 2026-09 #2, "decisiones que regresan") ----------
   Ya no basta con que una decisión tenga un efecto inmediato — algunas deben poder volver
   más adelante, atadas a un personaje real, no a una frase abstracta ("el vecino"). */
function buildDisputaVecinoEvent(w,p){

      `Una de tus ovejas se metió en el sembrado de ${neighbor.firstName}. ${genderText('Este/a',neighbor.sex)} exige compensación, ${genderText('furioso/a',neighbor.sex)}.`,
      `${neighbor.firstName} te acusa de robar agua del pozo común. La discusión sube de tono.`,
      `Un cerdo de ${neighbor.firstName} destrozó parte de tu huerto. Ahora exige que TÚ le pagues a ${pronoun(neighbor.sex)}.`
    ]),
    options:[
      {label:'Pagarle para calmarlo', desc:'-monedas, +relación con el pueblo',
        effect:(w,p)=>{ household(w).money=Math.max(0,household(w).money-3); p.reputation=clamp(p.reputation+2,0,100);
          bumpRelationship(w,p.id,neighbor.id,rand(4,8)); clearGrudge(w,neighbor.id);
          return log(w,'Disputa resuelta',`Pagaste a ${neighbor.firstName} por los daños y las cosas volvieron a la calma.`,'social',[p.id,neighbor.id]);}},
      {label:'Defender tu posición', desc:'riesgo de -reputación, y un rencor que puede volver',
        effect:(w,p)=>{ if(chance(0.5)){ p.reputation=clamp(p.reputation-rand(2,6),0,100);
            bumpRelationship(w,p.id,neighbor.id,-rand(8,14)); addGrudge(w,neighbor.id);
            return log(w,'Disputa envenenada',`La discusión se agrió; ${neighbor.firstName} no lo va a olvidar.`,'social',[p.id,neighbor.id]); }
          else { bumpRelationship(w,p.id,neighbor.id,-rand(2,5));

    ]};

/* represalia de un rencor guardado: pasiva (no otro modal a clickear) — la decisión ya se
   tomó hace tiempo, esto solo es el pago. Da tiempo (2+ años) para que no se sienta injusto. */
function buildGrudgeRetaliationEvent(w,p){
  const ids=Object.keys(w.flags.grudges||{});
  if(!ids.length) return null;
  const id=pick(ids); const enemy=C(id);
  if(!enemy || !enemy.alive){ clearGrudge(w,id); return null; }
  if((grudgeAge(w,id)||0)<2) return null;
  clearGrudge(w,id);
  const options=[
    ()=>{ p.reputation=clamp(p.reputation-rand(4,9),0,100);
      return {title:'Un rumor con nombre y apellido', desc:`${enemy.firstName} sigue ${genderText('resentido/a',enemy.sex)} por lo de antes: ahora cuenta por el pueblo cosas que no son ciertas sobre ti.`}; },
    ()=>{ bumpRelationship(w,p.id,enemy.id,-rand(3,6));
      return {title:'Puertas cerradas', desc:`${enemy.firstName} deja claro que, después de lo pasado, no piensa ayudarte en nada.`}; },
    ()=>{ const hh=household(w); if(hh.grainStores>3){ hh.grainStores=Math.max(0,hh.grainStores-rand(3,7));
        return {title:'Alguien tocó tu granero', desc:`Parte de tu grano desapareció una noche. Sospechas de ${enemy.firstName}, pero no puedes probarlo.`}; }
      return {title:'Rencor que no llegó a nada', desc:`${enemy.firstName} lo intentó, pero esta vez no consiguió hacerte daño.`}; }
  ];
  const r=pick(options)();
  return {id:'grudge_retaliation', interactive:false,
    resolve:(w,p)=> log(w,r.title,r.desc,'social',[p.id,enemy.id])};
}
/* a quien le debes un favor, tarde o temprano te lo cobra */
function buildDebtCalledEvent(w,p){
  const ids=debtorIds(w);
  if(!ids.length) return null;

  if(!creditor || !creditor.alive){ clearDebt(w,id); return null; }

    text:`${creditor.firstName} te recuerda aquel favor de hace tiempo y te pide que se lo devuelvas.`,

      {label:'Devolverle el favor', desc:'-grano o -monedas, +relación, tu palabra vale',
        effect:(w,p)=>{ const hh=household(w); if(hh.grainStores>=4) hh.grainStores-=4; else hh.money=Math.max(0,hh.money-3);
          bumpRelationship(w,p.id,creditor.id,rand(6,10)); clearDebt(w,creditor.id);
          return log(w,'Favor devuelto',`Le devolviste a ${creditor.firstName} lo que te prestó hace tiempo. Tu palabra vale algo en ${WORLD_FLAVOR.villageName}.`,'social',[p.id,creditor.id]);}},
      {label:'Decir que no puedes, ahora no', desc:'-relación, la deuda queda pendiente',
        effect:(w,p)=>{ bumpRelationship(w,p.id,creditor.id,-rand(6,12));
          return log(w,'Una deuda sin pagar',`Le dijiste a ${creditor.firstName} que no podías ayudar, no todavía. No pareció alegrarle.`,'social',[p.id,creditor.id]);}}
    ]};

/* eventos "clásicos" (adultos/económicos) requieren esta edad para DECIDIRSE (Parte 32);
   por debajo de ella, el evento igual ocurre y un adulto del hogar resuelve por defecto,
   y el jugador solo lo ve reflejado en la Historia, no como una decisión suya. */
const ADULT_EVENT_MIN_AGE=12;
/* Parte 50: cuando un evento "adulto" se autorresuelve porque el jugador es demasiado
   pequeño para decidir, la narración debe venir del hogar, no en primera persona del niño. */
function resolveAdultDecisionMaker(p){
  const hh=p.householdId? world.households[p.householdId] : null;
  const head=hh? C(hh.headId) : null;
  if(head && head.alive && head.id!==p.id) return personRef(p.id,head.id);
  const father=p.fatherId?C(p.fatherId):null;
  if(father && father.alive) return kinRef(p.id,father.id);
  const mother=p.motherId?C(p.motherId):null;
  if(mother && mother.alive) return kinRef(p.id,mother.id);
  return 'Tu familia';
}
function autoResolveAdultEvent(e, w, p){
  const opt=e.options[0];
  const beforeLen=w.history.length;
  opt.effect(w,p);
  if(w.history.length>beforeLen){
    const entry=w.history[w.history.length-1];
    const decisor=resolveAdultDecisionMaker(p);
    entry.desc = `${capitalize(decisor)} decidió, en nombre del hogar: ${opt.label.toLowerCase()}.`;
    pushFeed(w, entry);
  }
}
function rollEvents(w){
  const p=player(w);
  const pool=[];
  /* mejora de diseño (2026-09): los eventos genéricos base respetan su cooldown para no
     repetirse palabra por palabra en años seguidos (mismo principio que el "bag" de Reigns:
     lo recién usado sale temporalmente del fondo de selección). */
  const candidates=EVENTS.filter(e=>e.cond(w,p) && !eventOnCooldown(w,e.id,e.cooldown));
  if(candidates.length){ const chosen=pickWeighted(candidates.map(e=>({w:e.weight,e}))).e; markEventUsed(w,chosen.id); pool.push(chosen); }
  const withCooldown=(id, gap, chanceP, build)=>{
    if(eventOnCooldown(w,id,gap) || !chance(chanceP)) return null;
    const ev=build(); if(ev) markEventUsed(w,id); return ev;
  };
  const maybes=[
    ()=>withCooldown('enfermedad_familiar',2,0.3,()=>resolveEnfermedad(w,p)),
    ()=>withCooldown('hermano_quiere_marcharse',3,0.15,()=>buildHermanoMarchaEvent(w,p)),
    ()=>withCooldown('hijo_quiere_independencia',3,0.15,()=>buildHijoIndependenciaEvent(w,p)),
    ()=>withCooldown('disputa_hermanos',2,0.12,()=>buildDisputaHermanosEvent(w,p)),
    ()=>withCooldown('peticion_economica',2,0.12,()=>buildPeticionEconomicaEvent(w,p)),
    ()=>withCooldown('disputa_vecino',3,0.25,()=>buildDisputaVecinoEvent(w,p)),
    ()=>withCooldown('grudge_retaliation',2,0.4,()=>buildGrudgeRetaliationEvent(w,p)),
    ()=>withCooldown('debt_called',2,0.35,()=>buildDebtCalledEvent(w,p)),
    ()=>p.age>=12 && p.age<=15 && chance(0.3) && buildAdolescenciaEvent(w,p),
    ()=>p.age>=3 && p.age<=5 && chance(0.4) && buildJuegoInfantilEvent(w,p),
    ()=>p.age>=6 && p.age<=8 && chance(0.35) && buildTareaGranjaMenorEvent(w,p),
    ()=>p.age>=9 && p.age<=11 && chance(0.3) && buildErrorCampoEvent(w,p),
    ()=>p.age>=12 && chance(0.3) && buildApprenticeshipOfferEvent(w,p),
    ()=>p.age>=14 && chance(0.25) && buildFamilyTradeEvent(w,p),
    ()=>p.age>=18 && chance(0.3) && buildLaborerFallbackEvent(w,p)
  ];
  for(const fn of maybes){ const ev=fn(); if(ev) pool.push(ev); }

  const queue=[];
  let interactiveCount=0;
  for(const e of pool){
    if(e.interactive){
      const minAge = e.minAge!=null ? e.minAge : ADULT_EVENT_MIN_AGE;
      if(p.age<minAge){ autoResolveAdultEvent(e,w,p); continue; } // un adulto del hogar decide por defecto
      if(interactiveCount>=2) continue; // no saturar al jugador de decisiones en un mismo año
      queue.push({id:e.id, text: typeof e.text==='function'?e.text(w,p):e.text, options:e.options});
      interactiveCount++;
    } else {
      pushFeed(w, e.resolve(w,p));
    }
  }
  if(w.eventQueueSpecial && w.eventQueueSpecial.length){
    for(const ev of w.eventQueueSpecial){
      const minAge = ev.minAge!=null ? ev.minAge : ADULT_EVENT_MIN_AGE;
      if(p.age<minAge){ autoResolveAdultEvent(ev,w,p); continue; }
      queue.push(ev);
    }
    w.eventQueueSpecial=[];
  }
  return queue;
}

/* ---------- TimeSystem ---------- */
/* ---------- tutorial implícito (idea #1): crecer ES el tutorial, sin pantalla aparte.
   getPlayerCapabilities ya es la única fuente de verdad de qué se desbloquea a cada edad;
   en vez de una lista de pasos, cada vez que cumples la edad justa el feed te avisa, breve
   y en el momento en que de verdad importa. Un solo aviso por año, para no saturar aunque
   varias cosas se desbloqueen juntas a la misma edad. */
const GROWTH_UNLOCKS=[
  {cap:'canSeeRelaciones', title:'Empiezas a reconocer a la gente', desc:'Ya identificas a quienes te rodean. Ahora puedes ver a tu familia y a la gente del pueblo en Gente.'},
  {cap:'canHandleAnimals', title:'Ya puedes ayudar en casa', desc:'Tienes edad para ayudar con tareas sencillas, como cuidar a los animales. Búscalas en Hacer.'},
  {cap:'canFarm', title:'Empiezas a hacerte útil de verdad', desc:'Ahora puedes ayudar en el campo, y en Vida vas a ir viendo cada vez más de lo que pasa a tu alrededor.'},
  {cap:'canSeekApprenticeship', title:'Ya casi eres adulto/a', desc:'Puedes ver con más detalle las propiedades y el dinero del hogar, y hasta buscar oficio como aprendiz.'},
  {cap:'canEarnPersonalMoney', title:'Puedes ganar tu propio dinero', desc:'Ahora puedes trabajar por tu cuenta y guardar dinero aparte del dinero del hogar.'},
  {cap:'canSeeExactMoney', title:'Ya ves el mundo con ojos de adulto/a', desc:'Conoces el dinero exacto del hogar, tu reputación en el pueblo, y cómo le va a la economía de tu alrededor.'},
  {cap:'canMarry', title:'Eres adulto/a', desc:'Puedes casarte, trabajar un oficio, comerciar con otros, formar tu propio hogar y, si te toca, hacerte cargo tú mismo/a de la hacienda. A partir de aquí, tu camino es cosa tuya.'}
];
function announceGrowthUnlocks(w,prevCap,newCap){
  const p=player(w); if(!p) return;
  for(const u of GROWTH_UNLOCKS){
    if(!prevCap[u.cap] && newCap[u.cap]){
      plog(w, genderText(u.title,p.sex), genderText(u.desc,p.sex), 'tutorial', [p.id], 'growth_'+u.cap);
    }
  }
}
/* ---------- TutorialSpotlightSystem (mejora de diseño 2026-09 #13) ----------
   GROWTH_UNLOCKS ya avisaba en el feed de cada desbloqueo por edad, pero solo informaba —
   el jugador tenía que acordarse de ir a buscar la pestaña nueva por su cuenta. Ahora, cuando
   el desbloqueo abre una pestaña nueva de navegación, además se lanza un tutorial guiado real:
   se oscurece el resto de la interfaz, se resalta SOLO ese botón, y no se puede continuar hasta
   pulsarlo (ver applySpotlight() y el guard en el listener de clicks). Cada tutorial se guarda
   como visto en el propio personaje (p.tutorialsSeen) y no vuelve a mostrarse — igual que
   GROWTH_UNLOCKS, una vida nueva (tras una sucesión) sí vuelve a recibir los suyos al crecer. */
const TAB_TUTORIALS = {
  hacer:{ title:'Ya puedes trabajar', text:'Se ha desbloqueado HACER. Elige ahí cómo pasar cada año que vivas.' },
  gente:{ title:'Empiezas a conocer a tu gente', text:'Se ha desbloqueado GENTE: tu familia y quienes conoces en el pueblo.' },
  hacienda:{ title:'La hacienda de tu familia', text:'Se ha desbloqueado HACIENDA: lo que posee y necesita tu hogar para salir adelante.' },
  tienda:{ title:'El mercado del pueblo', text:'Se ha desbloqueado TIENDA: compra y vende lo que tu hogar produce.' }
};
function queueTutorial(w,p,key,def){
  p.tutorialsSeen = p.tutorialsSeen||[];
  if(p.tutorialsSeen.includes(key)) return;
  w.pendingTutorials = w.pendingTutorials||[];
  w.pendingTutorials.push({key, ...def});
}
function announceNewTabs(w,p,prevAge,newAge){
  if(prevAge==null || newAge==null) return;
  for(const [k,,minAge] of TAB_DEFS){
    if(TAB_TUTORIALS[k] && prevAge<minAge && newAge>=minAge){
      queueTutorial(w,p,'tab_'+k,{targetSel:`[data-tab="${k}"]`, requireSel:`[data-tab="${k}"]`, ...TAB_TUTORIALS[k]});
    }
  }
}
/* segundo spotlight, más pequeño, sobre la primera actividad real de HACER (ejemplo del
   propio encargo: primero el botón de la pestaña, luego la acción concreta dentro). Se dispara
   solo la primera vez que se entra a HACER con contenido disponible, no cada vez que se visita. */
function maybeQueueDoCardTutorial(p){
  if(!p) return;
  p.tutorialsSeen = p.tutorialsSeen||[];
  if(p.tutorialsSeen.includes('do_card')) return;
  world.pendingTutorials = world.pendingTutorials||[];
  world.pendingTutorials.push({key:'do_card', targetSel:'.do-card', requireSel:'.do-card',
    title:'Elige una actividad', text:'Cada tarjeta es algo distinto que puedes hacer este año. Toca una para empezar.'});
}
function advanceTutorialQueue(){
  if(world.pendingTutorials && world.pendingTutorials.length){
    ui.tutorial = world.pendingTutorials.shift();
  } else {
    ui.tutorial = null;
  }
}
function completeTutorial(){
  if(!ui.tutorial) return;
  const p=player(world);
  if(p){ p.tutorialsSeen=p.tutorialsSeen||[]; if(!p.tutorialsSeen.includes(ui.tutorial.key)) p.tutorialsSeen.push(ui.tutorial.key); }
  save();
  advanceTutorialQueue();
}
function advanceYear(){
  const turnLog=[];
  const growthP=player(world);
  const prevCap=(growthP && growthP.alive)? getPlayerCapabilities(growthP) : null;
  const prevAge=(growthP && growthP.alive)? growthP.age : null;
  const oldLordName=WORLD_FLAVOR.lordName;
  world.year += 1;
  world.flags.restedThisYear=false;
  world.annualActionsUsed=0;
  world.summaryShown=false;
  // mejora #1/#2: la cronología se aplica cada año — así un cambio de señor a mitad de partida
  // (una sucesión, no una elección del jugador) se nota solo, con fecha real detrás.
  applyWorldFlavorForYear(world.regionId||'fenwold', world.year);
  if(WORLD_FLAVOR.lordName!==oldLordName){
    turnLog.push(log(world,'Cambio de señor',`${WORLD_FLAVOR.lordName} toma el señorío de ${WORLD_FLAVOR.region}.`,'mundo'));
  }

  const hh=household(world);
  const grainTribute=Math.min(hh.grainStores, world.tribute+2);
  hh.grainStores-=grainTribute; hh.money=Math.max(0,hh.money-world.tribute);
  // Parte 16: la perspectiva narrativa respeta la edad — el tributo lo paga el hogar, no el bebé
  turnLog.push(log(world,'Tributo anual',`Tu hogar entregó el tributo anual a ${WORLD_FLAVOR.lordName}: ${world.tribute} monedas y ${grainTribute} sacos de grano.`,'mundo'));

  resolveCareers(world,turnLog);
  resolvePersonalEconomy(world,turnLog);
  resolveAgriculture(world,turnLog);
  resolveLivestock(world,turnLog);
  resolveChildDevelopment(world);
  resolveNpcLife(world,turnLog);
  resolveBirths(world,turnLog);
  resolveMortality(world,turnLog);
  resolveLivedHistory(world,turnLog);
  resolveMilestones(world,turnLog);
  { const p=player(world); if(p && p.alive) resolveAmbition(world,p,turnLog); }
  resolveHoldingEconomy(world,turnLog);

  world.lastTurnLog = turnLog;
  turnLog.forEach(e=>pushFeed(world,e));
  { const p=player(world); if(prevCap && p && p.alive) announceGrowthUnlocks(world,prevCap,getPlayerCapabilities(p)); }
  { const p=player(world); if(prevAge!=null && p && p.alive) announceNewTabs(world,p,prevAge,p.age); }
  world.pendingEvents = rollEvents(world);
  // mejora de diseño 2026-09 #6/#15: pasar el año siempre lleva a VIDA — ahí se ven sus
  // consecuencias, sin que el jugador tenga que acordarse de cambiar de pestaña a mano.
  ui.activeTab='vida'; ui.lifeFilter='all';
  save();
  advanceModalQueue();
}
/* ---------- mejora de diseño 2026-09 #6: el Resumen anual DEJÓ de ser un modal obligatorio.
   Ahora solo quedan como modal las cosas que de verdad requieren al jugador — una muerte, un
   hito importante, una decisión interactiva. Lo rutinario vive en el feed de la pantalla Vida,
   así que "VIVIR EL AÑO" se puede pulsar seguido, sin que un año tranquilo interrumpa nada,
   hasta que sí pase algo que merezca una pausa. ---------- */
function advanceModalQueue(){
  if(world.pendingPlayerDeath){
    const deadId = world.pendingPlayerDeath; world.pendingPlayerDeath=null;
    ui.modal={type:'death', charId:deadId};
  } else if(world.pendingMilestoneModals && world.pendingMilestoneModals.length){
    ui.modal={type:'milestone', data:world.pendingMilestoneModals.shift()};
  } else if(world.pendingEvents && world.pendingEvents.length){
    ui.modal={type:'event', event:world.pendingEvents.shift()};
  } else {
    ui.modal=null;
    // mejora de diseño 2026-09 #13: el tutorial guiado solo arranca cuando ya no queda
    // ningún modal más urgente (muerte/hito/evento) por resolver.
    if(!ui.tutorial) advanceTutorialQueue();
  }
  render();
}

/* ---------- SuccessionSystem (Parte 20: candidatos = familia cercana, no todo el linaje) ---------- */
function eligibleHeirs(deceased){
  const cf=closeFamily(deceased.id);
  const raw=[...cf.children, cf.spouse, ...cf.siblings].filter(m=>m && m.alive);
  const seen=new Set(); const out=[];
  for(const m of raw){ if(!seen.has(m.id)){ seen.add(m.id); out.push(m); } }
  out.sort((a,b)=>{
    const rank=(m)=> cf.children.some(c=>c.id===m.id) ? 0 : (cf.spouse && m.id===cf.spouse.id ? 1 : 2);
    return rank(a)-rank(b) || b.age-a.age;
  });
  return out;
}

/* ---------- acciones del jugador ---------- */
/* Parte 14: la edad no da autoridad — solo la cabeza de hogar adulta administra tierra/ganado/venta */
function doSow(){ const p=player(world); if(!canManageHousehold(p)) return; const hh=household(world); const prop=propertiesOf(hh)[0]; if(!prop) return;
  if(prop.sownCrop==='wheat'){ prop.sownCrop=null; plog(world,'Barbecho',`Dejaste el campo en barbecho este año para que la tierra descanse.`,'agricultura'); prop.landQuality=clamp(prop.landQuality+3,0,100); }
  else { if(hh.grainStores>=CROP.seedCost){ hh.grainStores-=CROP.seedCost; prop.sownCrop='wheat'; plog(world,'Siembra','Sembraste trigo en el campo familiar.','agricultura'); } }
  render(); }
function doSellGrain(){ const p=player(world); if(!canManageHousehold(p)) return; const hh=household(world); const amt=Math.min(10,hh.grainStores); if(amt<=0) return;
  hh.grainStores-=amt; hh.money+=Math.round(amt*1.2);
  plog(world,'Venta de grano',`Vendiste ${amt} sacos de grano en el mercado del pueblo.`,'trabajo');
