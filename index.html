function save(){
  try{
    // el tutorial activo (si hay uno a medias) se guarda también, para no perderlo si el
    // jugador cierra la partida en mitad de un spotlight (mejora de diseño 2026-09 #13).
    const data = JSON.stringify({world, ui:{activeTab:ui.activeTab, tutorial:ui.tutorial||null}});
    localStorage.setItem('libro_de_linaje_save', data);
    ui.lastSaved = Date.now();
  }catch(e){ /* almacenamiento no disponible: continuar sin guardar */ }
}
function reattachGetters(w){
  Object.values(w.characters).forEach(c=>{
    Object.defineProperty(c,'age',{get(){return world.year-this.birthYear;}, configurable:true});
  });
  // v4: world.marriageCandidates guarda IDs (string), no objetos embebidos — su getter de edad
  // ya vive en w.characters, reasignado arriba.
}
function load(){
  try{
    const raw = localStorage.getItem('libro_de_linaje_save');
    if(!raw) return false;
    const data = JSON.parse(raw);
    let w = data.world;
    if(!w.schema_version || w.schema_version<2){ world=w; w = migrateV1toV2(w); }
    if(w.schema_version<3){ world=w; w = migrateV2toV3(w); }
    if(w.schema_version<4){ world=w; w = migrateV3toV4(w); }
    if(w.schema_version<5){ world=w; w = migrateV4toV5(w); }
    world = w;
    // mejora #1/#4: partidas de antes de la cronología del mundo no tenían regionId — caen en
    // 'fenwold', la región que ya existía, así que no cambian de identidad al cargar.
    if(!world.regionId) world.regionId='fenwold';
    applyWorldFlavorForYear(world.regionId, world.year);
    if(data.ui && data.ui.activeTab) ui.activeTab=TAB_NAME_V4_TO_V5[data.ui.activeTab] || data.ui.activeTab;
    if(data.ui && data.ui.tutorial) ui.tutorial=data.ui.tutorial;
    reattachGetters(world);
    return true;
  }catch(e){ return false; }
}

/* ---------- herramientas de depuración (Parte 25) ---------- */
function maxGenerationDepth(){
  const chars=world.characters;
  const memo={};
  function depth(id){
    if(memo[id]!==undefined) return memo[id];
    memo[id]=0; // evita ciclos accidentales durante el cálculo
    const c=chars[id];
    if(!c || (!c.fatherId && !c.motherId)) return memo[id]=0;
    const df = c.fatherId && chars[c.fatherId] ? depth(c.fatherId)+1 : 0;
    const dm = c.motherId && chars[c.motherId] ? depth(c.motherId)+1 : 0;
    return memo[id]=Math.max(df,dm);
  }
  let max=0;
  for(const id in chars) max=Math.max(max, depth(id));
  return max;
}
function validateWorld(){
  const errors=[];
  const chars=world.characters;
  for(const c of Object.values(chars)){
    if(c.fatherId && !chars[c.fatherId]) errors.push(`Character ${c.id} (${c.firstName}) references missing father ${c.fatherId}`);
    if(c.motherId && !chars[c.motherId]) errors.push(`Character ${c.id} (${c.firstName}) references missing mother ${c.motherId}`);
    if(c.id===c.spouseId) errors.push(`Character ${c.id} is married to themselves`);
    if(c.spouseId){
      if(!chars[c.spouseId]) errors.push(`Character ${c.id} references missing spouse ${c.spouseId}`);
      // un cónyuge fallecido conserva el puntero histórico aunque el viudo/a se case de nuevo:
      // eso es correcto (no es un bug), así que solo exigimos reciprocidad desde el lado de los vivos.
      else if(c.alive && chars[c.spouseId].spouseId!==c.id) errors.push(`Spouse relation is not reciprocal for ${c.id} <-> ${c.spouseId}`);
    }
    for(const cid of c.childrenIds){
      const kid=chars[cid];
      if(!kid) errors.push(`Character ${c.id} references missing child ${cid}`);
      else if(kid.fatherId!==c.id && kid.motherId!==c.id) errors.push(`Child relation is not reciprocal for ${c.id} -> ${cid}`);
    }
    for(const sid of c.siblingIds){
      const sib=chars[sid];
      if(!sib) errors.push(`Character ${c.id} references missing sibling ${sid}`);
      else if(!sib.siblingIds.includes(c.id)) errors.push(`Sibling relation is not reciprocal for ${c.id} <-> ${sid}`);
    }
    if(c.householdId && !world.households[c.householdId]) errors.push(`Character ${c.id} references missing household ${c.householdId}`);
    if(c.houseId && !world.houses[c.houseId]) errors.push(`Character ${c.id} references missing house/lineage ${c.houseId}`);
    // v4: registro de carreras/conocidos/dinero (Parte 66)
    if(c.career){
      if(c.career.professionId && !PROFESSIONS[c.career.professionId]) errors.push(`Character ${c.id} has invalid career.professionId ${c.career.professionId}`);
      if(c.career.masterId && !chars[c.career.masterId]) errors.push(`Character ${c.id} references missing master ${c.career.masterId}`);
    }
    if(c.knownCharacterIds){
      for(const kid of c.knownCharacterIds) if(!chars[kid]) errors.push(`Character ${c.id} has unknown reference in knownCharacterIds: ${kid}`);
    }
    if(c.personalMoney!==undefined && (typeof c.personalMoney!=='number' || isNaN(c.personalMoney))) errors.push(`Character ${c.id} has invalid personalMoney`);
  }
  for(const hh of Object.values(world.households)){
    for(const mid of hh.memberIds) if(!chars[mid]) errors.push(`Household ${hh.id} references missing member ${mid}`);
    for(const pid of hh.propertyIds) if(!world.properties[pid]) errors.push(`Household ${hh.id} references missing property ${pid}`);
    if(typeof hh.money!=='number' || isNaN(hh.money)) errors.push(`Household ${hh.id} has invalid money`);
  }
  for(const a of Object.values(world.animals)){
    if(a.alive && !world.households[a.ownerHouseholdId]) errors.push(`Animal ${a.id} belongs to missing household ${a.ownerHouseholdId}`);
    if(a.alive && !a.name) errors.push(`Animal ${a.id} has no name`);
  }
  for(const p of Object.values(world.properties)){
    if(!world.households[p.ownerHouseholdId]) errors.push(`Property ${p.id} has no valid owning household ${p.ownerHouseholdId}`);
  }
  if(!Array.isArray(world.marriageCandidates) || world.marriageCandidates.some(id=>typeof id!=='string')) errors.push('world.marriageCandidates should be an array of character ids (v4)');
  if(errors.length){ console.log(errors.length+' problema(s) encontrados:'); errors.forEach(e=>console.log(' - '+e)); }
  else { console.log('validateWorld: sin problemas.'); }
  return errors;
}
function simulateYears(n){
  const startYear=world.year;
  for(let i=0;i<n;i++){
    advanceYear();
    let guard=0;
    while(ui.modal && guard++<25){
      if(ui.modal.type==='event'){ doResolveEventOption(ui.modal.event.options[0]); }
      else if(ui.modal.type==='death'){ ui.modal={type:'chooseHeir', deadId:ui.modal.charId}; render(); }
      else if(ui.modal.type==='chooseHeir'){
        const list=eligibleHeirs(C(ui.modal.deadId));
        if(list.length){ doChooseNext(list[0].id); }
        else {
          const oldHistory=world.history, oldYear=world.year;
          const fresh=generateInitialWorld({startYear:oldYear, playerAge:16});
          fresh.history=[...oldHistory,...fresh.history];
          world=fresh; ui.modal=null; save(); render();
        }
      } else { ui.modal=null; advanceModalQueue(); } // summary/milestone/birthIntro/charDetail: avanza la cola sola
    }
  }
  const chars=Object.values(world.characters);
  const stats={
    aniosSimulados:n, anioInicial:startYear, anioFinal:world.year,
    personajesCreados: chars.length,
    vivos: chars.filter(c=>c.alive).length,
    muertos: chars.filter(c=>!c.alive).length,
    matrimonios: Math.round(chars.filter(c=>c.spouseId).length/2),
    nacimientosRegistrados: world.history.filter(h=>h.title==='Nació un hijo'||h.title==='Nació una hija'||h.title==='Naces').length,
    households: Object.keys(world.households).length,
    lineages: Object.keys(world.houses).length,
    generacionesMax: maxGenerationDepth()
  };
  console.log('simulateYears('+n+') completado:');
  if(console.table) console.table([stats]); else console.log(stats);
  return stats;
}
window.simulateYears = simulateYears;
window.validateWorld = validateWorld;

/* ================= RENDER ================= */
/* =========================================================
   CAPA VISUAL v5 — pixel-art, 6 pantallas, sin emojis (Parte 72)
   Todo icono es o bien un tile real (personaje/moneda/corazón/cruz/flor,
   TILE_B64) o un bloque .slot marcado con data-icon="categoría:clave",
   a la espera de su asset — ver la lista pendiente en ARCHITECTURE.md.
   ========================================================= */
function tileImg(key, cls=''){ return `<img class="pixel ${cls}" src="data:image/png;base64,${TILE_B64[key]}" alt="">`; }
function slotIcon(dataIcon, cls=''){ return `<span class="slot ${cls}" data-icon="${dataIcon}"></span>`; }
function icon(key, dataIcon, cls=''){ return (key && TILE_B64[key]) ? tileImg(key,cls) : slotIcon(dataIcon||key||'icon', cls); }
/* retrato real por personaje: bebés (0-2 años) usan su tono de piel real
   (character.appearance.skinTone, 0-4 -> baby1..baby5) — sistema anterior,
   sigue igual porque no hay sprite base de bebé en pack/variantes. El resto
   (niños en adelante) usa el sistema nuevo de abajo (v7): recolor real en
   <canvas> del genotipo + vestuario sobre los sprites de pack/variantes.
   Si por lo que sea no hay retrato real disponible todavía (bases sin
   cargar, personaje sin appearance), cae al tile genérico de siempre. */
function portraitKey(ch){
  if(!ch) return 'character';
  if(ch.age<=2){ const t=(ch.appearance&&typeof ch.appearance.skinTone==='number')?ch.appearance.skinTone:2; return 'baby'+(clamp(t,0,4)+1); }
  return ch.sex==='F' ? 'woman' : 'character';
}
function avatar(ch, cls=''){
  const deadCls = ch && ch.alive===false ? ' dead' : '';
  const url = characterPortraitURL(ch);
  const img = url ? `<img class="pixel" src="${url}" alt="">` : tileImg(portraitKey(ch));
  return `<div class="portrait ${cls}${deadCls}">${img}</div>`;
}

/* =========================================================
   RETRATO REAL POR GENOTIPO (v7) — recolorea en <canvas> los sprites de
   pack/variantes con los colores reales del personaje, en vez de un tile
   genérico. Se recolorea en el navegador (no se embeben los 6240 PNG ya
   generados: harían crecer este HTML único ~15×) a partir de solo 6
   sprites base (~3KB en total, embebidos abajo) + las mismas tablas de
   paleta que usó pack/variantes/generar_sprites_medievales.bat y
   generar_base_mujer_vieja_sin_accesorio.bat para generar sus 6240+200
   PNG — verificado píxel a píxel contra un muestreo real de esos archivos
   (los 6 tipos de sprite, casos límite de piel+pelo incluidos) antes de
   integrarlo aquí, así que la salida es idéntica a la de esos scripts.

   - PALETTES: mismos nombres/códigos/hex que los .bat, para que
     appearance.hairColorKey / wardrobe.* (strings) mapeen directo.
   - SPRITE_BASE_B64: los 6 sprites base (hm/ha/hc/hb/mw/ow) con sus
     colores placeholder de siempre (magenta=piel, cian=pelo, etc. — ver
     PLACEHOLDER_RGB / PLACEHOLDER_RGB_OW).
   - preloadSpriteBases(): decodifica esos 6 PNG a ImageData UNA sola vez
     al arrancar (async, ver el boot al final del archivo); de ahí en
     adelante recolorToDataURL() es sync — solo remapea el array de
     píxeles ya decodificado, sin volver a cargar imágenes.
   - PORTRAIT_CACHE: cada combinación (tipo+piel+pelo+ropa) se pinta una
     sola vez por partida y se reusa (misma idea que TILE_B64, pero
     generado en vez de embebido). */
const PALETTES = {
  skin: {1:['#FFD3A0','#F0B57B'],2:['#F7C282','#E19A65'],3:['#E9A66B','#C97B50'],4:['#C98255','#A85C3F'],5:['#985A3C','#753D2E']},
  hair: {
    black:['bk','#3B3438','#1F1B20'], dark_brown:['db','#6B4335','#3F2925'], brown:['br','#8F5A3C','#593629'],
    light_brown:['lb','#B47A50','#765039'], dark_blond:['dd','#C49A5A','#8B673E'], blond:['bd','#E1BD72','#B1874F'],
    light_blond:['ld','#F0D694','#C3A666'], ginger:['gi','#C9683C','#873C2D'], auburn:['au','#9D4D3D','#63302F'],
    gray:['gy','#B9B1A7','#77716D'], white:['wh','#E8E2D6','#AAA59D']
  },
  agedHair: {

  },
  shirt: {linen:['ln','#D9D0BC','#A89D86'],olive:['ol','#7E8B55','#58613D'],forest:['fo','#4F6E4B','#314532'],blue:['bl','#5B7FA8','#3D5875'],red:['rd','#A35A52','#6F3B36'],burgundy:['bg','#7E4152','#552A36'],brown:['bn','#8B6B4A','#5F492F'],black:['bk','#4A4346','#292428']},
  pants: {brown:['br','#7A5A43','#523B2D'],dark_brown:['db','#5F4637','#3D2C24'],gray:['gy','#88858A','#5C5860'],blue:['bl','#586D8A','#39485F'],green:['gr','#62754D','#415033'],black:['bk','#3E3A3E','#221F23']},
  dress: {linen:['ln','#DCCCB2','#A99679'],olive:['ol','#76854F','#505B37'],forest:['fo','#4E6947','#314232'],blue:['bl','#5B79A6','#3A5272'],red:['rd','#AA5950','#743935'],burgundy:['bg','#7C4156','#522A39'],plum:['pl','#76608E','#4C3C5E'],brown:['bn','#89684B','#5B452F']},
  accessory: {white:['wh','#E9E2D5'],cream:['cr','#D7C9AA'],red:['rd','#A44B47'],blue:['bl','#5678A2'],olive:['ol','#73834F'],gold:['gd','#C8A45A']}
};
const PLACEHOLDER_RGB = { skinBase:'255,0,255', skinShade:'170,0,170', hairBase:'0,255,255', hairShade:'0,136,170', shirtBase:'0,255,0', shirtShade:'0,136,0', pantsBase:'255,255,0', pantsShade:'170,136,0', dressBase:'255,102,0', dressShade:'153,51,0', accBase:'255,0,0', beardBase:'0,0,255' };
const PLACEHOLDER_RGB_OW = { skinBase:'255,0,255', skinShade:'170,0,170', hairBase:'139,155,180', hairLight:'192,203,220', dressBase:'255,102,0', dressShade:'153,51,0' };
function hexToRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }

/* mismo límite de arte que allowedHairBySkin del generador joven (ver
   clampHairPigment más arriba, ya reproduce esa tabla exacta) y de
   generar_base_mujer_vieja_sin_accesorio.bat para la mujer vieja (tabla
   propia, no sigue la misma fórmula porque el set de 5 categorías
   "envejecidas" es distinto al de 11 colores naturales) */
const AGED_HAIR_ALLOWED_BY_SKIN = {
  1:['aged_dark','aged_brown','aged_blond','aged_ginger','white'],
  2:['aged_dark','aged_brown','aged_blond','aged_ginger','white'],
  3:['aged_dark','aged_brown','aged_blond','aged_ginger','white'],
  4:['aged_dark','aged_brown','aged_ginger','white'],
  5:['aged_dark','aged_brown','white']
};
function agedHairBucketFromGenotype(g){
  if(hasRedGene(g)) return 'aged_ginger';
  const h = rawHairPigmentIndex(g);
  if(h<=1) return 'aged_dark';
  if(h<=3) return 'aged_brown';
  return 'aged_blond';
}
function clampAgedHair(skinIndex, bucket){
  const allowed = AGED_HAIR_ALLOWED_BY_SKIN[skinIndex];
  if(allowed.includes(bucket)) return bucket;
  return allowed.includes('aged_brown') ? 'aged_brown' : 'aged_dark';
}

/* vestuario NO es genético — elección/posición social, ver nota en el
   bloque de genética más arriba. Se sortea una sola vez por personaje
   (perezoso, como ensureGenotypeSync) y queda fijo, sesgado por la
   prosperidad ACTUAL de su hogar (householdStatus) en el momento en que
   se le pide por primera vez un retrato — no por su hogar de nacimiento,
   así que alguien que se independiza pobre y prospera después no queda
   "condenado" a su paleta humilde de siempre en renders futuros porque
   nunca se le había pedido un retrato antes de prosperar. */
const WARDROBE_RICH_CHANCE = {destitute:0.03, poor:0.15, stable:0.35, comfortable:0.6, prosperous:0.85};
const SHIRT_HUMBLE=['linen','olive','forest','brown'], SHIRT_RICH=['blue','red','burgundy','black'];
const PANTS_HUMBLE=['brown','dark_brown','gray'], PANTS_RICH=['blue','green','black'];
const DRESS_HUMBLE=['linen','olive','forest','brown'], DRESS_RICH=['blue','red','burgundy','plum'];
const ACC_HUMBLE=['white','cream','olive'], ACC_RICH=['red','blue','gold'];
function wardrobeStatusFor(ch){
  const hh = (ch.householdId && world && world.households) ? world.households[ch.householdId] : null;
  return hh ? householdStatus(hh) : 'stable';
}
function weightedWardrobePick(status, humble, rich){ return chance(WARDROBE_RICH_CHANCE[status] ?? 0.35) ? pick(rich) : pick(humble); }
function ensureWardrobe(ch){
  const a = ch && ch.appearance; if(!a || a.wardrobe) return;
  const status = wardrobeStatusFor(ch);
  a.wardrobe = ch.sex==='F'
    ? { dressKey: weightedWardrobePick(status, DRESS_HUMBLE, DRESS_RICH), accessoryKey: weightedWardrobePick(status, ACC_HUMBLE, ACC_RICH) }
    : { shirtKey: weightedWardrobePick(status, SHIRT_HUMBLE, SHIRT_RICH), pantsKey: weightedWardrobePick(status, PANTS_HUMBLE, PANTS_RICH) };
}

/* tipo de sprite base por personaje. armadura/casco (ha/hc) quedan sin
   disparador todavía — pendiente de enganchar a oficio/actividad (p.ej.
   "guardia" o la ambición "ganar tus espuelas"), documentado como
   limitación conocida en vez de forzar una regla inventada. */
function spriteTypeFor(ch){
  if(ch.sex==='F') return ch.age>=65 ? 'ow' : 'mw'; // 65 = mismo umbral que LIFE_STAGES.oldAge
  return (ch.appearance && ch.appearance.beard && ch.age>=16) ? 'hb' : 'hm';
}

const SPRITE_PIXELS = {}; // se llena en preloadSpriteBases(): {hm:{width,height,data:Uint8ClampedArray}, ...}
function loadSpritePixels(key){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
      const ctx = c.getContext('2d'); ctx.drawImage(img,0,0);
      const id = ctx.getImageData(0,0,c.width,c.height);
      SPRITE_PIXELS[key] = {width:c.width, height:c.height, data:id.data};
      resolve();
    };
    img.onerror = ()=>resolve(); // si falla esa clave queda sin píxeles -> characterPortraitURL cae al tile genérico
    img.src = 'data:image/png;base64,'+SPRITE_BASE_B64[key];
  });
}
function preloadSpriteBases(){ return Promise.all(Object.keys(SPRITE_BASE_B64).map(loadSpritePixels)); }

/* recolorToDataURL: idéntico al algoritmo de New-VariantBitmap en los
   .bat (reemplaza SOLO los píxeles que matchean exacto un color
   placeholder; un píxel transparente se deja transparente; lo que no
   matchea ningún placeholder se copia igual) pero sobre el ImageData ya
   decodificado — sin volver a cargar ninguna imagen, así que es síncrono. */
function recolorToDataURL(baseKey, mapping){
  const src = SPRITE_PIXELS[baseKey]; if(!src) return null;
  const c = document.createElement('canvas'); c.width=src.width; c.height=src.height;
  const ctx = c.getContext('2d');
  const out = ctx.createImageData(src.width, src.height);
  const sd = src.data, od = out.data;
  for(let i=0;i<sd.length;i+=4){
    const a = sd[i+3];
    if(a===0){ od[i+3]=0; continue; }
    const repl = mapping[sd[i]+','+sd[i+1]+','+sd[i+2]];
    if(repl){ od[i]=repl[0]; od[i+1]=repl[1]; od[i+2]=repl[2]; od[i+3]=255; }
    else { od[i]=sd[i]; od[i+1]=sd[i+1]; od[i+2]=sd[i+2]; od[i+3]=a; }
  }
  ctx.putImageData(out,0,0);
  return c.toDataURL('image/png');
}

const PORTRAIT_CACHE = {};
function characterPortraitURL(ch){
  if(!ch || ch.age<=2) return null; // bebés: sigue el sistema baby1..5 existente, sin sprite base propio
  ensureGenotypeSync(ch);
  const a = ch.appearance; if(!a || !a.genotype) return null;
  if(!SPRITE_PIXELS.hm) return null; // bases todavía sin decodificar (arranque en curso) -> respaldo de tileImg
  ensureWardrobe(ch);
  const spriteType = spriteTypeFor(ch);
  const skinIndex = a.skinIndex || skinIndexFromGenotype(a.genotype);
  let cacheKey, mapping;
  if(spriteType==='ow'){
    // pasado el propio whiteOnsetAge (aunque ya esté en el tramo "ow" de
    // 65+), el pelo termina de blanquear del todo -- mismo criterio de
    // displayedHairColorKey, para que una misma persona sea consistente
    // consigo misma a lo largo de la vejez en vez de quedar fija en su
    // tono envejecido inicial para siempre
    const bucket = (ch.age >= a.whiteOnsetAge) ? 'white' : clampAgedHair(skinIndex, agedHairBucketFromGenotype(a.genotype));
    const [hCode,hBase,hLight] = PALETTES.agedHair[bucket];
    const [dCode,dBase,dShade] = PALETTES.dress[a.wardrobe.dressKey];
    cacheKey = `ow|sk${skinIndex}|${hCode}|${dCode}`;
    if(PORTRAIT_CACHE[cacheKey]) return PORTRAIT_CACHE[cacheKey];
    mapping = {};
    mapping[PLACEHOLDER_RGB_OW.skinBase]=hexToRgb(PALETTES.skin[skinIndex][0]); mapping[PLACEHOLDER_RGB_OW.skinShade]=hexToRgb(PALETTES.skin[skinIndex][1]);
    mapping[PLACEHOLDER_RGB_OW.hairBase]=hexToRgb(hBase); mapping[PLACEHOLDER_RGB_OW.hairLight]=hexToRgb(hLight);
    mapping[PLACEHOLDER_RGB_OW.dressBase]=hexToRgb(dBase); mapping[PLACEHOLDER_RGB_OW.dressShade]=hexToRgb(dShade);
  } else {
    const hairName = displayedHairColorKey(ch); // canoso/blanco por edad ya resuelto acá
    const [hCode,hBase,hShade] = PALETTES.hair[hairName] || PALETTES.hair.brown;
    mapping = {};
    mapping[PLACEHOLDER_RGB.skinBase]=hexToRgb(PALETTES.skin[skinIndex][0]); mapping[PLACEHOLDER_RGB.skinShade]=hexToRgb(PALETTES.skin[skinIndex][1]);
    mapping[PLACEHOLDER_RGB.hairBase]=hexToRgb(hBase); mapping[PLACEHOLDER_RGB.hairShade]=hexToRgb(hShade);
    if(spriteType==='mw'){
      const [dCode,dBase,dShade] = PALETTES.dress[a.wardrobe.dressKey];
      const [acCode,acColor] = PALETTES.accessory[a.wardrobe.accessoryKey];
      mapping[PLACEHOLDER_RGB.dressBase]=hexToRgb(dBase); mapping[PLACEHOLDER_RGB.dressShade]=hexToRgb(dShade);
      mapping[PLACEHOLDER_RGB.accBase]=hexToRgb(acColor);
      cacheKey = `mw|sk${skinIndex}|${hCode}|${dCode}|${acCode}`;
    } else { // hm / hb (y ha/hc el día que se disparen, ya soportado el color de piel+pelo)
      const [shCode,shBase,shShade] = PALETTES.shirt[a.wardrobe.shirtKey];
      const [ptCode,ptBase,ptShade] = PALETTES.pants[a.wardrobe.pantsKey];
      mapping[PLACEHOLDER_RGB.shirtBase]=hexToRgb(shBase); mapping[PLACEHOLDER_RGB.shirtShade]=hexToRgb(shShade);
      mapping[PLACEHOLDER_RGB.pantsBase]=hexToRgb(ptBase); mapping[PLACEHOLDER_RGB.pantsShade]=hexToRgb(ptShade);
      if(spriteType==='hb') mapping[PLACEHOLDER_RGB.beardBase]=hexToRgb(hShade); // barba = sombra del pelo real, "1 por pelo"
      cacheKey = `${spriteType}|sk${skinIndex}|${hCode}|${shCode}|${ptCode}`;
    }
    if(PORTRAIT_CACHE[cacheKey]) return PORTRAIT_CACHE[cacheKey];
  }
  const url = recolorToDataURL(spriteType, mapping);
  if(url) PORTRAIT_CACHE[cacheKey] = url;
  return url;
}
function row(k,v){ return `<div class="row"><span class="k">${k}</span><span class="leader"></span><span class="v">${v}</span></div>`; }
function bar(v){ return `<div class="bar ${meterClass(v)}"><i style="width:${clamp(v,0,100)}%"></i></div>`; }
/* icono + color por categoría (mejora de diseño 2026-09 #6): "una imagen dice más que mil
   palabras" — cada suceso del feed se distingue de un vistazo, sin tener que leer el texto. */
const TAG_ICON={family:'heart', agricultura:'hoe', ganado:'cow', fe:'cross', ocio:'barrel',
  marcial:'shield', crimen:'knife', mundo:'moneybag', trabajo:'anvil', hacienda:'chest',
  personaje:'character', social:'character', tutorial:'wizard'};
/* mejora de diseño 2026-09 #9: "no usar sprites genéricos si ya existe un personaje real
   involucrado" — cada suceso guarda en `related` a quienes participan; el protagonista visual
   es quien está al FINAL de esa lista (convención ya usada en todo el motor: el sujeto de la
   frase se agrega último — "Nace un hijo" → [padre,madre,bebé], "Pasaste tiempo con X" →
   [jugador,X]), así el feed muestra el retrato real de esa persona en vez de un ícono de
   categoría. Si el suceso no tiene a nadie real asociado (tributo, mercado...) se mantiene el
   ícono de categoría de siempre. */
function entrySubjectId(e){
  const rel=e && e.related;
  return (rel && rel.length) ? rel[rel.length-1] : null;
}
function feedIcon(e){
  const subj = entrySubjectId(e); const ch = subj? C(subj) : null;
  if(ch) return avatar(ch,'xs');
  const key=TAG_ICON[e.tag]; return key? tileImg(key,'') : slotIcon('category:'+(e.tag||'otro'));
}
const FEED_NEGATIVE=/muri|muert|tragedia|rechaz|perdiste|no sobrevivió|hambruna|bandidaje|descontento|riña|resentid|puertas cerradas|tocó tu granero|deuda sin pagar|sorprendid|no salió bien|no podías perder|mala suerte/i;
function feedCardClass(e){
  if(e.tag==='tutorial') return 'navy';
  if(FEED_NEGATIVE.test(e.title)) return 'pink';
  if(e.tag==='mundo'||e.tag==='hacienda'||e.tag==='trabajo') return 'green';
  return 'tan';
}
/* después de ver el mismo TIPO de suceso varias veces, ya no hace falta explicarlo entero
   cada vez — se condensa a solo el título (SIMULAR MUCHO, MOSTRAR POCO, con el tiempo). */
const FEED_FAMILIARITY_THRESHOLD=3;
function eventItem(e){
  const familiar = (e.seenCount||1) > FEED_FAMILIARITY_THRESHOLD;
  const showDesc = e.desc && e.desc!==e.title && !familiar;
  return `<div class="feed-item ${feedCardClass(e)}">
    <div class="feed-icon">${feedIcon(e)}</div>
    <div class="feed-body">
      <div class="feed-top"><span class="feed-title">${e.title}</span><span class="feed-year">Año ${e.year||world.year}</span></div>
      ${showDesc?`<div class="feed-desc">${e.desc}</div>`:''}
    </div>
  </div>`;
}

function renderApp(){
  const app=document.getElementById('app');
  // mejora de diseño 2026-09 #5/P5: el color ambiental (fondo/cabecera/nav/tarjetas neutras)
  // comunica la región/bioma actual sin tocar estructura — solo cambia qué paleta de variables
  // CSS lee el mismo marcado de siempre (ver bloques .app[data-palette=...] arriba).
  app.dataset.palette = (world && world.regionId) ? getRegion(world.regionId).palette : 'valley';
  const panel=renderPanel();
  app.innerHTML = `<div class="screen">
    ${renderHeader()}
    ${renderCaption()}
    ${panel.head||''}
    <div class="content">${panel.body||''}</div>
    ${renderFooter()}
    ${renderNav()}
  </div>${renderModal()}`;
  // mejora de diseño 2026-09 #10: el feed de VIDA ahora es cronológico (lo nuevo queda abajo),
  // así que cada vez que se muestra hay que llevar el scroll al final para ver la consecuencia
  // recién ocurrida, sin que el jugador tenga que desplazarse a mano.
  if(ui.activeTab==='vida' && ui.lifeFilter==='all'){
    const content=app.querySelector('.content');
    if(content) content.scrollTop=content.scrollHeight;
  }

}
/* mejora de diseño 2026-09 #13: mide en pantalla dónde quedó el botón real (ya pintado arriba
   por renderApp) y coloca el hueco/tarjeta del tutorial exactamente encima — así el spotlight
   sigue funcionando sin importar qué pantalla esté activa debajo. */
function applySpotlight(){
  const old=document.getElementById('tutorial-spotlight'); if(old) old.remove();
  if(!ui.tutorial) return;
  const target=document.querySelector(ui.tutorial.targetSel);
  if(!target){ ui.tutorial=null; return; } // el botón no existe en esta pantalla: no dejar un spotlight huérfano
  const r=target.getBoundingClientRect();
  const pad=5;
  const box={left:r.left-pad, top:r.top-pad, width:r.width+pad*2, height:r.height+pad*2};
  const vh=window.innerHeight, vw=window.innerWidth;
  const placeAbove = box.top > vh*0.55;
  const cardTop = placeAbove ? Math.max(10, box.top-8-120) : Math.min(vh-140, box.top+box.height+10);
  const cardLeft = clamp(box.left+box.width/2-115, 10, vw-240);
  const wrap=document.createElement('div');
  wrap.id='tutorial-spotlight';
  wrap.innerHTML = `
    <div class="tut-hole" style="left:${box.left}px;top:${box.top}px;width:${box.width}px;height:${box.height}px;"></div>
    <div class="tut-card" style="left:${cardLeft}px;top:${cardTop}px;">
      <div class="tut-eyebrow">Aprende algo nuevo</div>
      <div class="tut-title">${ui.tutorial.title}</div>
      <div class="tut-text">${ui.tutorial.text}</div>
      <div class="tut-hint">Toca lo resaltado para continuar</div>
    </div>`;
  document.body.appendChild(wrap);
}

/* separador de año (mejora de diseño 2026-09 #10): discreto, con el año y la edad del jugador
   en ese momento — solo aparece cuando el feed pasa de un año al siguiente. */
function yearSeparator(year,p){
  const age = (p && p.birthYear!=null && year>=p.birthYear) ? `${year-p.birthYear} años` : null;
  return `<div class="year-sep"><span class="year-sep-line"></span><span class="year-sep-label">Año ${year}${age?' · '+age:''}</span><span class="year-sep-line"></span></div>`;
}
function vidaFeedBody(p,cap){
  let html='';
  if(cap.jailed) html += `<div class="card pink"><h3>En el calabozo</h3><div class="body">No podrás ocuparte de tus asuntos hasta el año ${p.legal.jailedUntilYear}.</div></div>`;
  const amb=getAmbition(p);
  if(amb) html += `<div class="card tan"><h3>Tu ambición</h3><div class="body" style="display:flex;align-items:center;gap:6px">${ambitionIcon(amb)}${genderText(amb.def.label,p.sex)}</div>${bar(amb.pct)}</div>`;
  /* mejora de diseño 2026-09 #6/#12: esto YA NO es un resumen aparte que interrumpe con un modal —
     es la pantalla principal de "Tu vida", siempre disponible, que se va llenando sola a medida
     que se pulsa SEGUIR VIVIENDO. Lee de world.feed (persistente entre años), no de lastTurnLog
     (que un año nuevo sobreescribía). Orden cronológico real (lo antiguo arriba, lo nuevo abajo,
     como un feed/chat de toda la vida) con un separador entre años — antes se mostraba al revés. */
  const items=world.feed||[];
  if(!items.length){ html += '<p class="empty">Aún no ha pasado nada. Pulsa SEGUIR VIVIENDO para empezar.</p>'; return html; }
  let lastYear=null;
  for(const e of items){
    const y=e.year||world.year;
    if(y!==lastYear){ html+=yearSeparator(y,p); lastYear=y; }
    html += eventItem(e);
  }
  return html;
}
function mundoBody(p,cap){
  const reg=getRegion(world.regionId||'fenwold');
  let rows = `${row('Pueblo', WORLD_FLAVOR.villageName)}${row('Señor local', WORLD_FLAVOR.lordName)}${row('Tributo anual', world.tribute+' mn + grano')}`;
  if(p.age>=12) rows += `${row('Región', WORLD_FLAVOR.region)}${row('Fe practicada', WORLD_FLAVOR.faith)}`;
  if(cap.canSeeWorldFull) rows = row('Reino', WORLD_FLAVOR.kingdom) + rows;
  let html = `<div class="card"><h3>Tu lugar en el mundo</h3>${rows}</div>`;
  if(p.age>=6) html += `<div class="card"><h3>Lugares del pueblo</h3><div class="taglist">${Object.values(PLACES).map(pl=>`<span class="tag">${pl.label}</span>`).join('')}</div></div>`;
  // mejora #4/#5: el bioma se nombra y se nota en la vida diaria, no es solo decoración.
  if(p.age>=9) html += `<div class="card"><h3>Vivir en ${reg.biome}</h3><div class="body">Aquí se viste con ${reg.clothing} y se come sobre todo ${reg.food}. Lo que más se teme es ${reg.riskFlavor}.</div></div>`;
  if(p.age>=12) html += `<div class="card"><h3>Costumbre de sucesión</h3><div class="body">${WORLD_FLAVOR.law}</div></div>`;
  // mejora #2/#18: lo que el personaje sabe del mundo se descubre solo, con la vida — nunca
  // se le expone la cronología entera (WORLD_TIMELINE) de golpe.
  if(cap.canSeeHistoria){
    const known=(p.knownHistoryIds||[]).map(id=>WORLD_TIMELINE.find(e=>e.id===id)).filter(Boolean).sort((a,b)=>a.year-b.year);
    html += `<div class="card navy"><h3>Lo que sabes de la historia</h3>${known.length? known.slice(-6).map(e=>`<div class="body" style="margin-top:6px"><b>${e.year}</b> — ${e.title}</div>`).join('') : '<div class="body">Todavía no has oído hablar de nada de lo que pasó antes de ti. Con el tiempo, alguien te contará.</div>'}</div>`;
  }
  return html;
}
function historiaBody(){
  const items=[...world.history].reverse();
  return `<p class="lead">La crónica del linaje ${lineage(world).name}, desde el año ${world.campaignStartYear||(world.history[0]&&world.history[0].year)||world.year}.</p>
  <div class="card">${items.length? items.map(eventItem).join('') : '<p class="empty">Nada que contar todavía.</p>'}</div>`;
}

/* ---------- GENTE: familia + pueblo + árbol (antes Familia + Relaciones) ---------- */
function panelGente(){
  const p=player(world), cap=getPlayerCapabilities(p);
  const subtabs=[['all','TODO'],['familia','FAMILIA'],['pueblo','PUEBLO']];
  const head=`<div class="screen-head"><h2>Gente</h2><p class="sub">Quienes forman tu mundo cercano.</p></div>

function relPctClass(rel){ return rel>=25?'warm':(rel>=-10?'cool':'hostile'); }
function familyBody(p,cap){
  let html = genealogyBody(p);
  const widowed = !!(p.spouseId && C(p.spouseId) && !C(p.spouseId).alive);
  if(cap.canMarry || p.spouseId){
    let marriageBody;
    if(p.spouseId && !widowed){
      marriageBody = `<div class="body">Estás ${genderText('casado/a',p.sex)} con ${C(p.spouseId).firstName} ${C(p.spouseId).familyName}.</div>`;
    } else if(!cap.canMarry){
      marriageBody = `<p class="empty">Aún eres joven para pensar en matrimonio.</p>`;
    } else {
      const intro = widowed? `<div class="body">Enviudaste de ${C(p.spouseId).firstName}. Con tiempo, podrías volver a buscar pareja.</div>` : '';
      const candidates=getEligibleRomanticCandidates(p);
      marriageBody = intro + `<div class="actions-row"><button class="btn" data-action="findSuitor" ${!canUseAction()?'disabled':''}>Conocer gente nueva en el pueblo</button></div>`
        + (candidates.length? candidates.map(c=>`<div class="list-row"><div class="info"><div class="name">${c.firstName} ${c.familyName}</div><div class="role">${c.age} años · ${relLabelText(getRelationship(world,p.id,c.id))}</div></div><button class="btn small" data-action="propose" data-id="${c.id}">Proponer</button></div>`).join('') : '<p class="empty">Aún no conoces a nadie que pudiera convertirse en tu pareja.</p>');
    }
    html += `<div class="card pink"><h3>Matrimonio</h3>${marriageBody}</div>`;
  }
  return html;
}
function relLabelText(v){ return relationshipLabel(v); }
function villageBody(p,cap){
  if(!cap.canSeeRelaciones) return '';
  const knownOthers=getKnownPeople(p).others;
  let html=`<div class="card"><h3>Gente del pueblo</h3>`;
  html += knownOthers.length? knownOthers.map(m=>{
    const occ=getDisplayOccupation(m);
    const showOcc = occ && (cap.canSeeAdultProfession || p.age>=13);
    const rel=getRelationship(world,p.id,m.id);
    return `<div class="list-row clickable" data-action="viewChar" data-id="${m.id}">${avatar(m,'sm')}
      <div class="info"><div class="name">${m.firstName} ${m.familyName}</div><div class="role">${describeKnownRelation(p,m)}${showOcc?' · '+occ:''} · ${m.age} años</div></div>
      <div class="side"><div class="pct ${relPctClass(rel)}">${rel>=0?'+':''}${rel}</div></div>
    </div>`;
  }).join('') : '<p class="empty">Todavía no conoces a nadie fuera de tu familia.</p>';
  html += `</div>`;
  if(p.age>=9) html += `<div class="actions-row"><button class="btn" data-action="meetVillage" ${!canUseAction()?'disabled':''}>Pasar tiempo en el pueblo</button></div>`;
  return html;
}
/* árbol genealógico vertical: una generación debajo de otra, con retrato de
   cada quien; los fallecidos aparecen en gris (ver avatar()/.portrait.dead) */
function genPerson(p,m){
  const isSelf = m.id===p.id;
  const label = isSelf? 'Tú' : getKinshipLabel(p.id,m.id);
  const years = m.alive? m.age+' años' : `${m.birthYear}–${m.deathYear}`;
  return `<div class="genperson ${isSelf?'you':''} clickable" data-action="viewChar" data-id="${m.id}">
    ${avatar(m,'gen')}
    <div class="n">${m.firstName}</div>
    <div class="r">${label}</div>
    <div class="y">${years}</div>
  </div>`;
}
function genealogyBody(p){
  const father=p.fatherId?C(p.fatherId):null, mother=p.motherId?C(p.motherId):null;
  const grandparents=[father,mother].filter(Boolean).flatMap(par=>[par.fatherId?C(par.fatherId):null,par.motherId?C(par.motherId):null]).filter(Boolean);
  const siblings=p.siblingIds.map(C).filter(Boolean);
  const children=p.childrenIds.map(C).filter(Boolean);
  const grandchildren=children.flatMap(c=>c.childrenIds.map(C)).filter(Boolean);
  const level=(title,list)=>list.length? `<div class="genlevel"><h4>${title}</h4><div class="genlevel-row">${list.map(m=>genPerson(p,m)).join('')}</div></div>` : '';
  return `<div class="card"><h3>Árbol genealógico</h3><div class="gentree">
    ${level('Abuelos',grandparents)}
    ${level('Padres',[father,mother].filter(Boolean))}
    ${level('Tu generación',[p,...siblings])}
    ${level('Hijos',children)}
    ${level('Nietos',grandchildren)}
  </div></div>`;
}

      <h2>Debes decidir</h2>
      <p>${ev.text}</p>
      ${ev.options.map((o,i)=>`<button class="option" data-action="resolveEvent" data-idx="${i}"><b>${o.label}</b>${o.desc}</button>`).join('')}
    </div></div>`;
  }
  if(ui.modal.type==='birthIntro'){
    const p=player(world); const father=p.fatherId?C(p.fatherId):null, mother=p.motherId?C(p.motherId):null;
    return `<div class="overlay"><div class="modal">
      <div class="eyebrow">Nacimiento</div>
      <h2>Año ${world.year}</h2>
      <p>Has nacido en ${WORLD_FLAVOR.villageName}, en ${WORLD_FLAVOR.region}.</p>
      ${father&&mother? `<p>Eres ${p.sex==='M'?'hijo':'hija'} de ${kinRef(p.id,mother.id)} y ${kinRef(p.id,father.id)}.</p>` : ''}
      <p>Tu familia vive de una pequeña granja bajo el señorío de ${WORLD_FLAVOR.lordName}.</p>
      <p>Tu historia acaba de comenzar.</p>
      <div class="modal-close-row"><button class="btn primary" data-action="closeBirthIntro">Comenzar mi vida</button></div>
    </div></div>`;
  }
  if(ui.modal.type==='milestone'){
    const d=ui.modal.data;
    return `<div class="overlay"><div class="modal">
      <div class="eyebrow">Un momento de vida</div>
      <h2>${d.title}</h2>
      <p style="font-size:11px;color:#6b7280">Año ${world.year} · ${player(world).age} años</p>
      ${d.text.split('###').map(t=>`<p>${t}</p>`).join('')}
      <div class="modal-close-row"><button class="btn primary" data-action="closeMilestone">${d.buttonLabel}</button></div>
    </div></div>`;
  }
  if(ui.modal.type==='death'){
    const ch=C(ui.modal.charId); const s=ch.lifeSummary||{};
    return `<div class="overlay"><div class="modal">
      <div class="eyebrow">Fin de una vida</div>
      <h2>${ch.firstName} ${ch.familyName}</h2>
      <p style="font-size:11px;color:#6b7280">${ch.birthYear}–${ch.deathYear}</p>
      <p>Nació ${genderText('campesino/a',ch.sex)} en ${WORLD_FLAVOR.villageName}. ${s.careerLabel?('Trabajó como '+s.careerLabel.toLowerCase()+'. '):''}${s.masterName?('Aprendió su oficio con '+s.masterName+'. '):''}${s.leftHomeAge?('Dejó el hogar de sus padres a los '+s.leftHomeAge+' años. '):''}${s.marriedAge?('Se casó a los '+s.marriedAge+' años'+(s.spouseName?' con '+s.spouseName:'')+'. '):''}${s.numChildren?('Tuvo '+s.numChildren+' hijo(s). '):''}Murió a los ${ch.deathYear-ch.birthYear} años, por ${s.cause}.</p>
      ${s.highlights&&s.highlights.length?`<hr class="divider">${s.highlights.map(h=>`<p style="font-size:11px;color:#3d6491">${h.year} — ${h.title}</p>`).join('')}`:''}
      <div class="modal-close-row"><button class="btn primary" data-action="afterDeath">Continuar el linaje</button></div>
    </div></div>`;
  }
  if(ui.modal.type==='independence'){
    const p=player(world); const hh=household(world);
    return `<div class="overlay"><div class="modal">
      <div class="eyebrow">Tu propio hogar</div>
      <h2>Año ${world.year}</h2>
      <p>Por primera vez, ya no duermes bajo el techo de tus padres. Tus posesiones son pocas, pero esta casa depende ahora de ti.</p>
      ${row('Dinero personal', Math.floor(p.personalMoney||0)+' mn')}
      ${row('Capital del hogar', Math.floor(hh.money)+' mn')}
      ${row('Oficio', getDisplayOccupation(p)||'aún por definir')}
      ${row('Tierra propia', propertiesOf(hh).length? 'sí' : 'no, todavía')}
      <div class="modal-close-row"><button class="btn primary" data-action="closeIndependence">Continuar</button></div>
    </div></div>`;
  }
  if(ui.modal.type==='chooseHeir'){
    const list=eligibleHeirs(C(ui.modal.deadId));
    if(!list.length){
      return `<div class="overlay"><div class="modal">
      <div class="eyebrow">La línea se extingue</div>
      <h2>No queda descendencia elegible</h2>
      <p>Nadie de tu familia cercana sigue con vida para tomar las riendas. Puedes comenzar con una nueva familia campesina en el año ${world.year}, mientras el mundo y su historia continúan.</p>
      <div class="modal-close-row"><button class="btn primary" data-action="newFamilySameWorld">Comenzar nueva familia</button></div>
      </div></div>`;
    }
    return `<div class="overlay"><div class="modal">
      <div class="eyebrow">Elige a quién encarnar</div>
      <h2>¿Quién continúa el linaje?</h2>
      <p>Según ${WORLD_FLAVOR.law.toLowerCase()}</p>
      ${list.map(m=>{
        const hh=m.householdId?world.households[m.householdId]:null;
        const kin=getKinshipLabel(ui.modal.deadId, m.id);
        const homeNote = hh ? (hh.headId===m.id? 'posee su propio hogar ('+hh.name+')' : 'vive en '+hh.name) : '';
        const roleNote = (m.age>=16 && getDisplayOccupation(m)) ? getDisplayOccupation(m) : getStageTitle(m);
        return `<button class="option" data-action="chooseNext" data-id="${m.id}"><b>${m.firstName} ${m.familyName}</b>${kin} · ${m.age} años · ${roleNote}${homeNote?(' · '+homeNote):''}</button>`;
      }).join('')}
    </div></div>`;
  }
  if(ui.modal.type==='settings'){
    return `<div class="overlay"><div class="modal">
      <div class="eyebrow">Ajustes</div>
      <h2>Partida</h2>
      <p style="font-size:11px;color:#6b7280">Guardado automático activo.</p>
      <div class="actions-row"><button class="btn danger small" data-action="resetGame">Reiniciar partida</button></div>
      <div class="modal-close-row"><button class="btn primary" data-action="closeModal">Cerrar</button></div>
    </div></div>`;
  }
  if(ui.modal.type==='charDetail'){ return renderCharDetailModal(ui.modal.id); }
  return '';
}

/* ---------- eventos de click delegados ---------- */
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  // mejora de diseño 2026-09 #13: con un tutorial activo, solo se permite pulsar el elemento
  // resaltado — así el jugador de verdad llega a usar lo que se acaba de desbloquear, en vez
  // de solo leer un aviso. Cualquier otro click de la interfaz queda bloqueado hasta entonces.
  if(ui.tutorial){
    if(!btn.matches(ui.tutorial.requireSel)){ e.preventDefault(); e.stopPropagation(); return; }
    completeTutorial();
  }
  const a = btn.dataset.action;
  if(a==='setTab'){
    ui.activeTab=btn.dataset.tab;
    if(btn.dataset.tab==='hacer') maybeQueueDoCardTutorial(player(world));
    if(!ui.tutorial) advanceTutorialQueue();
    render();
  }
  else if(a==='advanceYear'){ advanceYear(); }
  else if(a==='sow'){ doSow(); }
  else if(a==='sellGrain'){ doSellGrain(); }
  else if(a==='workHarder'){ doWorkHarder(); }
  else if(a==='helpAnimals'){ doHelpAnimals(); }
  else if(a==='helpFarm'){ doHelpFarm(); }
  else if(a==='buyAnimal'){ doBuyAnimal(btn.dataset.species); }
  else if(a==='sellAnimal'){ doSellAnimal(btn.dataset.id); }
  else if(a==='spendTime'){ doSpendTime(btn.dataset.id); }
  else if(a==='help'){ doHelp(btn.dataset.id); }
  else if(a==='findSuitor'){ doFindSuitor(); }
  else if(a==='propose'){ doPropose(btn.dataset.id); }
  else if(a==='meetVillage'){ doMeetVillage(); }
  else if(a==='contributeMoney'){ doContributeMoney(); }
  else if(a==='leaveHousehold'){ doLeaveHousehold(); }
  else if(a==='activity'){ const act=DO_ACTIVITIES.find(x=>x.id===btn.dataset.id); if(act) act.run(); }
  else if(a==='setDoCategory'){ ui.doCategory=btn.dataset.cat; render(); }
  else if(a==='setPeopleFilter'){ ui.peopleFilter=btn.dataset.filter; render(); }
  else if(a==='setLifeFilter'){ ui.lifeFilter=btn.dataset.filter; render(); }
  else if(a==='estateOrder'){ doEstateOrder(btn.dataset.kind); }
  else if(a==='toggleAnimalDetail'){ ui.showAnimalDetail=!ui.showAnimalDetail; render(); }
  else if(a==='openSettings'){ ui.modal={type:'settings'}; render(); }
  else if(a==='resetGame'){ doResetGame(); }
  else if(a==='resolveEvent'){ const ev=ui.modal.event; doResolveEventOption(ev.options[+btn.dataset.idx]); }
  else if(a==='afterDeath'){ ui.modal={type:'chooseHeir', deadId: ui.modal.charId}; render(); }
  else if(a==='chooseNext'){ doChooseNext(btn.dataset.id); }
  else if(a==='viewChar'){ ui.modal={type:'charDetail', id:btn.dataset.id}; render(); }
  else if(a==='closeModal'){ ui.modal=null; render(); }
  else if(a==='closeBirthIntro'){ ui.modal=null; render(); }
  else if(a==='closeMilestone'){ ui.modal=null; advanceModalQueue(); }
  else if(a==='closeIndependence'){ ui.modal=null; render(); }
  else if(a==='newFamilySameWorld'){
    const oldHistory=world.history, oldYear=world.year, oldRegionId=world.regionId;
    // sigue siendo EL MISMO mundo (misma región, misma cronología) — solo cambia de familia.
    const fresh=generateInitialWorld({startYear:oldYear, playerAge:16, regionId:oldRegionId});
    fresh.history=[...oldHistory, ...fresh.history];
    world=fresh; ui.modal=null; save(); render();
  }
});

/* ---------- render + init ---------- */
function render(){
  // Parte 20: si cambia el personaje jugado (o su edad), las pestañas disponibles se recalculan siempre
  if(world && world.playerId && !getAvailableTabs(player(world)).some(([k])=>k===ui.activeTab)) ui.activeTab='yo';
  renderApp();
}
/* arranque (v7): espera a decodificar los 6 sprites base antes del primer
   render, así no hay un parpadeo inicial con los tiles genéricos viejos
   mientras cargan (son 6 PNG de ~300-400 bytes cada uno embebidos, la
   espera real es de milisegundos). Si por lo que sea falla la decodificación
   de alguno, preloadSpriteBases() igual resuelve (loadSpritePixels atrapa
   el error) y characterPortraitURL cae al tile genérico para ese caso. */
preloadSpriteBases().then(()=>{
  if(!load()){ world = generateInitialWorld(); save(); }
  if(world.pendingBirthIntro){ world.pendingBirthIntro=false; ui.modal={type:'birthIntro'}; }
  render();
});

</script>
</body>
</html>
